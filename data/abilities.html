<script>
function dataTable(cfg){
 var tb=document.querySelector(cfg.tb),q=document.getElementById(cfg.q),cnt=document.getElementById(cfg.cnt),extra=cfg.filters||[],clear=document.getElementById(cfg.clear);
 var rows=[].slice.call(tb.rows),base=rows.slice();
 var exm=location.search.match(/[?&]n=([^&]+)/),ex=exm?decodeURIComponent(exm[1]).toLowerCase():'';
 if(exm)q.value=decodeURIComponent(exm[1]);
 function run(){var s=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean),n=0;
  rows.forEach(function(tr){var ok=(!ex||tr.dataset.n===ex)&&extra.every(function(f){var el=document.getElementById(f.id);return !el.value||tr.dataset[f.k]===el.value})&&s.every(function(w){return tr.dataset.s.indexOf(w)>-1});tr.hidden=!ok;if(ok)n++});
  cnt.textContent=n+' / '+rows.length+' 筆';
  clear.hidden=!(q.value||extra.some(function(f){return document.getElementById(f.id).value}));
  document.getElementById(cfg.none).hidden=n>0}
 var timer;q.addEventListener('input',function(){ex='';clearTimeout(timer);timer=setTimeout(run,120)});
 extra.forEach(function(f){document.getElementById(f.id).addEventListener('input',function(){ex='';run()})});
 clear.addEventListener('click',function(){ex='';q.value='';extra.forEach(function(f){document.getElementById(f.id).value=''});if(location.search)history.replaceState(null,'',location.pathname);run();q.focus()});
 run();
 // 排序：點表頭或用下拉選單（手機版沒有表頭，下拉選單才能排序）
 var state={k:null,dir:1},ths=[].slice.call(document.querySelectorAll(cfg.tb.replace(' tbody','')+' th[data-k]')),ssel=cfg.sort?document.getElementById(cfg.sort):null;
 function applySort(){
  ths.forEach(function(t){t.classList.remove('asc','desc');if(state.k&&t.dataset.k===state.k)t.classList.add(state.dir>0?'asc':'desc')});
  if(ssel)ssel.value=state.k?state.k+':'+state.dir:'';
  var list=base.slice(),k=state.k,d=state.dir;
  if(k)list.sort(function(a,b){var x=a.dataset[k]||'',y=b.dataset[k]||'',nx=parseFloat(x),ny=parseFloat(y);
   if(k==='g'){nx=nx||NaN;ny=ny||NaN}
   if(!isNaN(nx)||!isNaN(ny)){if(isNaN(nx))return isNaN(ny)?0:1;if(isNaN(ny))return -1;return (nx-ny)*d}
   return x.localeCompare(y,'zh-Hant')*d});
  var fr=document.createDocumentFragment();list.forEach(function(r){fr.appendChild(r)});tb.appendChild(fr);
  if(clear)clear.hidden=!(q.value||state.k||extra.some(function(f){return document.getElementById(f.id).value}))}
 ths.forEach(function(th){
  th.tabIndex=0;th.setAttribute('role','button');th.title='點一下排序';
  function go(){var k=th.dataset.k;var first=k==='p'?-1:1;
   if(state.k===k){if(state.dir===first)state.dir=-first;else state.k=null}else{state.k=k;state.dir=first}
   applySort()}
  th.addEventListener('click',go);th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
 if(ssel)ssel.addEventListener('input',function(){var v=ssel.value.split(':');state.k=v[0]||null;state.dir=+v[1]||1;applySort()});
 clear.addEventListener('click',function(){state.k=null;applySort()});
 // 從全站搜尋帶錨點進來：捲到該列並標示
 if(location.hash){var el=document.querySelector(location.hash);if(el){el.classList.add('hl');el.scrollIntoView({block:'center'})}}
}
</script>

但當自己或所關心的人性命受到威脅時，腎上腺素會讓牠變成暴怒的野獸。","fo":"This Pokémon is usually calm in demeanor, but when its life or someone it cares for is in danger, the adrenaline rush will transform it into an enraged beast.","ai":["r",[["c",[248,["t","HP 剩一半以下","Half HP or less"]]],172]]},{"n":"Big Pecks","z":"健壯胸肌","g":5,"e":"此寶可夢的防禦無法被降低。","o":"This Pokémon cannot have its Defense reduced.","f":"這隻頑強的寶可夢會用鳥喙護住自己的弱點。","fo":"This tenacious Pokémon uses its beak to cover its weak spots.","ai":["r",[248,258]]},{"n":"Blaze","z":"猛火","g":3,"e":"疼痛懲罰不會扣除此寶可夢所使用的火屬性招式的命中或傷害擲骰的成功數。當此寶可夢的 HP 在一半或以下時，火屬性招式的傷害骰池額外增加 2 顆骰。","o":"Pain Penalization won't reduce successes from Accuracy or Damage rolls of Fire-Type Moves used by this Pokémon. Fire-Type Moves get 2 Extra dice to their Damage Pool when this Pokémon is at half HP or less..","f":"這隻寶可夢體內與體表的火焰，在熄滅之前會燃燒得格外猛烈。","fo":"The inner and outer fire of this Pokémon's body will burn incredibly fierce just before fading.","ai":["r",[248,["c",[["t","HP 剩一半以下時：","At Half HP or less:"],["r",[["t","獲得","gets"],173,["t","用於","on"]]]]],144]]},{"n":"Bulletproof","z":"防彈","g":6,"e":"此寶可夢受到的遠程物理招式傷害全部減少 1 點。此寶可夢受到名稱含有 Ball、Blast、Bomb、Cannon、Octazooka、Puff、Shot、Sphere 或 Wrecker 的特殊招式傷害全部減少 1 點。","o":"Reduce by 1 all damage from Ranged Physical Moves dealt to this Pokémon. Reduce by 1 all damage from Special Moves with the words: Ball, Blast, Bomb, Cannon, Octazooka, Puff, Shot, Sphere & Wrecker on their name.","f":"這隻寶可夢身上的盔甲能保護牠不受投射物與小型爆炸的傷害。","fo":"The armor on this Pokémon's body protects it from projectiles and small explosions.","ai":["r",[315,["t","與","&"],["c",[8,103]],236,248]]},{"n":"Cheek Pouch","z":"頰囊","g":6,"e":"此寶可夢每吃下一顆沒有 HP 回復效果的樹果，就回復 2 HP。（例：（桃桃果、木子果）","o":"This Pokémon restores 2 HP whenever it eats a berry with no HP healing effect. (e.g. Pecha Berry, Lum Berry)","f":"這隻寶可夢能把食物和小物品存放在富有彈性的臉頰裡，留著之後再享用，而且存放時的模樣總是可愛得很。","fo":"The Pokémon is able to store food and objects inside its stretchy cheeks for later consumption. Often looking adorable while doing so.","ai":["r",[248,259,["t","用攜帶的樹果治癒異常狀態後","After using its Held Berry to cure a Status condition"]]]},{"n":"Chilling Neigh","z":"蒼白嘶鳴","g":8,"e":"若有敵人因此寶可夢的物理或特殊招式而昏厥，其力量能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special Move dealt by this Pokémon, Increase its Strength Attribute by 1. Up to 3 points can be increased this way.","f":"這隻寶可夢會發出令人發寒又憤怒的嘶鳴。在古代的戰爭中，敵軍一聽到這聲音就嚇得發抖。","fo":"This Pokémon emits a chilling and furious neigh. In ancient times of war, hearing it made the opposing armies tremble in fear.","ai":["r",[248,174,["t","這隻寶可夢打倒敵人後。","After this Pokémon faints a foe."]]]},{"n":"Chlorophyll","z":"葉綠素","g":3,"e":"大晴天生效期間，此寶可夢的靈巧能力值提升 2 點。","o":"While Sunny Weather is active, Increase this Pokémon's Dexterity Attribute by 2.","f":"這隻寶可夢能把陽光轉換成能量，只要待在陽光充足的環境，就很少需要進食。","fo":"The Pokémon synthesizes sunlight to get energy, if it's kept in a sunny environment it will rarely need to eat.","ai":["r",[308,175,248]]},{"n":"Clear Body","z":"恆淨之軀","g":3,"e":"其他寶可夢無法提升或降低此寶可夢的能力值。此寶可夢仍可提升或降低自己的能力值。","o":"Other Pokémon cannot Increase or Reduce the Attributes of this Pokémon. This Pokémon can still Increase or Reduce its own Attributes.","f":"這隻寶可夢對身體周遭的一切動靜瞭若指掌，想偷偷靠近牠極為困難。","fo":"The Pokémon is completely aware of all its body surroundings, trying to sneak on it will be incredibly difficult.","ai":["r",[102,260,237]]},{"n":"Cloud Nine","z":"無關天氣","g":3,"e":"無效化天氣狀態對此寶可夢的影響。","o":"Negate the effects of Weather Conditions on this Pokémon.","f":"這隻寶可夢很容易感到滿足，也比其他寶可夢更容易開心。不論晴天還是雨天，牠都不會心情低落。","fo":"This Pokémon will easily feel pleased, and it's prone to be happier than others. No matter if it's sunny or rainy it will never feel gloomy.","ai":["r",[["c",[24,38]],["c",[70,["t","免疫：","Immune to:"],["r",[15,16]],["r",[37,36]]]],["c",[17,31]]]]},{"n":"Color Change","z":"變色","g":3,"e":"當此寶可夢受到傷害時，會暫時將屬性改為與剛擊中它的招式相同的屬性。若寶可夢離開戰鬥，此效果結束。","o":"When this Pokémon is dealt damage it will temporarily change its type to match the type of the move that just hit it. The effect ends if the Pokémon is removed from battle.","f":"這隻寶可夢能改變自己的顏色與能量，偽裝並融入周遭環境。","fo":"This Pokémon can change its color and energy to camouflage and merge with the surroundings.","ai":["c",[["r",[248,104]],["t","與擊中牠的招式相同。","Equal to Move it was hit with."]]]},{"n":"Comatose","z":"絕對睡眠","g":7,"e":"此寶可夢永久處於「睡眠」異常狀態，但免疫其效果。此寶可夢無法被施加其他異常狀態。影響睡眠寶可夢的招式與特性仍然對其有效。","o":"The Pokémon permanently has the “Sleep” Status Ailment but it is immune to its effects. This Pokémon can't be inflicted other Status Ailment or Condition. Moves and Abilities affecting Asleep Pokémon still have an effect on it.","f":"不知為何，這隻寶可夢總是睡著、醒不過來。即便如此，牠仍聽得懂指令，行動起來就像夢遊一樣。","fo":"For some reason this Pokémon is always asleep and can't wake up. Still, it is able to understand commands and move just as if it were sleepwalking.","ai":["r",[248,["c",[39,43,47]],["c",[40,48,45]],["c",[42,46]],["c",[41,44]]]]},{"n":"Commander","z":"發號施令","g":9,"e":"若場上有隊友吃吼霸，使其能力值與防禦提升 2 點。吃吼霸在場景剩餘時間內被阻擋。所有本應對此寶可夢造成的傷害，改由吃吼霸承受。專屬特性。","o":"If there is an Allied Dodonzo on the field, increase its Attributes and Defenses by 2. Dodonzo is blocked for the rest of the scene. All damage that would be dealt to this Pokémon is dealt to Dadonzo instead. Unique Ability.","f":"這隻寶可夢頭腦有戰略眼光，即使身體脆弱，也能想出巧妙的計畫，並精準地指揮牠的朋友吃吼霸。","fo":"The Pokémon has a strategic mind, even if its body is frail it can device clever plans and tell its Dodonzo friend exactly what to do.","ai":["r",[296,["c",[["t","#977 吃吼霸","#977 Dodonzo"],["r",[176,178]],251]],177]]},{"n":"Competitive","z":"好勝","g":6,"e":"此寶可夢在一場戰鬥中第一次被敵人降低能力值時，其特殊提升 2 點。","o":"The first time this Pokémon gets an Attribute reduced by a foe during a battle, Increase its Special by 2.","f":"這隻寶可夢的鬥志會在逆境中愈燒愈旺，總是想和周圍的人一較高下。","fo":"This Pokémon's determination grows in the face of adversity. It is always trying to compete with those around it.","ai":["r",[248,179,["c",[["t","受到以下影響時：","When it gets:"],180]]]]},{"n":"Compound Eyes","z":"複眼","g":3,"e":"此寶可夢在任何低命中率招式的命中骰池中獲得 2  of grass to protect its body, even if you cut it, it will regrow in a few days.","ai":["r",[248,188,["t","青草場地生效時。","When Grassy Terrain is active."]]]},{"n":"Grassy Surge","z":"青草製造者","g":7,"e":"此寶可夢登場時，自動啟動招式「青草場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）","o":"When this Pokémon comes out, it automatically starts the effects of the Move Grassy Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain)","f":"這隻寶可夢能在周身形成草地，讓牠輕鬆放鬆，在陽光下悠閒度日。","fo":"The Pokémon can surround itself with a grass field that makes it easy to relax and laze around in the sun.","ai":["r",[170,113]]},{"n":"Grim Neigh","z":"漆黑嘶鳴","g":8,"e":"若有敵人因此寶可夢的物理或特殊招式而昏厥，其特殊能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special dealt by this Pokémon, Increase its Special Attribute by 1. Up to 3 points can be increased this way.","f":"這隻寶可夢會發出陰沉又詭異的嘶鳴。在古代，夜裡聽到這個聲音是可怕的凶兆。","fo":"This Pokémon emits a somber and eerie neigh. In ancient times, hearing it at night was a terrible omen.","ai":["r",[248,171,["t","這隻寶可夢打倒敵人後。","After this Pokémon faints a foe."]]]},{"n":"Guard Dog","z":"看門犬","g":9,"e":"若敵人使用招式、特性或道具來降低此寶可夢的力量能力值，無效化該效果，並改為提升 2 點。此寶可夢免疫會將其移出戰鬥的替換招式的效果。","o":"If a foe uses a Move, Ability or Item to reduce this Pokemon's Strength Attribute, negate that effect and increase it by 2 instead. This Pokémon is im- mune to the effect of Switcher Moves that would remove it from battle.","f":"這是一隻保護欲強、有領域意識的寶可夢。牠絕不後退或逃跑，即使面對最嚇人的敵人也一樣。非常忠誠，但也有點可怕。","fo":"A teritorial and protective Pokémon. It won't ever back down or run away, not even from the most intimidating foes. Very loyal but can also be a bit scary.","ai":["c",[["r",[248,190,["t","力量被降低時。","If its Strength Attribute is Reduced."]]],["r",[["t","免疫：","Immune to:"],195]]]]},{"n":"Gulp Missile","z":"一口飛彈","g":8,"e":"若此寶可夢使用招式「衝浪」或「潛水」，造成傷害後會改變形態。HP 全滿或超過一半時為「一口吞形態」，一半或以下時為「吞入形態」。若此寶可夢在這些形態下受到敵人傷害，對該敵人造成 2 顆傷害骰與一項效果。之後使用者恢復原本的形態。專屬特性。","o":"If this Pokémon uses the Moves Surf or Dive, it will change forms after dealing damage. “Gulping Form” at full or more than half HP remaining, “Gorging Form” at half or less HP. If the Pokémon is dealt damage by a foe while in any of these Forms, deal 2 Dice of Damage and an effect to that foe. The user returns to its regular form afterwards. Unique Ability.","f":"這隻寶可夢是優秀的獵手，潛入水中總能帶著獵物浮上來，有時還會把獵物當成武器使用……","fo":"This Pokémon is an excellent hunter, when diving into a pool of water it will always come out with prey. And it will sometimes use the prey as a weapon...","ai":["c",[["r",[["t","這隻寶可夢使用「衝浪」或「潛水」時，變成一口吞模樣","This Pokémon uses the Move “Surf” or “Dive” User changes into Gulping Form"],1]],["r",[["t","受到傷害時：","If it receives damage:"],3,5,4]],["r",[["t","變成大口吞模樣時，受到傷害：","User changes into Gorging Form If it receives damage:"],1,3,5,6]]]]},{"n":"Guts","z":"毅力","g":3,"e":"處於異常狀態（灼傷、冰凍、麻痺、中毒、睡眠）期間，此寶可夢的力量能力值提升 2 點。","o":"While affected by a Status Ailment (Burn, Frozen, Paralysis, Poison, Sleep), Increase this Pokémon's Strength Attribute by 2.","f":"這隻寶可夢敢做別人不敢做的事，決心不會輕易動搖，不過可能有點魯莽。","fo":"This Pokémon dares to do everything no one else dares to, and won't lose its determination easily, it may be a little reckless, though.","ai":["r",[270,190,248]]},{"n":"Hadron Engine","z":"強子引擎","g":9,"e":"此寶可夢登場時，自動啟動招式「電氣場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）電氣場地生效期間，此寶可夢的特殊能力值提升 2 點。","o":"When this Pokémon comes out, it automatically starts the effects of the Move Electric Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain). While Electric Terrain is active, increase this Pokémon's Special Attribute by 2.","f":"這隻寶可夢的身體能加速粒子並轉換成能量。有一種理論認為，牠只是把另一個宇宙的能量帶到這裡來而已。","fo":"This Pokemon's body is able to accelerate particles and transform them into energy. Theory is that it's simply bringing forward energy from another universe.","ai":["r",[170,108,172]]},{"n":"Harvest","z":"收穫","g":5,"e":"若此寶可夢在戰鬥中使用了樹果作為攜帶道具，該樹果會在戰鬥結束時重新長出來。","o":"If this Pokémon uses a berry as a held item during a fight, the berry will grow back ]},{"n":"Hospitality","z":"款待","g":9,"e":"此寶可夢登場時，可花費一點意志點，為一名受傷的隊友回復最多 3 HP。致命傷害不會被此效果治癒。戰鬥外，可移除所有治療用草藥的苦味。","o":"When this Pokémon comes out, it can spend a Will Point to heal up to 3 HP from a damaged Ally. Lethal Damage is not healed with this effect. Outside of battle it can remove the bitter taste from all healing Herbs.","f":"這隻寶可夢能把最苦的草藥變成美味的藥草茶，有空時還會邀請朋友一起來喝一杯。","fo":"The Pokémon can transform the most bitter herb into a delicious medicinal tea. It will also invite its friends for a cup whenever they have the time.","ai":["r",[296,271]]},{"n":"Huge Power","z":"大力士","g":3,"e":"此寶可夢的力量能力值永久提升。啟程、新手、標準與進階階級的力量提升 1 點。專家階級以上的力量提升 2 點。","o":"This Pokémon has a permanent increase its Strength Attribute. Ranks Starter, Beginner, Standard and Advanced Increase Strength by 1. Rank Expert and higher Increase Strength by 2.","f":"這隻寶可夢擁有一股超乎常理的力量，遠遠超出牠外表所能看出的程度。","fo":"The Pokémon has an unnatural strength that goes way beyond of what its physical appearance would suggest.","ai":["r",[248,["c",[["t","永久：","Permanent:"],["r",[163,["t","或","or"],198]],["t","依階級而定。","Depending on Rank."]]]]]},{"n":"Hunger Switch","z":"飽了又餓","g":8,"e":"戰鬥輪結束時，將此寶可夢的形態在「空腹花紋」與「滿腹花紋」之間切換。戰鬥外，形態依其飢餓程度而改變。專屬特性。","o":"At the end of the Round, switch this Pokémon's Form, from “Hangry” Form to “Full-Belly Form” or vice versa. Outside of battle, the form changes depending on its hunger. Unique Ability.","f":"這隻寶可夢一餓就會非常煩躁，除非你不斷給牠零食，否則牠就會又咬又鬧。","fo":"This Pokémon becomes really upset if it gets hungry, it will bite and act out unless you constantly give it snacks.","ai":["r",[248,["t","變成「空腹模樣」或「滿腹模樣」","Changes form to: “Hangry Form” or “Full-Belly Form”"]]]},{"n":"Hustle","z":"活力","g":3,"e":"此寶可夢額外獲得低命中率 1，並使其所有物理招式的傷害骰池額外增加 2 顆骰。","o":"This Pokémon gets an Extra Low Accuracy 1 and adds 2 Extra Dice to the Damage pool of all its Physical Moves.","f":"這隻寶可夢做什麼事都急急忙忙，讓自己一直忙碌，不過匆忙趕工時會有點草率。","fo":"The Pokémon will perform everything in a hurry, it keeps itself busy, but it can be kind of sloppy when i ]],["r",[114,115,["t","恢復「結凍頭」型態","Restores “Ice Face Form”"]]]]]},{"n":"Ice Scales","z":"冰鱗粉","g":8,"e":"此寶可夢受到所有特殊招式的傷害減少 2 點。","o":"Reduce by 2 the Damage dealt to this Pokémon by All Special Moves.","f":"這隻寶可夢的身體覆蓋著以冰製成的水晶鱗片。摸起來總是冰涼，鱗片表面能輕易彈開大部分的投射物、能量與光線。","fo":"This Pokémon's body is covered by crystal scales made of ice. Always cold to the touch, it easily deflects most projectiles, energy and light on its surface.","ai":["r",[248,["r",[269,["t","被以下招式擊中時：","When this Pokémon is hit with:"],66]]]]},{"n":"Illuminate","z":"發光","g":3,"e":"提高遭遇隨機、非敵對野生寶可夢的機率。若有環境挑戰，或因能見度降低而有難度懲罰，此寶可夢與範圍內的隊友免疫其影響。","o":"Increases the chance of random, non-hostile, wild Pokémon encounters. If there were enviromental challenges, or difficulty penalties due to reduced visibility, this Pokémon and it's allies in range are immune to the effects.","f":"這隻寶可夢的身體會自然散發出柔和溫暖的光芒，其他寶可夢看見這道光，都會好奇地靠近牠。","fo":"The Pokémon naturally produces a soft and warm light through its body. Other Pokémon approach to it curiously when they see this light.","ai":["r",[248,["t","吸引野生寶可夢。","Attracts wild Pokémon."]]]},{"n":"Illusion","z":"幻覺","g":5,"e":"此寶可夢登場時，會呈現隊伍中另一隻寶可夢的樣貌，若受到傷害，幻象就會破除。戰鬥外，可隨意對自己施展幻象。專屬特性。","o":"When this Pokémon comes out, it will have the form of another Pokémon in the party, the illusion breaks if it receives damage. Outside of battle it may cast the illusion on itself at will. Unique Ability.","f":"這隻寶可夢能對自己施展幻象，變成牠見過的另一隻生物，幻象與真貨完全分不出來。","fo":"The Pokémon casts an illusion on itself to look like another creature it has seen. The illusion is indistinguishable from the real one.","ai":["r",[248,["t","改變外表。","Changes it’s appearance."]]]},{"n":"Immunity","z":"免疫","g":3,"e":"此寶可夢不會受到中毒與劇毒異常狀態的傷害。","o":"This Pokémon does not receive damage from Poison and Badly Poisoned Status Ailments.","f":"這隻寶可夢的免疫系統非常強，很少生病，甚至吃了腐壞的食物也不會不舒服。","fo":"The Pokémon has a very strong immune system and will rarely get sick. It could even eat rotten food without getting sick.","ai":["r",[248,274,199]]},{"n":"Imposter","z":"變身者","g":5,"e":"此寶可夢一進入戰鬥，就會受到招式「變身」的效果（參見原書）。","o":"As soon as it enters into battle, this Pokémon will be under the effects of the Move Transform ( p.XXX ).","f":"這隻寶可夢能極快地改變自己的細胞結構，變身成另一個存在的複製品。","fo":"This Pokémon can alter its own cell structure extremely fast to transform into a copy of another being.","ai":["r",[248,["t","自動使用「變身」","Uses “Transform” automatically"]]]},{"n":"Infiltrator","z":"穿透","g":5,"e":"此寶可夢無視敵方場地上所有生效中的護盾招式、防護力場、替身與掩護。","o":"This Pokémon ignores all Shield Moves, Force Fields, Substitutes and Cover active on the foe's side of the field.","f":"這隻寶可夢行動極為隱密，天生就很難被察覺，能輕易潛入戒備森嚴的地方。","fo":"The Pokémon is very stealthy with its movements, it is naturally harder to detect and can easily sneak in heavily guarded places.","ai":["r",[248,["c",[["t","無視：","Ignores:"],["r",[310,200]],["t","替身與掩護","Substitute & Cover"]]]]]},{"n":"Innards Out","z":"飛出的內在物","g":7,"e":"若此寶可夢因物理或特殊招式的傷害而昏厥，對攻擊者造成等同於使用者剩餘 HP 的傷害。","o":"If this Pokémon would faint due to damage from a Physical or Special Move, inflict damage on the attacker equal to the remaining HP the user had.","f":"由於沒有四肢，這隻寶可夢會把自己的內臟吐出來當作手腳使用，或用來保護自己免受傷害。很噁心，但很有效。","fo":"As it has no extremities, this Pokémon expels its own internal organs to use them as limbs or to defend itself from harm. Gross but effective.","ai":["r",[102,275,["t","這隻寶可夢倒下時。","When this Pokémon Faints."]]]},{"n":"Inner Focus","z":"精神力","g":3,"e":"此寶可夢不會畏縮。特性「威嚇」對此寶可夢無效。戰鬥外，此寶可夢比其他人更能抵抗恐嚇手段、恐懼與壓力。","o":"This Pokémon does not Flinch. The Ability Intimidate does not have any effect against this Pokémon. Outside of battle this Pokémon is able to resist intimidation tactics, fear and stress better than others.","f":"這隻寶可夢做任何事都極為嚴肅專注，即使身受重傷，仍能保持冷靜、絕不退縮。","fo":"The Pokémon is extremely serious and focused on everything it does. It remains calm and never backs down, even if it's getting severly injured.","ai":["r",[248,116]]},{"n":"Insomnia","z":"不眠","g":3,"e":"此寶可夢免疫睡眠狀態。會讓自己陷入睡眠的招式或道具會失敗。","o":"This Pokémon is immune to the Sleep Status. Moves or Items that self-inflict Sleep will fail.","f":"這隻寶可夢從不睡覺，不管幾點都醒著。也許牠不需要睡眠，也許只是太憂慮了。","fo":"The Pokémon does not ever sleep, it will be awake no matter the hour. Maybe it doesn't need to or maybe it's just worried.","ai":["r",[248,201]]},{"n":"Intimidate","z":"威嚇","g":3,"e":"此寶可夢進入戰鬥時，範圍內所有敵人的力量降低 1 點。只要此寶可夢在場，此效果就會持續。戰鬥外，若此寶可夢在場，野生寶可夢會避開隊伍。","o":"When this Pokémon comes into battle, Reduce by 1 the Strength of All foes in Range. This effect will last for as long as this Pokémon is out. Outside of battle, wild Pokémon will avoid the party if this Pokémon is out.","f":"這隻寶可夢氣場懾人，同時令人感到敬畏與尊敬。","fo":"This Pokémon has an overwhelming presence that inspires both fear and respect from others.","ai":["r",[117,276]]},{"n":"Intrepid Sword","z":"不撓之劍","g":8,"e":"每當此寶可夢進入戰鬥，其力量提升 2 點。戰鬥外，此寶可夢可以切開任何表面。專屬特性。","o":"Whenever this Pokémon enters battle, Increase its Strength by 2. Outside of battle, this Pokémon can cut through any surface. Unique Ability.","f":"這隻無畏的寶可夢不懼任何挑戰，力量會隨著意志不斷增強，牠的存在感極具威嚇力。","fo":"This audacious Pokémon is fearless to any challenge, its strength increases through sheer will. Its presence can be very menacing.","ai":["r",[248,190]]},{"n":"Iron Barbs","z":"鐵刺","g":5,"e":"若此寶可夢被非遠程物理招式擊中，二選一：對攻擊者造成 1 點中立傷害；或對攻擊者擲 2 顆中立傷害骰。","o":"If this Pokémon is hit with a Non-Ranged Physical Move choose one: - Deal 1 Neutral Damage against the attacker. - Roll 2 Dice of Neutral Damage against the attacker.","f":"這隻寶可夢全身長滿尖銳的鋼刺，任何隨便碰到牠的人都會受傷。","fo":"This Pokémon is covered with sharp steel quills that hurt anyone who may touch them carelessly.","ai":["r",[102,["c",[277,["t","或","or"],278]],["c",[["t","被以下招式擊中時：","When this Pokémon is hit with:"],67]]]]},{"n":"Iron Fist","z":"鐵拳","g":4,"e":"所有拳類招式的傷害骰池額外增加 1 顆骰。","o":"Add 1 Extra Die to the Damage Pool of all Fist Based Moves","f":"這隻寶可夢的雙手強壯又沉重，握成拳頭時，什麼都能擊穿。","fo":"The hands of this Pokémon are very strong and heavy, when curled into fists they can go through anything.","ai":["r",[248,161,["t","用於：","on:"],149]]},{"n":"Justified","z":"正義之心","g":5,"e":"若惡屬性招式擊中此寶可夢，其力量提升 1 點。最多可用此方式提升 3 點。戰鬥外，遭受或目睹不公不義也會觸發此效果。","o":"If a Dark-Type Move hits this Pokémon, Increase its Strength by 1. Up to 3 points can be increased this way. Outside of battle, suffering or witnessing injustices will also trigger this effect.","f":"這隻寶可夢天生有強烈的正義感，一遇到不義之事就會非常憤怒。","fo":"This Pokémon has an innate sense of justice, wrongdoings will make them really angry.","ai":["r",[145,174,248]]},{"n":"Keen Eye","z":"銳利目光","g":3,"e":"此寶可夢的命中擲骰成功數不會被招式、道具或特性扣除。","o":"This Pokémon cannot have successes removed from its Accuracy rolls by Moves, Items or Abilities.","f":"這些寶可夢的視力極佳，要找出細小或遙遠的物體對牠們來說容易得多。","fo":"These Pokémon have an exceptional sight. Locating small or far away objects is lot easier for them.","ai":["r",[248,279]]},{"n":"Klutz","z":"笨拙","g":4,"e":"攜帶道具對此寶可夢不會有任何效果。讓寶可夢超級進化、使用 Z 招式、極巨化／超極巨化或改變屬性的道具不受影響。","o":"Held items won't have any effect on this Pokémon. Items that allow the Pokémon to Mega Evolve, use Z-Moves, go Dynamax/ Gigantamax or Change type are not affected.","f":"這隻寶可夢不懂得怎麼正確使用工具，常常用出意想不到的方式。","fo":"This Pokémon does not understand how to use tools correctly, usually using them in unexpected ways.","ai":["r",[248,["t","不受攜帶道具效果影響。","Immune to Held Item effects."]]]},{"n":"Leaf Guard","z":"葉子防守","g":4,"e":"大晴天生效期間，此寶可夢無法被施加任何異常狀態。先前已被施加的異常狀態仍會維持。","o":"While Sunny Weather is active, this Pokémon can't have any Status Ailments or Conditions inflicted. Previously inflicted ailments/conditions remain.","f":"這隻寶可夢身上的葉片會隨著陽光舒展，完全包覆並保護牠不受表面的傷害，不過葉子可能需要經常修剪。","fo":"The leaves on this Pokémon's body expand with the sun to completely cover and shield it from superficial damage. They may need to be pruned often.","ai":["r",[308,280,248]]},{"n":"Levitate","z":"飄浮","g":3,"e":"此寶可夢免疫地面屬性招式，以及戰場上生效中的效果，例如場地與某些入場危害。","o":"This Pokémon has immunity to Ground-Type moves and effects active on the battlefield such as Terrains and certain Entry Hazards.","f":"這隻寶可夢以漂浮的方式移動，完全不會碰到地面。","fo":"The Poké .","f":"這隻寶可夢的肌肉極為柔軟且富有彈性，動作輕鬆、靈活又優雅。","fo":"The muscles of this Pokémon are incredibly flexible and elastic. Easing their movement, agility and grace.","ai":["r",[248,281]]},{"n":"Lingering Aroma","z":"甩不掉的氣味","g":9,"e":"若此寶可夢以非遠程物理招式擊中敵人或被其擊中，該敵人的特性會變為「甩不掉的香氣」。","o":"If this Pokémon hits or gets hit with a Non-Ranged Physical Move, the foe's ability is changed to Lingering Aroma.","f":"這隻寶可夢的氣味非常濃烈，可能好聞也可能難聞，但這股氣味會滲進每樣東西，很難去除。","fo":"The Pokémon has a very strong smell, it may be pleasant or disgusting, but the smell will impregnate into everything and be very difficult to remove.","ai":["r",[102,119,["c",[["t","這隻寶可夢用以下招式擊中或被擊中時：","When this Pokémon hits/is hit with:"],67]]]]},{"n":"Liquid Ooze","z":"污泥漿","g":3,"e":"若此寶可夢被會吸取其生命能量的招式擊中（寄生種子、超級吸取、食夢、吸取拳等），會對敵人造成傷害，而非回復。","o":"If this Pokémon is hit by a Move that would asborb it's vital energy (Leech Seed, Mega Drain, Dream Eater, Drain Punch, etc.) it will deal damage to the foe instead of healing.","f":"這隻寶可夢的體內會分泌惡臭又有毒的黏液，千萬別想吃下去。","fo":"The Pokémon produces a pestilent and toxic ooze within its body. Do not attempt to eat it.","ai":["r",[102,["t","對想吸取 HP 的敵人造成傷害","Deal damage to foes trying to absorb HP"]]]},{"n":"Liquid Voice","z":"濕潤之聲","g":7,"e":"此寶可夢使用的所有聲音類招式視為水屬性。","o":"All Sound-Based Moves this Pokémon uses are considered to be Water-Type.","f":"牠聲音裡的聲波能把空氣中的濕氣化為水，一首歌彷彿就能喚出露水、雨水，甚至瀑布。","fo":"Sound waves from its voice turn the moisture in the air into water, seemingly conjuring dew, rain and even cascades out of a song.","ai":["r",[248,120,["t","變成：","Becomes:"],150]]},{"n":"Long Reach","z":"遠隔","g":7,"e":"此寶可夢使用的所有招式都視為具有「遠程」額外效果。","o":"All Moves used by this Pokémon are considered to have the “Ranged” Added Effect.","f":"這隻寶可夢能透過物體和敵人的影子發動攻擊，而真正的目標卻承受了傷害。","fo":"The Pokémon is able to attack through the shadows of objects and foes meanwhile the real targets suffer the damage.","ai":["r",[248,121,203]]},{"n":"Magic Bounce","z":"魔法鏡","g":5,"e":"敵人對此寶可夢或其場地使用的所有變化招式，其效果會改為作用於該敵人。","o":"All Support Move
