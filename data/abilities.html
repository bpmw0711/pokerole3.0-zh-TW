<script>
function dataTable(cfg){
 var tb=document.querySelector(cfg.tb),q=document.getElementById(cfg.q),cnt=document.getElementById(cfg.cnt),extra=cfg.filters||[],clear=document.getElementById(cfg.clear);
 var rows=[].slice.call(tb.rows),base=rows.slice();
 var exm=location.search.match(/[?&]n=([^&]+)/),ex=exm?decodeURIComponent(exm[1]).toLowerCase():'';
 if(exm)q.value=decodeURIComponent(exm[1]);
 function run(){var s=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean),n=0;
  rows.forEach(function(tr){var ok=(!ex||tr.dataset.n===ex)&&extra.every(function(f){var el=document.getElementById(f.id);return !el.value||tr.dataset[f.k]===el.value})&&s.every(function(w){return tr.dataset.s.indexOf(w)>-1});tr.hidden=!ok;if(ok)n++});
  cnt.textContent=n+' / '+rows.length+' 筆';
  clear.hidden=!(q.value||extra.some(function(f){return document.getElementById(f.id).value}));
  document.getElementById(cfg.none).hidden=n>0}
 var timer;q.addEventListener('input',function(){ex='';clearTimeout(timer);timer=setTimeout(run,120)});
 extra.forEach(function(f){document.getElementById(f.id).addEventListener('input',function(){ex='';run()})});
 clear.addEventListener('click',function(){ex='';q.value='';extra.forEach(function(f){document.getElementById(f.id).value=''});if(location.search)history.replaceState(null,'',location.pathname);run();q.focus()});
 run();
 // 排序：點表頭或用下拉選單（手機版沒有表頭，下拉選單才能排序）
 var state={k:null,dir:1},ths=[].slice.call(document.querySelectorAll(cfg.tb.replace(' tbody','')+' th[data-k]')),ssel=cfg.sort?document.getElementById(cfg.sort):null;
 function applySort(){
  ths.forEach(function(t){t.classList.remove('asc','desc');if(state.k&&t.dataset.k===state.k)t.classList.add(state.dir>0?'asc':'desc')});
  if(ssel)ssel.value=state.k?state.k+':'+state.dir:'';
  var list=base.slice(),k=state.k,d=state.dir;
  if(k)list.sort(function(a,b){var x=a.dataset[k]||'',y=b.dataset[k]||'',nx=parseFloat(x),ny=parseFloat(y);
   if(k==='g'){nx=nx||NaN;ny=ny||NaN}
   if(!isNaN(nx)||!isNaN(ny)){if(isNaN(nx))return isNaN(ny)?0:1;if(isNaN(ny))return -1;return (nx-ny)*d}
   return x.localeCompare(y,'zh-Hant')*d});
  var fr=document.createDocumentFragment();list.forEach(function(r){fr.appendChild(r)});tb.appendChild(fr);
  if(clear)clear.hidden=!(q.value||state.k||extra.some(function(f){return document.getElementById(f.id).value}))}
 ths.forEach(function(th){
  th.tabIndex=0;th.setAttribute('role','button');th.title='點一下排序';
  function go(){var k=th.dataset.k;var first=k==='p'?-1:1;
   if(state.k===k){if(state.dir===first)state.dir=-first;else state.k=null}else{state.k=k;state.dir=first}
   applySort()}
  th.addEventListener('click',go);th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
 if(ssel)ssel.addEventListener('input',function(){var v=ssel.value.split(':');state.k=v[0]||null;state.dir=+v[1]||1;applySort()});
 clear.addEventListener('click',function(){state.k=null;applySort()});
 // 從全站搜尋帶錨點進來：捲到該列並標示
 if(location.hash){var el=document.querySelector(location.hash);if(el){el.classList.add('hl');el.scrollIntoView({block:'center'})}}
}
</script>
<script>(function(){var A=[{"n":"Adaptability","z":"適應力","g":4,"e":"每當此寶可夢使用與自身屬性相同的物理或特殊招式時，該招式的傷害骰池額外增加 1 顆骰。","o":"Whenever this Pokémon uses a Physical or Special Move that matches their Type, Add 1 Extra die to the Damage pool of that Move."},{"n":"Aerilate","z":"飛行皮膚","g":6,"e":"此寶可夢使用的一般屬性招式會視同飛行屬性造成傷害，並影響屬性一致加成、弱點與抗性。飛行屬性招式的傷害骰池額外增加 1 顆骰。","o":"Normal-Type Moves that the Pokémon uses will deal damage as if they were Flying-Type, affecting STAB, weakness and resistance. Add 1 Extra die to the Damage Pool of Flying moves."},{"n":"Aftermath","z":"引爆","g":4,"e":"若此寶可夢因非遠程物理招式而昏厥，該攻擊的使用者受到 2 點傷害。","o":"If this Pokémon faints due to a Non-Ranged Physical Move, the User of that attack is dealt 2 Damage."},{"n":"Air Lock","z":"氣閘","g":3,"e":"無效化場上所有天氣的效果。若沒有天氣生效，則無法被招式或特性啟動天氣。若已有天氣生效，它不會消失，但不會產生任何效果。專屬特性。","o":"Negate all the effects of a Weather in the field. If no weather is active, they cannot be activated by Moves or Abilities. If one is already active, it does not disappear but provides no effects. Unique Ability."},{"n":"Analytic","z":"分析","g":5,"e":"若此寶可夢的先攻低於其目標，則其所有傷害骰池額外增加 1 顆骰。","o":"If this Pokémon has a lower initiative than its target, Add 1 Extra die to all their Damage Pools."},{"n":"Anger Point","z":"憤怒穴位","g":4,"e":"若敵人對此寶可夢擊中要害，此寶可夢的力量能力值提升 3 點。","o":"If a foe lands a Critical Hit on this Pokémon, increase this Pokémon's Strength Attribute by 3."},{"n":"Anger Shell","z":"憤怒甲殼","g":9,"e":"當此寶可夢的 HP 在一半或以下時，其力量、特殊與靈巧提升 1 點，但防禦與特防降低 1 點。HP 一半","o":"When this Pokémon's HP is half or less, Increase its Strength, Special and Dexterity Attributes by 1 but Reduce its Defense and Sp. Defense by 1. Half HP"},{"n":"Anticipation","z":"危險預知","g":4,"e":"若有任何敵人知道可能對此寶可夢造成致命或效果絕佳傷害的招式，此寶可夢會向其訓練家示警。","o":"If any foe knows a Move that could deal Lethal or Super Effective damage against this Pokémon, it will alert its Trainer."},{"n":"Arena Trap","z":"沙穴","g":3,"e":"只要此寶可夢在場，進入或已在敵方場地上的寶可夢都會被阻擋。對地面屬性招式免疫的寶可夢不受影響。","o":"Pokémon entering or already on the foe's side of the field become blocked as long as this Pokémon is on the field. Pokémon with immunity to Ground-Type Moves are not affected."},{"n":"Armor Tail","z":"尾甲","g":9,"e":"使用者與範圍內的隊友不會成為帶有先制反應額外效果的物理或特殊招式的目標。","o":"The User and allies in range can't be the target of Physical or Special Moves with the Reaction Added Effect."},{"n":"Aroma Veil","z":"芳香幕","g":6,"e":"使用者與範圍內的隊友免疫「著迷」狀態，以及招式「挑釁」、「無理取鬧」、「怨恨」、「迷人」、「定身法」、「再來一次」與「回復封鎖」的效果。","o":"User and Allies in Range are immune to the “Love” Status Condition and the effects of the moves: Taunt, Torment, Spite, Attract, Disable, Encore, and Heal Block."},{"n":"As One","z":"人馬一體","g":8,"e":"此特性會觸發形態變化，結合兩隻隊友寶可夢的能力值與招式庫。從組成合體的兩隻寶可夢中各選一個特性，合體後的寶可夢可同時使用這兩個特性。專屬特性。","o":"This ability triggers a form change that combines the attributes & movepool of two Allied Pokémon. Choose one ability from each of the two Pokémon forming this union, the joint form of these Pokémon may use those two Abilities at the same time. Unique Ability."},{"n":"Aura Break","z":"氣場破壞","g":6,"e":"反轉特性「暗黑氣場」與「妖精氣場」對其使用者的效果。若這些特性會讓使用者的骰池增加，改為減少。專屬特性。","o":"Invert the effects that the Abilities Dark Aura and Fairy Aura have on their users. If said Abilities would increase a Dice Pool for their User, reduce it instead. Unique Ability."},{"n":"Bad Dreams","z":"夢魘","g":4,"e":"戰鬥輪結束時，對戰場上所有處於睡眠狀態的對象造成 1 點傷害。專屬特性。","o":"At the end of the Round, deal 1 Damage to anyone in the battlefield that has the Sleep Status Condition. Unique Ability."},{"n":"Ball Fetch","z":"撿球","g":8,"e":"每當你對野生寶可夢投出精靈球，若捕捉擲骰失敗，精靈球不會損壞。此寶可夢會在戰鬥輪結束時把它帶回來給你。","o":"Whenever you throw a pokéball to a wild Pokémon, if the roll for catching it is unsuccessful, the pokéball won't break. This Pokémon will bring it back to you at the end of the Round instead."},{"n":"Battery","z":"蓄電池","g":7,"e":"範圍內所有隊友寶可夢的特殊能力值提升 1 點。隊友寶可夢所有特殊招式的傷害骰池額外增加 1 顆骰。使用者本身不會獲得這些效果。","o":"Increase by 1 the Special Attribute of all Ally Pokémon in Range. Ally Pokémon get 1 Extra die to all their Special Move's Damage Pool. The User does not get these effects."},{"n":"Battle Armor","z":"戰鬥盔甲","g":3,"e":"若敵人對此寶可夢擊中要害，不會因此獲得傷害骰池的額外骰。","o":"If a foe lands a Critical Hit on this Pokémon, it won't get any Bonus Dice on its Damage Dice Pool for it."},{"n":"Beads of Ruin","z":"災禍之玉","g":9,"e":"場上除此寶可夢以外的所有人，特防降低 2 點。此寶可夢免疫特性「災禍之玉」、「災禍之劍」、「災禍之簡」與「災禍之鼎」的效果。專屬特性。","o":"Reduce by 2 the Special Defense of everyone in the field, except this Pokémon. This Pokémon is immune to the effects of the Abilities: Beads of Ruin, Sword of Ruin, Tablets of Ruin, and Vessel of Ruin. Unique Ability."},{"n":"Beast Boost","z":"異獸提升","g":7,"e":"若有敵人被這隻究極異獸的攻擊打到昏厥，其最高的能力值提升 1 點。最多可用此方式提升 3 點。專屬特性。","o":"If a foe faints because of an attack dealt by this Ultra Beast, Increase by 1 their highest Attribute. Up to 3 points can be increased this way. Unique Ability."},{"n":"Berserk","z":"怒火沖天","g":7,"e":"當此寶可夢的 HP 在一半或以下時，其特殊能力值提升 2 點。","o":"When this Pokémon's HP is half or less, Increase its Special Attribute by 2."},{"n":"Big Pecks","z":"健壯胸肌","g":5,"e":"此寶可夢的防禦無法被降低。","o":"This Pokémon cannot have its Defense reduced."},{"n":"Blaze","z":"猛火","g":3,"e":"疼痛懲罰不會扣除此寶可夢所使用的火屬性招式的命中或傷害擲骰的成功數。當此寶可夢的 HP 在一半或以下時，火屬性招式的傷害骰池額外增加 2 顆骰。","o":"Pain Penalization won't reduce successes from Accuracy or Damage rolls of Fire-Type Moves used by this Pokémon. Fire-Type Moves get 2 Extra dice to their Damage Pool when this Pokémon is at half HP or less.."},{"n":"Bulletproof","z":"防彈","g":6,"e":"此寶可夢受到的遠程物理招式傷害全部減少 1 點。此寶可夢受到名稱含有 Ball、Blast、Bomb、Cannon、Octazooka、Puff、Shot、Sphere 或 Wrecker 的特殊招式傷害全部減少 1 點。","o":"Reduce by 1 all damage from Ranged Physical Moves dealt to this Pokémon. Reduce by 1 all damage from Special Moves with the words: Ball, Blast, Bomb, Cannon, Octazooka, Puff, Shot, Sphere & Wrecker on their name."},{"n":"Cheek Pouch","z":"頰囊","g":6,"e":"此寶可夢每吃下一顆沒有 HP 回復效果的樹果，就回復 2 HP。（例：（桃桃果、木子果）","o":"This Pokémon restores 2 HP whenever it eats a berry with no HP healing effect. (e.g. Pecha Berry, Lum Berry)"},{"n":"Chilling Neigh","z":"蒼白嘶鳴","g":8,"e":"若有敵人因此寶可夢的物理或特殊招式而昏厥，其力量能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special Move dealt by this Pokémon, Increase its Strength Attribute by 1. Up to 3 points can be increased this way."},{"n":"Chlorophyll","z":"葉綠素","g":3,"e":"大晴天生效期間，此寶可夢的靈巧能力值提升 2 點。","o":"While Sunny Weather is active, Increase this Pokémon's Dexterity Attribute by 2."},{"n":"Clear Body","z":"恆淨之軀","g":3,"e":"其他寶可夢無法提升或降低此寶可夢的能力值。此寶可夢仍可提升或降低自己的能力值。","o":"Other Pokémon cannot Increase or Reduce the Attributes of this Pokémon. This Pokémon can still Increase or Reduce its own Attributes."},{"n":"Cloud Nine","z":"無關天氣","g":3,"e":"無效化天氣狀態對此寶可夢的影響。","o":"Negate the effects of Weather Conditions on this Pokémon."},{"n":"Color Change","z":"變色","g":3,"e":"當此寶可夢受到傷害時，會暫時將屬性改為與剛擊中它的招式相同的屬性。若寶可夢離開戰鬥，此效果結束。","o":"When this Pokémon is dealt damage it will temporarily change its type to match the type of the move that just hit it. The effect ends if the Pokémon is removed from battle."},{"n":"Comatose","z":"絕對睡眠","g":7,"e":"此寶可夢永久處於「睡眠」異常狀態，但免疫其效果。此寶可夢無法被施加其他異常狀態。影響睡眠寶可夢的招式與特性仍然對其有效。","o":"The Pokémon permanently has the “Sleep” Status Ailment but it is immune to its effects. This Pokémon can't be inflicted other Status Ailment or Condition. Moves and Abilities affecting Asleep Pokémon still have an effect on it."},{"n":"Commander","z":"發號施令","g":9,"e":"若場上有隊友吃吼霸，使其能力值與防禦提升 2 點。吃吼霸在場景剩餘時間內被阻擋。所有本應對此寶可夢造成的傷害，改由吃吼霸承受。專屬特性。","o":"If there is an Allied Dodonzo on the field, increase its Attributes and Defenses by 2. Dodonzo is blocked for the rest of the scene. All damage that would be dealt to this Pokémon is dealt to Dadonzo instead. Unique Ability."},{"n":"Competitive","z":"好勝","g":6,"e":"此寶可夢在一場戰鬥中第一次被敵人降低能力值時，其特殊提升 2 點。","o":"The first time this Pokémon gets an Attribute reduced by a foe during a battle, Increase its Special by 2."},{"n":"Compound Eyes","z":"複眼","g":3,"e":"此寶可夢在任何低命中率招式的命中骰池中獲得 2 顆額外骰。","o":"This Pokémon gets 2 Extra Dice on the Accuracy Pool of any move with Low Accuracy."},{"n":"Contrary","z":"唱反調","g":5,"e":"若有任何事物會降低此寶可夢的能力值，改為提升。若有任何事物會提升此寶可夢的能力值，改為降低。","o":"If anything would reduce an Attribute of this Pokémon, increase it instead. If anything would increase an Attribute of this Pokémon, reduce it instead."},{"n":"Corrosion","z":"腐蝕","g":7,"e":"無視敵人對毒屬性傷害的任何免疫，及／或對中毒與劇毒的免疫。","o":"Ignore any immunity the foe has to Poison-Type Damage and/or to be inflicted Poison and Badly Poisoned Status Ailments."},{"n":"Costar","z":"同台共演","g":9,"e":"若此寶可夢進場時，有隊友的能力值／特質被提升，將所有提升複製到此寶可夢身上。若有多名隊友被提升，選擇其中一名複製。","o":"If there's an Ally with increased Attributes/Traits as this Pokémon enters the field, copy all of the Increases onto this Pokémon. If more than one Ally increased has Attribute/Traits, choose one to copy from."},{"n":"Cotton Down","z":"棉絮","g":8,"e":"此寶可夢若被非遠程物理招式擊中，降低其附近區域內所有寶可夢的速度。","o":"Is Pokémon is hit with a Non-Ranged Physical Move, reduce the speed of all Pokémon in an Area close to it."},{"n":"Cud Chew","z":"反芻","g":9,"e":"若此寶可夢持有樹果作為攜帶道具，或被樹果擊中，在戰鬥中會發動其效果兩次。此效果可與招式「回收利用」疊加。","o":"If this Pokémon has a Berry as a Held Item or it is hit by a Berry, it will activate its effects two times during the battle. This effect does stack with the Move “Recycle”."},{"n":"Curious Medicine","z":"怪藥","g":8,"e":"此寶可夢進場時，移除範圍內所有隊友寶可夢身上的能力值提升與降低。戰鬥外，此寶可夢能製作可回復 HP 或造成傷害的藥水，由說書人裁定。","o":"When this Pokémon comes into battle, remove all Attribute Increases and Reductions on all Ally Pokémon in range. Outside of battle, the Pokémon is able to create potions that may heal HP or deal damage at storyteller's discretion."},{"n":"Cursed Body","z":"詛咒之軀","g":5,"e":"每當此寶可夢受到物理或特殊招式傷害時，擲 3 顆機率骰，封印該招式。最多可用此方式封印 3 個招式。","o":"Whenever this Pokémon is dealt damage with a Physical or Special Move, Roll 3 Chance Dice to Disable that Move. Up to 3 Moves may be disabled this way."},{"n":"Cute Charm","z":"迷人之軀","g":3,"e":"若此寶可夢被非遠程物理招式擊中，擲 3 顆機率骰，使敵人陷入著迷。","o":"If this Pokémon is hit with a Non-Ranged Physical Move, roll 3 Chance Dice to make the foe fall in Love."},{"n":"Damp","z":"濕氣","g":3,"e":"只要此寶可夢在場，場上沒有人能使用招式：自爆、大爆炸、薄霧炸裂、腦袋炸裂與燃盡。只要此寶可夢在場，特性「引爆」不會發動。","o":"No one in the field will be able to use the moves: Self-Destruct, Explosion, Misty Explosion, Mind Blown and Burn Up while this Pokémon is in the field. The Ability Aftermath does not activate if this Pokémon is in the field."},{"n":"Dancer","z":"舞者","g":7,"e":"每個戰鬥輪一次，若有寶可夢使用名稱含「舞」的招式（例：龍之舞、花瓣舞等），此寶可夢可立即多得一個免費行動，以相同的命中成功數使用同一個招式；傷害仍需擲骰。狂暴招式只會使用一次。","o":"Once per Round, if a Pokémon uses a Move with the word “Dance” (i.e. Dragon Dance, Petal Dance etc.) This Pokémon gets one free action to use the same Move immediately after with the same number of successes on Accuracy; Damage must still be rolled. Rampage Moves are only used once."},{"n":"Dark Aura","z":"暗黑氣場","g":6,"e":"場上所有寶可夢的惡屬性招式傷害骰池增加 2 顆骰。此效果不會與自身疊加。場上的寶可夢與訓練家不會彼此合作。專屬特性。","o":"Increase 2 dice to all Damage Pools of Dark-Type Moves of all Pokémon in the field. This effect does not stack with itself. Pokémon and Trainers on the field will not cooperate with each other. Unique Ability."},{"n":"Dauntless Shield","z":"不屈之盾","g":8,"e":"每當此寶可夢進入戰鬥，其防禦提升 2 點。戰鬥外，此寶可夢免疫物理傷害。專屬特性。","o":"Whenever this Pokémon enters battle, Increase its Defense by 2. Outside of battle, this Pokémon is immune to physical damage. Unique Ability."},{"n":"Dazzling","z":"鮮艷之軀","g":7,"e":"敵人無法對此寶可夢使用反應類招式。仍可使用無屬性戰技。","o":"Foes cannot use Reaction Moves against this Pokémon. Maneuvers can still be used."},{"n":"Defeatist","z":"軟弱","g":5,"e":"若此寶可夢的 HP 在一半或以下，每個行動擲其忠誠，需 2 個成功；若失敗，該行動中其力量與特殊降低 2 點。若擲骰成功，其能力值維持不變，或恢復先前行動中被降低的部分。","o":"If this Pokémon'sHP is at half or less, roll its Loyalty requiring 2 successes every action, if the roll fails Reduce by 2 its Strength and Special for that action. If the roll is successful it keeps its attributes unchanged or restore them if they were reduced in a previous action."},{"n":"Defiant","z":"不服輸","g":5,"e":"此寶可夢在一場戰鬥中第一次被降低能力值時，其力量提升 2 點。","o":"The first time this Pokémon has an Attribute reduced during a battle, Increase its Strength by 2."},{"n":"Delta Stream","z":"德爾塔氣流","g":6,"e":"此寶可夢登場時，自動啟動強風天氣的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志最高的寶可夢可保有優勢天氣。）專屬特性。","o":"When this Pokémon comes out, it automatically starts the effects of Strong Winds Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate, the Pokémon with highest Will might keep the dominant weather) Unique Ability."},{"n":"Desolate Land","z":"終結之地","g":6,"e":"此寶可夢登場時，自動啟動大日照天氣的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志最高的寶可夢可保有優勢天氣。）專屬特性。","o":"When this Pokémon comes out, it automatically starts the effects of Desolate Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate, the Poké- mon with highest Will might keep the dominant weather). Unique Ability."},{"n":"Disguise","z":"畫皮","g":7,"e":"此寶可夢第一次因物理或特殊招式而受到傷害時，將該傷害降為零。入場危害、天氣狀態與異常狀態不會觸發此特性。專屬特性。","o":"The first time this Pokémon would receive damage due to a Physical or Special Move, reduce that damage to zero. Entry Hazards, Weather Conditions and Status Ailments do not trigger this Ability. Unique Ability."},{"n":"Download","z":"下載","g":4,"e":"此寶可夢登場時會掃描敵人並提供其資訊。接著依說書人裁定，其力量或特殊能力值其中之一提升 1 點。專屬特性。","o":"When this Pokémon comes out it will scan its foes and give information about them. It will then Increase 1 Point to either its Strength or Special Attribute at Storyteller's discretion. Unique Ability."},{"n":"Dragon Maw","z":"龍顎","g":8,"e":"此寶可夢使用的所有物理或特殊龍屬性招式，傷害骰池額外增加 2 顆骰。此效果不適用於定傷招式。","o":"All Physical or Special Dragon-Type Moves that this Pokémon uses have 2 Extra dice on their Damage Pool. This effect does not apply to Moves with set damage."},{"n":"Drizzle","z":"降雨","g":3,"e":"此寶可夢登場時，自動啟動下雨天氣的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志較高的寶可夢可保有優勢天氣。）","o":"When this Pokémon comes out, it automatically starts the effects of Rain Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate the Pokémon with higher Will might keep the dominant weather)"},{"n":"Drought","z":"日照","g":3,"e":"此寶可夢登場時，自動啟動大晴天的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志較高的寶可夢可保有優勢天氣。）","o":"When this Pokémon comes out, it automatically starts the effects of Sunny Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate the Pokémon with higher Will might keep the dominant weather)"},{"n":"Dry Skin","z":"乾燥皮膚","g":4,"e":"大晴天生效期間，此寶可夢在每個戰鬥輪結束時受到 1 點傷害。火屬性攻擊對此寶可夢額外造成 1 點傷害。水屬性攻擊可能改為回復此寶可夢 1 HP，而不造成傷害。","o":"While Sunny Weather is active, this Pokémon will receive 1 damage at the end of each round. Fire attacks will deal 1 additional Damage to this Pokémon. Water attacks may heal 1 HP to this Pokémon instead of dealing damage."},{"n":"Early Bird","z":"早起","g":3,"e":"此寶可夢的睡眠時間減半，戰鬥中擲洞察只需 2 個成功即可醒來。此效果不適用於招式「睡覺」。","o":"The time this Pokémon would be asleep is reduced by half and it will only need to score 2 successes on its Insight roll to wake up in battle. This effect does not apply for the Move “Rest”"},{"n":"Earth Eater","z":"食土","g":9,"e":"每當此寶可夢被地面屬性招式擊中，你可以選擇回復 1 HP，而不受傷害。地面屬性招式不會對此寶可夢造成傷害。","o":"Whenever this Pokémon is hit by a Ground-Type Move, you may Heal 1 HP instead of receiving damage. Ground-type moves do not deal damage to this Pokémon."},{"n":"Effect Spore","z":"孢子","g":3,"e":"若被非遠程物理招式擊中，此寶可夢擲 3 顆機率骰，隨機使敵人陷入中毒、麻痺或睡眠。","o":"If hit by a Non-Ranged Physical Move, the Pokémon rolls 3 Chance Dice to Poison, Paralize or Sleep the foe at random."},{"n":"Electric Surge","z":"電氣製造者","g":7,"e":"此寶可夢登場時，自動啟動招式「電氣場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）","o":"When this Pokémon comes out, it automatically starts the effects of the Move Electric Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain)"},{"n":"Electromorphosis","z":"電力轉換","g":9,"e":"若此寶可夢受到物理或特殊招式傷害，其下一個電屬性招式的傷害骰池額外增加 2 顆骰。","o":"If this Pokémon receives Damage from a Physical or Special Move, Add 2 Extra Dice to the Damage Dice Pool of its next Electric Move."},{"n":"Embody Aspect","z":"面影輝映","g":9,"e":"依其所戴面具，此寶可夢的一項能力值提升 2 點。碧草面具與水井面具－靈巧／火穴面具與礎石面具－力量。專屬特性。","o":"Increase by 2 an Attribute of this Pokémon depending on the mask it wears. Teal & Wellspring Mask - Dexterity / Heartflame & Cornerstone Mask - Strength Unique Ability."},{"n":"Emergency Exit","z":"危險迴避","g":7,"e":"每當此寶可夢的 HP 降到一半或以下時，會回到精靈球中，由一名隊友接替上場。若沒有隊友，戰鬥可能結束。此特性的效果不受阻擋影響。","o":"Whenever this Pokémon's HP reaches half or less, it will switch out to its pokéball, sending an Ally to take its place. If there is no Ally, the battle may end. This Ability's effect is not affected by Block."},{"n":"Fairy Aura","z":"妖精氣場","g":6,"e":"場上所有寶可夢的妖精屬性招式傷害骰池增加 2 顆骰。此效果不會疊加。場上的寶可夢與訓練家不會攻擊此特性的使用者。專屬特性。","o":"Increase 2 dice to all Damage Pools of Fairy-Type Moves of all Pokémon in the field. This effect does not stack. Pokémon and Trainers on the field will not attack the user of this Ability. Unique Ability."},{"n":"Filter","z":"過濾","g":4,"e":"若敵人使用會對此寶可夢造成效果絕佳傷害的招式，該攻擊的總傷害減少 1 點。","o":"If a foe uses a Move that would deal Super Effective Damage to this Pokémon, reduce by 1 the total Damage from that attack."},{"n":"Flame Body","z":"火焰之軀","g":3,"e":"被非遠程物理招式擊中時，此寶可夢擲 3 顆機率骰，使敵人陷入灼傷 2 級。","o":"When hit by a Non-Ranged Physical Move, this Pokémon rolls 3 Chance Dice to inflict 2nd degree Burn on the foe."},{"n":"Flare Boost","z":"受熱激升","g":5,"e":"若此寶可夢陷入任何程度的灼傷，其特殊能力值提升 2 點。","o":"If this Pokémon gets any degree of Burn, Increase 2 points to its Special Attribute."},{"n":"Flash Fire","z":"引火","g":3,"e":"此寶可夢第一次被火屬性招式擊中時，直到場景結束，其使用的火屬性招式傷害骰池額外增加 1 顆骰。火屬性招式不會對此寶可夢造成傷害。","o":"The first time this Pokémon is hit by a Fire-Type move, add 1 Extra die to the Damage Pool of Fire-type Moves this Pokémon uses until the end of the scene. Fire-type moves do not deal damage to this Pokémon."},{"n":"Flower Gift","z":"花之禮","g":4,"e":"大晴天生效期間，使用者與範圍內隊友的力量與特防能力值提升 2 點。","o":"While Sunny Weather is active, Increase 2 Points to the Strength and Sp.Defense Attribute of the User and allies in range."},{"n":"Flower Veil","z":"花幕","g":6,"e":"使用者與範圍內的隊友的能力值／特質無法被降低。使用者與範圍內的隊友無法被施加任何異常狀態。先前已被施加或自行造成的能力值降低和／或異常狀態仍會維持。","o":"User and allies in range can't have their Attributes/Traits reduced. User and allies in range can't have any Status Ailment inflicted on them. Previously inflicted or self-inflicted Attribute reductions and/or ailments remain."},{"n":"Fluffy","z":"毛茸茸","g":7,"e":"此寶可夢受到所有物理招式的傷害減少 2 點。此寶可夢受到火屬性招式的傷害增加 2 點。","o":"Reduce by 2 the Damage dealt to this Pokémon by All Physical Moves. Increase by 2 the Damage dealt to this Pokémon by Fire-Type Moves."},{"n":"Forecast","z":"陰晴不定","g":3,"e":"此寶可夢的屬性會依生效中的天氣而改變。晴天時為火屬性、下雨時為水屬性、冰雹／下雪時為冰屬性、沙暴時為岩石屬性。","o":"The Type of this Pokémon will change depending on the active weather. Fire-Type under Sun, Water-Type under Rain, Ice-Type under Hail/Snow and Rock-Type under Sand."},{"n":"Forewarn","z":"預知夢","g":4,"e":"戰鬥中，此寶可夢會警告其某位敵人所會的最強招式。說書人須私下向此寶可夢的訓練家揭露。","o":"In battle, this Pokémon will warn about the strongest move one of its foes has. Storyteller has to reveal it to the trainer of this Pokémon in secret."},{"n":"Friend Guard","z":"友情防守","g":5,"e":"此寶可夢不會受到隊友所使用招式的傷害。額外效果仍可能生效。","o":"This Pokémon does not receive damage from Moves performed by allies. Added effects may still apply."},{"n":"Frisk","z":"察覺","g":4,"e":"此寶可夢進入戰場時，說書人須告知其訓練家一名敵人所持有的道具。","o":"When this Pokémon enters the battlefield, Storyteller must reveal its trainer the held item of one foe."},{"n":"Full Metal Body","z":"金屬防護","g":7,"e":"其他寶可夢無法降低此寶可夢的能力值。此寶可夢仍可降低自己的能力值。專屬特性。","o":"Other Pokémon cannot Reduce the Attributes of this Pokémon. This Pokémon can still Reduce its own Attributes. Unique Ability."},{"n":"Fur Coat","z":"毛皮大衣","g":6,"e":"此寶可夢受到所有物理招式的傷害減少 2 點。","o":"Reduce by 2 the Damage dealt to this Pokémon by All Physical Moves."},{"n":"Gale Wings","z":"疾風之翼","g":6,"e":"此寶可夢所有飛行屬性招式獲得「先制反應 1」效果。","o":"Add the Effect “Reaction 1” to all Flying-Type Moves of this Pokémon."},{"n":"Galvanize","z":"電氣皮膚","g":7,"e":"此寶可夢使用的一般屬性招式會視同電屬性造成傷害，並影響屬性一致加成、弱點與抗性。電屬性招式額外增加 1 顆傷害骰。","o":"Normal-Type Moves that this Pokémon uses will deal damage as if they were Electric-Type, affecting STAB, weakness and resistance. Add 1 Extra die of Damage to Electric Moves."},{"n":"Gluttony","z":"貪吃鬼","g":4,"e":"此寶可夢可以吃任何種類的食物、藥物或草藥，而沒有負面效果。此寶可夢可持有最多三顆樹果作為攜帶道具，而非只有一顆。這些樹果的效果不可相同。","o":"This Pokémon can eat any type of food, medicine or herbal medicine with no negative effect. This pokémon may have up to three berries as held item instead of just one. The berries must not be of the same effect."},{"n":"Good As Gold","z":"黃金之軀","g":9,"e":"敵人與隊友都無法以變化招式指定此寶可夢為目標。","o":"Neither foes nor Allies can Target this Pokémon with of Support Moves."},{"n":"Gooey","z":"黏滑","g":6,"e":"敵人第一次以非遠程物理招式擊中此寶可夢時，其靈巧能力值降低 1 點。","o":"The first time a foe hits this Pokémon with a Non-Ranged Physical Move, reduce 1 Point to their Dexterity Attribute."},{"n":"Gorilla Tactics","z":"一猩一意","g":8,"e":"每當此寶可夢進入戰鬥，選擇一個招式。此寶可夢在戰鬥中只能使用該招式，但每個戰鬥輪最多可使用 5 次。此寶可夢的力量提升 1 點。","o":"Whenever this Pokémon comes into battle, choose a Move. This Pokémon can only perform that Move during battle, but can use it up to 5 times per round. Increase this Pokémon's Strength by 1."},{"n":"Grass Pelt","z":"草之毛皮","g":6,"e":"若青草場地生效中，此寶可夢的防禦提升 2 點。","o":"If Grassy Terrain is active, Increase this Pokémon's Defense by 2."},{"n":"Grassy Surge","z":"青草製造者","g":7,"e":"此寶可夢登場時，自動啟動招式「青草場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）","o":"When this Pokémon comes out, it automatically starts the effects of the Move Grassy Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain)"},{"n":"Grim Neigh","z":"漆黑嘶鳴","g":8,"e":"若有敵人因此寶可夢的物理或特殊招式而昏厥，其特殊能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special dealt by this Pokémon, Increase its Special Attribute by 1. Up to 3 points can be increased this way."},{"n":"Guard Dog","z":"看門犬","g":9,"e":"若敵人使用招式、特性或道具來降低此寶可夢的力量能力值，無效化該效果，並改為提升 2 點。此寶可夢免疫會將其移出戰鬥的替換招式的效果。","o":"If a foe uses a Move, Ability or Item to reduce this Pokemon's Strength Attribute, negate that effect and increase it by 2 instead. This Pokémon is im- mune to the effect of Switcher Moves that would remove it from battle."},{"n":"Gulp Missile","z":"一口飛彈","g":8,"e":"若此寶可夢使用招式「衝浪」或「潛水」，造成傷害後會改變形態。HP 全滿或超過一半時為「一口吞形態」，一半或以下時為「吞入形態」。若此寶可夢在這些形態下受到敵人傷害，對該敵人造成 2 顆傷害骰與一項效果。之後使用者恢復原本的形態。專屬特性。","o":"If this Pokémon uses the Moves Surf or Dive, it will change forms after dealing damage. “Gulping Form” at full or more than half HP remaining, “Gorging Form” at half or less HP. If the Pokémon is dealt damage by a foe while in any of these Forms, deal 2 Dice of Damage and an effect to that foe. The user returns to its regular form afterwards. Unique Ability."},{"n":"Guts","z":"毅力","g":3,"e":"處於異常狀態（灼傷、冰凍、麻痺、中毒、睡眠）期間，此寶可夢的力量能力值提升 2 點。","o":"While affected by a Status Ailment (Burn, Frozen, Paralysis, Poison, Sleep), Increase this Pokémon's Strength Attribute by 2."},{"n":"Hadron Engine","z":"強子引擎","g":9,"e":"此寶可夢登場時，自動啟動招式「電氣場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）電氣場地生效期間，此寶可夢的特殊能力值提升 2 點。","o":"When this Pokémon comes out, it automatically starts the effects of the Move Electric Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain). While Electric Terrain is active, increase this Pokémon's Special Attribute by 2."},{"n":"Harvest","z":"收穫","g":5,"e":"若此寶可夢在戰鬥中使用了樹果作為攜帶道具，該樹果會在戰鬥結束時重新長出來。","o":"If this Pokémon uses a berry as a held item during a fight, the berry will grow back at the end of the battle."},{"n":"Healer","z":"治癒之心","g":5,"e":"若戰場上有隊友處於異常狀態，此寶可夢在戰鬥輪結束時擲 3 顆機率骰來治癒它。戰鬥外，可花費 1 點意志點來治癒異常狀態。","o":"If an Ally on the battle field has a Status Ailment, at the End of the Round this Pokémon rolls 3 Chance Dice to heal it. Outside of battle it can heal Status Ailments by spending 1 Will Point."},{"n":"Heatproof","z":"耐熱","g":4,"e":"灼傷 1 級與 2 級不會對此寶可夢造成傷害。若此寶可夢被火屬性招式擊中，造成的總傷害減少 2 點。","o":"1st and 2nd Degree Burns deal no Damage to this Pokémon. If this Pokémon is hit by a Fire-Type Move, Reduce the total damage dealt by 2."},{"n":"Heavy Metal","z":"重金屬","g":5,"e":"由說書人裁定，增加此寶可夢的體重。依體重計算傷害的招式，其傷害骰池依使用者增加後的體重調整。","o":"Increase the Pokemon's weight at storyteller's discretion. Moves with damage based on weight get their Damage Pool modified according to the increased weight of the user."},{"n":"Honey Gather","z":"採蜜","g":4,"e":"一小桶蜂蜜最高可賣到 $100。蜂蜜會吸引野生寶可夢，用來餵食寶可夢會使牠開心。","o":"A small barrel of honey can be sold for up to $100. Honey attracts wild Pokémon and feeding a Pokémon with it will make it happy."},{"n":"Hospitality","z":"款待","g":9,"e":"此寶可夢登場時，可花費一點意志點，為一名受傷的隊友回復最多 3 HP。致命傷害不會被此效果治癒。戰鬥外，可移除所有治療用草藥的苦味。","o":"When this Pokémon comes out, it can spend a Will Point to heal up to 3 HP from a damaged Ally. Lethal Damage is not healed with this effect. Outside of battle it can remove the bitter taste from all healing Herbs."},{"n":"Huge Power","z":"大力士","g":3,"e":"此寶可夢的力量能力值永久提升。啟程、新手、標準與進階階級的力量提升 1 點。專家階級以上的力量提升 2 點。","o":"This Pokémon has a permanent increase its Strength Attribute. Ranks Starter, Beginner, Standard and Advanced Increase Strength by 1. Rank Expert and higher Increase Strength by 2."},{"n":"Hunger Switch","z":"飽了又餓","g":8,"e":"戰鬥輪結束時，將此寶可夢的形態在「空腹花紋」與「滿腹花紋」之間切換。戰鬥外，形態依其飢餓程度而改變。專屬特性。","o":"At the end of the Round, switch this Pokémon's Form, from “Hangry” Form to “Full-Belly Form” or vice versa. Outside of battle, the form changes depending on its hunger. Unique Ability."},{"n":"Hustle","z":"活力","g":3,"e":"此寶可夢額外獲得低命中率 1，並使其所有物理招式的傷害骰池額外增加 2 顆骰。","o":"This Pokémon gets an Extra Low Accuracy 1 and adds 2 Extra Dice to the Damage pool of all its Physical Moves."},{"n":"Hydration","z":"濕潤之軀","g":4,"e":"下雨天氣生效期間，此寶可夢會在戰鬥輪結束時治癒其身上所有異常狀態。","o":"While Rain weather is active, this Pokémon will cure all Status Ailments and Conditions it is affected with at the end of the round."},{"n":"Hyper Cutter","z":"怪力鉗","g":3,"e":"此寶可夢的力量能力值無法被招式、特性或道具降低。此寶可夢仍可降低自己的力量能力值。","o":"This Pokémon can't have its Strength Attribute reduced by Moves, Abilities, or Items. This Pokémon can still Reduce its own Strength Attribute."},{"n":"Ice Body","z":"冰凍之軀","g":4,"e":"若冰雹／下雪天氣生效中，你可在戰鬥輪結束時使此寶可夢回復 1 HP。此寶可夢免疫冰雹天氣的傷害。","o":"If Hail/Snow Weather is active, you may restore 1 HP to this Pokémon at the end of the Round. This Pokémon is immune to damage from Hail weather."},{"n":"Ice Face","z":"結凍頭","g":8,"e":"此寶可夢處於「結凍頭形態」時，擁有 2 點額外 HP。若冰塊受到 2 點傷害，將此寶可夢的形態改為「解凍頭形態」。要恢復「結凍頭形態」，此寶可夢必須在冰雹／下雪天氣生效期間完整在場一個戰鬥輪。專屬特性。","o":"The Pokémon has 2 Extra HP when it is on “Ice Face form”. If the Ice receives 2 damage, change the Pokémon's form to “No-Ice Form”. To restore “Ice Face Form” the Pokémon must be out one whole Round while Hail/Snow weather is active. Unique Ability."},{"n":"Ice Scales","z":"冰鱗粉","g":8,"e":"此寶可夢受到所有特殊招式的傷害減少 2 點。","o":"Reduce by 2 the Damage dealt to this Pokémon by All Special Moves."},{"n":"Illuminate","z":"發光","g":3,"e":"提高遭遇隨機、非敵對野生寶可夢的機率。若有環境挑戰，或因能見度降低而有難度懲罰，此寶可夢與範圍內的隊友免疫其影響。","o":"Increases the chance of random, non-hostile, wild Pokémon encounters. If there were enviromental challenges, or difficulty penalties due to reduced visibility, this Pokémon and it's allies in range are immune to the effects."},{"n":"Illusion","z":"幻覺","g":5,"e":"此寶可夢登場時，會呈現隊伍中另一隻寶可夢的樣貌，若受到傷害，幻象就會破除。戰鬥外，可隨意對自己施展幻象。專屬特性。","o":"When this Pokémon comes out, it will have the form of another Pokémon in the party, the illusion breaks if it receives damage. Outside of battle it may cast the illusion on itself at will. Unique Ability."},{"n":"Immunity","z":"免疫","g":3,"e":"此寶可夢不會受到中毒與劇毒異常狀態的傷害。","o":"This Pokémon does not receive damage from Poison and Badly Poisoned Status Ailments."},{"n":"Imposter","z":"變身者","g":5,"e":"此寶可夢一進入戰鬥，就會受到招式「變身」的效果（參見原書）。","o":"As soon as it enters into battle, this Pokémon will be under the effects of the Move Transform ( p.XXX )."},{"n":"Infiltrator","z":"穿透","g":5,"e":"此寶可夢無視敵方場地上所有生效中的護盾招式、防護力場、替身與掩護。","o":"This Pokémon ignores all Shield Moves, Force Fields, Substitutes and Cover active on the foe's side of the field."},{"n":"Innards Out","z":"飛出的內在物","g":7,"e":"若此寶可夢因物理或特殊招式的傷害而昏厥，對攻擊者造成等同於使用者剩餘 HP 的傷害。","o":"If this Pokémon would faint due to damage from a Physical or Special Move, inflict damage on the attacker equal to the remaining HP the user had."},{"n":"Inner Focus","z":"精神力","g":3,"e":"此寶可夢不會畏縮。特性「威嚇」對此寶可夢無效。戰鬥外，此寶可夢比其他人更能抵抗恐嚇手段、恐懼與壓力。","o":"This Pokémon does not Flinch. The Ability Intimidate does not have any effect against this Pokémon. Outside of battle this Pokémon is able to resist intimidation tactics, fear and stress better than others."},{"n":"Insomnia","z":"不眠","g":3,"e":"此寶可夢免疫睡眠狀態。會讓自己陷入睡眠的招式或道具會失敗。","o":"This Pokémon is immune to the Sleep Status. Moves or Items that self-inflict Sleep will fail."},{"n":"Intimidate","z":"威嚇","g":3,"e":"此寶可夢進入戰鬥時，範圍內所有敵人的力量降低 1 點。只要此寶可夢在場，此效果就會持續。戰鬥外，若此寶可夢在場，野生寶可夢會避開隊伍。","o":"When this Pokémon comes into battle, Reduce by 1 the Strength of All foes in Range. This effect will last for as long as this Pokémon is out. Outside of battle, wild Pokémon will avoid the party if this Pokémon is out."},{"n":"Intrepid Sword","z":"不撓之劍","g":8,"e":"每當此寶可夢進入戰鬥，其力量提升 2 點。戰鬥外，此寶可夢可以切開任何表面。專屬特性。","o":"Whenever this Pokémon enters battle, Increase its Strength by 2. Outside of battle, this Pokémon can cut through any surface. Unique Ability."},{"n":"Iron Barbs","z":"鐵刺","g":5,"e":"若此寶可夢被非遠程物理招式擊中，二選一：對攻擊者造成 1 點中立傷害；或對攻擊者擲 2 顆中立傷害骰。","o":"If this Pokémon is hit with a Non-Ranged Physical Move choose one: - Deal 1 Neutral Damage against the attacker. - Roll 2 Dice of Neutral Damage against the attacker."},{"n":"Iron Fist","z":"鐵拳","g":4,"e":"所有拳類招式的傷害骰池額外增加 1 顆骰。","o":"Add 1 Extra Die to the Damage Pool of all Fist Based Moves"},{"n":"Justified","z":"正義之心","g":5,"e":"若惡屬性招式擊中此寶可夢，其力量提升 1 點。最多可用此方式提升 3 點。戰鬥外，遭受或目睹不公不義也會觸發此效果。","o":"If a Dark-Type Move hits this Pokémon, Increase its Strength by 1. Up to 3 points can be increased this way. Outside of battle, suffering or witnessing injustices will also trigger this effect."},{"n":"Keen Eye","z":"銳利目光","g":3,"e":"此寶可夢的命中擲骰成功數不會被招式、道具或特性扣除。","o":"This Pokémon cannot have successes removed from its Accuracy rolls by Moves, Items or Abilities."},{"n":"Klutz","z":"笨拙","g":4,"e":"攜帶道具對此寶可夢不會有任何效果。讓寶可夢超級進化、使用 Z 招式、極巨化／超極巨化或改變屬性的道具不受影響。","o":"Held items won't have any effect on this Pokémon. Items that allow the Pokémon to Mega Evolve, use Z-Moves, go Dynamax/ Gigantamax or Change type are not affected."},{"n":"Leaf Guard","z":"葉子防守","g":4,"e":"大晴天生效期間，此寶可夢無法被施加任何異常狀態。先前已被施加的異常狀態仍會維持。","o":"While Sunny Weather is active, this Pokémon can't have any Status Ailments or Conditions inflicted. Previously inflicted ailments/conditions remain."},{"n":"Levitate","z":"飄浮","g":3,"e":"此寶可夢免疫地面屬性招式，以及戰場上生效中的效果，例如場地與某些入場危害。","o":"This Pokémon has immunity to Ground-Type moves and effects active on the battlefield such as Terrains and certain Entry Hazards."},{"n":"Libero","z":"自由者","g":8,"e":"每當此寶可夢要擲招式的命中時，將其屬性改為與該招式相同。若該招式是造成傷害的物理或特殊招式，在傷害擲骰時套用對應的屬性一致加成。","o":"Whenever this Pokémon is about to roll the Accuracy of a Move, change its type to match that of the Move. If the Move is Physical or Special and deals damage, use the appropriate STAB on the Damage Roll."},{"n":"Light Metal","z":"輕金屬","g":5,"e":"由說書人裁定，減少此寶可夢的體重。依體重計算傷害的招式，其傷害骰池依使用者減少後的體重調整。","o":"Reduce the Pokemon's weight at storyteller's discretion. Moves with damage based on weight get their Damage Pool modified according to the reduced weight of the user."},{"n":"Lightning Rod","z":"避雷針","g":3,"e":"此寶可夢免疫電屬性傷害。若場上任何人使用單體目標的電屬性招式，該招式會被導向此寶可夢。此寶可夢第一次被電屬性招式擊中時，其特殊提升 1 點。","o":"This Pokémon is immune to Electric-Type Damage. If anyone on the field uses a Single-Target Electric-Type Move, it will be redirected towards this Pokémon. The first time this Pokémon is hit by an Electric-Type move, Increase its Special by 1."},{"n":"Limber","z":"柔軟","g":3,"e":"此寶可夢免疫麻痺異常狀態。","o":"This Pokémon is immune to Paralysis Status Ailment."},{"n":"Lingering Aroma","z":"甩不掉的氣味","g":9,"e":"若此寶可夢以非遠程物理招式擊中敵人或被其擊中，該敵人的特性會變為「甩不掉的香氣」。","o":"If this Pokémon hits or gets hit with a Non-Ranged Physical Move, the foe's ability is changed to Lingering Aroma."},{"n":"Liquid Ooze","z":"污泥漿","g":3,"e":"若此寶可夢被會吸取其生命能量的招式擊中（寄生種子、超級吸取、食夢、吸取拳等），會對敵人造成傷害，而非回復。","o":"If this Pokémon is hit by a Move that would asborb it's vital energy (Leech Seed, Mega Drain, Dream Eater, Drain Punch, etc.) it will deal damage to the foe instead of healing."},{"n":"Liquid Voice","z":"濕潤之聲","g":7,"e":"此寶可夢使用的所有聲音類招式視為水屬性。","o":"All Sound-Based Moves this Pokémon uses are considered to be Water-Type."},{"n":"Long Reach","z":"遠隔","g":7,"e":"此寶可夢使用的所有招式都視為具有「遠程」額外效果。","o":"All Moves used by this Pokémon are considered to have the “Ranged” Added Effect."},{"n":"Magic Bounce","z":"魔法鏡","g":5,"e":"敵人對此寶可夢或其場地使用的所有變化招式，其效果會改為作用於該敵人。","o":"All Support Moves used by a foe that target this Pokémon or its side of the field will have their effects redirected into the foe's instead."},{"n":"Magic Guard","z":"魔法防守","g":4,"e":"此寶可夢只會受到物理與特殊招式、持續傷害、混亂狀態、分擔痛楚、同命、滅亡之歌與自傷招式的傷害。免疫來自以下的傷害：特性、異常狀態、入場危害、反作用傷害、攜帶道具或天氣。仍可被施加異常狀態。","o":"The Pokémon only receives damage from Physical and Special Moves, Ongoing Dam- age, Confusion status, Pain Split, Destiny Bond, Perish Song & Self-Damaging Moves. Immune to damage from: Abilities, Status Ailments, Entry Hazards, Recoil, Held Items or Weather. It can still have Status Ailments inflicted."},{"n":"Magician","z":"魔術師","g":6,"e":"此寶可夢會奪走剛被其物理或特殊招式擊中的敵人所持有的道具。若已持有道具，你可以選擇用奪來的道具交換。攜帶道具的資訊請見原書第 83 頁。","o":"This Pokémon will steal the Held Item of a foe it just hit with a Physical or Special Move. If it already has a Held Item you may choose to switch it for the one it stole. For information on Held Items see p. 83."},{"n":"Magma Armor","z":"熔岩鎧甲","g":3,"e":"此寶可夢免疫冰凍異常狀態。","o":"This Pokémon is immune to the Frozen Status Ailment."},{"n":"Magnet Pull","z":"磁力","g":3,"e":"除了使用者外，場上所有鋼屬性寶可夢都會被阻擋。","o":"Other than the user, all Steel-Type Pokémon on the field are Blocked."},{"n":"Marvel Scale","z":"神奇鱗片","g":3,"e":"若此寶可夢處於異常狀態，其防禦能力值提升 2 點。","o":"If this Pokémon has a Status Ailment, Increase its Defense Attribute by 2."},{"n":"Mega Launcher","z":"超級發射器","g":6,"e":"名稱含有「Pulse」與「Aura」關鍵字的招式，傷害骰池額外增加 2 顆骰。名稱含有「Pulse」關鍵字的治療招式變為強效治療。","o":"Add 2 Extra Dice to the Damage pool of moves with the keyword “Pulse” and “Aura” on their name. Healing Moves with the keyword “Pulse” become Complete Heals."},{"n":"Merciless","z":"不仁不義","g":7,"e":"若敵人被施加中毒或劇毒，此寶可夢的所有招式都視為擊中要害。依說書人裁定，此寶可夢使用致命傷害招式時不會手下留情。","o":"If the foe is inflicted with Poison or Badly Poison, all of this Pokémon Moves are considered to be Critical Hits. This Pokémon will not hold back when using Lethal Damage Moves at Storyteller's discretion."},{"n":"Mimicry","z":"擬態","g":8,"e":"若場上有場地招式生效中（例：電氣場地、精神場地等），將此寶可夢的主屬性改為與該場地相符。若場地效果結束，恢復其原本的主屬性。","o":"If there is a Terrain Move active on the field (i.e. Electric Terrain, Psychic Terrain etc.) Change this Pokémon's main type to match that of the active Terrain. Restore its original main type if the terrain effects end."},{"n":"Mind's Eye","z":"心眼","g":9,"e":"夜晚時，此寶可夢使用的所有招式都視為具有「必中」額外效果。它能以一般與格鬥屬性招式命中幽靈屬性寶可夢，並造成一般傷害。","o":"At night time, all Moves used by this Pokémon are considered to have the “Never Miss” Added Effect. It can hit Ghost-Type Pokémon with Normal-Type and Fight-Type Moves, dealing Regular Damage."},{"n":"Minus","z":"負電","g":3,"e":"若場上有隊友寶可夢擁有特性「正電」，此寶可夢的特殊能力值提升 2 點。","o":"If an ally Pokémon on the field has the ability “Plus” (p.XXX), Increase by 2 the Special Attribute of this Pokémon."},{"n":"Mirror Armor","z":"鏡甲","g":8,"e":"敵人對此寶可夢或其場地使用的所有降低能力值／特質的效果，會改為作用於該敵人。","o":"All Effects Reducing Attributes/Traits used by a foe, that target this Pokémon or its side of the field will have their effects redirected into the foe's instead."},{"n":"Misty Surge","z":"薄霧製造者","g":7,"e":"此寶可夢登場時，自動啟動招式「薄霧場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）","o":"When this Pokémon comes out, it automatically starts the effects of the Move Misty Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain)"},{"n":"Mold Breaker","z":"破格","g":4,"e":"若敵方寶可夢擁有會阻止此寶可夢以招式造成傷害的屬性、免疫或特性，一律無視。","o":"If a foe Pokémon has a Type, an immunity, or an Ability that would prevent this Pokémon from dealing Damage with a Move, ignore it."},{"n":"Moody","z":"心情不定","g":5,"e":"戰鬥輪結束時，重置因「善變」而改變的能力值，然後隨機降低一項能力值 1 點，並隨機提升另一項能力值 {N} 點。","o":"At the end of the Round, reset Attributes modified by Moody, then Reduce a random Attribute by and Increase another random Attribute by 1."},{"n":"Motor Drive","z":"電氣引擎","g":4,"e":"此寶可夢第一次被電屬性招式擊中時，其靈巧能力值提升 1 點。此寶可夢不會受到電屬性招式的傷害。","o":"The first time this Pokémon is hit by an Electric-type move, Increase 1 Point to its Dexterity Attribute. This Pokémon doesn't receive damage from Electric- type moves."},{"n":"Moxie","z":"自信過度","g":5,"e":"若有敵人因此寶可夢使用的物理或特殊招式而昏厥，其力量能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special Move used by this Pokémon, Increase its Strength Attribute by 1. Up to 3 points can be increased this way."},{"n":"Multiscale","z":"多重鱗片","g":5,"e":"此寶可夢 HP 全滿時，下一個受到的物理或特殊招式傷害減少 1 點。","o":"While this Pokémon is at full health, Reduce by 1 the damage taken by the next Physical or Special Move it receives."},{"n":"Multitype","z":"多屬性","g":4,"e":"只有阿爾宙斯可以擁有此特性。此寶可夢可以在戰鬥中任何時刻隨意改變屬性。此特性無法以任何方式被複製、交換、轉移、改變、無視或無效化。專屬特性。","o":"Only Arceus may have this Ability.This Pokémon can freely change its Type at will in any moment of the battle. This Ability cannot be copied, switched, transfered, changed, ignored or negated in any way. Unique Ability."},{"n":"Mummy","z":"木乃伊","g":5,"e":"當此寶可夢以非遠程物理招式擊中敵人或被其擊中時，該敵人的特性會變為「木乃伊」。","o":"When this Pokémon hits or gets hit with a Non-Ranged Physical Move, the foe's Ability is changed to Mummy."},{"n":"Mycelium Might","z":"菌絲之力","g":9,"e":"此寶可夢使用的所有變化招式都視為具有「必中」與「後制反應 1」額外效果。","o":"All Support Moves used by this Pokémon are considered to have the “Never Miss” and “Late Reaction 1” Added Effect."},{"n":"Natural Cure","z":"自然回復","g":3,"e":"戰鬥輪結束時，若此寶可夢處於異常狀態，擲 3 顆機率骰來治癒。","o":"At the end of the Round, if this Pokémon has a Status Ailment or Condition, Roll 3 Chance Dice to heal it."},{"n":"Neuroforce","z":"腦核之力","g":7,"e":"此寶可夢使用的任何對敵人效果絕佳的招式，額外造成 1 點傷害。","o":"This Pokémon will deal 1 Extra Damage on any Move that is Super Effective against a foe."},{"n":"Neutralizing Gas","z":"化學變化氣體","g":8,"e":"只要此寶可夢在場，範圍內所有敵人的特性效果都會被無效化。","o":"All foes in range will have the effects of their Abilities negated as long as this Pokémon is on the field."},{"n":"No Guard","z":"無防守","g":4,"e":"戰鬥輪開始時，你可以宣告不使用護盾招式、閃避或對抗技倆。若這麼做，此寶可夢的所有招式擲骰時視為沒有低命中率。","o":"At the start of the Round, you may declare you won't use Shield Moves, Evasion or Clash Maneuvers. If you do, roll all moves of this Pokémon as if they had no Low Accuracy."},{"n":"Normalize","z":"一般皮膚","g":4,"e":"此寶可夢所會的所有招式都視為一般屬性。影響屬性一致加成、弱點、免疫與抗性。一般屬性招式的傷害骰池額外增加 1 顆骰。","o":"All the moves known by this Pokémon are considered Normal-Type. Affecting STAB, weaknesses, immunities, and resistances. Add 1 Extra die to the Damage Pool of Normal Moves."},{"n":"Oblivious","z":"遲鈍","g":3,"e":"此寶可夢不受著迷狀態影響。依說書人裁定，免疫會影響其情感的招式效果，例如挑釁、魅惑、迷人等。","o":"This Pokémon is not affected by the Love Status. It is immune to the effects of moves that affect its feelings such as Taunt, Charm, Captivate, etc. at Storyteller's discretion."},{"n":"Opportunist","z":"跟風","g":9,"e":"若敵方寶可夢提升了某項特質或能力值，此寶可夢也提升同一項特質或能力值。若僵持不下，取最高的數值。","o":"gets If a Pokémon on the foe's side of the field increases a Trait or Attribute, increase the same Trait or Attribute on this Pokémon. In case of stalemate, keep the highest number."},{"n":"Orichalcum Pulse","z":"緋紅脈動","g":9,"e":"此寶可夢登場時，自動啟動大晴天的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）大晴天生效期間，此寶可夢的力量能力值提升 2 點。","o":"When this Pokémon comes out, it automatically starts the effects of the Sunny Weather. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain). While Sunny Weather is active, increase this Pokémon's Strength Attribute by 2."},{"n":"Overcoat","z":"防塵","g":5,"e":"此寶可夢不會受到生效中天氣的傷害。","o":"This Pokémon won't recieve damage from active weather."},{"n":"Overgrow","z":"茂盛","g":3,"e":"疼痛懲罰不會扣除此寶可夢所使用的草屬性招式的命中或傷害擲骰的成功數。當此寶可夢的 HP 在一半或以下時，草屬性招式的傷害骰池額外增加 2 顆骰。","o":"gets on Grass Pain Penalization won't reduce successes from Accuracy or Damage rolls of Grass-Type Moves used by this Pokémon. Grass-Type Moves get 2 Extra dice to their Damage Pool when this Pokémon is at half HP or less.."},{"n":"Own Tempo","z":"我行我素","g":3,"e":"此寶可夢不受混亂狀態影響。","o":"This Pokémon is not affected by the Confused Status Condition."},{"n":"Parental Bond","z":"親子愛","g":6,"e":"此寶可夢的所有傷害骰池都擲兩次。取較高的一次對敵人造成傷害。","o":"All of the Damage Pools of this Pokémon get rolled twice. Choose the highest roll to deal damage to the foe."},{"n":"Pastel Veil","z":"粉彩護幕","g":8,"e":"使用者與範圍內的隊友免疫中毒與劇毒。若該狀態是在此寶可夢登場前就已造成，則仍會維持。","o":"User and Allies in range are immune to Poison and Badly Poison. If the condition was inflicted before this Pokémon came out, it remains."},{"n":"Perish Body","z":"滅亡之軀","g":8,"e":"若此寶可夢被非遠程物理招式擊中，敵人會受到等同於其剩餘 HP 的傷害，並在三個戰鬥輪後昏厥，除非被移出戰鬥。","o":"If this Pokémon is hit with Non-Ranged Physical Move, the foe will receive its remaining HP as damage and faint after three Rounds unless it is removed from battle."},{"n":"Pickpocket","z":"順手牽羊","g":5,"e":"若此寶可夢沒有持有道具，會奪走剛被其非遠程物理招式擊中的敵人所持有的道具。攜帶道具的資訊請見原書。","o":"If this Pokémon is not holding an Item it will steal the held Item of the foe it just hit with a Non-Ranged Physical Move. For information on Held Items see p. XXX"},{"n":"Pickup","z":"撿拾","g":3,"e":"若此寶可夢曾在精靈球外，場景結束時，由說書人裁定其為你找到了什麼。此寶可夢的階級越高，找到的物品越有價值。","o":"If this Pokémon was out of its Pokéball, at the end of the scene see what it found for you at Storyteller's discretion. The higher the Rank of this Pokémon the more valuable the items it will find."},{"n":"Pixilate","z":"妖精皮膚","g":6,"e":"此寶可夢使用的一般屬性招式會視同妖精屬性造成傷害。會影響屬性一致加成、弱點與抗性。妖精屬性招式的傷害骰池額外增加 1 顆骰。","o":"Normal-Type Moves that the Pokémon uses will deal damage as if they were Fairy-Type. Affecting STAB, weakness and resistance. Add 1 Extra die to the Damage Pool of Fairy Moves."},{"n":"Plus","z":"正電","g":3,"e":"若有隊友寶可夢擁有特性「負電」，此寶可夢的特殊能力值提升 2 點。","o":"If an ally Pokémon has the ability “Minus” (p.XXX), Increase by 2 the Special Attribute of this Pokémon."},{"n":"Poison Heal","z":"毒療","g":4,"e":"若此寶可夢中毒或陷入劇毒。它在每個戰鬥輪結束時會回復 1 HP，而不是受到傷害。毒會在 3 個戰鬥輪後被完全吸收並治癒。","o":"If this Pokémon becomes poisoned or badly poisoned. It will Heal 1 HP at the end of each round instead of receiving damage. The Poison will be completely absorbed and healed after 3 Rounds."},{"n":"Poison Point","z":"毒刺","g":3,"e":"若此寶可夢被非遠程物理招式擊中，擲 3 顆機率骰，使敵人中毒。","o":"If this Pokémon is hit by a Non-Ranged Physical Move, Roll 3 Chance Dice to inflict Poison on the foe."},{"n":"Poison Puppeteer","z":"毒傀儡","g":9,"e":"若目標因此寶可夢所使用招式的直接結果而中毒或陷入劇毒，也使其陷入混亂。專屬特性。","o":"If a Target gets the Poison or Badly Poison Status ailments as the direct result of a Move used by this Pokémon, inflict Confusion on them as well. Unique Ability."},{"n":"Poison Touch","z":"毒手","g":5,"e":"若此寶可夢以非遠程物理招式擊中敵人，擲 2 顆機率骰，使敵人中毒。","o":"If this Pokémon hits a foe with a Non-Ranged Physical Move, Roll 2 Chance Dice to Inflict Poison on the foe."},{"n":"Power Construct","z":"群聚變形","g":7,"e":"戰鬥輪結束時，若此寶可夢的 HP 在一半或以下，將其形態變為下一個形態。此寶可夢變換形態時，移除異常狀態，並回復全部 HP 與意志。專屬特性。","o":"At the end of the Round, if this Pokémon has half or less of its HP, change its Form to the next one. When this Pokémon changes Form, remove Status Ailments & restore its full HP & Will. Unique Ability."},{"n":"Power of Alchemy","z":"化學之力","g":7,"e":"在接下來 24 小時內，此寶可夢複製一名昏厥隊友的特性。可用此方式複製多個特性，但戰鬥中只能有一個生效。專屬特性。","o":"For the next 24 Hours the Pokémon copies the ability of a fainted Ally. Multiple Abilities may be copied this way, but only one may be active during combat. Unique Ability."},{"n":"Power Spot","z":"能量點","g":8,"e":"範圍內隊友的物理與特殊招式，傷害骰池額外增加 1 顆骰。若有多隻寶可夢擁有此特性，此效果不會在同一名隊友身上疊加。","o":"Add 1 Extra die to the Damage Pools of Physical and Special Moves by Allies in Range. This Effect does not stack in the same Allies if multiple Pokémon have this Ability."},{"n":"Prankster","z":"惡作劇之心","g":5,"e":"此寶可夢使用的所有變化招式都視為具有額外效果「先制反應 1」。","o":"All Support Moves used by this Pokémon are considered to have: “Reaction 1” as Added Effect."},{"n":"Pressure","z":"壓迫感","g":3,"e":"此寶可夢登場時，範圍內所有敵人花費其剩餘意志點的一半（無條件進位），且不會因此獲得任何效果。此效果不會疊加。","o":"When this Pokémon comes out, All foes in Range spend half (rounded up) of their remaining Will Points without gaining any effect for it. This effect does not stack."},{"n":"Primordial Sea","z":"始源之海","g":6,"e":"此寶可夢登場時，自動啟動颱風天氣的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志最高的寶可夢可保有優勢天氣。）專屬特性。","o":"When this Pokémon comes out, it automatically starts the effects of Typhoon Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate, The Pokémon with highest Will might keep the dominant weather). Unique Ability."},{"n":"Prism Armor","z":"稜鏡裝甲","g":7,"e":"此寶可夢受到效果絕佳的招式所造成的總傷害減少 2 點。","o":"Reduce by 2 the total Damage dealt to this Pokémon by a Super Effective Move."},{"n":"Propeller Tail","z":"螺旋尾鰭","g":8,"e":"無視會將此寶可夢的招式轉向其他目標的招式或特性效果。（例：招式「看我嘛」、特性「避雷針」等。）","o":"Ignore the effects of Moves or Abilities that would change this Pokémon's Moves into another target. (i.e. The Move “Follow Me”, the Ability “Lightining Rod” etc.)"},{"n":"Protean","z":"變幻自如","g":6,"e":"此寶可夢使用物理或特殊招式前，將其屬性改為所打算使用的招式的屬性，並在傷害骰池套用對應的屬性一致加成。","o":"Before this Pokémon uses a Physical or Spaecial Move, change its Type to that of the Move it intends to use the appropriate STAB on the Damage Pool."},{"n":"Protosynthesis","z":"古代活性","g":9,"e":"大晴天生效期間，此寶可夢最高的能力值提升 1 點。若其最高的能力值是靈巧，則提升 2 點。專屬特性。","o":"While Sunny Weather is active, increase this Pokemon's highest Attribute by 1. If their highest Attribute is Dexterity, increase it by 2. Unique Ability."},{"n":"Psychic Surge","z":"精神製造者","g":7,"e":"此寶可夢登場時，自動啟動招式「精神場地」的效果。（若僵持不下，意志較高的寶可夢可保有優勢場地。）","o":"When this Pokémon comes out, it automatically starts the effects of the Move Psychic Terrain. (In case of stalemate the Pokémon with higher Will might keep the dominant Terrain)"},{"n":"Punk Rock","z":"龐克搖滾","g":8,"e":"此寶可夢使用的聲音類招式，傷害骰池額外增加 1 顆骰。對此寶可夢使用的聲音類招式，其總傷害減少 2 點。","o":"Sound-Based Moves this Pokémon uses get 1 Extra die to their Damage Pool. Sound-Based Moves used against this Pokémon have their total Damage reduced by 2."},{"n":"Pure Power","z":"瑜伽之力","g":3,"e":"此寶可夢的力量能力值永久提升。啟程、新手、標準與進階階級的力量提升 1 點。專家階級以上的力量提升 2 點。","o":"This Pokémon has a permanent increase its Strength Attribute. Ranks Starter, Beginner, Standard and Advanced Increase Strength by 1. Rank Expert and higher Increase Strength by 2."},{"n":"Purifying Salt","z":"潔淨之鹽","g":9,"e":"此寶可夢無法被施加任何異常狀態。先前已被施加的異常狀態仍會維持。對此寶可夢使用的幽靈屬性招式，其總傷害減少 3 點。","o":"This Pokémon can't have any Status Ailment inflicted on them. Previously inflicted Ailments remain. Ghost-Type Moves used against this Pokémon have their total Damage Reduced by 3."},{"n":"Quark Drive","z":"夸克充能","g":9,"e":"若電氣場地生效中，此寶可夢最高的能力值提升 1 點。若其最高的能力值是靈巧，則提升 2 點。專屬特性。","o":"If Electric Terrain is active, increase this Pokemon's highest Attribute by 1. If their highest Attribute is Dexterity, increase it by 2. Unique Ability."},{"n":"Queenly Majesty","z":"女王的威嚴","g":7,"e":"敵人無法對此寶可夢使用反應類招式。","o":"Foes cannot use Reaction Moves against this Pokémon."},{"n":"Quick Draw","z":"速擊","g":8,"e":"每個戰鬥輪開始時，擲 3 顆機率骰。若成功，此寶可夢在該戰鬥輪的先攻順序中排第一。若僵持不下，依一般先攻順序。","o":"Roll 3 Chance Dice at the beginning of each Round. If successful, this Pokémon goes first in the initiative order of that Round. In case of stalemate, regular initiative order prevails."},{"n":"Quick Feet","z":"飛毛腿","g":4,"e":"處於異常狀態（灼傷、冰凍、麻痺、中毒、睡眠）期間，此寶可夢的靈巧能力值提升 2 點。若被施加麻痺，此特性會阻止其效果。","o":"While affected by a Status Ailment (Burn, Frozen, Paralysis, Poison, Sleep), Increase this Pokémon's Dexterity Attribute by 2. If inflicted Paralysis, this Ability prevents its effects."},{"n":"Rain Dish","z":"雨盤","g":3,"e":"下雨天氣生效期間，你可在每個戰鬥輪結束時使此寶可夢回復 1 HP。","o":"While Rain Weather is active, you may restore 1 HP to this Pokémon at the end of each Round."},{"n":"Rattled","z":"膽怯","g":5,"e":"此寶可夢第一次被蟲、惡或幽靈屬性招式擊中，或敵人擁有特性「威嚇」時，其靈巧能力值提升 1 點。","o":"The first time this Pokémon is hit by a Bug, Dark, or Ghost-Type Move, or if a foe has the Ability “Intimidate”, Increase its Dexterity Attribute by 1."},{"n":"Receiver","z":"接球手","g":7,"e":"在接下來 24 小時內，此寶可夢複製一名昏厥隊友的特性。只能用此方式複製一個特性。專屬特性。","o":"For the next 24 Hours the Pokémon copies the ability of a fainted Ally. Only one Ability may be copied this way. Unique Ability."},{"n":"Reckless","z":"捨身","g":4,"e":"當此寶可夢使用帶有反作用傷害額外效果的招式時，該招式的傷害骰池額外增加 2 顆骰。","o":"When this Pokémon performs a Move with Recoil as an Added Effect, Add 2 Extra dice to the Damage Pool of that Move."},{"n":"Refrigerate","z":"冰凍皮膚","g":6,"e":"此寶可夢使用的一般屬性招式會視同冰屬性造成傷害。會影響屬性一致加成、弱點與抗性。冰屬性招式的傷害骰池額外增加 1 顆骰。","o":"Normal-Type Moves that the Pokémon uses will deal damage as if they were Ice-Type. Affecting STAB, weakness and resistance. Add 1 Extra die to the Damage Pool of Ice moves."},{"n":"Regenerator","z":"再生力","g":5,"e":"此寶可夢每天可自行回復最多 4 HP，若為致命傷害則最多 2 HP。此寶可夢必須不在戰鬥中，才能受益於此效果。","o":"This Pokémon may Heal up to 4 HP or up to 2 HP in case of Lethal Damage on its own every day. The Pokémon must be out of combat to benefit from this effect."},{"n":"Ripen","z":"熟成","g":8,"e":"使用樹果產生額外效果的招式（例：自然之恩等），傷害骰池額外增加 2 顆骰。由說書人裁定，提高樹果的治療效果。","o":"Moves that use berries for Added Effects will have 2 Extra Dice on their Damage Pool (i.e. “Natural Gift” etc.). Increase the Healing properties of Berries at Storyteller's discretion."},{"n":"Rivalry","z":"鬥爭心","g":4,"e":"若此寶可夢攻擊的敵人性別傾向相同，其力量能力值提升 1 點。若所攻擊的敵人性別傾向相反，其力量能力值降低 1 點。","o":"If this Pokémon targets a foe of the same gender preference, Increase its Strength Attribute by 1. If the targeted foe is of the opposite preference Reduce its Strength Attribute by 1."},{"n":"RKS System","z":"ＡＲ系統","g":7,"e":"將此寶可夢的屬性改為與其攜帶道具欄中的卡帶相符。（例：電卡帶會使此寶可夢變為電屬性。）專屬特性。","o":"Change the Pokemon's Type to match the Disc on its Held Item slot. (i.e. Electric Disc makes this Pokémon become an Electric Type). Unique Ability."},{"n":"Rock Head","z":"堅硬腦袋","g":3,"e":"此寶可夢不會受到反作用傷害。","o":"This Pokémon will not receive damage from Recoil."},{"n":"Rocky Payload","z":"搬岩","g":9,"e":"此寶可夢使用的所有物理或特殊岩石屬性招式，傷害骰池額外增加 1 顆骰。","o":"All Physical or Special Rock-Type Moves this Pokémon uses get 1 Extra die to their Damage Pool."},{"n":"Rough Skin","z":"粗糙皮膚","g":3,"e":"若此寶可夢被非遠程物理招式擊中，二選一：對攻擊者造成 1 點中立傷害；或對攻擊者擲 2 顆中立傷害骰。","o":"If this Pokémon is hit with a Non-Ranged Physical Move choose one: - Deal 1 Neutral Damage against the attacker. - Roll 2 Dice of Neutral Damage against the attacker."},{"n":"Run Away","z":"逃跑","g":3,"e":"此寶可夢無法被阻擋。依說書人裁定，它也可在逃離戰鬥、精靈球或囚禁時獲得額外骰。","o":"This Pokémon cannot be Blocked. It may also obtain bonus dice to escape from battle, Pokéballs or captivity at Storyteller's discretion."},{"n":"Sand Force","z":"沙之力","g":5,"e":"沙暴天氣生效期間，若此寶可夢使用物理或特殊的地面、鋼或岩石屬性招式，該招式的傷害骰池額外增加 1 顆骰。此寶可夢免疫沙暴天氣的傷害。","o":"While Sandstorm Weather is active, if this Pokémon uses a Physical or Special Ground, Steel or Rock-Type Move, add 1 Extra die to the Damage Pool of that Move. The Pokémon is immune to damage from Sandstorm Weather."},{"n":"Sand Rush","z":"撥沙","g":5,"e":"沙暴天氣生效期間，此寶可夢的靈巧能力值提升 1 點。此寶可夢免疫沙暴天氣的傷害。","o":"While Sandstorm Weather is active, increase the Dexterity Attibute of this Pokémon by 1. The Pokémon is immune to damage from Sandstorm Weather."},{"n":"Sand Spit","z":"吐沙","g":8,"e":"若此寶可夢被非遠程物理招式擊中，會啟動沙暴天氣的效果。效果持續 4 個戰鬥輪。在沙暴天氣被移除之前，此效果不會再次啟動。","o":"If this Pokémon is hit with a Non-Ranged Physical Move, it starts the effects of Sandstorm Weather. The effect lasts 4 rounds. This effect does not reactivate until the Sandstorm Weather is removed."},{"n":"Sand Stream","z":"揚沙","g":3,"e":"此寶可夢登場時，自動啟動沙暴天氣的效果。寶可夢離開戰鬥時，效果結束。（若僵持不下，意志較高的寶可夢可保有優勢天氣。）","o":"When this Pokémon comes out, it automatically starts the effects of Sandstorm Weather. The effects end when the Pokémon leaves the battle. (In case of stalemate the Pokémon with higher Will, might keep the dominant weather)"},{"n":"Sand Veil","z":"沙隱","g":3,"e":"沙暴天氣生效期間，此寶可夢每個戰鬥輪最多可使用閃避技倆 5 次。此寶可夢免疫沙暴天氣的傷害。","o":"While Sandstorm Weather is active, this Pokémon can use the Evasion Maneuver up to 5 times per Round. The Pokémon is immune to damage from Sandstorm weather."},{"n":"Sap Sipper","z":"食草","g":5,"e":"此寶可夢第一次被草屬性攻擊擊中時，其力量能力值提升 1 點，而不受傷害。草屬性招式不會對此寶可夢造成傷害。","o":"The first time this Pokémon is hit by a Grass-type attack, Increase its Strength Attribute by 1 instead of dealing damage. Grass-type moves do not deal damage to this Pokémon."},{"n":"Schooling","z":"魚群","g":7,"e":"當此寶可夢的 HP 在一半或以下時，會呼喚隊友；隊友抵達後，換成 HP 全滿的弱丁魚群聚形態。其階級提升至比你高兩階。戰鬥結束時，恢復弱丁魚的原本形態。治療／昏厥／收回會使隊友無法抵達。專屬特性。","o":"When this Pokémon is at half HP or less it will call for its Allies, when the Allies arrive replace change to Wishiwashi School-Form at full HP. Increase its Rank two above your own. Restore Wishiwashi base Form at the end of the battle. Healing/Fainting/ Recalling prevents the allies from arriving. Unique Ability"},{"n":"Scrappy","z":"膽量","g":4,"e":"此寶可夢可以用一般與格鬥屬性招式命中幽靈屬性寶可夢。若敵人有第二屬性，套用其抗性或弱點。","o":"This Pokémon can hit Ghost-type Pokémon with Normal and Fighting Type Moves. Apply resistances or weaknesses to the foe if it has a secondary type."},{"n":"Screen Cleaner","z":"除障","g":8,"e":"此寶可夢進場時，移除雙方場地上所有生效中的防護力場（例：光牆、反射壁等）。","o":"When this Pokémon enters the field, remove any active Force Fields (i.e. Light Screen, Reflect etc.) on both sides of the field."},{"n":"Seed Sower","z":"掉出種子","g":9,"e":"若此寶可夢被物理或特殊招式擊中，會啟動青草場地的效果。效果持續 4 個戰鬥輪。在場地被移除之前，此效果不會再次啟動。","o":"If this Pokémon is hit with a Physical or Special Move, it starts the effects of Grassy Terrain. The effect lasts 4 rounds. This effect does not reactivate until the Terrain is removed."},{"n":"Serene Grace","z":"天恩","g":3,"e":"此寶可夢使所有帶有機率骰效果的招式，額外增加 2 顆機率骰。（例：（例：某招式有 3 顆機率骰使敵人畏縮，此寶可夢會擲 5 顆機率骰。）","o":"This Pokémon adds 2 Extra Chance Dice to all Moves with effects that use them. (e.g. A move has 3 Chance Dice to Flinch the foe, this Pokémon will roll 5 Chance Dice)"},{"n":"Shadow Shield","z":"幻影防守","g":7,"e":"若此寶可夢 ctive, Increase this Pokémon's Special Attribute by 2 and deal 1 damage to it at the end of the Round."},{"n":"Solid Rock","z":"堅硬岩石","g":4,"e":"若此寶可夢被效果絕佳的招式擊中，其受到的總傷害減少 1 點。","o":"If this Pokémon is hit by a Move that is Super-Effective, reduce by 1 the total Damage dealt to it."},{"n":"Soul-Heart","z":"魂心","g":7,"e":"若有敵人因此寶可夢使用的物理或特殊招式而昏厥，其特殊能力值提升 1 點。最多可用此方式提升 3 點。","o":"If a foe faints because of a Physical or Special Move used by this Pokémon, Increase its Special Attribute by 1. Up to 3 points can be increased this way."},{"n":"Soundproof","z":"隔音","g":3,"e":"此寶可夢免疫所有聲音類招式的傷害與額外效果。","o":"This Pokémon is immune to Damage and Added Effects of all Sound-based moves."},{"n":"Speed Boost","z":"加速","g":3,"e":"戰鬥輪結束時，此寶可夢的靈巧能力值提升 1 點。最多可用此方式提升 3 點。","o":"At the end of the Round, Increase this Pokémon's Dexterity Attribute by 1. Up to 3 Points can be increased this way."},{"n":"Stakeout","z":"監視","g":7,"e":"每當敵方寶可夢被換下場，此寶可夢對新換上場的敵人第一次成功的攻擊，額外造成 1 點傷害。","o":"Whenever a foe Pokémon is switched out this Pokémon will inflict 1 Extra Dam- age on its first successful attack to the newly switched in foe."},{"n":"Stall","z":"慢出","g":4,"e":"此寶可夢在先攻順序中一律排在最後。","o":"This Pokémon always goes last in the the initiative order."},{"n":"Stalwart","z":"堅毅","g":8,"e":"無視任何會把此寶可夢的招式轉向其他目標的招式或特性。（例：招式「看我嘛」、特性「避雷針」等。）","o":"Ignore any Moves or Abilities that would redirect this Pokémon's Moves into another Target. (i.e. The Move “Follow Me”, the Ability “Lightining Rod” etc.)"},{"n":"Stamina","z":"持久力","g":7,"e":"此寶可夢第一次受到物理或特殊招式傷害時，其防禦與特防提升 1 點。","o":"The first time this Pokémon receives Damage from a Physical or Special Move, Increase its Defense and Special Defense by 1."},{"n":"Stance Change","z":"戰鬥切換","g":6,"e":"只有堅盾劍怪能使用此特性。戰鬥輪開始時，選擇一種形態。處於刀劍形態時只能使用物理或特殊招式；處於盾牌形態時只能使用輔助招式。依其各形態所具有的階級與上限調整其能力值。兩種形態共用較高的 HP。","o":"Only Aegislash may use this Ability. At the beginning of the round, choose a Form. While in Sword Stance it can only use Physical or Special Moves; While in Shield Stance ","z":"懶惰","g":3,"e":"每隔一個回合擲此寶可夢的忠誠，至少需要 2 個成功。若擲骰失敗，此寶可夢拒絕行動。若成功，則可正常行動。","o":"Roll this Pokemon's Loyalty every other turn and score at least 2 successes. If the roll fails this Pokémon refuses to act. If it is successful it may act normally."},{"n":"Turboblaze","z":"渦輪火焰","g":5,"e":"若有任何屬性、招式、道具或特性會阻止此寶可夢鎖定敵人或造成效果，一律無視。（例：（例：擁有免疫的寶可夢也能中毒、地面屬性寶可夢也能被電屬性招式擊中等。）專屬特性。","o":"If a Type, Move, Item, or Ability would prevent this Pokémon from targeting a foe or inflicting an effect, ignore it. (e.g. A Pokémon with Immunity can be Poisoned, Ground-Type Pokémon can be hit with Electric Moves, etc.) Unique Ability."},{"n":"Unaware","z":"純樸","g":4,"e":"此寶可夢無視敵人身上的任何能力值提升或降低。此效果在對敵人造成傷害與受到敵人傷害時皆適用。","o":"This Pokémon ignores any Increase or Reduction on the foe's Attributes. This effect applies when dealing and receiving damage from a foe."},{"n":"Unburden","z":"輕裝","g":4,"e":"此寶可夢第一次用掉或失去攜帶道具而不再持有任何道具時，其靈巧能力值提升 2 點。","o":"The first time this Pokémon spends or loses its held item and is no longer holding any, Increase 2 Points to its Dexterity Attribute."},{"n":"Unnerve","z":"緊張感","g":5,"e":"只要此寶可夢在場，敵人無法吃下自己持有的樹果或回收的樹果。","o":"Foes cannot consume their held berry or recycled berries while this Pokémon is in the field."},{"n":"Unseen Fist","z":"無形拳","g":8,"e":"護盾招式、防護力場、替身與掩護，皆會被此寶可夢的非遠程物理招式無視。專屬特性。","o":"Shield Moves, Force Fields, Substitute decoys and cover are ignored by this Pokémon's Non-Ranged Physical Moves. Unique Ability."},{"n":"Vessel of Ruin","z":"災禍之鼎","g":9,"e":"場上除此寶可夢以外的所有人，特殊降低 2 點。此寶可夢免疫特性「災禍之玉」、「災禍之劍」、「災禍之簡」與「災禍之鼎」的效果。專屬特性。","o":"Reduce by 2 the Special of everyone in the field, except this Pokémon. This Pokémon is immune to the effects of the Abilities: Beads of Ruin, Sword of Ruin, Tablets of Ruin, and Vessel of Ruin. Unique Ability."},{"n":"Victory Star","z":"勝利之星","g":5,"e":"使用者與範圍內隊友的所有物理與特殊招式，都視為具有額外效果「必中」。專屬特性。","o":"All Physical and Special Moves of the user and allies in range are considered to have: “Never Miss” as Added Effect. Unique Ability."},  Pokémon."},{"n":"White Smoke","z":"白色煙霧","g":3,"e":"其他寶可夢無法降低此寶可夢的能力值。此寶可夢仍可降低自己的能力值。","o":"Other Pokémon cannot Reduce the Attributes of this Pokémon. This Pokémon can still Reduce its own Attributes."},{"n":"Wimp Out","z":"躍躍欲逃","g":7,"e":"每當此寶可夢的 HP 降到總 HP 的一半或以下時，會回到精靈球中，由一名隊友接替上場。若沒有隊友，戰鬥可能結束。此特性的效果不受阻擋影響。","o":"Whenever this Pokémon reaches half or less of its total HP, it will switch out to its pokéball, sending an Ally to take its place. If there is no Ally, the battle may end. This Ability's effect is not affected by Block."},{"n":"Wind Power","z":"風力發電","g":9,"e":"每當此寶可夢受到風類招式的傷害，其下一個電屬性招式的傷害骰池額外增加 2 顆骰。此效果不會疊加。","o":"Whenever this Pokémon receives damage from a Wind Move, Add 2 Extra Dice to the Damage pool of the next Electric-Type Move this Pokémon performs. This effect does not stack."},{"n":"Wind Rider","z":"乘風","g":9,"e":"所有風類招式的傷害骰池額外增加 1 顆骰。","o":"Add 1 Extra Die to the Damage Pool of all Wind Moves."},{"n":"Wonder Guard","z":"神奇守護","g":3,"e":"此寶可夢只會受到異常狀態／狀況，以及對它效果絕佳的招式所造成的傷害。此寶可夢免疫其他來源的傷害，例如天氣狀態與入場危害。專屬特性。","o":"This Pokémon only receives damage from Status Ailments/Conditions, and Moves that deal Super Effective damage against it. This Pokémon is immune to damage from other sources like weather conditions and entry hazards. Unique Ability."},{"n":"Wonder Skin","z":"奇跡皮膚","g":5,"e":"對此寶可夢使用的招式或特性效果中，最多減少 2 顆機率骰。（例：招式「火花」原本有 1 顆機率骰使敵人灼傷，對此寶可夢則是零顆機率骰。）","o":"Reduce up to 2 Chance Dice from Effects of Moves or Abilities that target this Pokémon. (Example: The move Ember has 1 Chance Dice to Burn the foe, against this Pokémon it has zero Chance Dice)."},{"n":"Zen Mode","z":"達摩模式","g":5,"e":"只有達摩狒狒可以使用此特性。HP 在一半或以下時，於戰鬥輪結束時變為達摩模式形態。此後使用其達摩模式形態。依其各形態所具有的階級與上限調整其能力值。專屬特性。","o":"Only Darmanitan may use this Ability. When at half or less of its HP, change to Zen Mode Form at the end of the Round. Use its Zen Mode Form from then on. Adjust its Attributes according to the Rank and Limits it has for each Form. Unique Ability."},{"n":"Zero to Hero","z":"全能變身","g":9,"e":"只有海豚俠可以使用此特性。換下場後，變為英雄形態。再次換上場時使用其英雄形態。依其各形態所具有的階級與上限調整其能力值。專屬特性。","o":"Only Palafin may use this Ability. After switching out, change to Hero Form. Use its Hero Form whenit switches back in. Adjust its Attributes according to the Rank and Limits it has for each Form. Unique Ability."}],GZ={"1": "第一世代（關都）", "2": "第二世代（城都）", "3": "第三世代（豐緣）", "4": "第四世代（神奧）", "5": "第五世代（合眾）", "6": "第六世代（卡洛斯）", "7": "第七世代（阿羅拉）", "8": "第八世代（伽勒爾、洗翠）", "9": "第九世代（帕底亞）"};
