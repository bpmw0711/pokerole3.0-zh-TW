<script>
function dataTable(cfg){
 var tb=document.querySelector(cfg.tb),q=document.getElementById(cfg.q),cnt=document.getElementById(cfg.cnt),extra=cfg.filters||[],clear=document.getElementById(cfg.clear);
 var rows=[].slice.call(tb.rows),base=rows.slice();
 var exm=location.search.match(/[?&]n=([^&]+)/),ex=exm?decodeURIComponent(exm[1]).toLowerCase():'';
 if(exm)q.value=decodeURIComponent(exm[1]);
 function run(){var s=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean),n=0;
  rows.forEach(function(tr){var ok=(!ex||tr.dataset.n===ex)&&extra.every(function(f){var el=document.getElementById(f.id);return !el.value||tr.dataset[f.k]===el.value})&&s.every(function(w){return tr.dataset.s.indexOf(w)>-1});tr.hidden=!ok;if(ok)n++});
  cnt.textContent=n+' / '+rows.length+' 筆';
  clear.hidden=!(q.value||extra.some(function(f){return document.getElementById(f.id).value}));
  document.getElementById(cfg.none).hidden=n>0}
 var timer;q.addEventListener('input',function(){ex='';clearTimeout(timer);timer=setTimeout(run,120)});
 extra.forEach(function(f){document.getElementById(f.id).addEventListener('input',function(){ex='';run()})});
 clear.addEventListener('click',function(){ex='';q.value='';extra.forEach(function(f){document.getElementById(f.id).value=''});if(location.search)history.replaceState(null,'',location.pathname);run();q.focus()});
 run();
 // 排序：點表頭或用下拉選單（手機版沒有表頭，下拉選單才能排序）
 var state={k:null,dir:1},ths=[].slice.call(document.querySelectorAll(cfg.tb.replace(' tbody','')+' th[data-k]')),ssel=cfg.sort?document.getElementById(cfg.sort):null;
 function applySort(){
  ths.forEach(function(t){t.classList.remove('asc','desc');if(state.k&&t.dataset.k===state.k)t.classList.add(state.dir>0?'asc':'desc')});
  if(ssel)ssel.value=state.k?state.k+':'+state.dir:'';
  var list=base.slice(),k=state.k,d=state.dir;
  if(k)list.sort(function(a,b){var x=a.dataset[k]||'',y=b.dataset[k]||'',nx=parseFloat(x),ny=parseFloat(y);
   if(k==='g'){nx=nx||NaN;ny=ny||NaN}
   if(!isNaN(nx)||!isNaN(ny)){if(isNaN(nx))return isNaN(ny)?0:1;if(isNaN(ny))return -1;return (nx-ny)*d}
   return x.localeCompare(y,'zh-Hant')*d});
  var fr=document.createDocumentFragment();list.forEach(function(r){fr.appendChild(r)});tb.appendChild(fr);
  if(clear)clear.hidden=!(q.value||state.k||extra.some(function(f){return document.getElementById(f.id).value}))}
 ths.forEach(function(th){
  th.tabIndex=0;th.setAttribute('role','button');th.title='點一下排序';
  function go(){var k=th.dataset.k;var first=k==='p'?-1:1;
   if(state.k===k){if(state.dir===first)state.dir=-first;else state.k=null}else{state.k=k;state.dir=first}
   applySort()}
  th.addEventListener('click',go);th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
 if(ssel)ssel.addEventListener('input',function(){var v=ssel.value.split(':');state.k=v[0]||null;state.dir=+v[1]||1;applySort()});
 clear.addEventListener('click',function(){state.k=null;applySort()});
 // 從全站搜尋帶錨點進來：捲到該列並標示
 if(location.hash){var el=document.querySelector(location.hash);if(el){el.classList.add('hl');el.scrollIntoView({block:'center'})}}
}
</script>

screech will make the target cover its ears instead of covering its flanks.","ic":[1,5,73]},{"n":"Slash","z":"劈開","t":"一般","c":"物理","g":1,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。高要害率。切割類招式。","o":"Single Target. Lethal. High Critical. Cutter Move.","f":"寶可夢用身體最鋒利的部分當作刀刃，帶著兇狠的意圖撕裂劈砍。","fo":"The Pokémon uses the sharpest part of their body as a blade to tear and slash with vicious intent.","ic":[20,1,0,14]},{"n":"Swords Dance","z":"劍舞","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 表演","d":"-","e":"目標：使用者。使用者的力量提升 2 點。","o":"Target Self. Increase the User's Strength by 2.","f":"寶可夢以強勁的步伐和兇猛的態度起舞，作為備戰的儀式。","fo":"The Pokémon dances with strong steps and a fierce attitude as a ritual to prepare for battle.","ic":[8,131]},{"n":"Power Shift","z":"力量轉換","t":"一般","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"目標：使用者。將使用者的力量與防禦對調，特殊與特防對調。","o":"Target Self. Switch the User's Strength with its Defense and its Special with its Sp. Defense.","f":"寶可夢知道，有時候最好的防守就是一次有力的進攻。","fo":"The Pokémon knows that sometimes the best defense is a good offense.","ic":[8]},{"n":"Relic Song","z":"古老之歌","t":"一般","c":"特殊","g":5,"p":"2","a":"特殊 + 表演","d":"特殊 + 2","e":"目標：範圍內所有敵人。聲音類招式。專用。擲 1 顆機率骰，使敵人陷入睡眠。若成功，使用者之後可選擇改變其形態。","o":"Target All Foes in Range. Sound Move. Unique. Roll 1 Chance Die to put the foe to Sleep. If successful, the User may choose to change its form afterwards.","f":"使用者唱歌跳舞，旋律美得你聽著聽著，不知不覺就流下淚來。","fo":"The user sings and dances to a melody so beautiful you won't notice you were crying while listening to it.","ic":[5,7,79,266]},{"n":"Growl","z":"叫聲","t":"一般","c":"變化","g":1,"p":"—","a":"強壯/可愛 + 威嚇","d":"-","e":"目標：範圍內所有敵人。聲音類招式。力量降低 1 點。","o":"Target All Foes in Range. Sound Move. Reduce by 1 the Strength of those affected.","f":"不論是靠威嚇的態度，還是靠討喜的模樣，對手都會猶豫是否要全力攻擊使用者。","fo":"Either through a menacing attitude or an adorable demeanor, the foe will hesitate to attack the user at full power.","ic":[7,5,74]},{"n":"Swallow","z":"吞下","t":"一般","c":"變化","g":3,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。使用者必須先前用過招式「蓄力」，否則此招式失敗。強效治療。若成功，花費 1 點意志點以發動。使用者的防禦與特防降低 1 點。","o":"Target Self. The user must have previously used the Move “Stockpile”, otherwise this Move will fail. Complete Heal, if successful, spend 1 Will point activate. Reduce by 1 User's Defense an Sp. Defense.","f":"蓄力之後，寶可夢吞下能量來恢復健康，之後會恢復原本的大小。","fo":"After stockpiling, the Pokémon swallows the energy to restore their health, they go back to their normal size afterwards.","ic":[279,8,66,147]},{"n":"Uproar","z":"吵鬧","t":"一般","c":"特殊","g":3,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"目標：隨機敵人。聲音類招式。","o":"Target Random foe. Sound Move.","f":"吵鬧聲、尖叫聲，還有喧譁的音樂……寶可夢到底要怎麼做，才能有一個安靜的睡眠夜晚？","fo":"Shouts, screams, and loud music... What does a Pokémon have to do here for a peaceful night of sleep?","ic":[5,100,285,112,32]},{"n":"Whirlwind","z":"吹飛","t":"一般","c":"變化","g":1,"p":"—","a":"靈巧/特殊 + 自然","d":"-","e":"單體目標。後制反應 6。風類招式。敵方替換招式。","o":"Single Target. Late Reaction 6. Wind Move. Switcher Move for the Foe.","f":"強勁的旋風能把你吹到不知哪裡去，你最好穿著你的紅鞋子。","fo":"A strong whirlwind can send you flying away to who knows where. You better be wearing your red shoes.","ic":[102,1,93,94]},{"n":"Roar","z":"吼叫","t":"一般","c":"變化","g":1,"p":"—","a":"力量 + 威嚇","d":"-","e":"單體目標。後制反應 6。敵方替換招式。","o":"Single Target. Late Reaction 6. Switcher Move for the Foe.","f":"以一聲強而有力的咆哮，讓對手重新考慮牠的打算。","fo":"With a potent roar, to make the foe reconsider their intentions.","ic":[1,93,94]},{"n":"Play Nice","z":"和睦相處","t":"一般","c":"變化","g":6,"p":"—","a":"帥氣/可愛 + 禮儀","d":"-","e":"單體目標。目標的力量降低 1 點。","o":"Single Target. Reduce the Target's Strength by 1.","f":"寶可夢開始和對手玩耍，牠友善、有禮貌，還感謝對手陪牠玩得愉快。對手不想打了，只想繼續玩。","fo":"The Pokémon starts to play with the foe. They are firendly, respectful, and thank the foe for the fun time. The foe does not want to fight, they want to keep playing.","ic":[1,74]},{"n":"Yawn","z":"哈欠","t":"一般","c":"變化","g":3,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。 *若目標在下一個戰鬥輪開始時仍未離開戰鬥，使其陷入睡眠。 *","o":"Single Target. *If the Target has not been removed from battle at the beginning of the next Round, put it to Sleep. *","f":"使用者打了個哈欠，對手打了個哈欠，訓練家們也打了個哈欠……大家都該睡個午覺了。","fo":"The user yawns, the foe yawns, the trainers yawn... everyone should take a nap.","ic":[1,205]},{"n":"Sing","z":"唱歌","t":"一般","c":"變化","g":1,"p":"—","a":"可愛/美麗 + 表演","d":"-","e":"單體目標。低命中率 3。聲音類招式。使目標陷入睡眠。","o":"Single Target. Low Accuracy 3. Sound Move. Put the Target to sleep.","f":"寶可夢唱起搖籃曲，歌聲溫柔得讓人想起被蓋好被子、被親吻道晚安的回憶。","fo":"The Pokémon sings a lullaby; the sound is so comforting that it evokes memories of being tucked in bed and kissed good night.","ic":[57,1,5,272]},{"n":"Milk Drink","z":"喝牛奶","t":"一般","c":"變化","g":2,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate.","f":"寶可夢喝下一杯牛奶，富含鈣質與維生素 D，是健康又美味的清涼飲品。","fo":"The Pokémon drinks a glass of milk. Full of calcium and vitamin D it is a healthy and delicious refreshment.","ic":[8,15]},{"n":"Simple Beam","z":"單純光束","t":"一般","c":"變化","g":5,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將目標的特性改為「單純」，持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Change the Target's Ability to “Simple” Whole Scene Duration. This effect does not end by switching out the affected Pokémon.","f":"一道微弱的精神光束，不會傷害或迷惑目標，卻會改變牠對人生的看法，讓牠開始用更簡單的方式看待事物。","fo":"A weak mental beam that doesn't hurt or confuse the target but it does change their view of life as they start to take a simpler apporach to things.","ic":[1,215,42]},{"n":"Spit Up","z":"噴出","t":"一般","c":"特殊","g":3,"p":"4","a":"靈巧 + 導引","d":"特殊 + 4","e":"單體目標。使用者必須先前用過招式「蓄力」，否則此招式失敗。使用者的防禦、特防降低 1 點。","o":"Single Target. The user must have previously used the Move “Stockpile”, otherwise this Move will fail. Reduce by 1 the User's Defense and Sp. Defense.","f":"蓄力之後，寶可夢把儲存的能量化為強大的光束吐出，之後使用者會恢復原本的大小。","fo":"After stockpiling, the Pokémon spits the stored energy as a mighty beam. The user returns to their original size afterwards.","ic":[1,66,147]},{"n":"Recycle","z":"回收利用","t":"一般","c":"變化","g":3,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。寶可夢重新使用一個已在戰鬥中、任一側戰場上被用掉的道具（樹果、傷藥、萬能藥等）。回收利用每場戰鬥中，使用者最多只能使用 3 次。","o":"Target Self. The Pokémon reuses an Item (Berries, Potions, Full Heal, etc.) that has already been spent during the battle on any side of the battlefield. Recycle can't be used more than 3 times per battle by the User.","f":"一隻寶可夢的垃圾，是另一隻寶可夢的寶貝。","fo":"One Pokémon's trash is another one's treasure.","ic":[8]},{"n":"Retaliate","z":"報仇","t":"一般","c":"物理","g":5,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若有隊友在本戰鬥輪或上一戰鬥輪昏厥，傷害骰池額外增加等同於使用者忠誠度的骰數。最多可用此方式增加 5 顆骰。此效果對每名昏厥的隊友只會發動一次。","o":"Single Target. *If an Ally fainted during this or the previous Round, add Extra Dice to the Damage pool. equal to the user's Loyalty. Up to 5 dice may be added this way. This effect only activates once per fainted Ally.","f":"寶可夢眼中帶著憤怒的淚水，絕不讓同伴的倒下不受懲罰。","fo":"With tears of rage in their eyes, the Pokémon will not let the fall of a friend go without punishment.","ic":[1,119]},{"n":"Return","z":"報恩","t":"一般","c":"物理","g":2,"p":"1","a":"洞察 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*每有 1 點使用者的幸福度，此招式的傷害骰池額外增加 1 顆骰，最多可用此方式增加 5 顆。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every point of Happiness on the User, Up to 5 Dice may be added this way.","f":"被疼愛的寶可夢會變得善良快樂，這是由感恩驅動的招式。","fo":"A loved Pokémon grows kind and happy, a Move fueled by gratitude.","ic":[1,119]},{"n":"Multi-Attack","z":"多屬性攻擊","t":"一般","c":"物理","g":7,"p":"5","a":"靈巧 + 鬥毆","d":"力量 + 5","e":"單體目標。專用。此招式的屬性會變得與使用者的主屬性相同。","o":"Single Target. Unique. This Move's type will change to match the User's Main Type.","f":"一隻外表奇特的寶可夢向對手衝鋒，同一招會依寶可夢所持有的光碟不同而釋放出不同種類的能量。","fo":"A weird-looking Pokémon charged against its foes, the same attack released different kinds of energy depending on the disk the Pokémon is holding.","ic":[1,79,210]},{"n":"Sleep Talk","z":"夢話","t":"一般","c":"變化","g":2,"p":"—","a":"依情況而定","d":"依情況而定","e":"若使用者沒有睡著，此招式失敗。使用者可以選擇改用「說夢話」，取代擲骰嘗試醒來。隨機選擇使用者招式庫中的一個招式，並以其攻擊隨機敵人。「說夢話」每戰鬥輪最多可重複使用 5 次。","o":"If the user is not asleep, this Move fails. Instead of making a roll to try to wake up, the user may choose to use Sleep Talk instead. Choose a Move on the user's Move set at random and Target Random foe with it. Sleep Talk can be repeated up to 5 times per Round.","f":"儘管睡著了，寶可夢仍持續夢見這場戰鬥，牠會說些語無倫次的話，甚至夢遊。","fo":"Despite being asleep, the Pokémon keeps dreaming about the battle. They talk incoherences and even sleep walk.","ic":[100]},{"n":"Terrain Pulse","z":"大地波動","t":"一般","c":"特殊","g":8,"p":"*","a":"特殊 + 自然","d":"特殊 + 2 *","e":"單體目標。*若戰場上有生效中的場地，傷害骰池額外增加 2 顆骰。將此招式的屬性改為與目前生效中的場地相符（例：電氣場地、青草場地等）。","o":"Single Target. *Add 2 Extra Dice to the Damage Pool if there is a Terrain active in the Battlefield. Change this Move's Type to match that of a currently active Terrain (i.e. Electric Terrain, Grassy Terrain etc.).","f":"使用者射出一道脈衝，吸收區域中流動的能量，以摧毀對手。","fo":"The user shoots a pulse that absorbs the energy flowing in the area to devastate its foes.","ic":[1,210,49]},{"n":"Stuff Cheeks","z":"大快朵頤","t":"一般","c":"變化","g":8,"p":"-","a":"聰明 + 自然","d":"-","e":"目標：使用者。若使用者持有樹果，會獲得其效果，之後使用者的防禦提升 2 點。所持有的樹果仍可正常使用。","o":"Target Self. If the user has a held Berry, it gains its effects, afterwards, Increase user's Defense by 2. The Held berry can still be used as normal.","f":"寶可夢嚼著樹果，卻把一半留在臉頰裡。看起來很可愛，其實是為了熬過嚴冬的生存策略。","fo":"The Pokémon munches a berry but keeps half of it inside their cheeks. This looks adorable but it is actually a survival tactic to endure harsh winters.","ic":[275,274]},{"n":"Tidy Up","z":"大掃除","t":"一般","c":"變化","g":9,"p":"-","a":"可愛 + 禮儀","d":"-","e":"目標：整個戰場。移除所有生效中的替身／斷尾替身與入場危害（例：黏黏網、撒菱、毒菱等）。使用者的力量、靈巧提升 1 點。","o":"Target Battlefield. Remove all active Substitute/Shed Tail Decoys and Entry Hazards (ie. Sticky Web, Spikes, Toxic Spikes etc.). Increase User's Strength and Dexterity by 1.","f":"使用者協調出一套快速而有效率的方式，把整個地方打掃乾淨。沒有東西散落在地上，沒有玩具留在玩具箱外。很適合訪客上門時使用。","fo":"The user coordinates a quick and efficient way to clean up the whole place. No things scattered on the floor, no toys out of the toybox. Perfect for when visits come over.","ic":[110,281,280]},{"n":"Explosion","z":"大爆炸","t":"一般","c":"物理","g":1,"p":"10","a":"力量 + 導引","d":"力量 + 10","e":"範圍招式。遠程。致命傷害。使用者昏厥。","o":"Area Move. Ranged. Lethal. The User Faints.","f":"寶可夢以一場大爆炸摧毀牠所能摧毀的一切，然後倒下。有時，擺脫困境的唯一辦法就是粉身碎骨。","fo":"Through a massive explosion the Pokémon destroys all they can before fainting. Sometimes the only way to get out of a bad situation is in bits and pieces.","ic":[20,106,2]},{"n":"Glare","z":"大蛇瞪眼","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 威嚇","d":"-","e":"單體目標。低命中率 1。使目標陷入麻痺。","o":"Single Target. Low Accuracy 1. Paralyze the Target.","f":"只要一個眼神，目標就知道自己即將成為別人的午餐，恐懼讓牠動彈不得。","fo":"With just one look, the target knows it is about to be someone else's lunch, fear has them immobilized.","ic":[23,1,255]},{"n":"Thrash","z":"大鬧一番","t":"一般","c":"物理","g":1,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"目標：隨機敵人。狂暴。","o":"Target Random Foe. Rampage.","f":"寶可夢變成一頭野獸，一場狂亂就此開始。","fo":"The Pokémon becomes a wild thing and the rumpus has started.","ic":[100,99]},{"n":"Tera Blast","z":"太晶爆發","t":"一般","c":"物理","g":9,"p":"3","a":"力量/特殊 + 導引","d":"力量/特殊 + 3","e":"單體目標。*若使用者處於太晶化狀態，此招式的屬性變為其太晶屬性。這會影響弱點、抗性與屬性一致加成。","o":"Single Target. *If the User is actively Terastallized, the Type of this Move changes to match that of the Tera-Type. This affects Weaknesses. Resistances and STAB accordingly.","f":"一陣尖銳晶體與太晶能量的爆發，如果寶可夢已太晶化，能量的屬性就會改變，那是美麗得值得一見的景象。","fo":"A blast of sharp crystals and Tera energy, if the Pokémon is Terastallized the energy's type will change. It is something beautiful to witness.","ic":[1,210]},{"n":"Vise Grip","z":"夾住","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。致命傷害。","o":"Single Target. Lethal.","f":"寶可夢抓住對手，愈捏愈緊，直到把牠榨出汁來。","fo":"The Pokémon grabs the foe and starts squeezing harder and harder until they get the juice out of it.","ic":[1,20]},{"n":"Protect","z":"守住","t":"一般","c":"變化","g":2,"p":"—","a":"意志 + 警覺","d":"-","e":"目標：使用者。先制反應 5。護盾招式。此寶可夢受到的物理或特殊招式傷害減少 3 點。無效化以使用者為目標的招式的額外效果。","o":"Target Self. Reaction 5. Shield Move. Reduce 3 Damage This Pokémon would receive from a Physical or Special Move. Negate the Added Effects of Moves that target the user.","f":"一面強大的能量盾牌在使用者面前顯現，彈開攻擊並驅散不良效果。","fo":"A mighty energy shield materializes in front of the user to to deflect attacks and dispel ill effects.","ic":[8,34,149]},{"n":"Disable","z":"定身法","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使目標最後使用的招式被封印。同時只能封印一個招式。","o":"Single Target. Disable the last Move performed by the Target. Only one Move may be Disabled at a time.","f":"寶可夢找到對的神經一拉，就能讓對手無法使出牠最拿手的招式。","fo":"The Pokémon finds the right nerve to pull that will render a foe useless to perform their best Move.","ic":[1,244]},{"n":"Confide","z":"密語","t":"一般","c":"變化","g":6,"p":"—","a":"可愛 + 魅惑","d":"-","e":"單體目標。目標的特殊降低 1 點。","o":"Single Target. Reduce the Target's Special by 1.","f":"寶可夢對目標說了一個祕密，牠們一起咯咯笑，但對手在戰鬥中失去了專注。","fo":"The Pokémon tells a secret to the target. They giggle together but the foe loses its concentration on the battle.","ic":[1,75]},{"n":"Sketch","z":"寫生","t":"一般","c":"變化","g":2,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。複製招式。將「寫生」替換為被複製的招式。永久持續。","o":"Single Target. Copy Move. Replace “Sketch” with the copied Move. Permanent Duration.","f":"寶可夢畫下目標施展招式的草圖，透過這番藝術研究，牠在過程中也學會了同一個招式。","fo":"The Pokémon draws a rough sketch of their target performing a Move and through their art studies they manage to learn that same Move in the process.","ic":[1,193,273]},{"n":"Spike Cannon","z":"尖刺加農炮","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。遠程。連續行動。投彈類招式。","o":"Single Target. Ranged. Succesive Actions. Projectile Move.","f":"寶可夢一波接一波地射出成百上千根小刺。","fo":"The Pokémon shoots wave after wave of hundreds of tiny spikes.","ic":[2,1,13,26]},{"n":"Cut","z":"居合斬","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。致命傷害。切割類招式。","o":"Single Target. Lethal. Cutter Move.","f":"迅速而精準的一刀，連一棵樹都能劈成兩半。","fo":"A swift and precise cut that can even slice a tree in half.","ic":[1,20,14]},{"n":"Hyper Voice","z":"巨聲","t":"一般","c":"特殊","g":3,"p":"3","a":"洞察 + 導引/ 表演","d":"特殊 + 3","e":"目標：範圍內所有敵人。聲音類招式。","o":"Target All Foes in Range. Sound Move.","f":"使用者發出高頻的尖叫或歌聲，頻率高到任何玻璃製品都會碎裂，受害者的耳朵也好不到哪裡去。","fo":"The user screeches or sings at such high frequencies that anything made of glass will break. The ears of the victims are left in no better state.","ic":[259,5]},{"n":"Helping Hand","z":"幫助","t":"一般","c":"變化","g":3,"p":"—","a":"帥氣 + 警覺","d":"-","e":"目標：一名隊友。先制反應 5。目標在下一次技能檢定／命中擲骰時額外獲得 2 顆骰，在下一次傷害擲骰時額外獲得 2 顆骰。此效果不可疊加。","o":"Target One Ally. Reaction 5. The Target Gets 2 Extra Dice on their next Skill Check/Accuracy Roll, and 2 Extra Dice on their next Damage Roll. This Effect does not Stack.","f":"這隻寶可夢總是第一個趕來幫朋友一把，真是個夠義氣的好兄弟。","fo":"The Pokémon is the first to come and give a hand to their friend. A true bro.","ic":[149,128,257,49]},{"n":"Lucky Chant","z":"幸運咒語","t":"一般","c":"變化","g":4,"p":"—","a":"特殊 + 表演","d":"-","e":"目標：使用者與範圍內的隊友。專用。目標可以對其所有擲骰中重擲一顆失敗的骰子。擊中要害不會對目標帶來額外骰加成。持續整個場景。戰鬥外會發生什麼好事，由說書人裁定。","o":"Target User and Allies in Range. Unique. Targets can Re-roll one un-successful die from all their rolls. Critical Hits do not grant Bonus dice against the Targets. Whole Scene Duration. Out of battle, good things happen at Storyteller's Discretion.","f":"年邁女祭司的魔法咒語，透過舞蹈與歌唱，好運與神聖的庇護會降臨在你身上。這個招式也能驅除邪靈與詛咒。","fo":"The magical incantation of an old priestess, through dance and song, good fortune and divine protection will come to you. This Move also removes evil spirits and curses.","ic":[90,79,42]},{"n":"Hyper Drill","z":"強力鑽","t":"一般","c":"物理","g":9,"p":"4","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。無視敵方或其場地上生效中的護盾招式。","o":"Single Target. Lethal. Ignore Shield Moves active on the Foe or their side of the field.","f":"寶可夢把尾巴當作強力的鑽頭，穿透任何接觸到的表面。","fo":"Using their tail as a powerful drill, the Pokémon pierces through any surface it comes in contact with.","ic":[67,1]},{"n":"Double Team","z":"影子分身","t":"一般","c":"變化","g":1,"p":"—","a":"靈巧 + 閃避","d":"-","e":"目標：使用者。使用者現在每個戰鬥輪最多可以閃避 5 次。","o":"Target Self. The User can now make up to 5 Evasions per Round.","f":"寶可夢動作快到製造出一連串自己的殘影，要猜哪一個才是本尊，真是頭痛。","fo":"The Pokémon moves so fast they create a series of shadow copies of themselves. Trying to guess which one is the real one is a pain.","ic":[8]},{"n":"Revival Blessing","z":"復生祈禱","t":"一般","c":"變化","g":9,"p":"—","a":"意志","d":"-","e":"目標：一名隊友。使用者必須花光所有剩餘的意志點；若使用者沒有剩餘的意志點，此招式失敗。使一名昏厥的隊友恢復意識並回復 2 HP。若沒有昏厥的隊友，此招式失敗。該隊友不必處於戰鬥中。","o":"Target One Ally. The User must spend all of their remaining Will points, if the User has no remaining Will points this Move fails. Restore conciousness and 2 HP to a fainted ally. If no Ally is fainted this Move fails. The ally does not need to be active in combat.","f":"寶可夢向天空祈禱，其無私的虔誠與奉獻感動上蒼，奇蹟因此降臨。","fo":"The Pokémon prays to the skies with such selfless fervor and devotion that a miracle is granted.","ic":[128,25]},{"n":"Mind Reader","z":"心之眼","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使用者在下一次對目標的命中或閃避擲骰中，擁有 2 個自動且無法被移除的成功。","o":"Single Target. The User has 2 automatic and unremovable successes on the next Accuracy or Evasion Roll against the Target.","f":"在一瞬間，寶可夢讀取對手的心思，因此確切地知道下一步該怎麼做。","fo":"In a split of second, the Pokémon reads the foe's mind so they know exactly what to do next.","ic":[1]},{"n":"Hyper Fang","z":"必殺門牙","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。啃咬類招式。擲 1 顆機率骰，使目標畏縮。","o":"Single Target. Bite Move. Roll 1 Chance die to Flinch the Target.","f":"寶可夢用力咬住對手，留下難看的牙印。","fo":"The Pokémon bites hard into the foe, leaving nasty teeth marks.","ic":[1,3,258]},{"n":"Bide","z":"忍耐","t":"一般","c":"物理","g":1,"p":"","a":"體魄 + 鬥毆","d":"依情況而定","e":"單體目標。使用者不會對接下來 2 個以其為目標的物理或特殊招式進行閃避或對抗。在對使用者造成的所有傷害結算後，擲出使用者所受傷害總和兩倍的一般屬性傷害骰。無視防禦。","o":"Single Target. The User will not Evade or Clash the next 2 Physical or Special Moves targeting it. Once all damage has been dealt against the User, roll a number of Normal- Type Damage dice equal to twice the total of Damage the User received. Ignore Defenses.","f":"使用者忍受著被打，等待完美的時機反擊。","fo":"The user puts up with being hit, waiting for the perfect opportunity to retaliate.","ic":[1]},{"n":"Raging Bull","z":"怒牛","t":"一般","c":"物理","g":9,"p":"3","a":"洞察 + 威嚇","d":"力量 + 3","e":"單體目標。*此招式的屬性變為使用者的第二屬性；若沒有，則為其主屬性。這會相應影響弱點、抗性與屬性一致加成。","o":"Single Target. *The Type of this Move becomes the same as the User's Secondary Type if possible, otherwise their Main Type. This affects Weakness, Resistances, and STAB accordingly.","f":"寶可夢向對手衝鋒，帶著正義的憤怒、熾烈的怒火、冰冷的盛怒，或者只是毫無理由的暴力慾望，一路踐踏過去。","fo":"The Pokémon charges against a foe, trampling through with a righteous fury, a blazing rage, a cold wrath, or maybe just the senseless desire for violence.","ic":[1,261]},{"n":"Strength","z":"怪力","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。","o":"Single Target.","f":"這隻寶可夢非常強壯，只要集中精神，牠可以繃緊肌肉，遠遠超越力量的極限。","fo":"The Pokémon is very strong. If they concentrate they can strain their muscles to go well beyond their limits of strength.","ic":[1]},{"n":"After You","z":"您先請","t":"一般","c":"變化","g":5,"p":"—","a":"帥氣 + 禮儀","d":"-","e":"目標：一名隊友。先制反應 1。目標將排在先攻順序的第一位。若再次使用，前一個目標恢復其原本的先攻順序。持續整個場景。","o":"Target One Ally. Reaction 1. The Target will go First in the Initiative Order. If used again, the previous target reverts to their original Initiative order. Whole Scene Duration.","f":"使用者鞠躬，彬彬有禮地讓朋友先行。","fo":"The user bows and courteously lets a friend go first.","ic":[128,206,42]},{"n":"Lovely Kiss","z":"惡魔之吻","t":"一般","c":"變化","g":1,"p":"—","a":"缺少的美麗點數","d":"-","e":"單體目標。使目標陷入睡眠。擁有此招式的寶可夢可以完全放棄其美麗值。若寶可夢忘記此招式，恢復 1 點美麗值。","o":"Single Target. Put the Target to Sleep. Pokémon with this Move may forfeit their Beauty score completely. If the Pokémon forgets this Move, restore 1 Point to their Beauty Score.","f":"真愛之吻，可以把任何王子變成呱呱泡蛙，也能讓任何公主沉睡一百年。","fo":"A true love's kiss that could turn any prince into a froakie and put any princess to sleep for a hundred years.","ic":[1,260]},{"n":"Rage","z":"憤怒","t":"一般","c":"物理","g":1,"p":"1","a":"洞察 + 鬥毆/ 威嚇","d":"力量 + 1","e":"單體目標。若敵人在使用此招式後的同一戰鬥輪內以物理或特殊招式傷害使用者，使用者的力量提升 1 點。此效果最多可疊加 3 次。","o":"Single Target. If a foe damages the User with a Physical or Special Move in the same round after using this Move, Increase the User's Strength by 1. This effect can stack up to 3 Times.","f":"使用者發怒，對對手大發脾氣。戰鬥持續得愈久，使用者就愈生氣。","fo":"The user gets angry and throws a tantrum against the foe. The more the battle continues the angrier the user gets.","ic":[1,64]},{"n":"Super Fang","z":"憤怒門牙","t":"一般","c":"物理","g":1,"p":"","a":"力量/ 靈巧 + 鬥毆","d":"依情況而定","e":"單體目標。低命中率 1。啃咬類招式。擲一般屬性傷害骰，數量等同於目標剩餘 HP 的一半。最多可擲 10 顆骰。無視防禦。","o":"Single Target. Low Accuracy 1. Bite Move. Roll Normal-Type Damage Dice tequal to Half of the Target's remaining HP. Up to 10 Dice may be rolled this way. Ignore Defenses.","f":"寶可夢躍起，用強大的尖牙從目標身上咬下一塊肉，每咬一口，能讓牠咬的對手就更少一點。","fo":"The Pokémon jumps to bite a chunk off their Target with their mighty fangs. After each bite there's less and less foe to take chunks off.","ic":[23,1,3]},{"n":"Noble Roar","z":"戰吼","t":"一般","c":"變化","g":6,"p":"—","a":"強壯 + 禮儀/威嚇","d":"-","e":"單體目標。聲音類招式。目標的力量、特殊降低 1 點。","o":"Single Target. Sound Move. Reduce by 1 the Target's Strength and Special.","f":"國王威嚴的咆哮，對聽見的所有人展現尊敬與權威。","fo":"The mighty roar of a king. It commands respect and authority over anyone who listens.","ic":[74,1,75,5]},{"n":"Snore","z":"打鼾","t":"一般","c":"特殊","g":2,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。聲音類招式。擲 3 顆機率骰，使目標畏縮。若使用者沒有睡著，此招式失敗。","o":"Single Target. Sound Move. Roll 3 Chance Dice to Flinch the Target. If the User is not asleep this Move fails.","f":"寶可夢睡著時開始打呼，聲音大到嚇了對手一跳。","fo":"While the Pokémon is asleep they start snoring so loud it startles the foe.","ic":[1,5,256]},{"n":"Entrainment","z":"找夥伴","t":"一般","c":"變化","g":5,"p":"—","a":"帥氣/聰明 + 運動","d":"-","e":"單體目標。將目標的特性替換為使用者的特性。專屬特性無法被傳遞或替換。持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Replace the Target's Ability with the User's. Unique Abilities can't be passed or replaced. Whole Scene Duration. This effect does not end by switching out the affected Pokémon.","f":"寶可夢訓練並教導目標自己最拿手的特性，目標在創紀錄的時間內成為這項特性的大師。","fo":"The Pokémon trains and teaches their best ability to their target. The target becomes a master of this ability in a record time.","ic":[1,215,42]},{"n":"Scratch","z":"抓","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target.","f":"寶可夢用鋒利的爪子抓向敵人。沒什麼花俏，但很有效。","fo":"The Pokémon uses their sharp claws to scratch the enemy. Nothing fancy but it works.","ic":[1]},{"n":"Flail","z":"抓狂","t":"一般","c":"物理","g":2,"p":"1","a":"體魄 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*使用者每缺少 1 點 HP，此招式的傷害骰池就額外增加 1 顆骰。最多可用此方式增加 5 顆骰。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every missing Point of HP the user has. Up to 5 Dice may be added this way.","f":"使用者拚命掙扎想活下去，愈接近倒下，就會有愈多的腎上腺素助長牠求生的努力。","fo":"The user flails around trying to stay alive, as they get closer to fainting, more adrenaline will fuel their efforts of survival.","ic":[1,254]},{"n":"Barrage","z":"投球","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。低命中率 1。遠程。連續行動。投彈類招式。","o":"Single Target. Low Accuracy 1. Ranged. Successive Actions. Projectile Move.","f":"寶可夢把找到的任何東西一個接一個地丟出去，壓倒對手。","fo":"The Pokémon throws whatever objects they find, one after the other to overwhelm the foe.","ic":[237,1,238,13,26]},{"n":"Pound","z":"拍擊","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target.","f":"使用者拍打目標的頭，簡單明瞭。","fo":"The user pounds the target's head. Simple.","ic":[1]},{"n":"Endure","z":"挺住","t":"一般","c":"變化","g":2,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。先制反應 5。護盾招式。若物理或特殊招式會使使用者昏厥，改為剩下 1 HP，此後移除此效果。此效果會在使用者的下一個回合重新啟動。持續整個戰鬥輪。","o":"Target Self. Reaction 5. Shield Move. If a Physical or Special Move would cause the user to faint, they remain at 1 HP instead, remove this effect afterwards. The effect re-activates on the user's next Turn. Whole Round duration.","f":"寶可夢在心理上準備好承受致命一擊，牠的精神比身體更強，所以能撐住，盡可能久地繼續戰鬥。","fo":"The Pokémon mentally prepares to receive a fatal blow, their spirit is stronger than their body so they endure to keep on fighting for as long as possible.","ic":[149,8,34,42]},{"n":"Crush Grip","z":"捏碎","t":"一般","c":"物理","g":4,"p":"*","a":"力量 + 鬥毆","d":"力量 + 1 *","e":"單體目標。致命傷害。專用。*若敵人的 HP 高於 4，每超出 1 點，傷害骰池就額外增加 1 顆骰。最多可用此方式增加 9 顆骰。","o":"Single Target. Lethal. Unique. *If the foe has an HP higher than 4, add 1 Extra Die to the Damage pool for every exceeding point. Up to 9 Dice may be added this way.","f":"寶可夢抓住對手並開始擠壓。小型目標很難抓牢，但體型較大的對象，不壓碎牠絕不鬆手。","fo":"The Pokémon grips the foe and starts crushing it. Small targets are difficult to grasp but larger bodies will not be released until they break.","ic":[20,1,79,243]},{"n":"Double-Edge","z":"捨身衝撞","t":"一般","c":"物理","g":1,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。反作用傷害。","o":"Single Target. Recoil.","f":"寶可夢不顧自身安全，對對手發動魯莽的攻擊。","fo":"Without regard for their own safety, the Pokémon does a reckless attack against their foe.","ic":[1,135]},{"n":"Tail Slap","z":"掃尾拍打","t":"一般","c":"物理","g":5,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。連續行動。","o":"Single Target. Low Accuracy 1. Successive Actions.","f":"寶可夢用尾巴反覆拍打對手的臉。","fo":"The Pokémon uses their tail to repeatedly slap their foe's face.","ic":[96,1,13]},{"n":"Baton Pass","z":"接棒","t":"一般","c":"變化","g":2,"p":"—","a":"靈巧 + 運動","d":"-","e":"目標：使用者。使用者方替換招式。使用者身上的任何能力值提升會傳給下一隻寶可夢。使用者在場景結束前，或被換上場的寶可夢昏厥前，無法再次提升自己的能力值。","o":"Target Self. Switcher Move for the User. Any Attribute increase on the user is passed on the next Pokémon. The user can't increase its own Attributes again until the end of the scene or until the switched Pokémon faints.","f":"寶可夢在戰鬥中奮力衝鋒，替下一位同伴鋪好一切，因為牠知道這是團隊合作。","fo":"The Pokémon rallies through the battle, setting up everything for the next companion as they know this is a team effort.","ic":[8,227]},{"n":"Doodle","z":"描繪","t":"一般","c":"變化","g":9,"p":"—","a":"聰明 + 隱匿","d":"-","e":"單體目標。用目標的特性取代使用者的特性。持續整個場景。","o":"Single Target. Replace the User's Ability with the Target's. Whole Scene Duration.","f":"寶可夢快速畫下目標的塗鴉，不知為何，這幅塗鴉讓寶可夢能運用畫中生物的力量。","fo":"By doodling a quick drawing of their target the doodle somehow allows the Pokémon to make use of the depicted creature's powers.","ic":[246,215,42]},{"n":"Court Change","z":"換場","t":"一般","c":"變化","g":8,"p":"-","a":"聰明 + 禮儀","d":"-","e":"目標：整個戰場。與使用者一側交換敵方場地上的防護力場、入場危害與效果（例：順風、青草場地的回復、火之誓約等）。","o":"Target Battlefield. Swap any Force Fields, Entry Hazards and Effects on the Foe's side of the field (i.e. Tailwind, Grassy Terrain healing, Fire Pledge etc.) for those on the User's side.","f":"寶可夢向裁判示意中場休息，裁判同意了，雙方交換場地。等等……我們東西都有帶過來吧？","fo":"The Pokémon signals the referee for half-time, the referee complies and both parties swap their sides of the field. Wait... we brought everything with us, right?","ic":[110]},{"n":"Metronome","z":"揮指","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 表演","d":"依情況而定","e":"單體目標。複製招式。擲一顆骰決定物理或特殊類別，再擲一顆骰決定此招式的威力。此招式的外觀、屬性與額外效果，由說書人裁定，變得與同威力的某個物理或特殊招式相同。","o":"Single Target. Copy Move. Roll a die to determine Physical or Special category, roll a die to determine this Move's Power. The appearance, Type and added effects of this Move become the same of a Physical or Special Move of the same Power at Storyteller's Discretion,","f":"寶可夢跟著特定的節奏揮舞雙手，周圍的能量隨著節拍起舞，隨機顯現為某個招式。","fo":"The Pokémon waves their hands following a specific rythm, the energy around follows the cadence and manifests as a Move at random.","ic":[1,193]},{"n":"Tickle","z":"搔癢","t":"一般","c":"變化","g":3,"p":"—","a":"可愛 + 鬥毆","d":"-","e":"單體目標。目標的力量、防禦降低 1 點。","o":"Single Target. Reduce by 1 the Target's Strength and Defense.","f":"誰說笑是最好的療法，誰就是騙人。","fo":"Whoever said laughter is the best therapy lied.","ic":[1,74,53]},{"n":"Tail Whip","z":"搖尾巴","t":"一般","c":"變化","g":1,"p":"—","a":"可愛 + 表演","d":"-","e":"目標：範圍內所有敵人。防禦降低 1 點。","o":"Target All foes in Range. Reduce by 1 the Defense of those affected.","f":"寶可夢以可愛無比的方式甩動尾巴，讓對手放下戒心。","fo":"The Pokémon whips their tail in such an adorable way the foes let their guard down.","ic":[7,53]},{"n":"Teeter Dance","z":"搖晃舞","t":"一般","c":"變化","g":3,"p":"—","a":"靈巧/洞察 + 表演","d":"-","e":"範圍招式。使受影響者陷入混亂。","o":"Area Move. Confuse those affected.","f":"寶可夢以搖搖晃晃的動作和雜亂無章的旋轉跳舞，觀眾對這些現代編舞摸不著頭緒。","fo":"The Pokémon dances with wobbly movements and erratic spins. The spectators don't know what to make of these modern choreographies.","ic":[106,276]},{"n":"Me First","z":"搶先一步","t":"一般","c":"變化","g":4,"p":"1","a":"洞察 + 運動","d":"與被複製的招式相同 + 1","e":"單體目標。先制反應 1。複製招式。變化招式無法被複製。專用招式無法被複製。你可以為被複製的招式另選目標。","o":"Single Target. Reaction 1. Copy Move. Support Moves can't be copied. Unique Moves can't be copied. You may choose another Target(s) for the copied Move.","f":"使用者預料到目標的下一個招式，迫不及待地打斷，搶在最前面。","fo":"The user anticipates the next Move the target will use and impatiently interrupts to be the first in line.","ic":[1,206,193]},{"n":"Slam","z":"摔打","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。","o":"Single Target. Low Accuracy 1.","f":"大家站起來，現在是灌籃（slam）時間。","fo":"Everybody get up, it's time to slam now.","ic":[1,96]},{"n":"Crush Claw","z":"撕裂爪","t":"一般","c":"物理","g":3,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 5 顆機率骰，目標的防禦降低 2 點。","o":"Single Target. Roll 5 Chance Dice to Reduce the Target's Defense by 2.","f":"使用者用壓碎般的力道抓住對手，成功擊破對方的盔甲。","fo":"With a crushing grip against the foe, the user manages to break their armor.","ic":[1,242,73]},{"n":"Tackle","z":"撞擊","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 / 力量 + 運動","d":"力量 + 2","e":"單體目標。","o":"Single Target.","f":"使用者衝撞對手，雖然簡單，但很管用。","fo":"The user charges to tackle their foe, it gets the job done.","ic":[1]},{"n":"Fake Out","z":"擊掌奇襲","t":"一般","c":"物理","g":3,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。先制反應 1。使目標畏縮。此招式只能在使用者上場後的第一個戰鬥輪使用。從第二個戰鬥輪起，此招式會自動失敗。","o":"Single Target. Reaction 1. Flinch the Target. This Move will only work on the First Round the User is out in battle. From the second round on, it will fail automatically","f":"寶可夢假裝在為戰鬥做準備，其實是在籌劃對對手的奇襲。","fo":"The Pokémon pretends to be getting ready for the battle when they are actually prepairing a surprise attack on the foe.","ic":[1,206,249]},{"n":"Block","z":"擋路","t":"一般","c":"變化","g":3,"p":"—","a":"力量/靈巧 + 鬥毆","d":"-","e":"單體目標。阻擋。持續整個場景。","o":"Single Target. Blocks. Whole Scene Duration.","f":"你好像不明白，我不是和你一起被困在這裡……是你和我一起被困在這裡！","fo":"You don't seem to understand. I'm not blocked in here with you... You are blocked in here with me!","ic":[1,42,16]},{"n":"Rock Climb","z":"攀岩","t":"一般","c":"物理","g":4,"p":"3","a":"力量 + 運動","d":"力量 + 3","e":"單體目標。低命中率 2。擲 2 顆機率骰，使目標陷入混亂。","o":"Single Target. Low Accuracy 2. Roll 2 Chance Dice to Confuse the Target.","f":"寶可夢爬到對手身上，歇在牠的頭頂，彷彿那是山頂。這讓對手感到困惑。","fo":"The Pokémon climbs over the foe and rests atop of their head as if it were the top of a mountain. This results confusing for the foe.","ic":[21,1,267]},{"n":"Shed Tail","z":"斷尾","t":"一般","c":"變化","g":9,"p":"—","a":"靈巧 + 隱匿","d":"-","e":"目標：使用者。使用者方替換招式。對使用者造成 2 點傷害。放置一個 2 HP、防禦與使用者相同的替身。詳見原書第 531 頁。","o":"Target Self. Switcher Move for the User. Deal 2 Damage to the User. Put a Substitute Decoy with 2HP and the same defenses as the user. See p. 531","f":"寶可夢甩掉自己的尾巴，留下當作誘餌，自己則撤退到安全的地方，讓別人去應付威脅。","fo":"The Pokémon sheds their tail and leaves it as a decoy while it retreats to safety and lets someone else deal with the threat.","ic":[8,251,227]},{"n":"Guillotine","z":"斷頭鉗","t":"一般","c":"物理","g":1,"p":"","a":"力量 + 鬥毆","d":"-","e":"單體目標。低命中率 5。對目標造成等同於其剩餘 HP 的傷害，再加上 1 點致命傷害。","o":"Single Target. Low Accuracy 5. Deal Damage equal to the Target's Remaining HP, plus 1 Lethal Damage.","f":"在革命精神的驅使下，寶可夢宣判對手被斬首。這招毀滅性的攻擊需要緊急前往寶可夢中心……還要一個籃子。","fo":"Fueled by the spirit of revolution the Pokémon sentences their foe to be reduced at the neck. This devastating attack requires an emergency trip to the Pokémon Center...and a basket.","ic":[1,216]},{"n":"Razor Wind","z":"旋風刀","t":"一般","c":"特殊","g":1,"p":"5","a":"靈巧 + 導引","d":"特殊 + 5","e":"目標：範圍內所有敵人。蓄力招式。高要害率。切割類招式。","o":"Target All Foes in Range. Charge Move. High Critical. Cutter Move.","f":"寶可夢擺動風，蓄積出一把看似無形的、由加壓空氣構成的刀刃，風會像剃刀一樣切開所有碰到的東西。","fo":"The Pokémon sways the winds while charging what appears to be an invisible blade made of pressurized air. The wind slices everything it touches as if it were a razor.","ic":[114,265,0,14]},{"n":"Morning Sun","z":"晨光","t":"一般","c":"變化","g":2,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。若為大晴天，此招式變為強效治療。若在下雨、沙暴、冰雹或下雪天氣下使用，此招式為定額治療，只回復 1 HP。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate. If Sunny Weather is in effect, this Move becomes a Complete Heal. If performed under Rain, Sandstorm, Hail or Snowy Weather, this Move is a Minor heal and only heals 1 HP.","f":"早晨明亮的陽光讓寶可夢感到精神煥發。","fo":"The Pokémon feels revitalized with the bright sun early in the mornings.","ic":[8,15]},{"n":"Tera Starstorm","z":"晶光星群","t":"一般","c":"物理","g":9,"p":"5","a":"力量/特殊 + 導引","d":"力量/特殊 + 3","e":"目標：範圍內所有敵人。專用招式。*若使用者處於太晶化狀態，此招式的屬性變為其太晶屬性。這會影響弱點、抗性與屬性一致加成。隨機改變受影響者的屬性。","o":"Target All Foes in Range. Unique Move. *If the User is actively Terastallized, the Type of this Move changes to match that of the Tera-Type. This affects Weaknesses. Resistances and STAB accordingly. Change the type of those affected at random.","f":"充滿能量的太晶結晶如隕石般從天空墜落，隨後出現美麗卻極度混亂的場面，所有寶可夢都不受控制地吸收太晶能量。","fo":"Tera crystals full of energy fall from the sky as meteors. A beautiful but extemely chaotic scene follows as all Pokémon absorb the Tera Energy without control.","ic":[79,7,210]},{"n":"Substitute","z":"替身","t":"一般","c":"變化","g":1,"p":"—","a":"體魄 + 隱匿","d":"-","e":"目標：使用者。對使用者造成 2 點傷害。放置一個 2 HP、防禦與使用者相同的替身。詳見原書第 531 頁。","o":"Target Self. Deal 2 Damage to the User. Put a Substitute Decoy with 2HP and the same defenses as the user. See p. 531","f":"寶可夢在一陣煙霧中消失，一個和使用者一模一樣的替身取代牠上場，使用者躲在暗處繼續攻擊，替身則負責吸引注意。","fo":"The Pokémon disappears in a poof of smoke. A decoy identical to the user takes their place in battle. The user keeps attacking from the shadows while the decoy serves as distraction.","ic":[8,251]},{"n":"Mimic","z":"模仿","t":"一般","c":"變化","g":1,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。複製招式。將「模仿」替換為被複製的招式。持續整個場景。","o":"Single Target. Copy Move. Replace “Mimic” with the copied Move. Whole Scene Duration.","f":"這隻寶可夢學得很快，牠模仿目標的動作，就這樣獲得一套新的力量。","fo":"The Pokémon is a quick learner. They imitate their target's movements and just like that they get a new set of powers.","ic":[1,193,42]},{"n":"Odor Sleuth","z":"氣味偵測","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 警覺","d":"-","e":"單體目標。敵人無法閃避使用者使用的招式。使用者可無視幽靈屬性對一般與格鬥屬性招式的免疫，反之亦然。戰鬥之外，此招式的成功數可加到任何追蹤目標的擲骰上。","o":"Single Target. The Foe cannot Evade Moves performed by the User. User Ignores Ghost Type immunity to Normal and Fight Type Moves and vice versa. Out of battle, Add successes of this Move to any roll for Tracking targets.","f":"寶可夢用敏銳的嗅覺逼近對手，並在對手試圖溜走時把牠找出來。","fo":"The Pokémon uses their keen sense of smell to corner the foe and find it when it tries to scurry away.","ic":[1,262]},{"n":"Weather Ball","z":"氣象球","t":"一般","c":"特殊","g":3,"p":"2","a":"特殊 + 自然","d":"特殊 + 2 *","e":"單體目標。投彈類招式。*若場上有天氣狀態，傷害骰池額外增加 2 顆骰。此招式的屬性會依天氣而改變。晴天／火、下雨／水、冰雹或下雪／冰、沙暴／岩石、強風／飛行。","o":"Single Target. Projectile Move. *If there is a weather condi- tion on the field, add 2 Extra Dice to the Dam- age Pool. This Move's type will change accord- ing to the Weather. Sun/Fire, Rain/Water, Hail or Snow/Ice, Sand/Rock, Wind/Flying.","f":"由天氣的力量製成的球。今天的天氣預報：多雲，偶有疼痛陣雨！","fo":"A ball created out of the forces of the weather. Today's forecast is cloudy with a chance of pain!","ic":[26,1,210,49]},{"n":"Heal Bell","z":"治癒鈴聲","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 表演","d":"-","e":"目標：使用者與範圍內的隊友。聲音類招式。治癒目標身上的任何異常狀態。","o":"Target User and Allies in Range. Sound Move. Cure any Status Ailment on the Targets.","f":"魔法鈴鐺的舒緩鈴聲，淨化一切雜質。","fo":"The soothing chime of a magical bell cleanses all impurities.","ic":[90,137,5]},{"n":"Body Slam","z":"泰山壓頂","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 3 Chance Dice to Paralyze the Target.","f":"使用者用身體衝向對手，把對手壓倒在地，讓目標暈頭轉向。","fo":"The user charges against the foe using ther body to slam it down, leaving the target stunned.","ic":[1,89]},{"n":"Tearful Look","z":"淚眼汪汪","t":"一般","c":"變化","g":7,"p":"-","a":"可愛 + 魅惑","d":"-","e":"單體目標。目標的力量、特殊降低 1 點。","o":"Single Target. Reduce by 1 the Target's Strength and Special.","f":"寶可夢的眼眶泛淚，彷彿快哭出來，對手被眼淚打動，失去了戰鬥的意志。","fo":"The Pokémon's eyes start watering as if it were about to cry, it's foe is moved by the tears and loses its will to fight.","ic":[1,74,75]},{"n":"Smelling Salts","z":"清醒","t":"一般","c":"物理","g":3,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若目標處於麻痺狀態，此招式的傷害骰池額外增加 2 顆骰。造成傷害後，治癒目標的麻痺。","o":"Single Target. *If the Target is Paralyzed, add 2 Extra Dice to the Damage pool of this Move. After deal- ing damage, cure the Target's Paralysis.","f":"寶可夢用氣味濃烈的嗅鹽淨化場地，或丟到對手臉上。任何麻痺的寶可夢都會被強烈的氣味刺激得突然一震。","fo":"The Pokémon uses strong smelling salts to purify the arena or to throw into the foe's face. Any paralized Pokémon gets a sudden jolt at the powerfull smell.","ic":[1,49]},{"n":"Covet","z":"渴望","t":"一般","c":"物理","g":3,"p":"2","a":"靈巧 + 隱匿","d":"力量 + 2","e":"單體目標。使用者奪走目標的攜帶道具。若使用者已持有攜帶道具，此效果失敗。","o":"Single Target. The User steals the Target's Held Item. If the User already has a Held Item, this effect fails.","f":"寶可夢被閃亮又色彩繽紛的物品吸引，牠們不明白不是自己的東西不能隨便拿，所以趁沒人注意就拿走了。","fo":"The Pokémon is attracted to shiny and colorful items. They don't understand when something is not theirs for the taking so they just take it when no one is looking.","ic":[1]},{"n":"Perish Song","z":"滅亡之歌","t":"一般","c":"變化","g":2,"p":"—","a":"美麗 + 表演","d":"-","e":"範圍招式。聲音類招式。使用此招式三個戰鬥輪後，對受影響者造成等同於其剩餘 HP 的傷害。從戰鬥中退場可避免此效果。","o":"Area Move. Sound Move. Three Rounds after this Move is used, deal damage to those affected equal to their remaining HP. Removing from battle prevents this effect.","f":"一首悼念逝者的歌，聽起來雖然優美，卻讓人心中充滿悲痛與絕望，聽者彷彿躺在自己的臨終病榻上。","fo":"A song for mourning the departed. Although it sounds beautiful, it fills the heart with grief and despair, making the listeners feel as if they were laying on their death bed.","ic":[106,5]},{"n":"Skull Bash","z":"火箭頭錘","t":"一般","c":"物理","g":1,"p":"6","a":"體魄 + 隱匿","d":"力量 + 6","e":"單體目標。蓄力招式。此招式蓄力期間，使用者的防禦提升 1 點。","o":"Single Target. Charge Move. While this Move is charging, Increase the User's Defense by 1.","f":"使用者縮進殼裡，一動也不動幾秒鐘，對手過來查看時，使用者探出頭來發動毀滅性的一擊。","fo":"The user withdraws into their shell, after a few seconds of them not moving, the foe goes to inspect and the user pops their head out in in a devastating strike.","ic":[1,114,86]},{"n":"Egg Bomb","z":"炸蛋","t":"一般","c":"物理","g":1,"p":"4","a":"力量/靈巧 + 導引","d":"力量 + 4","e":"單體目標。低命中率 2。遠程。投彈類招式。","o":"Single Target. Low Accuracy 2. Ranged. Projectile Move.","f":"目標開不起玩笑（原文以 yolk 諧音 joke）。來個「蛋」味十足的雙關語，讓牠笑到蛋殼都裂開吧。","fo":"The target can't take a yolk. Let's make them laugh with an egg-cellent pun to crack them up.","ic":[21,1,2,26]},{"n":"Smokescreen","z":"煙幕","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 隱匿","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target.","f":"寶可夢用一團煙霧蓋住對手，妨礙牠的視線，方便自己躲藏，或掩護逃跑。","fo":"The Pokémon covers the foe in a cloud of smoke to impair their visibility to make it easier to hide and/or cover their escape.","ic":[1,72]},{"n":"Refresh","z":"煥然一新","t":"一般","c":"變化","g":3,"p":"—","a":"特殊 + 導引/運動","d":"-","e":"目標：使用者。使用者治癒自身的灼傷、冰凍、中毒與麻痺。","o":"Target Self. The User heals itself from any Burn, Freeze, Poison and Paralysis.","f":"寶可夢花幾秒鐘冷靜下來、重新集中精神，再回到戰場。","fo":"The Pokémon takes a few seconds to cool off, refocus, and get back in the game.","ic":[8,201]},{"n":"Head Charge","z":"爆炸頭突擊","t":"一般","c":"物理","g":5,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。反作用傷害。","o":"Single Target. Recoil.","f":"這隻寶可夢頭很硬，在頭對頭的較量中，牠總是正面衝撞。","fo":"The Pokémon is headstrong, in head-to-head competitions they will always charge head on.","ic":[1,135]},{"n":"Boomburst","z":"爆音波","t":"一般","c":"特殊","g":6,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"範圍招式。聲音類招式。","o":"Area Move. Sound Move.","f":"寶可夢製造出突如其來的爆炸聲響，震聾周圍所有人的耳朵。","fo":"The Pokémon creates a sudden explosive sound that deafens everyone around.","ic":[106,5]},{"n":"Hold Hands","z":"牽手","t":"一般","c":"變化","g":6,"p":"-","a":"帥氣 + 魅惑","d":"-","e":"單體目標。戰鬥可能依說書人裁定而結束。目標可以用意志值對抗此招式的命中來嘗試抵抗。戰鬥外可用於降低敵意。","o":"Single Target. The battle may end at Storyteller's discretion. Target may resist rolling their Will score against the Accuracy of this Move. Out of battle, aid to reduce hostile intent.","f":"使用者伸出手表示友好，如果對方寶可夢握住牠的手，牠會非常開心，兩者成為好朋友。","fo":"The user offers their hand in friendship, if the other Pokémon holds their hand they'll be very happy and become good friends.","ic":[1]},{"n":"Take Down","z":"猛撞","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 2。反作用傷害。","o":"Single Target. Low Accuracy 2. Recoil.","f":"寶可夢以魯莽的扭打，把對手砸向地面，通常自己也跟著一起摔倒。","fo":"Through a reckless grapple, the Pokémon smashes the foe into the ground, usually falling along with it.","ic":[21,1,135]},{"n":"Trump Card","z":"王牌","t":"一般","c":"特殊","g":4,"p":"2","a":"意志 + 導引","d":"特殊 + 2 *","e":"單體目標。*若使用者的意志點為一半或更少，傷害骰池額外增加 2 顆骰。**若使用者的意志點耗盡，此招式的傷害骰池改為額外增加 8 顆骰。","o":"Single Target. *If the User's Will points are at half or less, add 2 Extra Dice to the Damage pool. **I f the User's Will points are depleted, add 8 Extra Dice to the Damage pool of this Move instead.","f":"不使出全力就不能放棄。就在大家以為你完蛋時，你手中還握著最後一張牌。","fo":"You can't give up until you have given your all. And just as everyone thinks you are done for, you still the last card in your hand.","ic":[1,247,49]},{"n":"Last Resort","z":"珍藏","t":"一般","c":"物理","g":4,"p":"6","a":"意志 + 鬥毆","d":"力量 + 6","e":"單體目標。若使用者在戰鬥中尚未成功使用過自己會的每個招式至少一次，此招式失敗。","o":"Single Target. This Move will fail if the User has not successfully performed all of its known Moves at least once during the battle.","f":"寶可夢也許已經沒有能量，但絕不會沒有辦法。","fo":"The Pokémon may be out of energy, but never out of options.","ic":[1]},{"n":"Sweet Scent","z":"甜甜香氣","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：範圍內所有敵人。受影響者無法閃避招式。","o":"Target All Foes in Range. Those Affected cannot Evade Moves.","f":"寶可夢釋放出香甜的氣味，使敵人產生虛假的安全感。","fo":"The Pokémon releases a sweet aroma that lulls their enemies into a false sense of security.","ic":[7,262]},{"n":"Soft Boiled","z":"生蛋","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate.","f":"一顆半熟蛋，健康早餐就靠牠！","fo":"An over-easy egg for a healthy breakfast!","ic":[8,15]},{"n":"Growth","z":"生長","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：使用者。使用者的力量、特殊提升 1 點。","o":"Target Self. Increase by 1 the User's Strength and Special.","f":"寶可夢讓自己的身體變大，只要幾秒鐘，牠就會變得更大、更強。","fo":"The Pokémon makes their body grow in size. They'll get bigger and stronger in just a few seconds.","ic":[8,64,85]},{"n":"Fillet Away","z":"甩肉","t":"一般","c":"變化","g":9,"p":"—","a":"靈巧 + 隱匿","d":"-","e":"目標：使用者。對使用者造成 2 點傷害。使用者的力量、靈巧、特殊提升 2 點。","o":"Target Self. Deal 2 Damage to the User. Increase the User's Strength, Dexterity and Special by 2.","f":"寶可夢把自己的身體切下一部分，磨利邊緣，讓自己擁有更流線型的外形。","fo":"The Pokémon slices pieces of itself to sharpen out the edges and give themselves a more hydrodynamic shape.","ic":[251,8,11,252,253]},{"n":"Mega Punch","z":"百萬噸重拳","t":"一般","c":"物理","g":1,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。拳類招式。","o":"Single Target. Low Accuracy 1. Fist Move.","f":"寶可夢把一切都灌注在這一拳，一擊就把對手粉碎。","fo":"The Pokémon packs everything into this punch to pulverize their foe with a single strike.","ic":[23,1,82]},{"n":"Mega Kick","z":"百萬噸重踢","t":"一般","c":"物理","g":1,"p":"5","a":"靈巧 + 鬥毆","d":"力量 + 5","e":"單體目標。低命中率 2。","o":"Single Target. Low Accuracy 2.","f":"強力的一腳，這種純靠肌肉力量的打擊，能把混凝土柱子踢成瓦礫。","fo":"A mighty kick. This sheer muscle-power strike can turn concrete pillars into rubble.","ic":[1,21]},{"n":"Follow Me","z":"看我嘛","t":"一般","c":"變化","g":3,"p":"—","a":"帥氣 + 表演","d":"-","e":"目標：使用者。先制反應 5。敵方所有能以使用者為目標的招式都會以使用者為目標。持續 1 個戰鬥輪。","o":"Target Self. Reaction 5. All Foe's Moves able to do so will Target the user. Duration 1 Round.","f":"寶可夢吸引所有人的注意，挑釁對手使出渾身解數。","fo":"The Pokemon draws everyone's attention, provoking their foes to do their worse.","ic":[8,149,32]},{"n":"Leer","z":"瞪眼","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 威嚇","d":"-","e":"目標：範圍內所有敵人。防禦降低 1 點。","o":"Target All Foes in Range. Reduce by 1 the Defense of those affected.","f":"掠食者兇狠的凝視，引發獵物逃跑的反應。","fo":"The vicious glare of a predator that triggers the flight response of their prey.","ic":[7,53]},{"n":"Veevee Volley","z":"砰砰擊破","t":"一般","c":"物理","g":7,"p":"*","a":"靈巧 + 運動","d":"力量 + 1 *","e":"單體目標。*每有 1 點使用者的幸福度，此招式的傷害骰池額外增加 1 顆骰，最多可用此方式增加 5 顆。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every point of Happiness on the User, Up to 5 Dice may be added this way. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"和寶可夢長時間打排球，讓牠非常開心。到了戰鬥中，牠只是把球換成對手而已。","fo":"Long sessions playing Volley ball with your Pokémon make it very happy. During battle, it just replaces the ball with a foe.","ic":[1,119]},{"n":"Hyper Beam","z":"破壞光線","t":"一般","c":"特殊","g":1,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。需要重新充能。致命傷害。","o":"Single Target. Low Accuracy 1. Must Recharge. Lethal.","f":"毀滅性的光束，一條可以延伸好幾英里的破壞痕跡，是有人使用過這招的無誤證據。再次使用之前，要先讓使用者休息。","fo":"A devastating beam, a path of destruction that can extend for miles is the unmistakable proof someone used this Move. Let the user rest before trying to use it again.","ic":[20,1,23,97]},{"n":"Shell Smash","z":"破殼","t":"一般","c":"變化","g":5,"p":"—","a":"力量 + 鬥毆","d":"-","e":"目標：使用者。使用者的力量、特殊、靈巧提升 2 點。使用者的防禦、特防降低 2 點。","o":"Target Self. Increase by 2 the User's Strength, Special and Dexterity. Reduce by 2 the User's Defense and Sp. Defense.","f":"寶可夢打破自己的殼。對手誤以為那層殼是用來保護寶可夢自己的，其實那是用來保護對手，免得受到接下來的攻擊。","fo":"The Pokémon breaks off their own shell. The foe mistakenly believed the shell was for the Pokémon to protect themselves when it was actually there to protect the foes from what's next.","ic":[270,271,8,131,133,70]},{"n":"Facade","z":"硬撐","t":"一般","c":"物理","g":3,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若使用者處於異常狀態（麻痺、中毒、灼傷等），傷害骰池額外增加 3 顆骰。","o":"Single Target. *If the User has a Status Ailment (Paralysis, Poison, Burn, etc.) Add 3 Extra Dice to the Damage pool.","f":"在最艱難的處境中，寶可夢仍擺出一副勇敢的表情。","fo":"The Pokémon puts on a brave face through the most difficult of situations.","ic":[1,248]},{"n":"Laser Focus","z":"磨礪","t":"一般","c":"變化","g":7,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：使用者。若使用者下一個物理或特殊招式的命中擲骰比需求多 5 個成功，則傷害擲骰無視目標的防禦。","o":"Target Self. If the next Physical or Special Move the user performs gets 5 more successes than required on the Accuracy Roll, ignore the Target's defenses on the Damage roll.","f":"憑藉驚人的感知力，寶可夢找到一條直通對手弱點的路徑，隨後的攻擊具有毀滅性。","fo":"Through its incredible awarenes the Pokémon finds a straight path into a weak point of the foe. The attack that follows is devastating.","ic":[8]},{"n":"Wish","z":"祈願","t":"一般","c":"變化","g":3,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者／一名隊友。基礎治療。若命中成功，花費 1 點意志點以發動。此招式在下一個戰鬥輪開始時生效；若使用者被換下，會治療接替上場的寶可夢。","o":"Target Self / Target One Ally. Basic Heal. If successful, spend 1 Will point to activate. This Move has its effect at the beginning of the Next Round if the User is switched it will heal whoever takes their place.","f":"當你對著星星許願，不論你是誰都沒有差別，你內心渴望的一切都會降臨在你身上。","fo":"When you wish upon a star it makes no difference who you are, anything your heart desires will come to you.","ic":[8,128,15]},{"n":"Safeguard","z":"神秘守護","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：己方場地。防護力場。受影響者免疫所有異常狀態。","o":"Target User's side of the field. Force Field. Those affected are immune to all Status Ailments/Conditions. 變化","g":2,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。專用。受到物理或特殊招式傷害後，將使用者的主屬性改為能抵抗該招式的屬性。持續整個場景。","o":"Target Self. Unique. After being dealt damage by a Physical or Special Move, change the User's Main Type to a Type resistant to that Move. Whole Scene Duration.","f":"寶可夢從被用在自己身上的招式下載資料，並改寫自己的程式碼，以抵抗未來的攻擊。","fo":"The Pokémon downloads data from a Move that was used against it and changes their code to resist future attacks.","ic":[8,79,42]},{"n":"Giga Impact","z":"終極衝擊","t":"一般","c":"物理","g":4,"p":"6","a":"力量 + 鬥毆","d":"力量 + 6","e":"單體目標。低命中率 1。需要重新充能。致命傷害。","o":"Single Target. Low Accuracy 1. Must Recharge. Lethal.","f":"寶可夢以如此蠻橫的力道衝撞，光是衝擊就能砸出一個坑洞。之後要讓牠喘口氣。","fo":"The Pokémon strikes with such a brutal force they leave a crater just from the impact. Let them catch their breath afterwards.","ic":[23,1,20,97]},{"n":"Wring Out","z":"絞緊","t":"一般","c":"物理","g":4,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5 *","e":"單體目標。致命傷害。*目標每缺少 1 點 HP，傷害骰池就減少 1 顆骰。最多可用此方式移除 4 顆骰。","o":"Single Target. Lethal. *Remove 1 Dice from the Damage Pool for every missing HP on the target. Up to 4 Dice may be removed this way.","f":"寶可夢真的是把對手的生命力擠壓出來，不過要有效做到這點，牠自己必須處於最佳狀態。","fo":"The Pokémon quite literally squeezes the life out of their foe. But to do this effectively they require to be in top condition.","ic":[20,1,286]},{"n":"Bind","z":"綁緊","t":"一般","c":"物理","g":1,"p":"1","a":"力量 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。阻擋。持續傷害。持續 4 個戰鬥輪。由說書人裁定，提高目標閃避的難度。","o":"Single Target. Low Accuracy 1. Blocks. Ongoing Damage. Duration 4 Rounds. Increase the Target's difficulty to Evade at Storyteller's discretion.","f":"寶可夢使盡全力壓制對手，把牠固定在原地。","fo":"The Pokémon uses all their strength to restrain to the foe and keep them in place.","ic":[96,16,1,17,18]},{"n":"Wrap","z":"緊束","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。阻擋。持續傷害。由說書人裁定，提高目標閃避的難度。持續 4 個戰鬥輪。","o":"Single Target. Low Accuracy 1. Blocks. Ongoing Damage. Increase the Target's difficulty to Evade at Storyteller's discretion. Duration. 4 Rounds.","f":"寶可夢迅速把對手纏在擠壓的鎖勁之中，防止牠逃走。","fo":"The Pokémon swiftly entangles their foe in a squeezing lock to prevent their escape.","ic":[23,16,1,17,18]},{"n":"Constrict","z":"纏繞","t":"一般","c":"物理","g":1,"p":"1","a":"力量 + 鬥毆","d":"力量 + 1","e":"單體目標。此招式造成無屬性傷害。擲 1 顆機率骰，目標的靈巧降低 1 點。","o":"Single Target. This Move deals Typeless Damage. Roll 1 Chance Die to Reduce the Target's Dexterity by 1.","f":"寶可夢收緊對對手的箍束，把牠鎖在緊壓之中。","fo":"The Pokémon tightens their hold on the foe to keep them locked in a squeeze.","ic":[1,37,240]},{"n":"Spotlight","z":"聚光燈","t":"一般","c":"變化","g":7,"p":"—","a":"帥氣 + 表演","d":"-","e":"目標：一名隊友。先制反應 3。敵方所有招式在可能時都會以所選的隊友為目標。持續 1 個戰鬥輪。","o":"Target One Ally. Reaction 3. All of the Foe's Moves will Target the Chosen Ally if able. Duration 1 Round.","f":"使用者把一道聚焦的光照向某個同伴，那位同伴忍不住吸引了所有人的目光。","fo":"The user points a focused light onto one of their allies. The ally can't help but catch everyone's attention into itself.","ic":[24,130,32]},{"n":"Pay Day","z":"聚寶功","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧+ 導引","d":"力量 + 2","e":"單體目標。遠程。戰鬥結束時，依你的訓練家階級給予金錢：啟程／新手級 100、標準級 250、進階級 500、王牌級以上 1000。","o":"Single Target. Ranged. At the end of the battle give Money to your Trainer Equal to their Rank: Starter/Rookie - 100 Standard - 250 Advanced - 500 Ace or more- 1000","f":"這隻寶可夢為商家與訓練家帶來財運，記得用辛苦賺來的錢，買點好吃的請牠。","fo":"This Pokémon brings good fortune to businesses and trainers alike. Make sure to use some of that hard earned money to buy them a treat.","ic":[1,2]},{"n":"Focus Energy","z":"聚氣","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。使用者所有的物理與特殊招式現在都具有「高要害率」。持續整個場景。","o":"Target Self. All of the user's Physical & Special Moves now have “High Critical”. Whole Scene Duration.","f":"寶可夢把全部專注力集中在戰鬥上，讓攻擊更加精準。","fo":"The Pokémon concentrates all their focus on the battle to make their attacks much more precise.","ic":[8,42]},{"n":"Belly Drum","z":"腹鼓","t":"一般","c":"變化","g":2,"p":"—","a":"強壯 + 表演","d":"-","e":"目標：使用者。使用者對自己擲出相當於其 HP 一半數量的無屬性傷害骰，無視防禦。使用者的力量提升 3 點。","o":"Target Self. Roll half of the User's HP as Neutral Damage Dice to itself, ignore defenses. Increase User's Strength by 3.","f":"使用者發出憤怒的戰吼，拍打自己的肚子當作戰鼓。","fo":"With an angry war cry the user hits their belly as drums of war.","ic":[8,239]},{"n":"Recover","z":"自我再生","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate.","f":"寶可夢運用能量迅速癒合傷口，牠的再生能力超乎想像。","fo":"The Pokémon uses their energy to quickly mend wounds, their regenerative powers are beyond the imagination.","ic":[8,15]},{"n":"Psych Up","z":"自我暗示","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使用者獲得與目標相同的能力值／特質提升與降低。","o":"Single Target. The User gets the same Attribute/Trait Increases and Reductions the Target has.","f":"寶可夢在心中把自己想像得比任何人都強，牠感覺很好，牠能贏。牠。可以。做到！","fo":"The Pokémon mentalizes themselves stronger than anyone. They feel good. They can win. They. Can. Do. This!","ic":[1]},{"n":"Work Up","z":"自我激勵","t":"一般","c":"變化","g":5,"p":"—","a":"力量 + 運動","d":"-","e":"目標：使用者。使用者的力量、特殊提升 1 點。","o":"Target Self. Increase by 1 the User's Strength and Special.","f":"寶可夢花了很多時間訓練，絕不放過炫耀肌肉與體能的機會。戰鬥結束後，牠會和其他寶可夢分享訓練菜單與心得。","fo":"The Pokémon has spent a lot of time training and doesn't miss the chance to show off their muscles and fitness. After the battle they share routines and tips with the other Pokémon.","ic":[8,64,85]},{"n":"Nature Power","z":"自然之力","t":"一般","c":"特殊","g":3,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。*此招式的屬性由環境或生效中的場地決定。","o":"Single Target. *The Type of this Move is determined by the environment or active Terrain","f":"寶可夢利用地形，請求大自然在戰鬥中伸出援手。","fo":"The Pokémon makes use of the terrain and asks for nature's aid in battle.","ic":[1,210]},{"n":"Natural Gift","z":"自然之恩","t":"一般","c":"物理","g":4,"p":"3","a":"洞察 + 自然","d":"力量 + 3","e":"單體目標。遠程。使用者失去所持有的樹果。*此招式的屬性依所用樹果而改變。","o":"Single Target. Ranged. The User loses its held berry. *The Type of this Move changes according to the berry used.","f":"使用者把持有的樹果丟向對手，各式各樣的味道會帶來出乎意料不同的結果。","fo":"The user throws their held berry at the foe, the myriad of flavors has surprisingly different results.","ic":[1,2,261]},{"n":"Self Destruct","z":"自爆","t":"一般","c":"物理","g":1,"p":"8","a":"力量 + 導引","d":"力量 + 8","e":"範圍招式。致命傷害。遠程。使用者昏厥。","o":"Area Move. Lethal. Ranged. The User faints.","f":"重點不在輸贏，有些寶可夢就是想看世界燒成一片。","fo":"It's not about winning or losing, some pokémon just want to see the world burn.","ic":[106,20,2]},{"n":"Teatime","z":"茶會","t":"一般","c":"變化","g":8,"p":"-","a":"帥氣/美麗 + 禮儀","d":"-","e":"範圍招式。受影響者會吃掉自己持有的樹果與訓練家背包中的樹果，但不會獲得其效果。戰鬥外可平息暴力意圖數分鐘。","o":"Area Move. Those Affected will eat their held berries and berries on their Trainer's Bag without gaining their effects. Outside of battle will difuse violent intentions for a few minutes.","f":"寶可夢召集大家來喝一杯美味的茶，不配點心一起吃就太可惜了。","fo":"The Pokémon gathers everyone for a cup of delicious tea, not eating a snack along with it would be a waste.","ic":[106]},{"n":"Stockpile","z":"蓄力","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者。使用者的防禦、特防提升 1 點。使「噴出」與「吞下」得以使用。","o":"Target Self. Increase by 1 the User's Defense and Sp. Defense. Enables the use of the Moves “Spit Up” and “Swallow”.","f":"寶可夢把力量儲存在體內，像氣球一樣膨脹，這有助於彈回一部分傷害。","fo":"The Pokémon swells up like a balloon by storing power within themselves. This helps them bounce back a bit of the damage.","ic":[8,86,87]},{"n":"Assist","z":"藉助","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 禮儀","d":"依情況而定","e":"目標：一名隊友。複製招式。選擇一個隊友或隊伍成員（不論是否在戰鬥中）所會的招式。你可以為此招式另選目標。專用招式無法被複製。","o":"Target One Ally. Copy Move. Choose one Move known by an Ally or member of your party, who may or may not be active in battle. You may choose another Target(s) for the Move. Unique Moves can't be copied.","f":"使用者匆忙回想別人做過的動作並加以模仿。有些寶可夢甚至能模仿人類的工作並協助完成。","fo":"The user hurriedly remembers actions performed by others and mimics them. Some Pokémon can even imitate human tasks and help carry them out.","ic":[128,193]},{"n":"Swagger","z":"虛張聲勢","t":"一般","c":"變化","g":2,"p":"—","a":"強壯/帥氣 + 威嚇","d":"-","e":"單體目標。目標的力量提升 2 點。使目標陷入混亂。","o":"Single Target. Increase the Target's Strength by 2. Confuse the Target.","f":"寶可夢傲慢又嘲弄的態度，激怒了對手，讓牠在戰鬥中失去專注。","fo":"The Pokémon's arrogant and mocking attitude enrage their foe and make it lose focus in battle.","ic":[1,278,277]},{"n":"Endeavor","z":"蠻幹","t":"一般","c":"物理","g":3,"p":"","a":"意志 + 導引","d":"依情況而定","e":"單體目標。擲出等同於使用者目前 HP 與目標最大 HP 之差的一般屬性傷害骰。無視防禦。最多可擲 10 顆骰。此傷害不會使目標的 HP 低於使用者目前的 HP。","o":"Single Target. Roll Dice of Normal-Type Damage equal to the difference between the User's current HP and the Target's max HP. Ignore defenses. Up to 10 Dice may be rolled this way. This Damage cannot make the Target's HP to go lower than the User's current HP.","f":"憑藉堅強的意志，寶可夢雖然身負傷勢，仍設法讓戰鬥的局勢回到同一水平。","fo":"Through sheer willpower the Pokémon manages to level the conditions of the battle despite their own injuries.","ic":[1]},{"n":"Blood Moon","z":"血月","t":"一般","c":"特殊","g":9,"p":"6","a":"特殊 + 自然","d":"特殊 + 6","e":"單體目標。","o":"Single Target.","f":"血月再度升起。當染血的月光灑落大地，被殺死的怪物漫無目的的靈魂便重返血肉之軀，世界又一次受到威脅。","fo":"The Blood Moon rises once again. When the glow of the bloodstained moon shines upon the land, the aimless spirits of slain monsters return to flesh. The world is threatened once again.","ic":[1]},{"n":"Revelation Dance","z":"覺醒之舞","t":"一般","c":"特殊","g":7,"p":"3","a":"靈巧 + 表演","d":"特殊 + 3","e":"單體目標。*此招式的屬性變為使用者的主屬性。這會相應影響弱點、抗性與屬性一致加成。","o":"Single Target. *The Type of this Move becomes the same as the User's Main Type. This affects Weakness, Resistances, and STAB accordingly.","f":"寶可夢跳起一支舞，舞蹈的能量會影響這個招式的屬性。","fo":"The Pokémon performs a dance, the dance's energy influences the Type of this Move.","ic":[1,210]},{"n":"Hidden Power","z":"覺醒力量","t":"一般","c":"特殊","g":2,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"單體目標。此招式對目標一律造成效果絕佳傷害。若由寶可夢 #201 未知圖騰使用，詳見原書第 530 頁。","o":"Single Target. This Move will always deal Super-Effective Damage against the Target. If used by the Pokémon #201 Unown See p. 530","f":"每隻寶可夢體內都藏著一把鑰匙，能解開各式各樣的力量。","fo":"Inside every Pokémon lies the key to unlock all kinds of power.","ic":[1]},{"n":"Horn Attack","z":"角撞","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target.","f":"使用者有角，你難道不覺得牠會拿來用嗎？","fo":"The user has horns. Did you not expect they'll use them?","ic":[1]},{"n":"Horn Drill","z":"角鑽","t":"一般","c":"物理","g":1,"p":"","a":"力量 + 鬥毆","d":"-","e":"單體目標。低命中率 5。對目標造成等同於其剩餘 HP 的傷害，再加上 1 點致命傷害。","o":"Single Target. Low Accuracy 5. Deal Damage equal to the Target's Remaining HP, plus 1 Lethal Damage.","f":"寶可夢用旋轉的角刺入目標，鑽穿牠的身體，直到牠陷入危急狀態。快送往最近的寶可夢中心。","fo":"The Pokémon stabs the target with a spinning horn, drilling through them until they are critical condition. Hurry to the nearest Pokémon Center.","ic":[1,216]},{"n":"Captivate","z":"誘惑","t":"一般","c":"變化","g":4,"p":"—","a":"美麗 + 魅惑","d":"-","e":"目標：範圍內所有敵人。特殊降低 2 點。","o":"Target All foes in Range. Reduce by 2 the Special of those affected.","f":"寶可夢展現自己的魅力，甚至對對手調情，那些被牠的魅力迷倒的人，就無法專心戰鬥了。","fo":"The Pokémon shows off their attractiveness and even flirts with the opponents, those who fall for their charms can't keep focus on the battle.","ic":[7,109]},{"n":"Foresight","z":"識破","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 警覺","d":"-","e":"單體目標。敵人無法閃避使用者使用的招式。使用者無視幽靈屬性對一般與格鬥屬性招式的免疫，反之亦然。","o":"Single Target. The Foe cannot Evade Moves performed by the User. User Ignores Ghost-Type immunity to Normal and Fight Type Moves and vice versa.","f":"寶可夢運用敏銳的感官與靈活的頭腦，預測對手的下一個動作。","fo":"The Pokémon uses their honed senses and mental agility to predict the next movement of their foe.","ic":[1]},{"n":"Defense Curl","z":"變圓","t":"一般","c":"變化","g":1,"p":"—","a":"體魄 + 鬥毆","d":"-","e":"目標：使用者。使用者的防禦提升 1 點。","o":"Target Self. Increase the User's Defense by 1.","f":"使用者感到受到威脅時，會蜷成一團來保護自己。","fo":"The user curls into a ball to protect themselves when they feel threatened.","ic":[8,86]},{"n":"Minimize","z":"變小","t":"一般","c":"變化","g":1,"p":"-","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者現在每個戰鬥輪最多可以閃避 5 次。使用者的身高與體重減半。使用者會變為易傷：踩踏。持續整個場景。","o":"Target Self. The User can now make up to 5 Evasions per Round. Reduce the User's Height and Weight in half. The user is now Vulnerable to: Stomp Whole Scene Duration.","f":"寶可夢把身體縮小，成為更小的目標，不容易被擊中。不過一腳踩下去，牠可能就被踩扁在地上了。","fo":"The Pokémon compacts their body. Becoming a much smaller target to be difficult to hit. But a well placed stomp may leave them squished on the floor, though.","ic":[8,98,42]},{"n":"Harden","z":"變硬","t":"一般","c":"變化","g":1,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。使用者的防禦提升 1 點。","o":"Target Self. Increase the User's Defense by 1.","f":"當生活變得艱難（hard），你也要跟著變硬（harden）。","fo":"When life gets hard, do the same.","ic":[8,86]},{"n":"Transform","z":"變身","t":"一般","c":"變化","g":1,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。專用招式。使用者變身為所選目標的複製品。它擁有相同的特性、能力值、能力值增減與招式，並保留「變身」。持續整個場景。","o":"Target Self. Unique Move.The User transforms into an copy of a chosen Target. It has the same Ability, Attributes, Attribute Increases and Reductions, and Moves, keeping Transform. Whole Scene Duration.","f":"寶可夢改變自己的 DNA 結構，變成牠所見到的任何寶可夢、生物或物體的完美複製品。有些複製品還保留著牠有趣的眼睛。","fo":"The Pokémon modifies their own DNA structure and becomes an identical clone to any Pokémon, creature or object it can see. Some clones keep their funny eyes.","ic":[8,79,42]},{"n":"Supersonic","z":"超音波","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 導引","d":"-","e":"單體目標。低命中率 3。聲音類招式。使目標陷入混亂。","o":"Single Target. Low Accuracy 3. Sound Move. Confuse the Target.","f":"寶可夢射出一連串超音波，擾亂對手，讓牠感到頭暈目眩、不知所措。","fo":"The Pokémon shoots a series of ultrasonic waves that mess with the foe by making it feel dizzy and disoriented.","ic":[57,1,5,276]},{"n":"Stomp","z":"踩踏","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Dice to Flich the Target.","f":"用強壯的雙腳踩踏對手，非常適合壓扁討人厭的小蟲子。","fo":"Stomping the foe with strong feet. Perfect to squish nasty little bugs.","ic":[1,256]},{"n":"Splash","z":"躍起","t":"一般","c":"變化","g":1,"p":"—","a":"靈巧 + 運動","d":"-","e":"目標：使用者。","o":"Target Self.","f":"噢，看在阿爾宙斯的份上……","fo":"Oh, for the love of Arceus...","ic":[8]},{"n":"Round","z":"輪唱","t":"一般","c":"特殊","g":5,"p":"2","a":"特殊 + 表演","d":"特殊 + 2 *","e":"單體目標。聲音類招式。*若使用者與一名隊友都能使用「輪唱」。兩者可選擇同時使用。若這麼做，兩隻寶可夢的傷害骰池各額外增加 3 顆骰。","o":"Single Target. Sound Move. *If the user and an ally are able to use Round. Both may choose to do it at the same time. If they do, add 3 Extra Dice to the Damage Pool of both Pokémon.","f":"使用者以音樂的力量攻擊對手，如果有另一個加入演出，音樂的和諧將會令觀眾瘋狂！","fo":"The user attacks the foe with the power of music, if another one joins the performance, the musical harmony will rock their public!","ic":[1,120,5]},{"n":"Echoed Voice","z":"迴聲","t":"一般","c":"特殊","g":5,"p":"2","a":"靈巧 + 表演","d":"特殊 + 2 *","e":"單體目標。聲音類招式。此招式可在同一戰鬥輪中多次使用。*每使用一次，此招式的傷害骰池額外增加 1 顆骰。最多可用此方式增加 8 顆骰。若使用者進行了其他招式、閃避或對抗，則重置此效果。","o":"Single Target. Sound Move. This Move can be used many times in the same Round. *Add 1 Extra Die to the Damage pool of this move for each time you use it. Up to 8 Dice might be added this way. Reset this effect if the user performs another move, evasion or clash.","f":"寶可夢對著虛空大喊，回音回應了牠。每次回音回話，寶可夢就喊得更大聲。","fo":"The Pokémon yells at the void. Their echo answers. The Pokémon yells louder and louder everytime the echo talks back.","ic":[1,5,247]},{"n":"Attract","z":"迷人","t":"一般","c":"變化","g":2,"p":"—","a":"美麗 + 魅惑","d":"-","e":"單體目標。目標會對使用者著迷。","o":"Single Target. Target is now In Love with the User.","f":"憑藉出眾的外貌與賣弄風情的態度，寶可夢讓每個人都對牠心生愛慕。","fo":"Through their good looks and coquetish attitude, the Pokémon makes everyone develop a crush on them.","ic":[1,236]},{"n":"Dizzy Punch","z":"迷昏拳","t":"一般","c":"物理","g":1,"p":"3","a":"靈巧/洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。拳類招式。擲 2 顆機率骰，使目標陷入混亂。","o":"Single Target. Fist Move. Roll 2 Chance Dice to Confuse the Target.","f":"寶可夢找出敵人的平衡點，迅速揮出一拳，讓對手眼冒金星，頭頂繞著一圈星星。","fo":"The Pokémon locates their enemy's balance point and lands a swift punch that leaves the foe seeing a swirl of stars around its head.","ic":[1,82,245]},{"n":"Chip Away","z":"逐步擊破","t":"一般","c":"物理","g":5,"p":"2","a":"洞察 + 隱匿","d":"力量 + 2","e":"單體目標。無視掩護與替身。無視防禦。移除目標提升閃避行動的效果（例：影子分身、變小等招式，沙隱等特性）。","o":"Single Target. Ignore Cover & Substitute decoys. Ignore Defenses. Remove effects that increase Evasion Actions from the Target (ie. Moves like: Double Team, Minimize, Abilities like: Sand Veil)","f":"寶可夢一點一點地找出目標各層防禦的空隙，直到沒有任何東西能保護牠不受直接一擊為止。","fo":"Bit by bit the Pokémon finds an opening though all layers of defense their target has until there is nothing left to protect it from a direct strike.","ic":[1]},{"n":"Double Slap","z":"連環巴掌","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。連續行動。","o":"Single Target. Low Accuracy 1. Successive Actions.","f":"這個名字有點誤導，因為使用者連自己已經打了幾下都沒在數就一直拍。","fo":"The name is misleading as the user slaps withouth even counting how many slaps they have given already.","ic":[1,23,13]},{"n":"Comet Punch","z":"連續拳","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。拳類招式。連續行動。","o":"Single Target. Fist Move. Successive Actions.","f":"一連串快速的拳擊，快到像彗星一樣拖出一道發光的尾跡。","fo":"A series of rapid punches. So fast they leace a luminous trail behind like a comet's.","ic":[1,82,13]},{"n":"Frustration","z":"遷怒","t":"一般","c":"物理","g":2,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*使用者每缺少 1 點幸福度，此招式的傷害骰池就額外增加 1 顆骰。最多可用此方式增加 5 顆骰。","o":"Single Target. *Add 1 Extra Die to the Damage pool of this Move for every missing point of Happiness on the user. Up to 5 Dice may be added this way.","f":"被虐待的寶可夢會變得兇惡而冷漠，這是一個由憤怒驅動的招式。","fo":"A mistreated Pokémon grows vicious and uncaring, a Move fueled by anger.","ic":[1,119]},{"n":"Lock-On","z":"鎖定","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：使用者。使用者下一個招式的命中擲骰自動獲得 2 個成功。","o":"Target Self. The Next Move the User Performs has 2 automatic successes added on their Accuracy Roll.","f":"寶可夢的眼睛對準移動中的目標放大，以便在下一個機會精準出擊。","fo":"The Pokémon's eyes zoom into a moving target to strike with precision at the next opportunity.","ic":[8]},{"n":"Reflect Type","z":"鏡面屬性","t":"一般","c":"變化","g":5,"p":"—","a":"特殊 + 導引/自然","d":"-","e":"目標：使用者。將使用者的屬性改為與敵人的屬性相同。（例如：海星星與噴火龍對戰，牠的屬性會變成火／飛行，而不是水。）持續整個場景。","o":"Target Self. Change the User's Type to match the one(s) of a foe. (i.e. Staryu is battling vs Charizard, their type will become Fire/Flying instead of Water) Whole Scene Duration.","f":"寶可夢能隨意改寫自己的細胞組成，變得和潛在的掠食者一樣，提高生存的機會。","fo":"The Pokémon is able to rewrite their own cellular composition at will to match that of potential predators. Increasing chances of survival.","ic":[8,42]},{"n":"Howl","z":"長嚎","t":"一般","c":"變化","g":3,"p":"—","a":"帥氣 + 威嚇","d":"-","e":"目標：使用者與範圍內的隊友。聲音類招式。力量提升 1 點。","o":"Target User and Allies in Range. Sound Move. Increase by 1 the Strength of those affected.","f":"如果你聽到了嚎叫，狼群就已經把你包圍了。","fo":"If you hear the howl, the pack has already surrounded you.","ic":[90,5,64]},{"n":"Flash","z":"閃光","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target.","f":"寶可夢發出明亮的光芒，暫時讓對手目眩眼花。這也很適合用來照亮黑暗的地方。","fo":"The Pokémon glows with a bright light to temporarily blind and dazzle their foe. It's also perfect to light up dark places.","ic":[1,72]},{"n":"Quick Attack","z":"電光一閃","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量/靈巧 + 2","e":"單體目標。先制反應 1。","o":"Single Target. Reaction 1.","f":"像閃電一樣快的攻擊。","fo":"An attackas fight as lightning.","ic":[1,113]},{"n":"Sonic Boom","z":"音爆","t":"一般","c":"特殊","g":1,"p":"","a":"特殊 + 隱匿","d":"定傷","e":"單體目標。此招式一律造成 1 點無屬性傷害。無視任何會阻止此傷害的防禦、防護力場、護盾招式、掩護、範圍外、屬性或特性。","o":"Single Target. This Moves always inflicts 1 Typeless damage. Ignore Defenses, Force Fields, Shield Moves, Cover, Out of Range, Type, or Abilitiy that would prevent this damage.","f":"寶可夢運用雖小卻極具破壞力的衝擊，能穿透任何牆壁或隔層。","fo":"The Pokémon makes use of a small but very destructive shock that goes through any wall, layer or wall.","ic":[1,197]},{"n":"Headbutt","z":"頭錘","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標畏縮。戰鬥之外，用它撞樹可能引發隨機遭遇，也能讓高處的物品掉下來。","o":"Single Target. Roll 3 Chance Dice to Flinch the Target. Out of battle it may cause a Random encounter when hitting trees and make objects drop from high places.","f":"寶可夢用頭撞向對手。這個招式很適合在找樹果時把樹搖下來，但要小心樹梢上棲息的野生寶可夢。","fo":"The Pokémon rams against their foe with their head. This Move is perfect to shake down trees when looking for berries, but beware of wild Pokémon nesting at the treetops.","ic":[1,256]},{"n":"Techno Blast","z":"高科技光炮","t":"一般","c":"特殊","g":5,"p":"5","a":"靈巧 + 導引","d":"特殊 + 5","e":"單體目標。致命傷害。*若由基拉祈使用此招式，依其攜帶的卡帶，此招式的屬性可變為：火、冰、水或電。","o":"Single Target. Lethal. *If Genesect is performing this Move, this Move's type may change to: Fire, Ice, Water, or Electric depending on the Driver it has as Held Item.","f":"一道雷射短暫地從寶可夢身上射出，打中的東西一秒後就會爆炸。這個招式只要給電腦寫上正確的程式，就能改變。","fo":"A laser briefly beams away from the Pokémon, whatever it hits explodes a second later. This move can be modified with the right programing of a computer.","ic":[1,210,20]},{"n":"Rapid Spin","z":"高速旋轉","t":"一般","c":"物理","g":2,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。使用者的靈巧提升 1 點。從使用者身上和／或其場地上移除入場危害、場地（例：青草場地、薄霧場地）、持續傷害與寄生種子。","o":"Single Target. Increase User's Dexterity by 1. Remove Entry Hazards, Terrains (ie. Grassy Terrain, Misty Terrain) Ongoing Damage and Leech seed from the User and/or their side of the field.","f":"寶可夢迅速旋轉攻擊對手，過程中使用者附近的所有東西都被掃出戰場。","fo":"The Pokémon makes a swift spin to strike at the foe and in the process everything laying close to the user is scattered out of the battlefield.","ic":[1,84]},{"n":"Swift","z":"高速星星","t":"一般","c":"特殊","g":1,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"目標：範圍內所有敵人。必中。","o":"Target All Foes in Range. Never Miss.","f":"寶可夢以令人目眩的速度射出一陣星形閃光。","fo":"The Pokémon shoots a burst of star-shaped sparkles at a blinding speed.","ic":[7,59]},{"n":"Scary Face","z":"鬼面","t":"一般","c":"變化","g":2,"p":"—","a":"強壯 + 威嚇","d":"-","e":"單體目標。目標的靈巧降低 2 點。","o":"Single Target. Reduce the Target's Dexterity by 2.","f":"當寶可夢用「那種」眼神看著你，你就知道得小心翼翼地對付牠。","fo":"When a Pokémon looks at you like THAT, you know you gotta thread carefully around them.","ic":[1,153]},{"n":"Mean Look","z":"黑色目光","t":"一般","c":"變化","g":2,"p":"—","a":"強壯 + 威嚇","d":"-","e":"單體目標。阻擋。持續整個場景。","o":"Single Target. Blocks. Whole Scene Duration.","f":"強烈而時刻警戒的凝視，監視著對手所有可能逃跑的路線。","fo":"An intense and ever-vigilant stare that surveils all possible paths the foe has to escape.","ic":[1,16,42]},{"n":"False Swipe","z":"點到為止","t":"一般","c":"物理","g":2,"p":"2","a":"力量 + 表演","d":"力量 + 2","e":"單體目標。切割類招式。此招式的傷害不會使目標降到 1 HP 以下。","o":"Single Target. Cutter Move. This Move's Damage can't make the Target go below 1 HP.","f":"透過最戲劇化的姿勢，寶可夢假裝把對手砍得稀爛（血是假的）。","fo":"Through their most dramatic poses, the Pokémon pretends to slice up the foe (the blood is fake).","ic":[1,14]},{"n":"Acupressure","z":"點穴","t":"一般","c":"變化","g":4,"p":"—","a":"聰明 + 自然","d":"-","e":"目標：使用者。隨機提升使用者的一項能力值或特質 1 點（力量、靈巧、特殊、防禦、特防、命中、閃避）。若再次使用此招式，先前的提升會被移除。","o":"Target Self. Increase by 1 one of the User's Attributes or Traits at Random (Strength, Dexterity, Special, Defense, Sp. Defense, Accuracy, Evasion) If this Move is used again, the previous Attribute increase is removed.","f":"使用者開始按壓自己身上的穴位，開啟連自己都不知道的潛能。","fo":"The user begins pushing pressure points on their body to unlock a hidden potential they didn't even knew they had.","ic":[8,235]},{"n":"Population Bomb","z":"鼠數兒","t":"一般","c":"物理","g":9,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。專用。低命中率 2。連續行動。","o":"Single Target. Unique. Low Accuracy 2. Successive Actions.","f":"寶可夢和牠的家人一波接一波地攻擊對手。父母、孩子、堂表兄弟姊妹、叔叔阿姨以及遠房親戚，整棵家族樹都會一擁而上。","fo":"The Pokémon and their family attack the foe in waves. Parents, children, cousins, aunts, uncles, and extended relatives, the whole family tree will appear on an onslaught.","ic":[21,1,13,79]},{"n":"Signal Beam","z":"信號光束","t":"蟲","c":"特殊","g":3,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使敵人陷入混亂。","o":"Single Target. Roll 1 Chance Die to Confuse the foe.","f":"寶可夢射出嗡嗡作響的光束，讓對手像被迷惑的飛蛾一樣朝著亮光飛去。","fo":"The Pokémon shoots a buzzing beam that leaves makes the foe head towards bright lights like a dazzled moth.","ic":[1,33]},{"n":"X-Scissor","z":"十字剪","t":"蟲","c":"物理","g":4,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。切割類招式。","o":"Single Target. Cutter Move.","f":"寶可夢把鐮刀或爪子當成一把剪刀，切開對手。","fo":"The Pokémon uses its scythes or clawa as if they were a pair of scissors to cut through the foe.","ic":[1,14]},{"n":"String Shot","z":"吐絲","t":"蟲","c":"變化","g":1,"p":"—","a":"靈巧 + 導引","d":"-","e":"目標：範圍內所有敵人。靈巧降低 1 點。","o":"Target All Foes in Range. Reduce by 1 the Dexterity of those affected.","f":"對手被使用者射出的細絲纏住。這種絲也可以用來製作精美的衣服。","fo":"The foe gets tangled in a fine silk string shot by the user. This silk can also be used to make fine clothes.","ic":[7,27]},{"n":"Leech Life","z":"吸血","t":"蟲","c":"物理","g":1,"p":"3","a":"體魄 + 鬥毆","d":"力量 + 3","e":"單體目標。使用者回復等同於造成傷害一半的 HP（無條件捨去）。","o":"Single Target. The User restores HP equal to half the damage dealt, rounded down.","f":"寶可夢緊緊黏在對手身上，然後咬進去，開始吸取牠的生命力。","fo":"The Pokémon clings to their foe, then bites in and starts to suck away its life force.","ic":[1]},{"n":"Heal Order","z":"回復指令","t":"蟲","c":"變化","g":4,"p":"-","a":"強壯 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If succesful, spend 1 Will point to activate.","f":"蜂后命令蜂群為她帶來療傷的蜂蜜。","fo":"The queen commands the swarm to bring her healing honey.","ic":[8,15]},{"n":"U-Turn","z":"急速折返","t":"蟲","c":"物理","g":4,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。使用者方替換招式。","o":"Single Target. Switcher Move for User.","f":"聲東擊西的招式，使用者先攻擊，接著突然轉身回到安全的地方。","fo":"A bait and switch move, where the user strikes then makes a sudden u-turn back to safety.","ic":[1,48]},{"n":"Rage Powder","z":"憤怒粉","t":"蟲","c":"變化","g":5,"p":"—","a":"洞察 + 威嚇","d":"-","e":"目標：使用者。先制反應 2。粉末類招式。敵人所有的物理與特殊招式，若可行，都必須以使用者為目標。持續 1 個戰鬥輪 ls up and rolls at full speed against the foe with the intention to swat them on the ground.","ic":[1,43]},{"n":"Powder","z":"粉塵","t":"蟲","c":"變化","g":6,"p":"—","a":"洞察 + 自然","d":"-","e":"單體目標。粉末類招式。目標下次使用火屬性招式時，擲出等同於該招式威力的無屬性傷害骰（無視防禦）。","o":"Single Target. Powder Move. The next time the Target uses a Fire-Type Move, Roll Typeless Damage Dice equal to that Move's power, ignore defenses.","f":"對手被一種極易燃的粉末覆蓋，只要一點點火源就會點燃，引發爆炸。","fo":"The foe gets covered by a very flammable powder, the smallest source of fire will ignite it with explosive results.","ic":[1,28]},{"n":"Silk Trap","z":"線阱","t":"蟲","c":"變化","g":9,"p":"—","a":"洞察 + 隱匿","d":"-","e":"目標：使用者。先制反應 4。護盾招式。使用者受到傷害性招式時，減少 3 點傷害。*若敵人對使用者使用非遠程物理招式，該敵人的靈巧降低 2 點。","o":"Target Self. Reaction 4. Shield Move. Reduce 3 Damage the User would receive from a Damaging Move. *If the Foe used a Non-Ranged Physical Move against the user Reduce the foe's Dexterity by 2.","f":"寶可夢在身體的特定部位織上絲線，既當作盔甲，也當作陷阱來困住敵人。","fo":"The Pokémon weaves a thread of silk around specific parts of their body, both as an armor and as a trap to snare their enemies.","ic":[36,8,34,35]},{"n":"Fell Stinger","z":"致命針刺","t":"蟲","c":"物理","g":6,"p":"1","a":"力量 + 鬥毆","d":"力量 + 1","e":"單體目標。*若對已昏厥的目標使用，或目標因此招式的傷害而昏厥，使用者的力量提升 2 點。","o":"Single Target. *If used against a fainted Target ot if the Target faints due to damage from this Move, Increase the User's Strength by 2.","f":"寶可夢用刺針扎向目標；如果對手虛弱得動彈不得，使用者就會吸收牠的力量。","fo":"The Pokémon stings the target, if the foe is too weakened to move, the user absorbs their power.","ic":[1,11]},{"n":"Pollen Puff","z":"花粉團","t":"蟲","c":"特殊","g":7,"p":"1","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。投彈類招式。*或以一名隊友為目標。*對隊友使用此招式時，不會造成傷害，而是回復 2 HP；需花費 1 點意志點才有此效果。","o":"Single Target. Projectile Move. *Or Target One Ally. *When this move is used against an ally, it will heal 2 HP instead of dealing damage; Spend 1 Will Point to get this effect.","f":"寶可夢做出一團花粉球，在對手臉上爆開，讓對手過敏得很難受。這些花粉球吃起來很甜，營養也非常豐富。","fo":"The Pokémon creates a puff of pollen
