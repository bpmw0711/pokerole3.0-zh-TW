. Reduce the Target's Dexterity by 1.","f":"寶可夢靜靜地一動也不動，就在對手靠近時，突然撲上去發動攻擊。","fo":"The Pokémon stands very still, and just as their foe approaches, they suddenly launch into attacking.","ic":[1,27]},{"n":"Bug Buzz","z":"蟲鳴","t":"蟲","c":"特殊","g":4,"p":"3","a":"特殊 + 表演","d":"特殊 + 3","e":"目標：範圍內所有敵人。聲音類招式。擲 1 顆機率骰，使受影響者的特防降低 1 點。","o":"Target All Foes in Range. Sound Move. Roll 1 Chance Die to Reduce by 1 the Sp. Defense of those affected","f":"寶可夢用翅膀或身體的一部分，在四周發出擾人的嗡嗡聲。","fo":"The Pokémon uses their wings or a part of their bodies to emit distracting buzzes all around.","ic":[5,7,4,6]},{"n":"Megahorn","z":"超級角擊","t":"蟲","c":"物理","g":2,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。低命中率 2。致命傷害。","o":"Single Target. Low Accuracy 2. Lethal.","f":"寶可夢用強壯的角刺穿對手，造成巨大的傷害。","fo":"The Pokémon uses its strong horn(s) to pierce their foe and deal massive damage.","ic":[21,1,20]},{"n":"First Impression","z":"迎頭一擊","t":"蟲","c":"物理","g":7,"p":"3","a":"強壯/ 帥氣 + 威嚇","d":"力量 + 3","e":"單體目標。先制反應 2。此招式只能在使用者上場後的第一個戰鬥輪使用。從第二個戰鬥輪起，此招式會自動失敗。","o":"Single Target. Reaction 2. This Move will only work on the First Round the User is out in battle. From the second round on, it will fail automatically","f":"寶可夢華麗地登上戰場，讓對手措手不及。","fo":"The Pokémon makes a dramatic entrance to the battlefield, taking the foe by surprise.","ic":[1,12]},{"n":"Fury Cutter","z":"連斬","t":"蟲","c":"物理","g":2,"p":"1","a":"靈巧 + 鬥毆","d":"力量/靈巧 + 1","e":"單體目標。連續行動。切割類招式。","o":"Single Target. Successive Actions. Cutter Move.","f":"寶可夢用爪子或鐮刀快速切割，彷彿在撕碎紙張。","fo":"The Pokémon uses their claws or scythes to rapidly cut as if shredding paper.","ic":[1,13,14]},{"n":"Silver Wind","z":"銀色旋風","t":"蟲","c":"特殊","g":3,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。風類招式。擲 1 顆機率骰，使用者的力量、靈巧、特殊、防禦、特防提升 1 點。","o":"Single Target. Wind Move. Roll 1 Chance Die to Increase by 1 the User's Strength, Dexterity, Special, Defense and Sp. Defense.","f":"一陣美麗卻危險的風，把銀色的粉末吹向對手。這場表演也許會讓使用者的自信大增。","fo":"A beautiful but dangerous wind that blows a silver powder against the foe. The performance may give the user a big confidence boost.","ic":[1,37,38]},{"n":"Defend Order","z":"防禦指令","t":"蟲","c":"變化","g":4,"p":"-","a":"強壯 + 自然","d":"-","e":"目標：使用者。使用者的防禦、特防提升 1 點。","o":"Target Self. Increase the User's Defense and Sp. Defense by 1.","f":"一群蟲子繞著使用者飛舞，形成屏障，保護牠們的蜂后不受傷害。","fo":"A swarm of bugs flies around the user, creating a barrier to protect their swarm queen from damage.","ic":[8,9,10]},{"n":"Twineedle","z":"雙針","t":"蟲","c":"物理","g":1,"p":"1","a":"力量/靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。遠程。雙重行動。每次命中，擲 2 顆機率骰，使目標陷入中毒。","o":"Single Target. Ranged. Double Action. Roll 2 Chance Dice to Poison the Target each hit.","f":"寶可夢用注入了毒液的刺針、爪子或尖刺，進行雙重突刺。","fo":"The Pokémon makes a double stab using a poison-infused sting, claw, or spikes.","ic":[22,1,46,47]},{"n":"Pin Missile","z":"飛彈針","t":"蟲","c":"物理","g":1,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。低命中率 1。遠程。連續行動。","o":"Single Target. Low Accuracy 1. Ranged. Successive Actions.","f":"寶可夢射出一連串如針一般刺穿目標的刺針或尖刺。","fo":"The Pokémon shoots a barrage of stingers or spikes that pierce like needles.","ic":[23,1,22,13]},{"n":"Sticky Web","z":"黏黏網","t":"蟲","c":"變化","g":6,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：敵方場地。入場危害。進入戰場的敵人靈巧降低 1 點。對地面屬性免疫的寶可夢不受影響。","o":"Target Foe's Side of the Field. Entry Hazard. Reduce by 1 the Dexterity of Foes that enter the battle- field. Pokémon with Immunity to Ground are not affected.","f":"寶可夢迅速在場地上布滿黏性的蜘蛛網，新上場的對手會很難順利移動。","fo":"The Pokémon quickly covers the arena with a sticky web, newly arrived foes will have trouble moving with ease.","ic":[41,27,40]},{"n":"Kowtow Cleave","z":"仆斬","t":"惡","c":"物理","g":9,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。切割類招式。必中。","o":"Single Target. Lethal. Cutter Move. Never Miss.","f":"使用者跪下向對手行禮，對手接受了這份禮數後，卻被一記背信的斬擊揭穿了這場騙局的惡意。","fo":"The user gets on their knees and bows to its foe, then as the foe accepts this courtesy, a treacherous slash reveals the evil intent of the ruse.","ic":[67,1,59,14]},{"n":"Payback","z":"以牙還牙","t":"惡", 動前再三考慮。","fo":"The user represses the foe through intimidation so it thinks twice before acting.","ic":[1,42]},{"n":"Comeuppance","z":"復仇","t":"惡","c":"物理","g":9,"p":"*","a":"洞察 + 鬥毆","d":"依情況而定","e":"單體目標。只有在目標上一次對使用者使用的是物理或特殊招式時才能使用。擲出等同於目標上一次對使用者擲出的傷害骰池，再加 2 顆骰。無視防禦。","o":"Single Target. Can only be used if Target's last Move on User was a Physical or Special Move. Roll dice equal to Target's last damage pool rolled against the User plus 2 dice. Ignore Defenses.","f":"以眼還眼，使用者向惹到牠的人狠狠報復。","fo":"An eye for en eye, the user retaliates with a vengance against those who cross them.","ic":[1]},{"n":"Fiery Wrath","z":"怒火中燒","t":"惡","c":"特殊","g":8,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"目標：範圍內所有敵人。擲 2 顆機率骰，使受影響者畏縮。","o":"Target all Foes in Range. Roll 2 Chance Dice to Flinch those affected.","f":"寶可夢的怒火化為火焰，吞噬對手的身體與靈魂。","fo":"The Pokémon's wrath is turned to flames that consume the foe's body and soul.","ic":[7,60]},{"n":"Dark Pulse","z":"惡之波動","t":"惡","c":"特殊","g":4,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"目標：隨機敵人。擲 2 顆機率骰，使目標畏縮。","o":"Target Random Foe. Roll 2 Chance Dice to Flinch the Target.","f":"一團黑暗能量籠罩戰場，專門攻擊那些容易受到這股幽暗情緒與恐懼影響的對象。","fo":"A haze of dark energy decends on the battlefield preying on those vulnerable to the obscure feelings and fears it provokes.","ic":[55,54]},{"n":"Assurance","z":"惡意追擊","t":"惡","c":"物理","g":4,"p":"2","a":"洞察 + 鬥毆","d":"力量 + 2 *","e":"單體目標。*若目標本戰鬥輪已受到使用者的傷害，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. *Add 2 Extra Dice to the Damage pool of this Move if the Target has already received Damage from the User this Round.","f":"使用者找出最虛弱的對手，向牠衝去。","fo":"The user indentifies the weakest foe and charges against them.","ic":[1,49]},{"n":"Punishment","z":"懲罰","t":"惡","c":"物理","g":4,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1 *","e":"單體目標。目標每有一次能力值提升，此招式的傷害骰池就增加 1 顆骰，最多增加 7 顆。（例：目標力量被提升 2 點，則傷害骰增加 2 顆。）","o":"Single Target. Add 1 Die to the Damage Pool of this Move for every Attribute increase the target has, up to a maximum of 7 Dice. (ie. The target has 2 increased points on Strength, add 2 Damage dice).","f":"你不該這麼做的……","fo":"You shouldn't have done that...","ic":[1,76]},{"n":"Fling","z":"投擲","t":"惡","c":"物理","g":4,"p":"1","a":"靈巧 + 導引","d":"力量 + 1 * *","e":"單體目標。遠程。*最多可為傷害骰池增加 4 顆骰。使用者失去其攜帶道具。詳見原書第 530 頁。","o":"Single Target. Ranged. *Add up to 4 Dice to the damage pool. User loses its Held Item. See p. 530","f":"寶可夢拿起持有的道具當作武器，而裁判不知為何也沒意見。丟出的道具會留在場上，戰鬥結束後可以取回。","fo":"The Pokémon takes their held item, uses it as a weapon and the referee is somehow OK with this. The held item remains in the field and may be recovered after the battle.","ic":[2,1,63]},{"n":"Parting Shot","z":"拋下狠話","t":"惡","c":"變化","g":6,"p":"—","a":"強壯 + 威嚇","d":"-","e":"單體目標。使用者方替換招式。敵人的力量、特殊降低 1 點。","o":"Single Target. Switcher Move for the User. Reduce by 1 the foe's Strength and Special.","f":"使用者在離開前，對對手丟下最後一句威脅，對手被嚇得不敢再與使用者和牠的夥伴作對。","fo":"The user throws one last threat against the foe before taking their leave. The foe is left too frightened to try to stand up against the user and their gang.","ic":[48,1,74,75]},{"n":"Knock Off","z":"拍落","t":"惡","c":"物理","g":3,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2 *","e":"單體目標。*若目標持有道具，此招式的傷害骰池增加 2 顆骰。之後目標失去其攜帶道具。","o":"Single Target. *If the Target is holding an Item, Add 2 Dice to the Damage pool of this Move. The Target loses its Held Item afterwards.","f":"寶可夢粗魯地拍掉對手手裡拿著的東西。","fo":"The Pokémon rudely smacks what their foe was holding.","ic":[1,49]},{"n":"Taunt","z":"挑釁","t":"惡","c":"變化","g":3,"p":"—","a":"強壯/可愛 + 威嚇","d":"-","e":"單體目標。目標無法使用變化招式（變化類的無屬性戰技仍可使用）。持續 4 個戰鬥輪。","o":"Single Target. The Target cannot perform Support Moves (Support Maneuvers may still be performed). Duration 4 Rounds.","f":"透過挖苦與嘲弄，對手被激怒到無法清楚思考。","fo":"Through tease and mockery, the foe is enraged to the point it stops thinking clearly.","ic":[1,18]},{"n":"Switcheroo","z":"掉包","t":"惡","c":"變化","g":4,"p":"—","a":"聰明 + 隱匿","d":"-","e":"單體目標。使用者與目標交換攜帶道具。若只有一方持有道具，則將道具給對方。","o":"Single Target. The User and the Target switch their Held Item. If only one Pokémon is holding an Item, it gives it away.","f":"寶可夢用一點妙手空空的小把戲，把自己持有的道具和目標的對調，對方根本沒發現發生了什麼事。","fo":"The Pokémon uses a bit of sleigh of hand to switch their Held Item with the target's, who don't even notice what happened.","ic":[1]},{"n":"Snatch","z":"搶奪","t":"惡","c":"變化","g":3,"p":"—","a":"聰明 + 隱匿","d":"-","e":"單體目標。先制反應 6。移除敵人身上所有的能力值提升／降低、生效中的護盾招式、治療效果，以及其場地上的效果，並改為套用在使用者身上。詳見原書第 531 頁。","o":"Single Target. Reaction 6. Remove any Increase/Reduction on the foe's Attributes, Active Shield Moves, Healing effects on the Foe, or effects on its side of the field; and place them on the User instead. See p. 531 for more info.","f":"使用者注意到對面有好東西，便迅速占為己有。誰撿到就是誰的，輸家只能哭！","fo":"The user takes notice of the good stuff on the other side and quickly takes it for themselves. Finders keepers, losers weepers!","ic":[1,80]},{"n":"Obstruct","z":"攔堵","t":"惡","c":"變化","g":8,"p":"-","a":"靈巧 + 威嚇","d":"-","e":"目標：使用者。先制反應 4。護盾招式。使用者受到傷害性招式時，減少 3 點傷害。*若敵人對使用者使用非遠程物理招式，該敵人的防禦降低 2 點。","o":"Target Self. Reaction 4. Shield Move. Reduce 3 Damage the User would receive from a Damaging Move. *If the Foe used a Non-Ranged Physical Move against the user Reduce the foe's Defense by 2.","f":"使用者不顧一切地衝向對手，阻止牠的氣勢並擋下來襲的攻擊。靠得這麼近，也讓使用者能攻擊弱點。","fo":"In a reckless action, the user charges against the foe to stop its momentum and block its incoming attack. Being so close allows the user to reach for weak spots.","ic":[36,8,34,73]},{"n":"Wicked Blow","z":"暗冥強擊","t":"惡","c":"物理","g":8,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。拳類招式。","o":"Single Target. Lethal. Fist Move.","f":"「暗黑流派」被譽為最致命、最兇狠的戰鬥技術。使用者已精通這個流派，出拳威力驚人。","fo":"The “Dark Style” is known as the most deadly and vicious of battle techniques. The user mastered this style and their punches are wicked strong.","ic":[20,1,82]},{"n":"Night Slash","z":"暗襲要害","t":"惡","c":"物理","g":4,"p":"3","a":"靈巧 + 隱匿","d":"力量 + 3","e":"單體目標。致命傷害。高要害率。切割類招式。","o":"Single Target. Lethal. High Critical. Cutter Move.","f":"使用者尋找弱點，用爪子一記陰狠的斬擊撕開柔軟 ed this Round.","f":"使用者以滿腔的挫折與絕望的尖叫，對對手猛烈爆發。","fo":"The user fulminates the foe with the power of its frustration and a shriek of despair.","ic":[1,68]},{"n":"Torment","z":"無理取鬧","t":"惡","c":"變化","g":3,"p":"—","a":"強壯/聰明 + 威嚇","d":"-","e":"單體目標。目標無法使用上一個戰鬥輪中用過的招式。持續 4 個戰鬥輪。","o":"Single Target. The Target cannot use any of the Moves it used during the Last Round. Duration 4 Rounds.","f":"寶可夢欺凌對手到折磨的地步，讓對手無法繼續使用同一種策略，否則就會覺得難受。","fo":"The Pokémon bullies their foe to the point of torment where they cannot keep using their strategy without feeling bad about it.","ic":[1,18]},{"n":"Brutal Swing","z":"狂舞揮打","t":"惡","c":"物理","g":7,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"目標：範圍內所有敵人。致命傷害。","o":"Target All foes in Range. Lethal.","f":"寶可夢全力揮動爪子展開攻擊，不幸擋在牠面前的人都會身受重傷。","fo":"The Pokémon starts attacking at full force with its claws, anyone unfortunate enough to be in its path will end up severely wounded.","ic":[52,20]},{"n":"Hyperspace Fury","z":"異次元猛攻","t":"惡","c":"物理","g":6,"p":"4","a":"特殊 + 隱匿","d":"力量 + 4","e":"單體目標。必中。無視敵方一側任何生效中的防護力場或護盾招式的效果。使用者的防禦降低 1 點。","o":"Single Target. Never Miss. Ignores the effect of any Force Field or Shield Move active on the foe's side. Reduce the User's Defense by 1.","f":"寶可夢開啟傳送門，用每一隻手臂從各處發動攻擊，無視一切防禦，讓對手無處可逃；不過，傳送門是雙向的。","fo":"The Pokémon opens portals to attack with each one of its arms, bypassing all defenses and making it impossible to escape; however, portals go both ways.","ic":[1,66,59]},{"n":"Hone Claws","z":"磨爪","t":"惡","c":"變化","g":5,"p":"—","a":"洞察 + 威嚇","d":"-","e":"目標：使用者。使用者的力量與命中骰池各提升 1 點。","o":"Target Self. Increase by 1 the User's Strength score and Accuracy Pools.","f":"鋒利的爪子能讓攻擊更精準、更致命。","fo":"Sharp claws make for more precise and deadly attacks.","ic":[8,64,65]},{"n":"Ceaseless Edge","z":"秘劍・千重濤","t":"惡","c":"物理","g":8,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 2。高要害率。切割類招式。持續傷害，持續 4 個戰鬥輪。","o":"Single Target. Low Accuracy 2. High Critical. Cutter Move. Ongoing Damage with Duration of 4 Rounds.","f":"使用者以鋒利卻易碎的貝殼斬向對手，貝殼上的細小尖刺會殘留在對手的傷口裡，對手一動就會造成更多傷害。","fo":"The user slashes the foe using a sharp but brittle shell. Tiny spikes from the shell are left embeded into the foe's wounds causing more damage as the foe moves.","ic":[21,0,1,14,17,18]},{"n":"Sucker Punch","z":"突襲","t":"惡","c":"物理","g":4,"p":"3","a":"聰明 + 隱匿","d":"力量 + 3","e":"單體目標。後制反應 6。*此招式只能作為後制反應使用，且僅限目標使用了物理或特殊招式時，否則失敗。","o":"Single Target. Late Reaction 6. *This move can only be used as a Late Reaction; and only if the Target used a Physical or Special Move, otherwise it will fail.","f":"寶可夢趁對手準備攻擊時，使出卑鄙的偷襲重擊。","fo":"The Pokémon takes advantage of their foe preparing to attack to unleash a dirty surprise blow.","ic":[1,81]},{"n":"Jaw Lock","z":"緊咬不放","t":"惡","c":"物理","g":8,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。啃咬類招式。使使用者與目標雙方皆被阻擋。持續整個場景。","o":"Single Target. Bite Move. Blocks both User and Target. Whole Scene Duration.","f":"使用者用強力的顎部鎖住對手，不管怎麼努力都拉不開，只有在其中一方倒下時，牠才會鬆口。","fo":"The user will capture its foe in a crushing jaw grip. It won't let go no matter how much you try to separate them. The only way it will release its victim is if one of them faints.","ic":[3,1,42,16]},{"n":"Memento","z":"臨別禮物","t":"惡","c":"變化","g":3,"p":"—","a":"意志 + 威嚇","d":"-","e":"單體目標。使用者昏厥。敵人的力量、靈巧、特殊、防禦、特防降低 2 點。持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. The User faints. Reduce by 2 the foe's Strength, Dexterity, Special, Defense and Sp. Defense. Whole Scene Duration. This effect does not end by switching out the affected Pokémon.","f":"寶可夢在嚥下最後一口氣時，把一份懊悔的印記留在對手身上。","fo":"As they take their last breath, the Pokémon leaves behind an imprint of regret on their foe.","ic":[1,42,69]},{"n":"Nasty Plot","z":"詭計","t":"惡","c":"變化","g":4,"p":"—","a":"聰明 + 警覺","d":"-","e":"目標：使用者。使用者的特殊提升 2 點。","o":"Target Self. Increase User's Special by 2.","f":"寶可夢搓著雙手，陰險地笑著，為即將實行的邪惡計畫而歡欣。","fo":"Rubbing both hands and laughing sinisterly the Pokémon rejoices in the evil plans they'll soon carry out.","ic":[8,70]},{"n":"Pursuit","z":"追打","t":"惡","c":"物理","g":2,"p":"2","a":"靈巧 + 運動/隱匿","d":"力量 + 2","e":"單體目標。*若被此招式命中的目標被收回、嘗試逃跑、使用替換招式或成為替換招式的目標，對其造成 2 點無屬性傷害。戰鬥外可用於協助捕捉逃跑的目標。","o":"Single Target. *If a Target hit by this Move is recalled, attempts to Run Away, uses a Switcher Move or is the Target of a Switcher Move, Deal 2 Typeless Damage to it. Outside of battle, aid in catching a fleeing target.","f":"寶可夢對目標窮追不捨，就在對方以為自己逃掉時一擊命中。","fo":"The Pokémon is relentless in its pursuit of their target, striking it just as it believed it had escaped.","ic":[1,77]},{"n":"Topsy-Turvy","z":"顛倒","t":"惡","c":"變化","g":6,"p":"—","a":"聰明 + 警覺/威嚇","d":"-","e":"單體目標。目標被提升的能力值改為被降低，反之亦然。","o":"Single Target. Increased Attributes on the Target become Reductions instead and vice versa.","f":"透過巧妙的操弄，寶可夢扭轉了對手的道德羅盤。壞事變成好事，好事變成壞事。","fo":"Though clever manipulation the Pokémon switches their foe's morality compass. Bad things become good and bad things become bad.","ic":[1]},{"n":"Wicked Torque","z":"黑暗暴衝","t":"惡","c":"物理","g":9,"p":"4","a":"靈巧 + 導引","d":"力量 + 4","e":"單體目標。致命傷害。遠程。擲 1 顆機率骰，使目標陷入睡眠。","o":"Single Target. Lethal. Ranged. Roll 1 Chance die to put the Target to Sleep.","f":"使用者以高速扭轉受害者，力道大到對方可能就這樣昏過去。","fo":"The user torques out their victim at a high speed with such force they may simply drop unconscious.","ic":[20,1,2,83]},{"n":"Darkest Lariat","z":"ＤＤ金勾臂","t":"惡","c":"物理","g":7,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。無視防禦。","o":"Single Target. Ignore Defenses.","f":"使用者朝目標揮出雙臂，沒有任何盔甲厚到擋得住這一記殘酷的攻擊。","fo":"The user swings both of its arms against the target, there's no armor thick enough to stop this cruel strike.","ic":[1]},{"n":"Order Up","z":"上菜","t":"龍","c":"物理","g":9,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。專用。若使用者正在掩護一名 #978 的隊友（劍堂系列），依該隊友的顏色提升使用者 1 點能力值。*橘色－力量 *紅色－防禦 *黃色－靈巧","o":"Single Target. Unique. If the User is giving cover to a #978 Tatsurugi Ally, Increase by 1 an Attribute depending on the Ally's color. *Orange - Strength *Red - Defense *Yellow - Dexterity","f":"使用者等待命令，並遵從體型較小但更聰明的夥伴所擬定的策略。","fo":"The user waits for orders and adheres to the strategy of a smaller but smarter ally.","ic":[79,1,64,66,84]},{"n":"Dual Chop","z":"二連劈","t":"龍","c":"物理","g":5,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。雙重行動。","o":"Single Target. Low Accuracy 1. Double Action.","f":"這隻寶可夢只需要兩記猛烈的打擊，就能讓對手屈服於牠的力量。","fo":"Two brutal blows are all this Pokémon needs to make the opponent yield to their might.","ic":[23,1,46]},{"n":"Spacial Rend","z":"亞空裂斬","t":"龍","c":"特殊","g":4,"p":"4","a":"特殊 + 導引","d":"特殊 + 4","e":"單體目標。高要害率。致命傷害。專用。若命中成功，目標所有命中擲骰扣除 5 個成功。持續整個場景。","o":"Single Target. High Critical. Lethal. Unique. If successful, Reduce 5 Success from all Accuracy rolls of the Target. Whole scene duration.","f":"帕路奇亞揮動爪子輕輕一閃，就讓對手周圍的空間四分五裂。倖存下來的人很少能保持原本的形體，更別說像以前那樣行動或運作了。","fo":"With a flicker of its claws, Palkia defragments the space around its foe. Those who survive rarely do preserve their original shape much less move or fuction as they should.","ic":[0,20,1,79,101,42]},{"n":"Glaive Rush","z":"巨劍突擊","t":"龍","c":"物理","g":9,"p":"6","a":"靈巧 + 鬥毆","d":"力量 + 6","e":"單體目標。致命傷害。使用者會變為易傷：下一個以其為目標的物理或特殊招式。","o":"Single Target. Lethal. The User is now Vulnerable to: The Next Physical or Special Move that targets them.","f":"使用者以鋒利的背鰭翻身斬擊。這招幾乎能把任何東西劈成兩半，卻也讓使用者容易遭到偷襲。","fo":"The user attacks with its sharp dorsal fin by doing a somersault slash. This can pretty much slice in half anything, but it also leaves the user prone to sneak attacks.","ic":[67,1,98]},{"n":"Dragon Energy","z":"巨龍威能","t":"龍","c":"特殊","g":8,"p":"*","a":"特殊 + 導引","d":"特殊 + 6 *","e":"目標：範圍內所有敵人。致命傷害。*使用者每損失 1 點 HP，傷害骰池減少 1 顆骰。最多可用此方式減少 5 顆骰。","o":"Target All foes in Range. Lethal. *Reduce 1 Dice from the Damage Pool for every missing HP the User has. Up to 5 dice may be removed this way.","f":"寶可夢把生命能量轉換成一道足以致命的光束。毫不誇張。","fo":"The Pokémon converts its life-energy into a life-ending beam. No exaggeration.","ic":[20,7,91]},{"n":"Breaking Swipe","z":"廣域破壞","t":"龍","c":"物理","g":8,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"範圍內所有敵人。力量降低 1 點。","o":"All Foes in Range. Reduce by 1 the Strength of those affected.","f":"寶可夢用尾巴長長地橫掃一擊，所有對手都倒在地上，傷痕累累地爬起來。","fo":"The Pokémon will make a long swipe at using its tail. All foes fall to the ground and come up pretty bruised.","ic":[7,74]},{"n":"Roar of Time","z":"時光咆哮","t":"龍","c":"特殊","g":4,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。需要重新充能。致命傷害。專用。若成功，目標除非每次嘗試行動時花費 1 點意志，否則無法採取任何行動。持續 1 個戰鬥輪。","o":"Single Target. Low Accuracy 1. Must Recharge. Lethal. Unique. If successful, the target can't take any action unless they spend 1 Will point per action attempted. Duration 1 Round.","f":"帝牙盧卡發出一聲駭人的咆哮，把時間的力量束縛在單一區域，不幸的目標會被困在時間扭曲之中，在幾毫秒之內衰老。","fo":"Through a terrifying roar, Dialga bounds the forces of time on a single area, the unfortunate target will be trapped in a time warp, growing old in a matter of miliseconds.","ic":[23,20,1,97,79,32]},{"n":"Core Enforcer","z":"核心懲罰者","t":"龍","c":"特殊","g":7,"p":"4","a":"特殊 + 導引","d":"特殊 + 4","e":"單體目標。若使用者在本戰鬥輪中已受到目標的傷害，移除目標的特性，持續到場景結束。此效果不會因為被影響的寶可夢換下場而結束。專屬特性不受此效果影響。","o":"Single Target. If the User has already received Damage from the Target this Round, R emove the Target's Ability for the rest of the Scene. This effect does not end by switching out the affected Pokémon. Unique Abilities are not affected by this effect.","f":"基格爾德發射一道光束，將目標擊裂到核心，使牠連自身的本質都無法維持。","fo":"Zygarde shoots a beam that fractures the target to its core, rendering it unable to sustain even their own essence.","ic":[1,42]},{"n":"Dynamax Cannon","z":"極巨炮","t":"龍","c":"特殊","g":8,"p":"*","a":"特殊 + 導引","d":"特殊 + 4 *","e":"單體目標。*若目標處於極巨化狀態，此招式變為致命，且傷害骰池額外增加 4 顆骰。","o":"Single Target. *If the Target is under the effects of Dynamax this Move becomes Lethal and you add 4 Extra Dice to the Damage Pool.","f":"寶可夢發射沉重的投射物，如果對手正處於極巨化現象的影響之下，所有能量都會集中並在目標身上爆發。","fo":"The Pokémon shoots a heavy projectile, if the foe is under the effects of the Dynamax phenomenon all the energy will be concentrated and explode on the Target.","ic":[1,95,20]},{"n":"Draco Meteor","z":"流星群","t":"龍","c":"特殊","g":4,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。致命傷害。使用者的特殊降低 2 點。","o":"Single Target. Low Accuracy 1. Lethal. Reduce User's Special by 2.","f":"寶可夢召喚隕石從天而降，直接墜入敵人之中，造成極其猛烈的傷害。這是令人印象深刻的力量展示，但需要消耗大量能量。","fo":"The Pokémon summons a meteor to fall from the sky directly into their foes, dealing a brutal amount of damage. An impressive display if power that demands a lot of energy.","ic":[23,1,20,88]},{"n":"Eternabeam","z":"無極光束","t":"龍","c":"特殊","g":8,"p":"7","a":"特殊 + 導引","d":"特殊 + 7","e":"單體目標。低命中率 1。致命傷害。需要重新充能。","o":"Single Target. Low Accuracy 1. Lethal. Must Recharge.","f":"寶可夢朝天空射出一道威力驚人的光束，釋放出的能量也許在幾千年後仍會在宇宙中前進。","fo":"The Pokémon shoots an incredibly powerful beam towards the sky. The energy released might keep traveling through space thousands of years later.","ic":[96,1,20,97]},{"n":"Outrage","z":"逆鱗","t":"龍","c":"物理","g":2,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"目標：隨機敵人。狂暴。","o":"Target Random Foe. Rampage.","f":"龍屬性的真正本性被釋放出來。使用者被原始的狂怒吞沒，在一切被夷為平地之前不會停手。事後，寶可夢會陷入混亂。","fo":"The true nature of dragon-types unleashed. The user is consumed by a primal fury that won't stop until everything has ben razed to the ground. Afterwards the Pokémon is confused.","ic":[100,99]},{"n":"Fickle Beam","z":"隨機光","t":"龍","c":"特殊","g":9,"p":"*","a":"洞察 + 導引","d":"特殊 + X *","e":"單體目標。","o":"Single Target.","f":"這隻寶可夢由許多獨立的頭組成，牠們很少意見一致，但一旦同心協力，合起來的力量就十分驚人。","fo":"The Pokémon is formed by many individual heads who rarely agree with one another, but when they do their combined power is devastating.","ic":[1]},{"n":"Clangorous Soul","z":"魂舞烈音爆","t":"龍","c":"變化","g":8,"p":"-","a":"強壯 + 表演","d":"-","e":"目標：使用者。使用者對自己造成傷害骰，數量等同於其總 HP 的一半（無條件捨去）。使用者的力量、靈巧、特殊、防禦、特防提升 1 點。","o":"Target Self. User deals Damage Dice to itself equal to Half of its total HP rounded down. Increase by 1 the User's Strength, Dexterity, Special, Defense and Sp. Defense.","f":"寶可夢甩動鱗片，把它們磨利、脫落並重新排列。雖然有點粗暴，但最後寶可夢覺得更能專注於戰鬥了。","fo":"The Pokémon shakes its scales around, to sharpen, shed, and rearrange them. It's a bit rough, but in the end the Pokémon feels more focused for battle.","ic":[64,84,8,85,86,87]},{"n":"Scale Shot","z":"鱗射","t":"龍","c":"物理","g":8,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。低命中率 1。遠程。連續行動。*若 5 次行動全部命中，使用者的靈巧提升 1 點，防禦降低 1 點。","o":"Single Target. Low Accuracy 1. Ranged. Successive Actions. *If all 5 Actions land successfully, Increase the User's Dexterity by 1, and lower the User's Defense by 1.","f":"寶可夢的鱗片爆開，彷彿手榴彈的碎片。","fo":"The Pokémon's scales burst out as if they were shrapnel from a grenade.","ic":[23,2,1,84,66,13]},{"n":"Clanging Scales","z":"鱗片噪音","t":"龍","c":"特殊","g":7,"p":"4","a":"靈巧 + 表演","d":"特殊 + 4","e":"目標：範圍內所有敵人。聲音類招式。使用者的防禦降低 1 點。","o":"Target all Foes in Range. . Sound Move. Reduce User's Defense by 1.","f":"寶可夢讓盔甲上的鱗片嘩啦作響，在周圍製造出駭人的噪音。有些鱗片因此脫落，讓部分身體暴露在外。","fo":"The Pokémon rattles the scales of its armor creating a frightening noise in the area. Some of its scales fall off as a result, leaving some areas exposed.","ic":[52,66,5]},{"n":"Dragon Rush","z":"龍之俯衝","t":"龍","c":"物理","g":4,"p":"4","a":"靈巧 + 鬥毆","d":"力量 + 4","e":"單體目標。低命中率 2。擲 2 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 2. Roll 2 Chance Dice to Flinch the Target.","f":"寶可夢向對手衝鋒，倒楣的受害者最後會被壓進地面。","fo":"The Pokémon rushes to charge against their foe. Unlucky victims end up crushed into the ground.","ic":[21,1,54]},{"n":"Dragon Rage","z":"龍之怒","t":"龍","c":"特殊","g":1,"p":"","a":"洞察 + 導引","d":"定傷","e":"單體目標。定傷。對目標造成 2 點龍屬性傷害。","o":"Single Target. Set Damage. Deal 2 Dragon-Type Damage to the Target.","f":"寶可夢集中內心的憤怒，並讓它不再只是藏在心裡。","fo":"The Pokémon focuses their inner rage and makes it not-soinner anymore.","ic":[1,92]},{"n":"Dragon Pulse","z":"龍之波動","t":"龍","c":"特殊","g":4,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。","o":"Single Target.","f":"寶可夢從嘴裡發出一道強力的能量波。","fo":"The Pokémon sends out a powerful wave of energy through their mouth.","ic":[1]},{"n":"Dragon Dance","z":"龍之舞","t":"龍","c":"變化","g":3,"p":"—","a":"強壯 + 表演","d":"-", ill sometimes be used as projectiles.","ic":[1,2,46]},{"n":"Dragon Cheer","z":"龍聲鼓舞","t":"龍","c":"變化","g":9,"p":"-","a":"強壯 + 魅惑","d":"-","e":"目標：範圍內的隊友。隊友的所有物理與特殊招式獲得「高要害率」額外效果。*若隊友是龍屬性，其力量與特殊提升 1 點。","o":"Target Allies in Range. All Physical and Special Moves of the Allies now have the “High Critical” Added Effect. *If an Ally is a Dragon- Type, Increase their Strength and Special by 1.","f":"寶可夢發出一聲有力的咆哮，激起同伴在勝利之路上的戰鬥士氣。","fo":"With a mighty roar, the Pokémon fires up the battle spirit of their companions on their quest for victory.","ic":[90,64,85,0]},{"n":"Dragon Hammer","z":"龍錘","t":"龍","c":"物理","g":7,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。","o":"Single Target.","f":"寶可夢揮動身體當作鐵鎚，把對手釘在龜裂的地面上。","fo":"The Pokémon swings its body as a hammer and leaves the foe nailed to the cracked ground.","ic":[1]},{"n":"Fusion Bolt","z":"交錯閃電","t":"電","c":"物理","g":5,"p":"*","a":"力量 + 導引","d":"力量 + 4 *","e":"單體目標。致命傷害。專用。*若本戰鬥輪已有任何人使用過招式「交錯火焰」，此招式的傷害骰池額外增加 4 顆骰。","o":"Single Target. Lethal. Unique. *If the Move “Fusion Flare” has already been used by anyone this Round, add 4 Extra Dice to the Damage Pool of this Move.","f":"寶可夢發動毀滅性的電擊，如果附近有某種特殊的火焰，電擊還會變得更大、更強。","fo":"The Pokémon strikes with a devastating electric impact, said impact will grow larger and stronger if there's a special kind of fire nearby.","ic":[20,1,79,95]},{"n":"Volt Tackle","z":"伏特攻擊","t":"電","c":"物理","g":3,"p":"5","a":"靈巧 + 運動","d":"力量 + 5","e":"單體目標。反作用傷害。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Recoil. Roll 3 Chance die to Paralyze the Target.","f":"寶可夢蓄積最強大的電屬性攻擊，卻不釋放，而是全速奔跑，帶著這股電力撞向對手。","fo":"The Pokémon charges their most powerful electric attack but instead of releasing it, they run at top speed to crash agains their foe with it.","ic":[1,123,124]},{"n":"Volt Switch","z":"伏特替換","t":"電","c":"特殊","g":5,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。使用者方替換招式。","o":"Single Target. Switcher Move for the User.","f":"使用者射出一波電環，讓牠能以閃電般的速度撤退到安全的地方。","fo":"The user shoots a wave of electric rings that allow it to reteat to safety at the speed of lightning.","ic":[1,48]},{"n":"Charge","z":"充電","t":"電","c":"變化","g":3,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：使用者。使用者下一個造成傷害的電屬性招式，傷害骰池增加 2 顆骰。","o":"Target Self. Add 2 Dice to the Damage Pool of the next Damaging Electric-Type Move the User performs.","f":"使用者蒐集並儲存電力，讓攻擊更強。你也可以把牠當成手機的活體行動電源。","fo":"The user gathers electricity and stores it to make its attacks more powerful. You may also use them as a living battery for your phone.","ic":[8,49]},{"n":"Charge Beam","z":"充電光束","t":"電","c":"特殊","g":4,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。低命中率 1。擲 5 顆機率骰，使用者的特殊提升 1 點。","o":"Single Target. Low Accuracy 1. Roll 5 Chance Dice to Increase User's Special by 1.","f":"寶可夢放出一道電光束，如果還有沒用完的電荷，牠就會拿來增強威力。","fo":"The Pokémon releases an electric beam, if any charge remains unused, it will make use of it to boost its power.","ic":[23,1,105,85]},{"n":"Thunderbolt","z":"十萬伏特","t":"電","c":"特殊","g":1,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 1 Chance die to Paralyze the Target.","f":"一記實在的電擊，近一萬伏特的放電，足以擊倒大部分的對手，也能摧毀電子裝置。","fo":"A solid electric shock. A discharge of nearly 10,000 volts that can knock out most foes and destroy electrical devices.","ic":[1,122]},{"n":"Eerie Impulse","z":"怪異電波","t":"電","c":"變化","g":6,"p":"—","a":"洞察 + 威嚇","d":"-","e":"單體目標。敵人的特殊降低 2 點。","o":"Single Target. Reduce foe's Special by 2.","f":"使用者向四周放射電力，讓對手在攻擊前先三思。","fo":"The user radiates electricity around itself so the foe will think twice about attacking.","ic":[1,109]},{"n":"Thunder","z":"打雷","t":"電","c":"特殊","g":1,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"單體目標。低命中率 2。致命傷害。擲 3 顆機率骰，使目標陷入麻痺。下雨天氣會消除低命中率。大晴天會使低命中率增加 4。若目標因使用「飛翔」、「彈跳」或「空中彈跳」而處於範圍外，此招式仍會命中。","o":"Single Target. Low Accuracy 2. Lethal. Roll 3 Chance Dice to Paralyze the Target. Rain Weather eliminates Low Accuracy. Sunny Weather increases it Low Accuracy 4. If the Target is Out of Range due to using “Fly”, “Bounce” or “Sky Drop” this Move hits anyways.","f":"寶可夢命令天空把一道巨大的閃電打向特定的一點。在晴空下很難指揮，在暴風雨中則是致命的。飛行寶可夢特別容易受到傷害。","fo":"The Pokémon commands the skies to send a giant lightning bolt to a specific point. Difficult to command under clear skies, lethal during a storm. Flying Pokémon are specially vulnerable.","ic":[21,1,20,89]},{"n":"Parabolic Charge","z":"拋物面充電","t":"電","c":"特殊","g":6,"p":"2","a":"體魄 + 導引","d":"特殊 + 2","e":"範圍招式。使用者回復等同於對單一目標所造成傷害一半的 HP（無條件捨去）。","o":"Area Move. The User restore HP equal to half the damage to one Target, rounded down.","f":"寶可夢從身體放出一道巨大的電荷，這道電荷回到牠身上時變得更大。","fo":"The Pokémon lets loose a big electric charge from its body. The charge comes back to it even bigger.","ic":[106]},{"n":"Discharge","z":"放電","t":"電","c":"特殊","g":4,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"範圍招式。擲 3 顆機率骰，使受影響者陷入麻痺。","o":"Area Move. Roll 3 Chance Dice to Paralyze those affected.","f":"使用者在場地上釋放出一道巨大的放電，閃電不分敵我。","fo":"The user lets out an enormous discharge over the arena. Lightning does not distinguish friend from foe.","ic":[106,89]},{"n":"Aura Wheel","z":"氣場輪","t":"電","c":"物理","g":8,"p":"4","a":"洞察 + 鬥毆","d":"力量 + 4","e":"單體目標。使用者的靈巧提升 1 點。","o":"Single Target Increase user's Dexterity by 1.","f":"寶可夢開心地衝進由電力構成的輪子，撞向對手。如果使用者感到飢餓，輪子的能量就會被惡之氣場取代。","fo":"The Pokémon happily runs into a wheel made of electricity that strikes the foe. If the user is feeling hungry the wheel's energy is replaced by a dark aura.","ic":[1,84]},{"n":"Wild Charge","z":"瘋狂伏特","t":"電","c":"物理","g":5,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。反作用傷害。擲 1 顆機率骰，使目標陷入麻痺。","o":"Single Target. Recoil. Roll 1 Chance die to Paralyze the Target.","f":"寶可夢全身包覆閃電，不顧一切地衝向目標。","fo":"The Pokémon surrounds itself with lightning then recklessly charges against their target.","ic":[1,123,122]},{"n":"Overdrive","z":"破音","t":"電","c":"特殊","g":8,"p":"3","a":"特殊 + 表演","d":"特殊 + 3","e":"目標：範圍內所有敵人。聲音類招式。","o":"Target All Foes in Range. Sound Move.","f":"寶可夢把自己的身體當作擴大器，放大自己發出的振奮人心的聲音。","fo":"The Pokémon uses its own body as an amplifier for the energizing sounds it produces.","ic":[7,5]},{"n":"Magnetic Flux","z":"磁場操控","t":"電","c":"變化","g":6,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者與範圍內的隊友。電屬性或鋼屬性目標的防禦與特防提升 1 點。","o":"Target User and Allies in Range. Increase by 1 the Defense and Sp. Defense of Electric-Type or Steel-Type Targets.","f":"寶可夢改變自己周圍的磁場來排斥傷害，這也會影響其他對磁荷敏感的寶可夢。","fo":"The Pokémon alters the magnetic field around itself to repel damage. This also affects other Pokémon sensible to magnetic charges.","ic":[117,86,87]},{"n":"Ion Deluge","z":"等離子浴","t":"電","c":"變化","g":6,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：整個戰場。一般屬性招式造成的傷害會被視為電屬性。持續整個場景。","o":"Target Battlefield. Damage from Normal-Type Moves will be considered to be Electric-Type. Whole Scene Duration.","f":"使用者讓環境中的所有粒子帶電，結果令人觸電！","fo":"The user electrifies all the particles in the environment with shocking results!","ic":[110,42]},{"n":"Plasma Fists","z":"等離子閃電拳","t":"電","c":"物理","g":7,"p":"4","a":"靈巧 + 鬥毆","d":"力量 + 4","e":"單體目標。拳類招式。若成功，使用者所有一般屬性招式會被視為電屬性。持續整個場景。","o":"Single Target. Fist Move. If successful, all Normal-Type Moves of the User will be considered Electric- Type. Whole Scene Duration.","f":"使用者讓拳頭充滿電力，擊中時，電荷會化為電漿，替牠所有的一般屬性招式加上電屬性。","fo":"The user charges its fists with electricity, upon impact, the charge materializes into plasma that adds an electric element to all of its Normal moves.","ic":[1,82,42]},{"n":"Nuzzle","z":"蹭蹭臉頰","t":"電","c":"物理","g":6,"p":"1","a":"靈巧 + 魅惑","d":"力量 + 1","e":"單體目標。使敵人陷入麻痺。","o":"Single Target. Paralyze the foe.","f":"寶可夢對目標可愛地蹭了一下，看起來很討喜，直到你看見那些火花。","fo":"The Pokémon gives a cute nuzzle at their target, it looks adorable until you see the sparks.","ic":[1,118]},{"n":"Electrify","z":"輸電","t":"電","c":"變化","g":6,"p":"—","a":"洞察 + 警覺","d":"-","e":"單體目標。先制反應 1。目標下一個物理或特殊招式造成的所有傷害變為電屬性。","o":"Single Target. Reaction 1. All Damage of the Next Physical or Special Move the Target performs will become Electric-Type","f":"使用者向目標突然放出一道電流，目標因此帶電，必須透過攻擊來釋放多餘的能量。","fo":"The user hurls a sudden electric jolt onto its target. The target's rbines and races forward at ultrafast speeds, piercing its target in a blast of futuristic electricity","ic":[20,1,79,95]},{"n":"Bolt Strike","z":"雷擊","t":"電","c":"物理","g":5,"p":"6","a":"力量 + 鬥毆","d":"力量 + 6","e":"單體目標。低命中率 2。致命傷害。專用。擲 2 顆機率骰，使敵人陷入麻痺。","o":"Single Target. Low Accuracy 2. Lethal. Unique. Roll 2 Chance Dice to Paralyze the foe.","f":"捷克羅姆全力衝撞，同時讓閃電流過全身。對手因為電流的衝擊而無法動彈。","fo":"Zekrom delivers a powerful tackle while discharging lightning through its body. The foe is rendered unable to move, either by the strike of the electricity.","ic":[21,1,79,103]},{"n":"Thunder Cage","z":"雷電囚籠","t":"電","c":"特殊","g":8,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。阻擋。持續傷害。持續 4 個戰鬥輪。由說書人裁定，提高目標閃避的難度。","o":"Single Target. Blocks. Ongoing Damage. Duration 4 Rounds. Increase the Target's Difficulty to Evade at Storyteller's Discretion.","f":"戰場上布下數顆閃電球，像特斯拉線圈一樣不停放出閃電，轟擊不幸被困在其中的人。","fo":"Several lightning spheres are placed in the battlefied as if they were a tesla coil. Shooting thunderbolts non-stop and blasting those unfortunate enough to be trapped in it.","ic":[16,1,17,18]},{"n":"Thunder Punch","z":"雷電拳","t":"電","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。拳類招式。擲 1 顆機率骰，使目標陷入麻痺。","o":"Single Target. Fist Move. Roll 1 Chance die to Paralyze the Target.","f":"一記帶電的拳頭，給予令人觸電的一擊。","fo":"A charged punch to deliver a shocking blow.","ic":[1,82,122]},{"n":"Thunder Fang","z":"雷電牙","t":"電","c":"物理","g":4,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。啃咬類招式。擲 2 顆機率骰，使目標畏縮。擲 2 顆機率骰，使目標陷入麻痺。","o":"Single Target. Low Accuracy 1. Bite Move. Roll 2 Chance Dice to Flinch the Target. Roll 2 Chance Dice to Paralyze the Target.","f":"寶可夢用帶電的尖牙咬住對手，等於把電流直接注入對手的神經系統。","fo":"The Pokémon bites the foe with charged fangs, basically injecting electricity right into the foe's nervous system.","ic":[23,3,1,54,121]},{"n":"Spark","z":"電光","t":"電","c":"物理","g":2,"p":"2","a":"靈巧 + 運動","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 3 Chance Dice to Paralyze the Target.","f":"使用者全身包覆靜電，接著用結結實實的衝撞攻擊對手，火花四濺，一點也不誇張。","fo":"The user engulfs itself with statc electricity then charges with a solid tackle against the foe. Sparks fly, very literally.","ic":[1,89]},{"n":"Electro Shot","z":"電光束","t":"電","c":"特殊","g":9,"p":"6","a":"靈巧 + 導引","d":"特殊 + 4 *","e":"單體目標。致命傷害。蓄力招式。若為下雨天氣，可省略此招式的蓄力行動。使用者的特殊提升 1 點。","o":"Single Target. Lethal. Charge Move. If Rain Weather is active, you skip this Move's Charge action. Increase the User's Special Score by 1.","f":"使用者盡可能站得挺直，等待閃電落下，再把閃電直接導向對手，同時為自己充電。","fo":"The user stands as tall as possible, waiting for a lightning to strike. Then re-directs the lightning directly towards the foe; recharging themselves in the process.","ic":[20,1,114,85]},{"n":"Double Shock","z":"電光雙擊","t":"電","c":"物理","g":9,"p":"7","a":"意志 + 導引","d":"力量 + 7","e":"單體目標。致命傷害。造成傷害後，使用者失去電屬性。若其唯一屬性是電，則變為無屬性。使用者的物理與特殊電屬性招式威力變為 0。持續整個場景。此效果不會因為使用者換下場而結束。","o":"Single Target. Lethal. After damage is dealt, the user loses its Electric-Type. If its only type was Electric, it is now Typeless. User's Physical & Special Electric-Type Moves have Power 0. Whole Scene Duration. This effect does not end by switching out the User.","f":"使用者放出一道巨大的電流，閃電連接天空與大地，持續的時間長得過分。不過這番付出也會讓使用者的能量儲備見底。","fo":"The user lets out a colossal discharge of electricity, lightning connecting the sky and earth for way too long. However, the effort effectively depletes the energy reserves of the user.","ic":[20,1,108,107,42]},{"n":"Rising Voltage","z":"電力上升","t":"電","c":"特殊","g":8,"p":"*","a":"靈巧 + 導引","d":"特殊 + 3 *","e":"單體目標。致命傷害。*若電氣場地生效中，此招式的傷害骰池額外增加 3 顆骰。","o":"Single Target. Lethal. *If Electric Terrain is active, add 3 Extra Dice to the Damage pool of this Move..","f":"衝擊波在地面傳遞，接著化為一道由雷電構成的金色光柱升起。","fo":"A shockwave travels through the ground, then rises as a golden pillar of thunderbolts.","ic":[20,1,120]},{"n":"Bolt Beak","z":"電喙","t":"電","c":"物理","g":8,"p":"*","a":"靈巧 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若這是使用者本戰鬥輪的第一個行動，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. *If this is the first Action of the Round for the User, add 2 Extra Dice to the Damage pool of this Move.","f":"寶可夢用鳥喙衝撞啄擊對手，如果對手動作不夠快，就會被一道電流電到。","fo":"The Pokémon charges with its beak and pecks its foe. If the foe is not fast enough it will be zapped with a jolt of electricity.","ic":[1,49]},{"n":"Thunder Shock","z":"電擊","t":"電","c":"特殊","g":1,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 1 Chance die to Paralyze the Target.","f":"最基本的電屬性攻擊：充電、放電、電擊！只是別對著任何電器使用。","fo":"The most basic electric attack, charge, release, and shock! Just don't point it to any electric device.","ic":[1,122]},{"n":"Shock Wave","z":"電擊波","t":"電","c":"特殊","g":3,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。必中。","o":"Single Target. Never Miss.","f":"一連串閃電從地面竄向天空，完全無法預測它們會從哪裡冒出來。","fo":"A series of lightning bolts rise through the floor towards the sky, it is impossible to predict where they are coming from.","ic":[1,59]},{"n":"Electric Terrain","z":"電氣場地","t":"電","c":"變化","g":6,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。所有物理與特殊的電屬性招式，傷害骰池額外增加 1 顆骰。不具地面免疫的寶可夢會從睡眠狀態中治癒。持續 4 個戰鬥輪。","o":"Target Battlefield. Add 1 Extra Damage Dice to all Physical & Special Electric-Type Moves. Pokémon without immunity to Ground will be cured of the Sleep Status. Duration 4 Rounds.","f":"使用者讓戰場充滿電，在火花與電流之間根本無法放鬆。","fo":"The user electrifies the battlefield, making it impossible to relax around the sparks and live current.","ic":[108,111,110,112,18]},{"n":"Electro Ball","z":"電球","t":"電","c":"特殊","g":5,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2 *","e":"單體目標。投彈類招式。*使用者的靈巧每比敵人高 1 點，傷害骰池就額外增加 1 顆骰。最多可用此方式增加 4 顆骰。","o":"Single Target. Projectile Move. *Add 1 Extra Die to the Damage Pool of the user for every Point on Dexterity it has that surpasses the Foe's. Up to 4 Dice might be added this way.","f":"一顆電球被丟向目標，使用者衝得愈快，電球的衝力就愈大。","fo":"An orb of electricity is hurled against the target, the faster the user dashes, the more momentum the orb gets.","ic":[1,95,26]},{"n":"Thunder Wave","z":"電磁波","t":"電","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使目標陷入麻痺。","o":"Single Target. Paralyze the Target.","f":"一連串電波擊中目標，電壓雖然弱得不足以造成多大傷害，卻會讓肌肉痙攣好幾個小時。","fo":"A series of electric waves hit the target, their voltage is too weak to cause much harm but muscles will get cramped for hours.","ic":[1,118]},{"n":"Zap Cannon","z":"電磁炮","t":"電","c":"特殊","g":2,"p":"5","a":"靈巧 + 導引","d":"特殊 + 5","e":"單體目標。低命中率 4。致命傷害。使目標陷入麻痺。投彈類招式。","o":"Single Target. Low Accuracy 4. Lethal. Paralyze the Target. Projectile Move.","f":"一陣駭人卻不規則的電擊爆炸轟炸，被擊中將會是毀滅性的。","fo":"A dreadful but erratic bombardment of electric explosions, getting hit would be devastating.","ic":[126,1,20,118,26]},{"n":"Magnet Rise","z":"電磁飄浮","t":"電","c":"變化","g":4,"p":"—","a":"洞察 + 運動","d":"-","e":"目標：使用者。使用者獲得對地面屬性招式的免疫。持續整個場景。","o":"Target Self. The User gains Immunity against Ground-Type Moves. Whole Scene Duration.","f":"寶可夢製造磁場，使自己與地面互相排斥，讓牠能在短時間內漂浮。","fo":"The Pokémon creates a magnetic field to repel themselves from the ground, allowing it to float for a short period of time.","ic":[8,42,116]},{"n":"Electroweb","z":"電網","t":"電","c":"特殊","g":5,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"目標：範圍內所有敵人。靈巧降低 1 點。","o":"Target All foes in Range. Reduce by 1 the Dexterity of those affected.","f":"一張帶電的網射向目標，同時電擊並纏住牠。","fo":"An electrified web is shot towards the target, shoking and tangling them at the same time.","ic":[7,115]},{"n":"Zippy Zap","z":"電電加速","t":"電","c":"物理","g":7,"p":"2","a":"靈巧 + 鬥毆","d":"力量 +2","e":"單體目標。先制反應 2。此招式一律視為擊中要害，並獲得相應的加成。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. Reaction 2. This Move is always considered to be a Critical Hit and gets the proper Bonus for it. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"使用者在各處穿梭閃電，快到彷彿瞬間移動，從一處閃到另一處襲擊對手，讓對手幾乎來不及反應。","fo":"The user zips and zaps from one place to another to strike the foe moving so fast it appears to be teleporting, leaving almost no time to react.","ic":[1,12]},{"n":"Wildbolt Storm","z":"鳴雷風暴","t":"電","c":"特殊","g":8,"p":"4","a":"特殊 + 自然","d":"特殊 + 4","e":"範圍招式。低命中率 2。致命傷害。風類招式。擲 3 顆機率骰，使受影響者陷入麻痺。","o":"Area Move. Low Accuracy 2. Lethal.Wind Move. Roll 3 Chance Dice to Paralyze those affected.","f":"整片戰場被狂亂的雷暴吞沒，離開掩護的安全處，可能是致命的錯誤。","fo":"The whole battlefield becomes engulfed in a wild lightning storm. Leaving the safety of cover could be a fatal mistake.","ic":[21,106,20,102,125]},{"n":"Zing Zap","z":"麻麻刺刺","t":"電","c":"物理","g":7,"p":"3","a":"靈巧 + 運動","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Dice to Flinch the Target.","f":"使用者化身成一顆之字形亂竄的電球衝向對手，接觸時爆炸，讓對手好幾秒動彈不得。","fo":"The user hurls itself as a zig-zaging ball of electricity that explodes on contact, this leaves the foe unable to move for a few seconds.","ic":[1,127]},{"n":"Buzzy Buzz","z":"麻麻電擊","t":"電","c":"特殊","g":7,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"單體目標。使敵人陷入麻痺。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. Paralyze the foe. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"寶可夢從毛皮釋放一陣靜電，發出可愛的啪啪聲。一切都只是玩鬧，直到有人被麻痺為止。","fo":"The Pokémon releases a jolt of static electricity from its fur, that makes a cute zapping sound. It's all fun and games until somebody gets paralyzed.","ic":[1,104]},{"n":"Sparkly Swirl","z":"亮亮風暴","t":"妖精","c":"特殊","g":7,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。低命中率 1。治癒使用者與範圍內隊友的任一異常狀態。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. Low Accuracy 1. Heal any Status Ailment on the User and Allies in Range. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"寶可夢釋放出閃閃發光的旋轉能量，散發宜人的香氣，能撫慰身體並具有治療的效果。","fo":"The Pokémon unleashes a swirling and glittery energy that releases a pleasant aroma that soothes the body and has healing properties.","ic":[23,1,137,90]},{"n":"Draining Kiss","z":"吸取之吻","t":"妖精","c":"特殊","g":6,"p":"2","a":"體魄 + 魅惑","d":"特殊 + 2","e":"單體目標。使用者回復等同於造成傷害一半的 HP（無條件捨去）。","o":"Single Target. The User restores HP equal to half the damage dealt, rounded down.","f":"寶可夢獻上一個挑逗的飛吻，對手接住它，以為自己找到了愛，結果那只是偷取牠生命能量的把戲。","fo":"The Pokémon blows a flirtatious kiss; the foe catches it believing to have found love, but it turns out to be a trick to steal its life energy.","ic":[1]},{"n":"Baby-Doll Eyes","z":"圓瞳","t":"妖精","c":"變化","g":6,"p":"—","a":"可愛 + 魅惑","d":"-","e":"單體目標。先制反應 1。目標的力量降低 1 點。","o":"Single Target. Reaction 1. Reduce Target's Strength by 1.","f":"最大最亮的眼睛，閃著不曾落下的淚光，你怎麼忍心說「不」呢？！","fo":"The biggest and brightest eyes, spakling with unshed tears, how can you say “no” to that?!","ic":[1,113,74]},{"n":"Geomancy","z":"大地掌控","t":"妖精","c":"變化","g":6,"p":"-","a":"洞察 + 自然","d":"-","e":"目標：使用者。蓄力招式。專用。使用者的靈巧、特殊、特防提升 2 點。","o":"Target Self. Charge Move. Unique. Increase by 2 the User's Dexterity, Special and Sp. Defense.","f":"透過神祕的連結，這隻寶可夢吸收大地本身的生命力，來增強自己的力量。","fo":"Through a mystical conection this Pokémon absorbs the life force of earth itself to increase its power.","ic":[114,79,8,133,70,134]},{"n":"Sweet Kiss","z":"天使之吻","t":"妖精","c":"變化","g":2,"p":"—","a":"可愛 + 魅惑","d":"-","e":"單體目標。低命中率 2。使目標陷入混亂。","o":"Single Target. Low Accuracy 2. Confuse the Target.","f":"寶可夢羞怯地靠近對手，在牠臉頰上輕輕一吻，然後咯咯笑著迅速退開。對手努力想弄懂這是什麼意思。","fo":"The Pokémon timidly approaches the foe and plants a delicate kiss on its cheek then quickly retreats giggling. The foe struggles to understand the meaning of this.","ic":[21,1,144]},{"n":"Fairy Lock","z":"妖精之鎖","t":"妖精","c":"變化","g":6,"p":"—","a":"洞察 + 表演","d":"-","e":"目標：整個戰場。阻擋。持續 1 個戰鬥輪。","o":"Target Battlefield. Block. Duration 1 Round.","f":"使用者像在鎖門一樣比劃，讓任何人都無法離開房間。大家花了好幾秒才發現，自己其實沒有被困住。","fo":"The User moves as if locking a door, preventing anyone from leaving the room. It takes everyone a few seconds to realize they are not really trapped.","ic":[110,32,16]},{"n":"Fairy Wind","z":"妖精之風","t":"妖精","c":"特殊","g":6,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。風類招式。","o":"Single Target. Wind Move.","f":"寶可夢吹出一陣甜美的微風，夾帶閃閃發光的妖精粉，沒有快樂念頭的人會因此起一點疹子。","fo":"The Pokémon let's out sweet a breeze of glittery fairy dust. It gives a mild rash to those without happy thoughts.","ic":[1,102]},{"n":"Play Rough","z":"嬉鬧","t":"妖精","c":"物理","g":6,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。擲 1 顆機率骰，目標的力量降低 1 點。","o":"Single Target. Low Accuracy 1. Roll 1 Chance Dice to Reduce Target's Strength by 1.","f":"寶可夢和對手開始玩鬧般地摔角，很快就演變成一場激烈的扭打。","fo":"The Pokémon and their foe start a playful wrestle that soon escalates into a furious wrestling match.","ic":[23,1,4,74]},{"n":"Crafty Shield","z":"戲法防守","t":"妖精","c":"變化","g":6,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者與範圍內的隊友。先制反應 3。護盾招式。無效化針對目標所使用招式的額外效果。","o":"Target User and Allies in Range. Reaction 3. Shield Move. Negate the Added Effects from Moves made against the Targets.","f":"寶可夢製造一面魔法盾，保護所有人不受對手任何詭計的侵害。在這面盾之下，每個人都能看穿謊言與惡意。","fo":"The Pokémon creates a magic shield to protect everyone from any tricks a foe has up their sleeve. Under this shield, everyone can see dishonesty and bad intentions","ic":[90,34,130]},{"n":"Charm","z":"撒嬌","t":"妖精","c":"變化","g":2,"p":"—","a":"美麗/可愛 + 魅惑","d":"-","e":"單體目標。目標的力量降低 2 點。","o":"Single Target. Reduce Target's Strength by 2.","f":"寶可夢與對手進行一場迷人的互動，以削減對方的攻擊意圖。","fo":"The Pokémon engages their foe in a charming interaction to reduce their aggressive intent.","ic":[1,129]},{"n":"Moonblast","z":"月亮之力","t":"妖精","c":"特殊","g":6,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"單體目標。擲 3 顆機率骰，目標的特殊降低 1 點。","o":"Single Target. Roll 3 Chance Dice to Reduce Target's Special by 1.","f":"使用者化身為月之正義的使者，以月亮之名，匡正錯誤，戰勝邪惡！","fo":"The user becomes a champion of lunar justice. In the name of the moon, they will right the wrongs and triumph over evil!","ic":[1,140,75]},{"n":"Moonlight","z":"月光","t":"妖精","c":"變化","g":2,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。夜晚與大晴天會使其升級為強效治療。下雨、沙暴與冰雹天氣會使其降為回復 1 HP 的定額治療。","o":"Target Self. Basic Heal. If suc- cessful, spend 1 Will point to activate. Night time and Sunny Weather increase it to Complete Heal. Rain, Sandstorm and Hail Weather reduce to Minor Heal of 1 HP.","f":"寶可夢運用月亮的力量治療自己的傷勢。","fo":"The Pokémon uses the moon's power to heal their injuries.","ic":[8,15]},{"n":"Light of Ruin","z":"破滅之光","t":"妖精","c":"特殊","g":6,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。反作用傷害。致命傷害。專用。","o":"Single Target. Low Accuracy 1. Recoil. Lethal. Unique.","f":"寶可夢汲取永恆之花的能量，釋放出牠所有的傷痛。美麗的光芒籠罩四周，但牠內心的痛苦依然存在。","fo":"By drawing energy from the Eternal Flower, the Pokémon unleashes all of its hurt. A beautiful light surrounds the area, yet the pain inside of its heart remains.","ic":[23,20,1,79,135]},{"n":"Strange Steam","z":"神奇蒸汽","t":"妖精","c":"特殊","g":8,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。擲 2 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 2 Chance Dice to Confuse the Target.","f":"使用者釋放出令人上癮、氣味香甜的蒸氣。別被騙了，它帶有輕微的毒性，副作用很討厭。","fo":"The user releases an addictive and sweet-smelling steam. Do not be fooled as it is mildly toxic with nasty side-effects.","ic":[1,143]},{"n":"Nature's Madness","z":"自然之怒","t":"妖精","c":"特殊","g":7,"p":"*","a":"洞察 + 自然","d":"依情況而定","e":"單體目標。低命中率 1。傷害骰為目標剩餘 HP 的一半（最多 10 顆骰，無條件捨去）。若目標的剩餘 HP 為 1，此招式失敗。無視防禦。","o":"Single Target. Low Accuracy 1. Damage Roll is Half of the Target's remaining HP (up to 10 Dice) Rounded down. If the remaining HP of the Target is 1, this move fails. Ignore Defenses.","f":"大自然的力量彷彿有了自己的意志般發動攻擊。水會想淹死你，植物會困住你，閃電會憑空冒出來，連你自己的身體都會背叛你。","fo":"The forces of nature attack as if they had a will of their own. Water will try to drown you, plants will trap you, lightning will come out of nowhere, even your own body will fail you.","ic":[23,1]},{"n":"Fleur Cannon","z":"花朵加農炮","t":"妖精","c":"特殊","g":7,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標，低命中率 1。致命傷害。專用。使用者的特殊降低 2 點。","o":"Single Target, Low Accuracy 1. Lethal. Unique. Reduce User's Special by 2.","f":"一道光束貫穿戰場，造成毀滅性的傷害，卻留下新長出的花朵，而不是焦土。使用者會感到非常疲憊。","fo":"A light beam pierces the battlefield, it deals devastating damage but leaves newly grown flowers instead of scorched earth. The user is left feeling very tired.","ic":[23,20,1,79,88]},{"n":"Floral Healing","z": crease by 2 the Strength and Special of the Target.","f":"只要一點蛋糕的糖霜，寶可夢就能把目標裝飾得看起來更大、更強、而且超級美味！","fo":"With just a bit of cake frosting the Pokémon decorates their target to look bigger, more powerful and incredibly delicious!","ic":[24,131,70]},{"n":"Springtide Storm","z":"陽春風暴","t":"妖精","c":"特殊","g":8,"p":"4","a":"特殊 + 自然","d":"特殊 + 4","e":"範圍招式。致命傷害。低命中率 2。*擇一：擲 3 顆機率骰，使使用者的力量、特殊、靈巧、防禦與特防各提升 1 點。或者，擲 3 顆機率骰，使受影響者的防禦與特防降低 2 點。","o":"Area Move. Lethal. Low Accuracy 2. *Choose one: Roll 3 Chance Dice to increase by 1 the User's Strength, Special, Dexterity, Defense & Sp. Defense. Or, Roll 3 Chance dice to Reduce by 2 the affected Defense & Sp. Defense.","f":"整片戰場被情緒的漩渦吞沒，愛與恨對不幸被困在其中的人造成情感上的傷害。","fo":"The whole battlefield becomes engulfed in a maelstrom of emotion. Love and hate deal emotional damage to those unfortunate enough to be trapped into it.","ic":[21,20,106,141,142]},{"n":"Spirit Break","z":"靈魂衝擊","t":"妖精","c":"物理","g":8,"p":"3","a":"洞察 + 威嚇","d":"力量 + 3","e":"單體目標。目標的特殊降低 1 點。","o":"Single Target, Reduce the Target's Special by 1.","f":"棍棒和石頭也許能打斷你的骨頭，但言語同樣可以。","fo":"Sticks and stones may break your bones but words will too.","ic":[1,75]},{"n":"Disarming Voice","z":"魅惑之聲","t":"妖精","c":"特殊","g":6,"p":"2","a":"洞察 + 魅惑/表演","d":"特殊 + 2","e":"目標：範圍內所有敵人。聲音類招式。必中。","o":"Target All foes in Range. Sound Move. Never Miss.","f":"使用者以迷人卻帶著操弄意味的叫聲，讓對手覺得愧疚，造成情感上的傷害。","fo":"With a charming but manipulative cry, the user deals emotional damage to their opponent by making them feel guilty.","ic":[7,5,59]},{"n":"Alluring Voice","z":"魅誘之聲","t":"妖精","c":"特殊","g":9,"p":"3","a":"美麗/可愛 + 魅惑","d":"特殊 + 3","e":"單體目標。聲音類招式。使目標陷入混亂。","o":"Single Target, Sound Move. Confuse the Target.","f":"自古以來，水手們就警告人們，要提防海中傳來呼喚你的海妖魅惑嗓音。現在你知道為什麼了。","fo":"Since ancient times, sailors have warned against the siren's alluring voice calling out for you in the middle of the sea. Now you know why.","ic":[1,5,61]},{"n":"Magical Torque","z":"魔法暴衝","t":"妖精","c":"物理","g":9,"p":"4","a":"特殊 + 導引","d":"力量 + ，傷害骰池就額外增加 1 顆骰，最多可用此方式增加 4 顆骰。","o":"Single Target. *Add 1 Extra Damage Dice for every 50kg of weight on the foe, up to 4 Dice may be added this way.","f":"寶可夢踢向脛骨，把對手摔倒在地。體型愈大，摔得愈重。","fo":"The Pokémon uses a kick to the sheen to throw the foe into the ground. The bigger they are, the harder they fall.","ic":[1,95]},{"n":"Close Combat","z":"近身戰","t":"格鬥","c":"物理","g":4,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。使用者的防禦、特防降低 1 點。","o":"Single Target. Reduce by 1 the User's Defense and Sp. Defense.","f":"寶可夢貼近到足以造成毀滅性的傷害，但對手也一樣。","fo":"The Pokémon gets close enough to deal devastating damage, but the same can be said for the foe.","ic":[1,66,147]},{"n":"Rolling Kick","z":"迴旋踢","t":"格鬥","c":"物理","g":1,"p":"2","a":"靈巧 + 運動","d":"力量 + 2","e":"單體目標。低命中率 2。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 2. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢跳到空中旋轉，伸出一條腿，對對手踢出令人印象深刻的一腳。","fo":"The Pokémon jumps in the air and spins with one leg extended to land an impressive kick against their foe.","ic":[21,1,43]},{"n":"Counter","z":"雙倍奉還","t":"格鬥","c":"物理","g":1,"p":"","a":"洞察 + 鬥毆","d":"依情況而定","e":"單體目標。後制反應 5。只有在目標上一次對使用者使用的是物理招式時才能使用。傷害骰為：目標上一次對使用者擲出的傷害骰池，再加 2 顆骰。無視防禦。","o":"Single Target. Late Reaction 5. Can only be used if Target's last Move on User was a Physical Move. For damage, roll dice equal to Target's last damage pool rolled against the User plus 2 dice. Ignore Defenses.","f":"寶可夢反擊對手，顯示牠不但能承受一擊，還能打得更重。","fo":"The Pokémon strikes back at their foe. Showing they can take a hit and punch even harder.","ic":[1,148]},{"n":"Thunderous Kick","z":"雷鳴蹴擊","t":"格鬥","c":"物理","g":8,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。目標的防禦降低 1 點。","o":"Single Target. Reduce Target's Defense by 1.","f":"使用者以一記閃電般快速的踢擊劈開戰場，就連旁觀者也被強大的衝擊波震飛。","fo":"The user splits open the field with a single lightning-fast kick. Even bystanders are sent flying away by the powerful shockwave.","ic":[1,53]},{"n":"Mach Punch","z":"音速拳","t":"格鬥","c":"物理","g":2,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。先制反應 1。拳類招式。","o":"Single Target. Reaction 1. Fist Move.","f":"使用者出拳的速度快到幾乎看不見。","fo":"The user launches a punch so quickly that it's barely seen.","ic":[113,1,82]},{"n":"High Jump Kick","z":"飛膝踢","t":"格鬥","c":"物理","g":1,"p":"5","a":"靈巧 + 運動","d":"力量 + 5","e":"單體目標。低命中率 2。若命中擲骰失敗，對使用者擲 5 顆無屬性傷害骰（無視防禦）。","o":"Single Target. Low Accuracy 2. If the Accuracy roll fails, Roll 5 Dice of Typeless Damage against the user, ignoring defenses.","f":"使用者躍上三層樓高，再以猛烈的踢擊重重落下。姑且相信牠從那種距離也能瞄得很準。","fo":"The user launches itself up three stories high to pummel down with a brutal kick. Let's just trust it's got a good aim from that distance.","ic":[1,21]},{"n":"Jump Kick","z":"飛踢","t":"格鬥","c":"物理","g":1,"p":"4","a":"靈巧 + 運動","d":"力量 + 4","e":"單體目標。低命中率 1。若命中擲骰失敗，對使用者擲 4 顆無屬性傷害骰（無視防禦）。","o":"Single Target. Low Accuracy 1. If the Accuracy roll fails, Roll 4 Dice of Typeless Damage against the user, ignoring defenses.","f":"使用者躍上兩層樓高，再以強力的踢擊重重落下。請勿在家模仿。","fo":"The user launches itself up two stories high to pummel down with a powerful kick. Do not try it at home.","ic":[1,23]},{"n":"Flying Press","z":"飛身重壓","t":"格鬥","c":"物理","g":6,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。此招式造成傷害時，視同其也帶有飛行屬性。","o":"Single Target. This Move deals damage as if it was also Flying-Type.","f":"使用者跳上繩索，以純正的墨西哥職業摔角風格，用膝蓋撞擊對手！","fo":"The user jumps up the ropes to hit the foe using their knees in pure Lucha Libre style!","ic":[1]},{"n":"Fusion Flare","z":"交錯火焰","t":"火","c":"特殊","g":5,"p":"*","a":"特殊 + 導引","d":"特殊 + 4 *","e":"單體目標。致命傷害。專用。*若本戰鬥輪中已有任何人使用過「交錯閃電」，此招式的傷害骰池額外增加 4 顆骰。","o":"Single Target. Lethal. Unique. *If the Move “Fusion Bolt” has already been used by anyone this Round, add 4 Extra Dice to the Damage Pool of this Move.","f":"寶可夢在目標身上點燃一道旋轉的火柱，如果附近有某種特殊的電荷，火柱還會變得更高、旋轉得更快。","fo":"The Pokémon sets ablaze a swirling pillar upon the target, said pillar will grow taller and swirl faster if there's a special kind of charge nearby.","ic":[20,1,79,95]},{"n":"Flamethrower","z":"噴射火焰","t":"火","c":"特殊","g":1,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標陷入灼傷 2 級。","o":"Single Target. Roll 1 Chance Dice to inflict 2nd Degree Burn on the Target.","f":"最具代表性的火屬性攻擊，一道彷彿永不停歇的火流，把一切生物與事物燒成灰燼。","fo":"The most emblematic fire attack, a seeminly endless stream of fire that reduces everything and everyone to ashes.","ic":[1,173]},{"n":"Eruption","z":"噴火","t":"火","c":"特殊","g":3,"p":"6","a":"特殊 + 導引","d":"特殊 + 6 *","e":"目標：範圍內所有敵人。致命傷害。*使用者每損失 1 點 HP，傷害骰池減少 1 顆骰。最多可用此方式移除 5 顆骰。","o":"Target All Foes in Range. Lethal. *Reduce 1 Die from the Damage Pool for every missing HP the User has. Up to 5 Dice may be removed this way.","f":"寶可夢全力迸發出猛烈的熔岩，接觸到的一切都被燒焦。隨著怒氣平息，熔岩的流動也漸漸減弱。","fo":"A fierce burst of lava comes out from the Pokémon at full force, charring whatever comes in contact with it. The lava flow diminishes as the rage subsides.","ic":[20,7,91]},{"n":"Lava Plume","z":"噴煙","t":"火","c":"特殊","g":4,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"範圍招式。擲 3 顆機率骰，使受影響者陷入灼傷 1 級。","o":"Area Move. Roll 3 Chance Dice to inflict 1st Degree Burn on those affected.","f":"地板是岩漿，天空是岩漿，到處都是岩漿，成百上千的熔岩碎塊開始如雨般散落在場地各處。","fo":"The floor is lava. The sky is lava. Everywhere is lava. Hundreds of lava bits start raining scattered around the field.","ic":[106,178]},{"n":"Fire Blast","z":"大字爆炎","t":"火","c":"特殊","g":1,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"單體目標。低命中率 2。致命傷害。擲 3 顆機率骰，使目標陷入灼傷 3 級。","o":"Single Target. Low Accuracy 2. Lethal. Roll 3 Chance Dice to inflict 3rd Degree Burn on the Target.","f":"寶可夢射出一顆巨大的火球，一碰到目標就會爆炸，向四面八方炸出火焰。","fo":"The Pokémon shoots a giant fireball that explodes as soon as it touches their target. Blasting fire in all directions.","ic":[21,1,20,171]},{"n":"Raging Fury","z":"大憤慨","t":"火","c":"物理","g":8,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"目標：隨機敵人。遠程。狂暴。","o":"Target Random foe. Ranged. Rampage.","f":"寶可夢憤怒得發狂，在戰場上兇狠地到處噴火，幾乎分不出敵友。","fo":"The Pokémon goes mad with rage, spitting fire viciously all over the battlfield and barely recognizing friend from foe.","ic":[1 ll 2 Dice of Fire-Type Damage to everyone without immunity to Ground on the field ignoring defenses. Duration 4 Rounds.","f":"寶可夢吟唱，召喚火焰的力量，牠的誓言被聽見了，火焰上前來協助牠戰鬥。","fo":"The Pokémon chants to invoke the power of fire, their pledge is heard and the flames come forward to aid them in battle.","ic":[106,110,18]},{"n":"Burning Bulwark","z":"火焰守護","t":"火","c":"變化","g":9,"p":"-","a":"特殊 + 自然","d":"-","e":"目標：使用者。先制反應 4。護盾招式。使用者受到傷害性招式時，減少 3 點傷害。*若敵人對使用者使用非遠程物理招式，使其陷入灼傷 1 級。","o":"Target Self. Reaction 4. Shield Move. Reduce 3 Damage the User would receive from a Damaging Move. *If the Foe used a Non-Ranged Physical Move against the user, inflict 1st Degree Burn to it.","f":"寶可夢在自己身上點燃一層火焰外衣，當作保護屏障。碰它可不是個好主意。","fo":"The Pokémon lights a fire coat around itself as a protective barrier. It is not a good idea to touch it.","ic":[36,8,34,169]},{"n":"Searing Shot","z":"火焰彈","t":"火","c":"特殊","g":5,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"目標：範圍內所有敵人。致命傷害。投彈類招式。擲 3 顆機率骰，使受影響者陷入灼傷 2 級。","o":"Target All Foes in Range. Lethal. Projectile Move. Roll 3 Chance Dice to inflict 2nd Degree Burn on those affected.","f":"使用者在一陣突然爆發的猩紅火焰中，燒盡周圍的一切，轉瞬之間，一切都化為灰燼。","fo":"The User torches everything around itself in a sudden burst of scarlet flames. Everything is brought to cinders in a matter of seconds.","ic":[20,7,26,182]},{"n":"Fire Punch","z":"火焰拳","t":"火","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。拳類招式。擲 1 顆機率骰，使目標陷入灼傷 2 級。","o":"Single Target. Fist Move. Roll 1 Chance Dice to inflict 2nd Degree Burn on the Target.","f":"一記由戰鬥的火熱精神驅動的拳頭，戰鬥的熱度在拳頭擊中對手痛處的瞬間真的燃燒起來！","fo":"A fist powered by the fiery spirit of combat, the heat of the battle lights of for real as the punch hits the foe right where it hurts!","ic":[1,82,173]},{"n":"Fire Spin","z":"火焰旋渦","t":"火","c":"特殊","g":1,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。低命中率 2。阻擋。持續傷害。持續 4 個戰鬥輪。由說書人裁定，提高目標閃避的難度。","o":"Single Target. Low Accuracy 2. Blocks. Ongoing Damage. Duration 4 Rounds. Increase the Target's difficulty to Evade at ith a mighty stomp on top of the foe. While in the air it is safe from most treaths but its still vulnerable to bad weather.","ic":[114,1,190,98,89]},{"n":"Hurricane","z":"暴風","t":"飛行","c":"特殊","g":5,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"單體目標。低命中率 2。致命傷害。風類招式。擲 3 顆機率骰，使目標陷入混亂。下雨天氣會消除低命中率。大晴天會使低命中率增加至 4。若目標因使用「飛翔」、「彈跳」或「空中彈跳」而處於範圍外，此招式仍會命中。","o":"Single Target. Low Accuracy 2. Lethal. Wind Move. Roll 3 Chance Dice to Confuse the Target. Rain Weather eliminates Low Accuracy. Sunny Weather in- creases to Low Accuracy 4. If the Target is Out of Range due to using “Fly”, “Bounce” or “Sky Drop” this Move hits anyways.","f":"寶可夢召喚猛烈的狂風。在晴空下很難喚出風暴，但只要有一點雨，就能增強成颱風。空中的其他寶可夢最危險。","fo":"The Pokémon calls upon fierce gale winds. It'll be difficult to summon the tempest on a clear day, but a little rain will enhance it into a typhoon. Other pokémon in the air are in most danger.","ic":[21,20,1,102,191]},{"n":"Bleakwind Storm","z":"枯葉風暴","t":"飛行","c":"特殊","g":8,"p":"4","a":"特殊 + 自然","d":"特殊 + 4","e":"範圍招式。低命中率 2。致命傷害。風類招式。擲 3 顆機率骰，使受影響者陷入冰凍。","o":"Area Move. Low Accuracy 2. Lethal. Wind Move. Roll 3 Chance Dice to Freeze those Affected.","f":"一場狂暴的風暴蹂躪戰場，寒風以令人心驚的方式旋繞，你分不清那股寒意是來自冰，還是來自侵襲全身的恐懼。","fo":"A furious storm ravages the battlefield, cold winds swirl in such a menacing way that you don't know if the chill comes from the ice or the sheer terror invading you.","ic":[21,20,106,102,189]},{"n":"Oblivion Wing","z":"死亡之翼","t":"飛行","c":"特殊","g":6,"p":"4","a":"特殊 + 導引","d":"特殊 + 4","e":"單體目標。致命傷害。高要害率。專用。","o":"Single Target. Lethal. High Critical. Unique.","f":"一陣黑暗之風颳起，碰到的一切都化為塵埃，被吹散到什麼都不剩。人、寶可夢、植物，一切都像遙遠的記憶一樣褪去。","fo":"A dark wind rises, turning everything it touches into dust to be scattered until nothing remains. People, Pokémon, plants, everything fades like a distant memory.","ic":[20,1,79,0]},{"n":"Aeroblast","z":"氣旋攻擊","t":"飛行","c":"特殊","g":2,"p":"4","a":"特殊 + 導引","d":"特殊 + 4","e":"單體目標。致命傷害。高要害率。專用。","o":"Single Target. Lethal. High Critical. Unique.","f":"受害者被困在劇烈旋轉的漩渦之中，強勁的氣流把碎片吹得四處飛散。","fo":"The victim is trapped in a violently swirling vortex. The strong wind currents make debris fly everywhere.","ic":[20,1,79,0]},{"n":"Defog","z":"清除濃霧","t":"飛行","c":"變化","g":4,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：整個戰場。移除戰場上所有防護力場、入場危害與場地（薄霧場地、電氣場地等）。","o":"Target Battlefield. Remove all Force Fields, Entry Hazards and Terrains (Misty Terrain, Electric Terrain etc.) from the Battlefield.","f":"一陣強風橫掃戰場，從壞天氣、散落的物品，到無形的屏障，全都被吹得乾乾淨淨。","fo":"A strong wind sweeps out the battle field, removing anything from bad weather to scattered objects and even invisible barriers.","ic":[110]},{"n":"Aerial Ace","z":"燕返","t":"飛行","c":"物理","g":3,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。必中。","o":"Single Target. Never Miss.","f":"寶可夢朝著光源飛上天空，暫時讓對手睜不開眼，接著迅速俯衝攻擊對手。","fo":"The Pokémon rises up in the air towards a light source, momentarily blinding the foe. then plummets quickly to attack the opponent","ic":[1,59]},{"n":"Dragon Ascent","z":"畫龍點睛","t":"飛行","c":"物理","g":6,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。致命傷害。專用。使用者的防禦、特防降低 1 點。","o":"Single Target. Lethal. Unique. Reduce by 1 the User's Defense and Sp. Defense.","f":"使用者飛升到雲層之上，然後瞬間俯衝撞向對手。這一擊對雙方都極為猛烈。","fo":"The user rises above the clouds and then comes crashing down against its foe in an instant. The strike is brutal for the both of them.","ic":[20,79,1,66,147]},{"n":"Sky Attack","z":"神鳥猛擊","t":"飛行","c":"物理","g":1,"p":"6","a":"力量 + 鬥毆","d":"力量 + 6","e":"單體目標。低命中率 1。蓄力招式。高要害率。致命傷害。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Charge Move. High Critical. Lethal. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢以優雅卻致命的一擊向對手深深俯衝，彷彿整片天空都塌了下來，正好壓在對手頭上。","fo":"In a graceful but lethal strike, the Pokémon takes a deep dive towards the foe as if the sky was falling down right on top of it","ic":[23,0,1,114,20,43]},{"n":"Air Cutter","z":"空氣利刃","t":"飛行","c":"特殊","g":3,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"目標：範圍內所有敵人。高要害率。風類。切割類招式。","o":"Target All Foes in Range. High Critical. Wind Based. Cutter Move.",  a decent altitude. Let gravity handle this one.","ic":[114,1,190,98,194]},{"n":"Gust","z":"起風","t":"飛行","c":"特殊","g":1,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。風類招式。若目標因使用「飛翔」、「彈跳」或「空中彈跳」而處於範圍外，此招式仍會命中。","o":"Single Target. Wind Move. If the Target is Out of Range due to using “Fly”, “Bounce” or “Sky Drop” this Move hits anyways.","f":"寶可夢拍動翅膀，用一陣旋風打擊對手。空中的寶可夢可能會被吹走。","fo":"The Pokémon flaps their wings and strikes the foe with a swirl of wind. Pokémon in the air may get swept away.","ic":[1,102]},{"n":"Dual Wingbeat","z":"雙翼","t":"飛行","c":"物理","g":8,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。雙重行動。","o":"Single Target. Low Accuracy 1. Double Action.","f":"寶可夢從上方重擊對手，雙翼各給一記狠狠的拍打。","fo":"The Pokémon slams the foe from above. Each wing provides a good smacking.","ic":[1,23,46]},{"n":"Acrobatics","z":"雜技","t":"飛行","c":"物理","g":5,"p":"4","a":"靈巧 + 運動","d":"力量 + 4 *","e":"單體目標。*若使用者持有攜帶道具，此招式的傷害骰池減少 2 顆骰。傷害 *","o":"Single Target. *If the User has a Held Item, Reduce 2 Dice to the Damage Pool of this Move. Damage *","f":"寶可夢輕盈又優雅，翻筋斗、扭身，再做出一個後空翻跳躍，然後落在對手身上。當牠身上沒有負擔時，表現最為出色。","fo":"The Pokémon is quick and graceful, they cartwheel, contort and make a double back jump before landing onthe foe. Their best perfomance is done when they are unburdened.","ic":[1,187]},{"n":"Tailwind","z":"順風","t":"飛行","c":"變化","g":4,"p":"—","a":"聰明 + 自然","d":"-","e":"目標：己方場地。風類招式。使用者一側場地上所有人的靈巧提升 2 點。持續 4 個戰鬥輪。","o":"Target User's side of the Field. Wind Move. Increase by 2 the Dexterity of everyone on the User's side of the field. Duration 4 Rounds.","f":"飛行寶可夢比任何人都懂得如何借用風勢。讓這陣氣流帶你走向勝利吧。","fo":"Flying Pokémon know better than anyone how to use the wind in their favor. Let its draft carry you to victory.","ic":[102,195,133,18]},{"n":"Floaty Fall","z":"飄飄墜落","t":"飛行","c":"物理","g":7,"p":"3","a":"靈巧 + 運動","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標畏縮。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. Roll 3 Chance Dice to Flinch the Target. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"使用者借助九十九顆氣球的力量高高跳起，再落到對手身上。在戰鬥中使用九十九顆氣球頗有爭議，但裁判允許了。","fo":"With the help of 99 air balloons, the user jumps up high and falls on top of its foe. The use of 99 balloons in-battle is questionable, but the referee will allow them.","ic":[1,43]},{"n":"Fly","z":"飛翔","t":"飛行","c":"物理","g":1,"p":"4","a":"靈巧 + 運動","d":"力量 + 4","e":"單體目標。蓄力招式。蓄力期間處於範圍外。蓄力期間易受以下招式影響：打雷／龍捲風／衝天拳／突襲／暴風／打落。戰鬥外可讓寶可夢飛行長距離移動。","o":"Single Target. Charge Move. Out of Range while Charging. Vulnerable while charging to: Thunder/ Twister/ Sky Uppercut /Gust/ Hurricane/ Smack Down. Out of battle allows the pokemon to fly long distances.","f":"寶可夢用一個行動飛到高處，找出對對手俯衝的最佳角度。會這個招式的寶可夢能長時間飛行而不需休息。","fo":"The Pokémon uses an action to fly up high, to asses the best angle to take a dive against the foe. Pokémon who know this Move can fly for long periods of time without rest.","ic":[114,1,190,98]},{"n":"Beak Blast","z":"鳥嘴加農炮","t":"飛行","c":"物理","g":7,"p":"4","a":"力量 + 鬥毆","d":"力量 + 4","e":"單體目標。蓄力招式。遠程。投彈類招式。*若使用者在蓄力期間被非遠程物理招式命中，使攻擊者陷入灼傷 2 級。","o":"Single Target. Charge Move. Ranged. Projectile Move. *If the User is hit by a Non-Ranged Physical Move while this Move is charging, inflict 2nd Degree Burn on the attacker.","f":"寶可夢準備從鳥喙釋放滾燙的氣體，鳥喙變得極度灼熱，隨後的爆發聲聽起來像火車的汽笛。","fo":"The Pokémon gets ready to release a boiling gas through its beak, which gets incredibly hot. The resulting blast sounds like a train's horn.","ic":[114,22,1,26,188]},{"n":"Mirror Move","z":"鸚鵡學舌","t":"飛行","c":"變化","g":1,"p":"—","a":"洞察 + 表演","d":"與被複製的招式相同","e":"單體目標。複製招式。專用招式無法被複製。你可以為被複製的招式另選目標。","o":"Single Target. Copy Move. Unique Moves can't be copied. You may choose another Target(s) for the copied Move.","f":"寶可夢模仿目標的叫聲與動作，近乎完美的模仿甚至連對方的力量也能複製。","fo":"The Pokémon parrots the target cries and movements. In an almost perfect impersonation that manages to copy its powers.","ic":[192,193]},{"n":"Bitter Malice","z":"冤冤相報","t":"幽靈","c":"特殊","g":8,"p":"*","a":"特殊 + 威嚇","d":"特殊 + 3 *","e":"擲 3 顆機率骰，使敵人陷入冰凍。*若目標已處於異常狀態，此招式的傷害骰池額外增加 2 顆骰。","o":"Roll 3 Chance Dice to Freeze the Foe. *If the Target already has an active Status Condition, add 2 Extra Dice to the Damage Pool of this Move.","f":"受害者被一波邪惡能量襲擊，滿心恐懼，動彈不得。","fo":"The victim is hit by an onslaught of evil energy. Filled with dread, the victim is unable to move.","ic":[1,189,49]},{"n":"Destiny Bond","z":"同命","t":"幽靈","c":"變化","g":2,"p":"—","a":"意志 + 隱匿","d":"-","e":"目標：使用者。若使用者在本戰鬥輪因物理或特殊招式的傷害而昏厥，對造成傷害的寶可夢造成等同於其剩餘 HP 的傷害。若上個戰鬥輪用過此招式，則此招式失敗。","o":"Target Self. If the user faints this Round due to damage from a Physical or Special Move, the Pokémon who dealt the damage be dealt damage equal to their remaining HP. This Move will fail if it was used the previous Round.","f":"透過神祕的羈絆，任何讓這隻寶可夢蒙羞的人，都會遭遇一模一樣的命運。","fo":"Through a mystical bond, everyone who brings disgrace to this Pokémon will suffer the exact same fate.","ic":[8]},{"n":"Confuse Ray","z":"奇異之光","t":"幽靈","c":"變化","g":1,"p":"—","a":"聰明 + 魅惑/威嚇","d":"-","e":"單體目標。使目標陷入混亂。","o":"Single Target. Confuse the Target.","f":"使用者閃出一道不祥的明亮光線，其他人忍不住直直往光裡走去。","fo":"The user flashes a sinister ray of bright light that others cannot help but go straight into it.","ic":[1,144]},{"n":"Ominous Wind","z":"奇異之風","t":"幽靈","c":"特殊","g":4,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。風類招式。擲 1 顆機率骰，使用者的力量、靈巧、特殊、防禦、特防提升 1 點。","o":"Single Target. Wind Move. Roll 1 Chance Die to Increase by 1 the User's Strength, Dexterity, Special, Defense and Sp. Defense.","f":"戰場變得鴉雀無聲，唯一的聲音是一陣冰冷的風，讓目標寒毛直豎、起雞皮疙瘩。使用者從陰影中觀察，對這份恐懼樂在其中。","fo":"The battlefield gets absolutely silent, the only noise is a cold wind draft that gives the target chills and goosebumps. Observing from the shadows, the user rejoices in the fear.","ic":[102,1,37,198]},{"n":"Shadow Sneak","z":"影子偷襲","t":"幽靈","c":"物理","g":4,"p":"2","a":"靈巧/力量 + 隱匿","d":"力量 + 2","e":"單體目標。先制反應 1。","o":"Single Target. Reaction 1.","f":"使用者潛行穿過黑暗，從目標的影子中冒出來發動攻擊。這隻寶可夢能在影之界自由穿梭。","fo":"The user sneaks through the darkness and strikes by coming out of the target's shadow. The Pokémon is able travel freely through the shadow realm.","ic":[1,113]},{"n":"Grudge","z":"怨念","t":"幽靈","c":"變化","g":3,"p":"—","a":"意志 + 導引","d":"-","e":"單體目標。使用者昏厥。將目標的意志降為 0 點，並重置其因花費意志點而獲得的所有效果。每個戰鬥輪結束時擲目標的忠誠，每輪難度增加 1。此擲骰失敗會使目標昏厥。","o":"Single Target. The User Faints. Reduce the Target's Will to 0 points and reset any effects it got from spending them. Roll Target's Loyalty at the end of the round, increase difficulty by 1 each round. Failing this roll faints the Target.","f":"這隻寶可夢臨終的遺言烙下對對手的怨恨與憤怒，讓對手失去繼續活在這世上的意志。","fo":"The last words of this Pokémon imprint their grudge and anger over their foe. Depleting the foe of their will to carry on in this world.","ic":[1]},{"n":"Spite","z":"怨恨","t":"幽靈","c":"變化","g":2,"p":"—","a":"意志 + 威嚇","d":"-","e":"單體目標。將目標的意志降為 1 點。重置其因花費意志點而獲得的所有效果。","o":"Single Target Reduce the Target's Will to 1 point. Reset any effects it got from spending Will Points.","f":"目標被恐懼的情緒淹沒。","fo":"The target feels overwhelmend by feelings of dread.","ic":[1]},{"n":"Nightmare","z":"惡夢","t":"幽靈","c":"變化","g":2,"p":"—","a":"意志 + 威嚇","d":"-","e":"單體目標。只有在目標處於睡眠狀態時才能使用。目標每次嘗試擺脫睡眠卻沒有醒來時，對目標造成 1 點無屬性傷害。","o":"Single Target. Can only be used if the Target has the Sleep Condition. Deal 1 Typeless Damage to the Target after every attempt it makes to resist its Sleep Condition where it doesn't wake up.","f":"據說使用者會把自己傳送到夢境之地，用逼真的夜驚折磨受害者，受害者醒來後身上會出現無法解釋的傷痕。","fo":"The user is believed to transport themselves to the land of dreams to torment their victims with vivid night terrors. The vicitms wake up with unexplainable injuries.","ic":[1,197]},{"n":"Rage Fist","z":"憤怒之拳","t":"幽靈","c":"物理","g":9,"p":"*","a":"洞察 + 威嚇","d":"力量 + 2 *","e":"單體目標。拳類招式。*使用者本戰鬥輪每受到一次傷害，此招式的傷害骰池就額外增加 2 顆骰，最多可用此方式增加 8 顆。","o":"Single Target. Fist Move. *Add 2 Extra Dice to the Damage pool of this Move for every time the User has received Damage this Round, Up to 8 Dice may be added this way.","f":"寶可夢把所有憤怒集中在一隻拳頭上，牠受過的苦愈多，匯聚的暗黑能量就愈多。","fo":"The Pokémon focuses all of their rage into a single fist, the more they suffered the more dark energy will concentrate.","ic":[1,82,120]},{"n":"Last Respects","z":"掃墓","t":"幽靈","c":"物理","g":9,"p":"*","a":"洞察 + 共感","d":"力量 + 2 *","e":"單體目標。*本場戰鬥中每有一名隊友昏厥，此招式的傷害骰池就額外增加 2 顆骰，最多可用此方式增加 8 顆。","o":"Single Target. *Add 2 Extra Dice to the Damage pool of this Move for every ally that has Fainted during this Battle Up to 8 Dice may be added this way.","f":"寶可夢聚集亡者的靈魂，在牠們離去之前，幫助牠們完成復仇的心願。","fo":"The Pokémon gathers the souls the departed and helps them fulfill their desire of revenge before moving on.","ic":[1,120]},{"n":"Astral Barrage","z":"星碎","t":"幽靈","c":"特殊","g":8,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"目標：範圍內所有敵人。致命傷害。專用。","o":"Target All Foes in Range. Lethal. Unique.","f":"召喚亡者不安的靈魂，派牠們去消滅你的對手。親眼目睹，真是令人毛骨悚然的景象。","fo":"Call upon the restless spirits of the dead and send them to destroy your opponents. A truly frightening sight to witness.","ic":[7,20,79]},{"n":"Moongeist Beam","z":"暗影之光","t":"幽靈","c":"特殊","g":7,"p":"4","a":"特殊 + 導引","d":"特殊 + 4","e":"單體目標。致命傷害。專用。若敵方一側有任何事物會使此招式無法造成傷害（寶可夢屬性、特性、護盾招式、天氣或防護力場），一律無視。此招式無法被對抗。","o":"Single Target. Lethal. Unique. If anything on the foe's side would prevent this move from dealing damage (Pokémon Type, Abilities, Shield Moves, Weather or Force Fields) ignore it. This Move cannot be Clashed.","f":"月亮冰冷的倒影照向目標，不會造成身體上的疼痛，但直視這道光的人就這樣倒下了。","fo":"A cold reflection of the moon shines upon the target, it doesn't hurt physically but those who stare directly into the light simply collapse.","ic":[1,20,79]},{"n":"Shadow Bone","z":"暗影之骨","t":"幽靈","c":"物理","g":7,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 2 顆機率骰，敵人的防禦降低 1 點。","o":"Single Taget. Roll 2 Chance Dice to Reduce the Foe's Defense by 1.","f":"這隻寶可夢當作武器使用的骨頭裡，寄宿著一個靈魂，那個靈魂可能附著在受害者身上，為牠的主人創造破綻。","fo":"The bone that this Pokémon uses as a weapon contains a spirit, that spirit may cling into a victim, creating openings for its master.","ic":[1,199,53]},{"n":"Spectral Thief","z":"暗影偷盜","t":"幽靈","c":"物理","g":7,"p":"3","a":"靈巧 + 隱匿","d":"力量 + 3","e":"單體目標。專用。使用者以此招式造成傷害前，先奪取目標身上所有的能力提升。目標被降低的能力值維持不變。","o":"Single Target. Unique. Before the User deals damage with this Move, steal all Attribute Increases the Target may have. Reduced Attributes on the Target remain.","f":"使用者透過陰影悄悄接近目標，偷走並吞噬牠的生命力，讓受害者陷入悲傷與失落。","fo":"Through the shadows, the user sneaks on its target to steal its life force and consume it, leaving the victim with a sense of grief and loss.","ic":[1,79]},{"n":"Shadow Punch","z":"暗影拳","t":"幽靈","c":"物理","g":3,"p":"2","a":"力量 + 鬥毆/隱匿","d":"力量 + 2","e":"單體目標。必中。拳類招式。","o":"Single Target. Never Miss. Fist Move.","f":"寶可夢朝空氣揮拳，不經意間，牠的影子透過對手自己的影子打出這一拳，這個招式完全無法預測。","fo":"The Pokémon punches the air, inadvertently, their shadow delivers the punch through the foe's own shadow. This move is impossible to predict.","ic":[1,59,82]},{"n":"Shadow Force","z":"暗影潛襲","t":"幽靈","c":"物理","g":4,"p":"5","a":"力量 + 隱匿","d":"力量 + 5","e":"單體目標。蓄力招式。蓄力期間處於範圍外。致命傷害。專用。無視防禦，以及目標身上生效中的任何防護招式與防護力場。此招式造成的傷害在 24 小時內無法被治療。","o":"Single Target. Charge Move. Out of Range while Charging. Lethal. Unique. Ignore Defenses and any Shield Moves and Force Fields active on the Target. Damage dealt by this Move cannot be healed for 24 hrs.","f":"寶可夢消失在黑暗的次元，等待下一個機會攻擊對手。這一擊傷害的不是目標的身體，而是直接傷在牠的靈魂上。","fo":"The Pokémon dissapears into a dark dimension to strike its foe at the next opportunity. The blow will hurt the target not on their body but directly into their soul.","ic":[79,114,1,190,20]},{"n":"Shadow Claw","z":"暗影爪","t":"幽靈","c":"物理","g":4,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。高要害率。","o":"Single Taget. Lethal. High Critical.","f":"寶可夢用幽靈般的爪子劃過對手的身體，撕裂的不是血肉，而是直接撕裂靈魂。","fo":"The Pokémon uses their ghostly claws to slash through their foe's body tearing not their flesh but their soul directly.","ic":[1,20,0]},{"n":"Shadow Ball","z":"暗影球","t":"幽靈","c":"特殊","g":2,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。投彈類招式。擲 1 顆機率骰，使目標的特防降低 1 點。","o":"Single Target. Projectile Move.Roll 1 Chance die to Reduce the Target's Sp. Defense by 1.","f":"暗物質與陰影被當成投射物攻擊對手，喚起對方內心最深的恐懼回憶。","fo":"Dark matter and shadows are used as a projectile against the foe, bringing out memories of their deepest fears.","ic":[1,26,4,150]},{"n":"Phantom Force","z":"潛靈奇襲","t":"幽靈","c":"物理","g":6,"p":"3","a":"力量 + 隱匿","d":"力量 + 3","e":"單體目標。蓄力招式。蓄力期間處於範圍外。致命傷害。無視目標身上生效中的任何掩護、防護招式與防護力場。","o":"Single Target. Charge Move. Out of Range while Charging. Lethal. Ignore any Cover, Shield Moves, and/or Force Fields active on the Target.","f":"寶可夢消失在黑暗的次元，連最堅不可摧的堡壘也能潛入，牠可能會在下一個行動中重新現身。","fo":"The Pokémon disappears into a dark dimension to infiltrate even the most impenetrable fortress. It may reappear during its next action.","ic":[114,1,190,20]},{"n":"Hex","z":"禍不單行","t":"幽靈","c":"特殊","g":5,"p":"2","a":"洞察 + 導引","d":"特殊+ 2 *","e":"單體目標。*若目標處於異常狀態，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. *If the Target has an active Status Condition, add 2 Extra Dice to the Damage Pool of this Move.","f":"使用者對目標施下可怕的咒術，如果目標原本就受異常狀態所苦，效果會更強。","fo":"The user casts a terrible hex over the target, the effects will be greater if the target is already burdened by an ailment.","ic":[1,49]},{"n":"Spirit Shackle","z":"縫影","t":"幽靈","c":"物理","g":7,"p":"3","a":"靈巧 + 隱匿","d":"力量 + 3","e":"單體目標。阻擋。持續整個場景。","o":"Single Target. Blocks. Whole Scene Duration.","f":"攻擊的同時，使用者偷偷把對手的影子綁在地面上，限制牠的行動，讓牠無法逃脫。","fo":"While attacking, the user sneakily binds its foe's shadow to the ground, restricting its movement and making it unable to escape.","ic":[1,16,42]},{"n":"Infernal Parade","z":"群魔亂舞","t":"幽靈","c":"特殊","g":8,"p":"*","a":"洞察 + 威嚇","d":"特殊 + 2 *","e":"單體目標。擲 2 顆機率骰，使敵人陷入灼傷 2 級。*若目標已處於異常狀態，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Roll 2 Chance Dice to Inflict 2nd Degree Burn on the Foe. *If the Target already has an active Status Condition, add 2 Extra Dice to the Damage Pool of this Move.","f":"你也許不是那種遇到怪事或奇異景象就會昏倒的人，但看到那不屬於這世間的火焰，它也會把你燒到驚慌失措。","fo":"You may not be the type to faint when things are odd or things are quaint. But seeing flames you know that ain't will scorch you into dismay.","ic":[1,196,49]},{"n":"Lick","z":"舌舔","t":"幽靈","c":"物理","g":1,"p":"1","a":"洞察 + 魅惑","d":"力量 + 1","e":"單體目標。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 3 Chance Dice to Paralyze the Target.","f":"寶可夢舔了對手一口，對手被這種令人毛骨悚然的「親暱」舉動嚇得不輕。","fo":"The Pokémon licks the foe. The foe is deeply disturbed by this creepy display of “affection”.","ic":[1,89]},{"n":"Trick-or-Treat","z":"萬聖夜","t":"幽靈","c":"變化","g":6,"p":"—","a":"意志 + 魅惑","d":"-","e":"單體目標。為目標的屬性加上幽靈屬性。（例：皮卡丘會變為「電／幽靈」，噴火龍會變為「火／飛行／幽靈」。）若目標已附加第三屬性，則取代之。","o":"Single Target Add the Ghost Type to the Target's Type. (ie. Pikachu will now be “Electric/Ghost” Charizard will now be “Fire/Flying/Ghost”) If the Target already has a third Type attached, replace it.","f":"使用者邀請對手玩「不給糖就搗蛋」，對手穿上一套幽靈服裝，除非驅魔或請寶可夢中心協助，否則脫不下來。","fo":"The user invites their foe to go trick-or-treating. The foe puts on a ghost costume that cannot be removed without an exorcism or help from the Pokémon center.","ic":[1,200]},{"n":"Curse","z":"詛咒","t":"幽靈","c":"變化","g":2,"p":"—","a":"意志 + 隱匿/威嚇","d":"-","e":"單體目標。對使用者自己擲出相當於其一半 HP 的無屬性傷害骰（無視防禦）。在詛咒解除之前，目標所有擲骰都會扣除 1 個成功。","o":"Single Target. Roll half of the User's HP as Typeless Damage Dice to itself, ignoring defenses. The Target will remove 1 success from all of their Rolls until the Curse is lifted.","f":"使用者喃喃念出邪惡的咒語，以使用者的靈魂為代價，讓悲慘降臨在對手身上。要解除詛咒，必須進行驅魔，或到寶可夢中心求助。寶可夢喃喃念著不適合小孩的話語，準備造成並承受傷害。","fo":"The user mutters an evil incantation, misery will befall into the foe at the cost of the user's soul. To get rid of the curse, perform an exorcism or get help at a Pokémon Center. The Pokémon prepares to deal and receive damage by muttering something not appropiate for kids.","ic":[1,64,8,86,151]},{"n":"Curse (Non-Ghost User)","z":"詛咒（非幽靈系的使用者）","t":"幽靈","c":"變化","g":2,"p":"—","a":"體魄 + 對抗","d":"—","e":"對自己。使用者的力量和防禦提升 1 點，靈巧降低 1 點。這個效果只會在非幽靈系的寶可夢使用這個招式時才會發動。","o":"Target Self. Increase by 1 the User's Strength and Defense. Reduce by 1 the User's Dexterity. This effect ser and their Allies.","ic":[90,207,201]},{"n":"Absorb","z":"吸取","t":"草","c":"特殊","g":1,"p":"1","a":"體魄 + 導引/自然","d":"特殊 + 1","e":"單體目標。使用者回復等同於造成傷害一半的 HP（無條件捨去）。","o":"Single Target. The User restores HP equal to half the damage dealt, rounded down.","f":"使用者從身邊找到的最近的生命來源汲取養分。","fo":"The user takes nutrients from the nearest source of life they find.","ic":[1]},{"n":"Strength Sap","z":"吸取力量","t":"草","c":"變化","g":7,"p":"-","a":"體魄 + 自然","d":"-","e":"單體目標。目標的力量降低 1 點。使用者回復 1 HP。若命中成功，花費 1 點意志點以發動。","o":"Single Target. Reduce Target's Strength by 1. Heal 1 HP to the user. If successful, spend 1 Will point to activate.","f":"寶可夢找出對手的弱點，然後吸食牠的生命能量，對手因此感到虛弱無力。","fo":"The Pokémon looks for a weak point on its foe, then feeds on its vital energy. The foe is left feeling feeble.","ic":[1,207,74]},{"n":"Leech Seed","z":"寄生種子","t":"草","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"單體目標。低命中率 1。花費 1 點意志點以發動。每個戰鬥輪結束時，對目標擲 2 顆無屬性傷害骰。無視防禦。使用者每造成 1 點此類傷害，回復 1 HP。草屬性寶可夢免疫此效果。","o":"Single Target. Low Accuracy 1. Spend 1 Will point to activate. At the end of the Round, Roll 2 Dice of Typeless Damage against the target. Ignore defenses. The User heals 1 HP for every damage dealt this way. Grass-Type Pokémon are immune to this Effect.","f":"對手被種子的幼苗寄生，幼苗在牠身上紮根。隨著幼苗成長，會吸收對手的生命能量並送回給使用者。","fo":"The foe is infected with seed saplings taking root on their body. As the saplings grow, they'll absorb the vital energy of the foe and send it back to the user.","ic":[1,23,207]},{"n":"Needle Arm","z":"尖刺臂","t":"草","c":"物理","g":3,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢猛烈地向對手揮舞手臂，那些手臂長出了像針一樣會刺人的尖刺。","fo":"The Pokémon flails their arms with violence against the foe, the arms have grown thorns that sting like needles.","ic":[1,43]},{"n":"Spiky Shield","z":"尖刺防守","t":"草","c":"變化","g":6,"p":"—","a":"體魄 + 鬥毆","d":"-","e":"目標：使用者。先制反應 3。護盾招式。此寶可夢受到傷害性招式時，減少 3 點傷害。若敵人使用了非遠程物理招式。對其擲 2 顆無屬性傷害骰，無視防禦。","o":"Target
