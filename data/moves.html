<script>
function dataTable(cfg){
 var tb=document.querySelector(cfg.tb),q=document.getElementById(cfg.q),cnt=document.getElementById(cfg.cnt),extra=cfg.filters||[],clear=document.getElementById(cfg.clear);
 var rows=[].slice.call(tb.rows),base=rows.slice();
 var exm=location.search.match(/[?&]n=([^&]+)/),ex=exm?decodeURIComponent(exm[1]).toLowerCase():'';
 if(exm)q.value=decodeURIComponent(exm[1]);
 function run(){var s=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean),n=0;
  rows.forEach(function(tr){var ok=(!ex||tr.dataset.n===ex)&&extra.every(function(f){var el=document.getElementById(f.id);return !el.value||tr.dataset[f.k]===el.value})&&s.every(function(w){return tr.dataset.s.indexOf(w)>-1});tr.hidden=!ok;if(ok)n++});
  cnt.textContent=n+' / '+rows.length+' 筆';
  clear.hidden=!(q.value||extra.some(function(f){return document.getElementById(f.id).value}));
  document.getElementById(cfg.none).hidden=n>0}
 var timer;q.addEventListener('input',function(){ex='';clearTimeout(timer);timer=setTimeout(run,120)});
 extra.forEach(function(f){document.getElementById(f.id).addEventListener('input',function(){ex='';run()})});
 clear.addEventListener('click',function(){ex='';q.value='';extra.forEach(function(f){document.getElementById(f.id).value=''});if(location.search)history.replaceState(null,'',location.pathname);run();q.focus()});
 run();
 // 排序：點表頭或用下拉選單（手機版沒有表頭，下拉選單才能排序）
 var state={k:null,dir:1},ths=[].slice.call(document.querySelectorAll(cfg.tb.replace(' tbody','')+' th[data-k]')),ssel=cfg.sort?document.getElementById(cfg.sort):null;
 function applySort(){
  ths.forEach(function(t){t.classList.remove('asc','desc');if(state.k&&t.dataset.k===state.k)t.classList.add(state.dir>0?'asc':'desc')});
  if(ssel)ssel.value=state.k?state.k+':'+state.dir:'';
  var list=base.slice(),k=state.k,d=state.dir;
  if(k)list.sort(function(a,b){var x=a.dataset[k]||'',y=b.dataset[k]||'',nx=parseFloat(x),ny=parseFloat(y);
   if(k==='g'){nx=nx||NaN;ny=ny||NaN}
   if(!isNaN(nx)||!isNaN(ny)){if(isNaN(nx))return isNaN(ny)?0:1;if(isNaN(ny))return -1;return (nx-ny)*d}
   return x.localeCompare(y,'zh-Hant')*d});
  var fr=document.createDocumentFragment();list.forEach(function(r){fr.appendChild(r)});tb.appendChild(fr);
  if(clear)clear.hidden=!(q.value||state.k||extra.some(function(f){return document.getElementById(f.id).value}))}
 ths.forEach(function(th){
  th.tabIndex=0;th.setAttribute('role','button');th.title='點一下排序';
  function go(){var k=th.dataset.k;var first=k==='p'?-1:1;
   if(state.k===k){if(state.dir===first)state.dir=-first;else state.k=null}else{state.k=k;state.dir=first}
   applySort()}
  th.addEventListener('click',go);th.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
 if(ssel)ssel.addEventListener('input',function(){var v=ssel.value.split(':');state.k=v[0]||null;state.dir=+v[1]||1;applySort()});
 clear.addEventListener('click',function(){state.k=null;applySort()});
 // 從全站搜尋帶錨點進來：捲到該列並標示
 if(location.hash){var el=document.querySelector(location.hash);if(el){el.classList.add('hl');el.scrollIntoView({block:'center'})}}
}
</script>

色","t":"一般","c":"變化","g":3,"p":"—","a":"聰明 + 自然/隱匿","d":"-","e":"在場景剩餘時間內，使用者的屬性變為與其所處地形／環境相符的屬性（例：在岩石洞窟中變為岩石屬性）。","o":"For the rest of the scene the User changes type to one that fits the terrain/environment it is in (i.e. User is in a rocky cave, becoming rock type)"},{"n":"Slack Off","z":"偷懶","t":"一般","c":"變化","g":3,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate."},{"n":"Bestow","z":"傳遞禮物","t":"一般","c":"變化","g":5,"p":"—","a":"帥氣 + 禮儀","d":"-","e":"單體目標。若目標沒有持有道具，無法使用。使用者將自己的攜帶道具交給目標。","o":"Single Target. Can't be used if Target is not holding an Item. The User gives its Held Item to the Target."},{"n":"Encore","z":"再來一次","t":"一般","c":"變化","g":2,"p":"—","a":"帥氣 + 魅惑/禮儀","d":"-","e":"單體目標。先制反應 3。目標會重複上一個戰鬥輪的完全相同的行動順序。目標必須曾有過行動順序。持續 1 個戰鬥輪。若上一個戰鬥輪使用過，此招式失敗。詳見原書第 529 頁。","o":"Single Target. Reaction 3. The Target will repeat the exact same action sequence it had last Round. Target must have had an action sequence. Duration 1 Round. If used on the previous Round, this Move fails. See more on p. 529"},{"n":"Pain Split","z":"分擔痛楚","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。花費 1 點意志點以發動。*對目標造成最多 3 點無屬性傷害，每造成 1 點傷害，使用者回復 1 HP。若使用者的 HP 高於一半（無條件捨去），此招式失敗。此招式無法使目標降到 1 HP 以下。","o":"Single Target. Spend 1 Will Point to activate. *Deal up to 3 Typeless Damage to the Target, Heal 1 HP to the User for every Damage dealt this way. This Move Fails if the User has more than Half HP rounded down. This Move cannot reduce a Target to less than 1 HP."},{"n":"Judgment","z":"制裁光礫","t":"一般","c":"特殊","g":4,"p":"*","a":"洞察 + 威嚇","d":"特殊 + *","e":"單體目標。專用。無視防禦。此招式的屬性、威力與其他額外效果由說書人決定。若有任何事物會使此招式無法造成傷害，一律無視。此招式無法被對抗。","o":"Single Target. Unique. Ignore Defenses. This Move's Type, Power and extra Added Effects are decided by the Storyteller. If something would prevent this Move from dealing Damage, ignore it. This Move can't be Clashed."},{"n":"Screech","z":"刺耳聲","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 表演","d":"-","e":"單體目標。聲音類招式。目標的防禦降低 2 點。","o":"Single Target. Sound Move. Reduce the Target's Defense by 2."},{"n":"Slash","z":"劈開","t":"一般","c":"物理","g":1,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。高要害率。切割類招式。","o":"Single Target. Lethal. High Critical. Cutter Move."},{"n":"Swords Dance","z":"劍舞","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 表演","d":"-","e":"目標：使用者。使用者的力量提升 2 點。","o":"Target Self. Increase the User's Strength by 2."},{"n":"Power Shift","z":"力量轉換","t":"一般","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"目標：使用者。將使用者的力量與防禦對調，特殊與特防對調。","o":"Target Self. Switch the User's Strength with its Defense and its Special with its Sp. Defense."},{"n":"Relic Song","z":"古老之歌","t":"一般","c":"特殊","g":5,"p":"2","a":"特殊 + 表演","d":"特殊 + 2","e":"目標：範圍內所有敵人。聲音類招式。專用。擲 1 顆機率骰，使敵人陷入睡眠。若成功，使用者之後可選擇改變其形態。","o":"Target All Foes in Range. Sound Move. Unique. Roll 1 Chance Die to put the foe to Sleep. If successful, the User may choose to change its form afterwards."},{"n":"Growl","z":"叫聲","t":"一般","c":"變化","g":1,"p":"—","a":"強壯/可愛 + 威嚇","d":"-","e":"目標：範圍內所有敵人。聲音類招式。力量降低 1 點。","o":"Target All Foes in Range. Sound Move. Reduce by 1 the Strength of those affected."},{"n":"Swallow","z":"吞下","t":"一般","c":"變化","g":3,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。使用者必須先前用過招式「蓄力」，否則此招式失敗。強效治療。若成功，花費 1 點意志點以發動。使用者的防禦與特防降低 1 點。","o":"Target Self. The user must have previously used the Move “Stockpile”, otherwise this Move will fail. Complete Heal, if successful, spend 1 Will point activate. Reduce by 1 User's Defense an Sp. Defense."},{"n":"Uproar","z":"吵鬧","t":"一般","c":"特殊","g":3,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"目標：隨機敵人。聲音類招式。","o":"Target Random foe. Sound Move."},{"n":"Whirlwind","z":"吹飛","t":"一般","c":"變化","g":1,"p":"—","a":"靈巧/特殊 + 自然","d":"-","e":"單體目標。後制反應 6。風類招式。敵方替換招式。","o":"Single Target. Late Reaction 6. Wind Move. Switcher Move for the Foe."},{"n":"Roar","z":"吼叫","t":"一般","c":"變化","g":1,"p":"—","a":"力量 + 威嚇","d":"-","e":"單體目標。後制反應 6。敵方替換招式。","o":"Single Target. Late Reaction 6. Switcher Move for the Foe."},{"n":"Play Nice","z":"和睦相處","t":"一般","c":"變化","g":6,"p":"—","a":"帥氣/可愛 + 禮儀","d":"-","e":"單體目標。目標的力量降低 1 點。","o":"Single Target. Reduce the Target's Strength by 1."},{"n":"Yawn","z":"哈欠","t":"一般","c":"變化","g":3,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。 *若目標在下一個戰鬥輪開始時仍未離開戰鬥，使其陷入睡眠。 *","o":"Single Target. *If the Target has not been removed from battle at the beginning of the next Round, put it to Sleep. *"},{"n":"Sing","z":"唱歌","t":"一般","c":"變化","g":1,"p":"—","a":"可愛/美麗 + 表演","d":"-","e":"單體目標。低命中率 3。聲音類招式。使目標陷入睡眠。","o":"Single Target. Low Accuracy 3. Sound Move. Put the Target to sleep."},{"n":"Milk Drink","z":"喝牛奶","t":"一般","c":"變化","g":2,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate."},{"n":"Simple Beam","z":"單純光束","t":"一般","c":"變化","g":5,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將目標的特性改為「單純」，持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Change the Target's Ability to “Simple” Whole Scene Duration. This effect does not end by switching out the affected Pokémon."},{"n":"Spit Up","z":"噴出","t":"一般","c":"特殊","g":3,"p":"4","a":"靈巧 + 導引","d":"特殊 + 4","e":"單體目標。使用者必須先前用過招式「蓄力」，否則此招式失敗。使用者的防禦、特防降低 1 點。","o":"Single Target. The user must have previously used the Move “Stockpile”, otherwise this Move will fail. Reduce by 1 the User's Defense and Sp. Defense."},{"n":"Recycle","z":"回收利用","t":"一般","c":"變化","g":3,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。寶可夢重新使用一個已在戰鬥中、任一側戰場上被用掉的道具（樹果、傷藥、萬能藥等）。回收利用每場戰鬥中，使用者最多只能使用 3 次。","o":"Target Self. The Pokémon reuses an Item (Berries, Potions, Full Heal, etc.) that has already been spent during the battle on any side of the battlefield. Recycle can't be used more than 3 times per battle by the User."},{"n":"Retaliate","z":"報仇","t":"一般","c":"物理","g":5,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若有隊友在本戰鬥輪或上一戰鬥輪昏厥，傷害骰池額外增加等同於使用者忠誠度的骰數。最多可用此方式增加 5 顆骰。此效果對每名昏厥的隊友只會發動一次。","o":"Single Target. *If an Ally fainted during this or the previous Round, add Extra Dice to the Damage pool. equal to the user's Loyalty. Up to 5 dice may be added this way. This effect only activates once per fainted Ally."},{"n":"Return","z":"報恩","t":"一般","c":"物理","g":2,"p":"1","a":"洞察 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*每有 1 點使用者的幸福度，此招式的傷害骰池額外增加 1 顆骰，最多可用此方式增加 5 顆。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every point of Happiness on the User, Up to 5 Dice may be added this way."},{"n":"Multi-Attack","z":"多屬性攻擊","t":"一般","c":"物理","g":7,"p":"5","a":"靈巧 + 鬥毆","d":"力量 + 5","e":"單體目標。專用。此招式的屬性會變得與使用者的主屬性相同。","o":"Single Target. Unique. This Move's type will change to match the User's Main Type."},{"n":"Sleep Talk","z":"夢話","t":"一般","c":"變化","g":2,"p":"—","a":"依情況而定","d":"依情況而定","e":"若使用者沒有睡著，此招式失敗。使用者可以選擇改用「說夢話」，取代擲骰嘗試醒來。隨機選擇使用者招式庫中的一個招式，並以其攻擊隨機敵人。「說夢話」每戰鬥輪最多可重複使用 5 次。","o":"If the user is not asleep, this Move fails. Instead of making a roll to try to wake up, the user may choose to use Sleep Talk instead. Choose a Move on the user's Move set at random and Target Random foe with it. Sleep Talk can be repeated up to 5 times per Round."},{"n":"Terrain Pulse","z":"大地波動","t":"一般","c":"特殊","g":8,"p":"*","a":"特殊 + 自然","d":"特殊 + 2 *","e":"單體目標。*若戰場上有生效中的場地，傷害骰池額外增加 2 顆骰。將此招式的屬性改為與目前生效中的場地相符（例：電氣場地、青草場地等）。","o":"Single Target. *Add 2 Extra Dice to the Damage Pool if there is a Terrain active in the Battlefield. Change this Move's Type to match that of a currently active Terrain (i.e. Electric Terrain, Grassy Terrain etc.)."},{"n":"Stuff Cheeks","z":"大快朵頤","t":"一般","c":"變化","g":8,"p":"-","a":"聰明 + 自然","d":"-","e":"目標：使用者。若使用者持有樹果，會獲得其效果，之後使用者的防禦提升 2 點。所持有的樹果仍可正常使用。","o":"Target Self. If the user has a held Berry, it gains its effects, afterwards, Increase user's Defense by 2. The Held berry can still be used as normal."},{"n":"Tidy Up","z":"大掃除","t":"一般","c":"變化","g":9,"p":"-","a":"可愛 + 禮儀","d":"-","e":"目標：整個戰場。移除所有生效中的替身／斷尾替身與入場危害（例：黏黏網、撒菱、毒菱等）。使用者的力量、靈巧提升 1 點。","o":"Target Battlefield. Remove all active Substitute/Shed Tail Decoys and Entry Hazards (ie. Sticky Web, Spikes, Toxic Spikes etc.). Increase User's Strength and Dexterity by 1."},{"n":"Explosion","z":"大爆炸","t":"一般","c":"物理","g":1,"p":"10","a":"力量 + 導引","d":"力量 + 10","e":"範圍招式。遠程。致命傷害。使用者昏厥。","o":"Area Move. Ranged. Lethal. The User Faints."},{"n":"Glare","z":"大蛇瞪眼","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 威嚇","d":"-","e":"單體目標。低命中率 1。使目標陷入麻痺。","o":"Single Target. Low Accuracy 1. Paralyze the Target."},{"n":"Thrash","z":"大鬧一番","t":"一般","c":"物理","g":1,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"目標：隨機敵人。狂暴。","o":"Target Random Foe. Rampage."},{"n":"Tera Blast","z":"太晶爆發","t":"一般","c":"物理","g":9,"p":"3","a":"力量/特殊 + 導引","d":"力量/特殊 + 3","e":"單體目標。*若使用者處於太晶化狀態，此招式的屬性變為其太晶屬性。這會影響弱點、抗性與屬性一致加成。","o":"Single Target. *If the User is actively Terastallized, the Type of this Move changes to match that of the Tera-Type. This affects Weaknesses. Resistances and STAB accordingly."},{"n":"Vise Grip","z":"夾住","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。致命傷害。","o":"Single Target. Lethal."},{"n":"Protect","z":"守住","t":"一般","c":"變化","g":2,"p":"—","a":"意志 + 警覺","d":"-","e":"目標：使用者。先制反應 5。護盾招式。此寶可夢受到的物理或特殊招式傷害減少 3 點。無效化以使用者為目標的招式的額外效果。","o":"Target Self. Reaction 5. Shield Move. Reduce 3 Damage This Pokémon would receive from a Physical or Special Move. Negate the Added Effects of Moves that target the user."},{"n":"Disable","z":"定身法","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使目標最後使用的招式被封印。同時只能封印一個招式。","o":"Single Target. Disable the last Move performed by the Target. Only one Move may be Disabled at a time."},{"n":"Confide","z":"密語","t":"一般","c":"變化","g":6,"p":"—","a":"可愛 + 魅惑","d":"-","e":"單體目標。目標的特殊降低 1 點。","o":"Single Target. Reduce the Target's Special by 1."},{"n":"Sketch","z":"寫生","t":"一般","c":"變化","g":2,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。複製招式。將「寫生」替換為被複製的招式。永久持續。","o":"Single Target. Copy Move. Replace “Sketch” with the copied Move. Permanent Duration."},{"n":"Spike Cannon","z":"尖刺加農炮","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。遠程。連續行動。投彈類招式。","o":"Single Target. Ranged. Succesive Actions. Projectile Move."},{"n":"Cut","z":"居合斬","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。致命傷害。切割類招式。","o":"Single Target. Lethal. Cutter Move."},{"n":"Hyper Voice","z":"巨聲","t":"一般","c":"特殊","g":3,"p":"3","a":"洞察 + 導引/ 表演","d":"特殊 + 3","e":"目標：範圍內所有敵人。聲音類招式。","o":"Target All Foes in Range. Sound Move."},{"n":"Helping Hand","z":"幫助","t":"一般","c":"變化","g":3,"p":"—","a":"帥氣 + 警覺","d":"-","e":"目標：一名隊友。先制反應 5。目標在下一次技能檢定／命中擲骰時額外獲得 2 顆骰，在下一次傷害擲骰時額外獲得 2 顆骰。此效果不可疊加。","o":"Target One Ally. Reaction 5. The Target Gets 2 Extra Dice on their next Skill Check/Accuracy Roll, and 2 Extra Dice on their next Damage Roll. This Effect does not Stack."},{"n":"Lucky Chant","z":"幸運咒語","t":"一般","c":"變化","g":4,"p":"—","a":"特殊 + 表演","d":"-","e":"目標：使用者與範圍內的隊友。專用。目標可以對其所有擲骰中重擲一顆失敗的骰子。擊中要害不會對目標帶來額外骰加成。持續整個場景。戰鬥外會發生什麼好事，由說書人裁定。","o":"Target User and Allies in Range. Unique. Targets can Re-roll one un-successful die from all their rolls. Critical Hits do not grant Bonus dice against the Targets. Whole Scene Duration. Out of battle, good things happen at Storyteller's Discretion."},{"n":"Hyper Drill","z":"強力鑽","t":"一般","c":"物理","g":9,"p":"4","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。無視敵方或其場地上生效中的護盾招式。","o":"Single Target. Lethal. Ignore Shield Moves active on the Foe or their side of the field."},{"n":"Double Team","z":"影子分身","t":"一般","c":"變化","g":1,"p":"—","a":"靈巧 + 閃避","d":"-","e":"目標：使用者。使用者現在每個戰鬥輪最多可以閃避 5 次。","o":"Target Self. The User can now make up to 5 Evasions per Round."},{"n":"Revival Blessing","z":"復生祈禱","t":"一般","c":"變化","g":9,"p":"—","a":"意志","d":"-","e":"目標：一名隊友。使用者必須花光所有剩餘的意志點；若使用者沒有剩餘的意志點，此招式失敗。使一名昏厥的隊友恢復意識並回復 2 HP。若沒有昏厥的隊友，此招式失敗。該隊友不必處於戰鬥中。","o":"Target One Ally. The User must spend all of their remaining Will points, if the User has no remaining Will points this Move fails. Restore conciousness and 2 HP to a fainted ally. If no Ally is fainted this Move fails. The ally does not need to be active in combat."},{"n":"Mind Reader","z":"心之眼","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使用者在下一次對目標的命中或閃避擲骰中，擁有 2 個自動且無法被移除的成功。","o":"Single Target. The User has 2 automatic and unremovable successes on the next Accuracy or Evasion Roll against the Target."},{"n":"Hyper Fang","z":"必殺門牙","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。啃咬類招式。擲 1 顆機率骰，使目標畏縮。","o":"Single Target. Bite Move. Roll 1 Chance die to Flinch the Target."},{"n":"Bide","z":"忍耐","t":"一般","c":"物理","g":1,"p":"","a":"體魄 + 鬥毆","d":"依情況而定","e":"單體目標。使用者不會對接下來 2 個以其為目標的物理或特殊招式進行閃避或對抗。在對使用者造成的所有傷害結算後，擲出目標所受傷害總和兩倍的一般屬性傷害骰。無視防禦。使用者忍受著攻擊，等待反擊的完美時機。","o":"Single Target. The User will not Evade or Clash the next 2 Physical or Special Moves targeting it. Once all damage has been dealt against the User, roll a number of Normal- Type Damage dice equal to twice the total of Damage the Target received. Ignore Defenses. The user puts up with being hit, waiting for the perfect opportunity to retaliate."},{"n":"Raging Bull","z":"怒牛","t":"一般","c":"物理","g":9,"p":"3","a":"洞察 + 威嚇","d":"力量 + 3","e":"單體目標。*此招式的屬性變為使用者的第二屬性；若沒有，則為其主屬性。這會相應影響弱點、抗性與屬性一致加成。","o":"Single Target. *The Type of this Move becomes the same as the User's Secondary Type if possible, otherwise their Main Type. This affects Weakness, Resistances, and STAB accordingly."},{"n":"Strength","z":"怪力","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。","o":"Single Target."},{"n":"After You","z":"您先請","t":"一般","c":"變化","g":5,"p":"—","a":"帥氣 + 禮儀","d":"-","e":"目標：一名隊友。先制反應 1。目標將排在先攻順序的第一位。若再次使用，前一個目標恢復其原本的先攻順序。持續整個場景。","o":"Target One Ally. Reaction 1. The Target will go First in the Initiative Order. If used again, the previous target reverts to their original Initiative order. Whole Scene Duration."},{"n":"Lovely Kiss","z":"惡魔之吻","t":"一般","c":"變化","g":1,"p":"—","a":"缺少的美麗點數","d":"-","e":"單體目標。使目標陷入睡眠。擁有此招式的寶可夢可以完全放棄其美麗值。若寶可夢忘記此招式，恢復 1 點美麗值。","o":"Single Target. Put the Target to Sleep. Pokémon with this Move may forfeit their Beauty score completely. If the Pokémon forgets this Move, restore 1 Point to their Beauty Score."},{"n":"Rage","z":"憤怒","t":"一般","c":"物理","g":1,"p":"1","a":"洞察 + 鬥毆/ 威嚇","d":"力量 + 1","e":"單體目標。若敵人在使用此招式後的同一戰鬥輪內以物理或特殊招式傷害使用者，使用者的力量提升 1 點。此效果最多可疊加 3 次。","o":"Single Target. If a foe damages the User with a Physical or Special Move in the same round after using this Move, Increase the User's Strength by 1. This effect can stack up to 3 Times."},{"n":"Super Fang","z":"憤怒門牙","t":"一般","c":"物理","g":1,"p":"","a":"力量/ 靈巧 + 鬥毆","d":"依情況而定","e":"單體目標。低命中率 1。啃咬類招式。擲一般屬性傷害骰，數量等同於目標剩餘 HP 的一半。最多可擲 10 顆骰。無視防禦。","o":"Single Target. Low Accuracy 1. Bite Move. Roll Normal-Type Damage Dice tequal to Half of the Target's remaining HP. Up to 10 Dice may be rolled this way. Ignore Defenses."},{"n":"Noble Roar","z":"戰吼","t":"一般","c":"變化","g":6,"p":"—","a":"強壯 + 禮儀/威嚇","d":"-","e":"單體目標。聲音類招式。目標的力量、特殊降低 1 點。","o":"Single Target. Sound Move. Reduce by 1 the Target's Strength and Special."},{"n":"Snore","z":"打鼾","t":"一般","c":"特殊","g":2,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。聲音類招式。擲 3 顆機率骰，使目標畏縮。若使用者沒有睡著，此招式失敗。","o":"Single Target. Sound Move. Roll 3 Chance Dice to Flinch the Target. If the User is not asleep this Move fails."},{"n":"Entrainment","z":"找夥伴","t":"一般","c":"變化","g":5,"p":"—","a":"帥氣/聰明 + 運動","d":"-","e":"單體目標。將目標的特性替換為使用者的特性。專屬特性無法被傳遞或替換。持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Replace the Target's Ability with the User's. Unique Abilities can't be passed or replaced. Whole Scene Duration. This effect does not end by switching out the affected Pokémon."},{"n":"Scratch","z":"抓","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target."},{"n":"Flail","z":"抓狂","t":"一般","c":"物理","g":2,"p":"1","a":"體魄 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*使用者每缺少 1 點 HP，此招式的傷害骰池就額外增加 1 顆骰。最多可用此方式增加 5 顆骰。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every missing Point of HP the user has. Up to 5 Dice may be added this way."},{"n":"Barrage","z":"投球","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。低命中率 1。遠程。連續行動。投彈類招式。","o":"Single Target. Low Accuracy 1. Ranged. Successive Actions. Projectile Move."},{"n":"Pound","z":"拍擊","t":"一般","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target."},{"n":"Endure","z":"挺住","t":"一般","c":"變化","g":2,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。先制反應 5。護盾招式。若物理或特殊招式會使使用者昏厥，改為剩下 1 HP，此後移除此效果。此效果會在使用者的下一個回合重新啟動。持續整個戰鬥輪。","o":"Target Self. Reaction 5. Shield Move. If a Physical or Special Move would cause the user to faint, they remain at 1 HP instead, remove this effect afterwards. The effect re-activates on the user's next Turn. Whole Round duration."},{"n":"Crush Grip","z":"捏碎","t":"一般","c":"物理","g":4,"p":"*","a":"力量 + 鬥毆","d":"力量 + 1 *","e":"單體目標。致命傷害。專用。*若敵人的 HP 高於 4，每超出 1 點，傷害骰池就額外增加 1 顆骰。最多可用此方式增加 9 顆骰。","o":"Single Target. Lethal. Unique. *If the foe has an HP higher than 4, add 1 Extra Die to the Damage pool for every exceeding point. Up to 9 Dice may be added this way."},{"n":"Double-Edge","z":"捨身衝撞","t":"一般","c":"物理","g":1,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。反作用傷害。","o":"Single Target. Recoil."},{"n":"Tail Slap","z":"掃尾拍打","t":"一般","c":"物理","g":5,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。連續行動。","o":"Single Target. Low Accuracy 1. Successive Actions."},{"n":"Baton Pass","z":"接棒","t":"一般","c":"變化","g":2,"p":"—","a":"靈巧 + 運動","d":"-","e":"目標：使用者。使用者方替換招式。使用者身上的任何能力值提升會傳給下一隻寶可夢。使用者在場景結束前，或被換上場的寶可夢昏厥前，無法再次提升自己的能力值。","o":"Target Self. Switcher Move for the User. Any Attribute increase on the user is passed on the next Pokémon. The user can't increase its own Attributes again until the end of the scene or until the switched Pokémon faints."},{"n":"Doodle","z":"描繪","t":"一般","c":"變化","g":9,"p":"—","a":"聰明 + 隱匿","d":"-","e":"單體目標。用目標的特性取代使用者的特性。持續整個場景。","o":"Single Target. Replace the User's Ability with the Target's. Whole Scene Duration."},{"n":"Court Change","z":"換場","t":"一般","c":"變化","g":8,"p":"-","a":"聰明 + 禮儀","d":"-","e":"目標：整個戰場。與使用者一側交換敵方場地上的防護力場、入場危害與效果（例：順風、青草場地的回復、火之誓約等）。","o":"Target Battlefield. Swap any Force Fields, Entry Hazards and Effects on the Foe's side of the field (i.e. Tailwind, Grassy Terrain healing, Fire Pledge etc.) for those on the User's side."},{"n":"Metronome","z":"揮指","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 表演","d":"依情況而定","e":"單體目標。複製招式。擲一顆骰決定物理或特殊類別，再擲一顆骰決定此招式的威力。此招式的外觀、屬性與額外效果，由說書人裁定，變得與同威力的某個物理或特殊招式相同。","o":"Single Target. Copy Move. Roll a die to determine Physical or Special category, roll a die to determine this Move's Power. The appearance, Type and added effects of this Move become the same of a Physical or Special Move of the same Power at Storyteller's Discretion,"},{"n":"Tickle","z":"搔癢","t":"一般","c":"變化","g":3,"p":"—","a":"可愛 + 鬥毆","d":"-","e":"單體目標。目標的力量、防禦降低 1 點。","o":"Single Target. Reduce by 1 the Target's Strength and Defense."},{"n":"Tail Whip","z":"搖尾巴","t":"一般","c":"變化","g":1,"p":"—","a":"可愛 + 表演","d":"-","e":"目標：範圍內所有敵人。防禦降低 1 點。","o":"Target All foes in Range. Reduce by 1 the Defense of those affected."},{"n":"Teeter Dance","z":"搖晃舞","t":"一般","c":"變化","g":3,"p":"—","a":"靈巧/洞察 + 表演","d":"-","e":"範圍招式。使受影響者陷入混亂。","o":"Area Move. Confuse those affected."},{"n":"Me First","z":"搶先一步","t":"一般","c":"變化","g":4,"p":"1","a":"洞察 + 運動","d":"與被複製的招式相同 + 1","e":"單體目標。優先度。複製招式。變化招式無法被複製。專用招式無法被複製。你可以為被複製的招式另選目標。","o":"Single Target. Priority. Copy Move. Support Moves can't be copied. Unique Moves can't be copied. You may choose another Target(s) for the copied Move."},{"n":"Slam","z":"摔打","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。","o":"Single Target. Low Accuracy 1."},{"n":"Crush Claw","z":"撕裂爪","t":"一般","c":"物理","g":3,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 5 顆機率骰，目標的防禦降低 2 點。","o":"Single Target. Roll 5 Chance Dice to Reduce the Target's Defense by 2."},{"n":"Tackle","z":"撞擊","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧 / 力量 + 運動","d":"力量 + 2","e":"單體目標。","o":"Single Target."},{"n":"Fake Out","z":"擊掌奇襲","t":"一般","c":"物理","g":3,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。先制反應 1。使目標畏縮。此招式只能在使用者上場後的第一個戰鬥輪使用。從第二個戰鬥輪起，此招式會自動失敗。","o":"Single Target. Reaction 1. Flinch the Target. This Move will only work on the First Round the User is out in battle. From the second round on, it will fail automatically"},{"n":"Block","z":"擋路","t":"一般","c":"變化","g":3,"p":"—","a":"力量/靈巧 + 鬥毆","d":"-","e":"單體目標。阻擋。持續整個場景。","o":"Single Target. Blocks. Whole Scene Duration."},{"n":"Rock Climb","z":"攀岩","t":"一般","c":"物理","g":4,"p":"3","a":"力量 + 運動","d":"力量 + 3","e":"單體目標。低命中率 2。擲 2 顆機率骰，使目標陷入混亂。","o":"Single Target. Low Accuracy 2. Roll 2 Chance Dice to Confuse the Target."},{"n":"Shed Tail","z":"斷尾","t":"一般","c":"變化","g":9,"p":"—","a":"靈巧 + 隱匿","d":"-","e":"目標：使用者。使用者方替換招式。對使用者造成 2 點傷害。放置一個 2 HP、防禦與使用者相同的替身。詳見原書第 531 頁。","o":"Target Self. Switcher Move for the User. Deal 2 Damage to the User. Put a Substitute Decoy with 2HP and the same defenses as the user. See p. 531"},{"n":"Guillotine","z":"斷頭鉗","t":"一般","c":"物理","g":1,"p":"","a":"力量 + 鬥毆","d":"-","e":"單體目標。低命中率 5。對目標造成等同於其剩餘 HP 的傷害，再加上 1 點致命傷害。","o":"Single Target. Low Accuracy 5. Deal Damage equal to the Target's Remaining HP, plus 1 Lethal Damage."},{"n":"Razor Wind","z":"旋風刀","t":"一般","c":"特殊","g":1,"p":"5","a":"靈巧 + 導引","d":"特殊 + 5","e":"目標：範圍內所有敵人。蓄力招式。高要害率。切割類招式。","o":"Target All Foes in Range. Charge Move. High Critical. Cutter Move."},{"n":"Morning Sun","z":"晨光","t":"一般","c":"變化","g":2,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。若為大晴天，此招式變為強效治療。若在下雨、沙暴、冰雹或下雪天氣下使用，此招式為定額治療，只回復 1 HP。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate. If Sunny Weather is in effect, this Move becomes a Complete Heal. If performed under Rain, Sandstorm, Hail or Snowy Weather, this Move is a Minor heal and only heals 1 HP."},{"n":"Tera Starstorm","z":"晶光星群","t":"一般","c":"物理","g":9,"p":"5","a":"力量/特殊 + 導引","d":"力量/特殊 + 3","e":"目標：範圍內所有敵人。專用招式。*若使用者處於太晶化狀態，此招式的屬性變為其太晶屬性。這會影響弱點、抗性與屬性一致加成。隨機改變受影響者的屬性。","o":"Target All Foes in Range. Unique Move. *If the User is actively Terastallized, the Type of this Move changes to match that of the Tera-Type. This affects Weaknesses. Resistances and STAB accordingly. Change the type of those affected at random."},{"n":"Substitute","z":"替身","t":"一般","c":"變化","g":1,"p":"—","a":"體魄 + 隱匿","d":"-","e":"目標：使用者。對使用者造成 2 點傷害。放置一個 2 HP、防禦與使用者相同的替身。詳見原書第 531 頁。","o":"Target Self. Deal 2 Damage to the User. Put a Substitute Decoy with 2HP and the same defenses as the user. See p. 531"},{"n":"Mimic","z":"模仿","t":"一般","c":"變化","g":1,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。複製招式。將「模仿」替換為被複製的招式。持續整個場景。","o":"Single Target. Copy Move. Replace “Mimic” with the copied Move. Whole Scene Duration."},{"n":"Odor Sleuth","z":"氣味偵測","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 警覺","d":"-","e":"單體目標。敵人無法閃避使用者使用的招式。使用者可無視幽靈屬性對一般與格鬥屬性招式的免疫，反之亦然。戰鬥之外，此招式的成功數可加到任何追蹤目標的擲骰上。","o":"Single Target. The Foe cannot Evade Moves performed by the User. User Ignores Ghost Type immunity to Normal and Fight Type Moves and vice versa. Out of battle, Add successes of this Move to any roll for Tracking targets."},{"n":"Weather Ball","z":"氣象球","t":"一般","c":"特殊","g":3,"p":"2","a":"特殊 + 自然","d":"特殊 + 2 *","e":"單體目標。投彈類招式。*若場上有天氣狀態，傷害骰池額外增加 2 顆骰。此招式的屬性會依天氣而改變。晴天／火、下雨／水、冰雹或下雪／冰、沙暴／岩石、強風／飛行。","o":"Single Target. Projectile Move. *If there is a weather condi- tion on the field, add 2 Extra Dice to the Dam- age Pool. This Move's type will change accord- ing to the Weather. Sun/Fire, Rain/Water, Hail or Snow/Ice, Sand/Rock, Wind/Flying."},{"n":"Heal Bell","z":"治癒鈴聲","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 表演","d":"-","e":"目標：使用者與範圍內的隊友。聲音類招式。治癒目標身上的任何異常狀態。","o":"Target User and Allies in Range. Sound Move. Cure any Status Ailment on the Targets."},{"n":"Body Slam","z":"泰山壓頂","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Roll 3 Chance Dice to Paralyze the Target."},{"n":"Tearful Look","z":"淚眼汪汪","t":"一般","c":"變化","g":7,"p":"-","a":"可愛 + 魅惑","d":"-","e":"單體目標。目標的力量、特殊降低 1 點。","o":"Single Target. Reduce by 1 the Target's Strength and Special."},{"n":"Smelling Salts","z":"清醒","t":"一般","c":"物理","g":3,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若目標處於麻痺狀態，此招式的傷害骰池額外增加 2 顆骰。造成傷害後，治癒目標的麻痺。","o":"Single Target. *If the Target is Paralyzed, add 2 Extra Dice to the Damage pool of this Move. After deal- ing damage, cure the Target's Paralysis."},{"n":"Covet","z":"渴望","t":"一般","c":"物理","g":3,"p":"2","a":"靈巧 + 隱匿","d":"力量 + 2","e":"單體目標。使用者奪走目標的攜帶道具。若使用者已持有攜帶道具，此效果失敗。","o":"Single Target. The User steals the Target's Held Item. If the User already has a Held Item, this effect fails."},{"n":"Perish Song","z":"滅亡之歌","t":"一般","c":"變化","g":2,"p":"—","a":"美麗 + 表演","d":"-","e":"範圍招式。聲音類招式。使用此招式三個戰鬥輪後，對受影響者造成等同於其剩餘 HP 的傷害。從戰鬥中退場可避免此效果。","o":"Area Move. Sound Move. Three Rounds after this Move is used, deal damage to those affected equal to their remaining HP. Removing from battle prevents this effect."},{"n":"Skull Bash","z":"火箭頭錘","t":"一般","c":"物理","g":1,"p":"6","a":"體魄 + 隱匿","d":"力量 + 6","e":"單體目標。蓄力招式。此招式蓄力期間，使用者的防禦提升 1 點。","o":"Single Target. Charge Move. While this Move is charging, Increase the User's Defense by 1."},{"n":"Egg Bomb","z":"炸蛋","t":"一般","c":"物理","g":1,"p":"4","a":"力量/靈巧 + 導引","d":"力量 + 4","e":"單體目標。低命中率 2。遠程。投彈類招式。","o":"Single Target. Low Accuracy 2. Ranged. Projectile Move."},{"n":"Smokescreen","z":"煙幕","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 隱匿","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target."},{"n":"Refresh","z":"煥然一新","t":"一般","c":"變化","g":3,"p":"—","a":"特殊 + 導引/運動","d":"-","e":"目標：使用者。使用者治癒自身的灼傷、冰凍、中毒與麻痺。","o":"Target Self. The User heals itself from any Burn, Freeze, Poison and Paralysis."},{"n":"Head Charge","z":"爆炸頭突擊","t":"一般","c":"物理","g":5,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。反作用傷害。","o":"Single Target. Recoil."},{"n":"Boomburst","z":"爆音波","t":"一般","c":"特殊","g":6,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"範圍招式。聲音類招式。","o":"Area Move. Sound Move."},{"n":"Hold Hands","z":"牽手","t":"一般","c":"變化","g":6,"p":"-","a":"帥氣 + 魅惑","d":"-","e":"單體目標。戰鬥可能依說書人裁定而結束。目標可以用意志值對抗此招式的命中來嘗試抵抗。戰鬥外可用於降低敵意。","o":"Single Target. The battle may end at Storyteller's discretion. Target may resist rolling their Will score against the Accuracy of this Move. Out of battle, aid to reduce hostile intent."},{"n":"Take Down","z":"猛撞","t":"一般","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 2。反作用傷害。","o":"Single Target. Low Accuracy 2. Recoil."},{"n":"Trump Card","z":"王牌","t":"一般","c":"特殊","g":4,"p":"2","a":"意志 + 導引","d":"特殊 + 2 *","e":"單體目標。*若使用者的意志點為一半或更少，傷害骰池額外增加 2 顆骰。**若使用者的意志點耗盡，此招式的傷害骰池改為額外增加 8 顆骰。","o":"Single Target. *If the User's Will points are at half or less, add 2 Extra Dice to the Damage pool. **I f the User's Will points are depleted, add 8 Extra Dice to the Damage pool of this Move instead."},{"n":"Last Resort","z":"珍藏","t":"一般","c":"物理","g":4,"p":"6","a":"意志 + 鬥毆","d":"力量 + 6","e":"單體目標。若使用者在戰鬥中尚未成功使用過自己會的每個招式至少一次，此招式失敗。","o":"Single Target. This Move will fail if the User has not successfully performed all of its known Moves at least once during the battle."},{"n":"Sweet Scent","z":"甜甜香氣","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：範圍內所有敵人。受影響者無法閃避招式。","o":"Target All Foes in Range. Those Affected cannot Evade Moves."},{"n":"Soft Boiled","z":"生蛋","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate."},{"n":"Growth","z":"生長","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：使用者。使用者的力量、特殊提升 1 點。","o":"Target Self. Increase by 1 the User's Strength and Special."},{"n":"Fillet Away","z":"甩肉","t":"一般","c":"變化","g":9,"p":"—","a":"靈巧 + 隱匿","d":"-","e":"目標：使用者。對使用者造成 2 點傷害。使用者的力量、靈巧、特殊提升 2 點。","o":"Target Self. Deal 2 Damage to the User. Increase the User's Strength, Dexterity and Special by 2."},{"n":"Mega Punch","z":"百萬噸重拳","t":"一般","c":"物理","g":1,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。拳類招式。","o":"Single Target. Low Accuracy 1. Fist Move."},{"n":"Mega Kick","z":"百萬噸重踢","t":"一般","c":"物理","g":1,"p":"5","a":"靈巧 + 鬥毆","d":"力量 + 5","e":"單體目標。低命中率 2。","o":"Single Target. Low Accuracy 2."},{"n":"Follow Me","z":"看我嘛","t":"一般","c":"變化","g":3,"p":"—","a":"帥氣 + 表演","d":"-","e":"目標：使用者。先制反應 5。敵方所有能以使用者為目標的招式都會以使用者為目標。持續 1 個戰鬥輪。","o":"Target Self. Reaction 5. All Foe's Moves able to do so will Target the user. Duration 1 Round."},{"n":"Leer","z":"瞪眼","t":"一般","c":"變化","g":1,"p":"—","a":"強壯 + 威嚇","d":"-","e":"目標：範圍內所有敵人。防禦降低 1 點。","o":"Target All Foes in Range. Reduce by 1 the Defense of those affected."},{"n":"Veevee Volley","z":"砰砰擊破","t":"一般","c":"物理","g":7,"p":"*","a":"靈巧 + 運動","d":"力量 + 1 *","e":"單體目標。*每有 1 點使用者的幸福度，此招式的傷害骰池額外增加 1 顆骰，最多可用此方式增加 5 顆。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. *Add 1 Extra Die to the Damage Pool of this Move for every point of Happiness on the User, Up to 5 Dice may be added this way. If the user of this Move is at its Final Stage of Evolution, this move fails."},{"n":"Hyper Beam","z":"破壞光線","t":"一般","c":"特殊","g":1,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。需要重新充能。致命傷害。","o":"Single Target. Low Accuracy 1. Must Recharge. Lethal."},{"n":"Shell Smash","z":"破殼","t":"一般","c":"變化","g":5,"p":"—","a":"力量 + 鬥毆","d":"-","e":"目標：使用者。使用者的力量、特殊、靈巧提升 2 點。使用者的防禦、特防降低 2 點。","o":"Target Self. Increase by 2 the User's Strength, Special and Dexterity. Reduce by 2 the User's Defense and Sp. Defense."},{"n":"Facade","z":"硬撐","t":"一般","c":"物理","g":3,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3 *","e":"單體目標。*若使用者處於異常狀態（麻痺、中毒、灼傷等），傷害骰池額外增加 3 顆骰。","o":"Single Target. *If the User has a Status Ailment (Paralysis, Poison, Burn, etc.) Add 3 Extra Dice to the Damage pool."},{"n":"Laser Focus","z":"磨礪","t":"一般","c":"變化","g":7,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：使用者。若使用者下一個物理或特殊招式的命中擲骰比需求多 5 個成功，則傷害擲骰無視目標的防禦。","o":"Target Self. If the next Physical or Special Move the user performs gets 5 more successes than required on the Accuracy Roll, ignore the Target's defenses on the Damage roll."},{"n":"Wish","z":"祈願","t":"一般","c":"變化","g":3,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者／一名隊友。基礎治療。若命中成功，花費 1 點意志點以發動。此招式在下一個戰鬥輪開始時生效；若使用者被換下，會治療接替上場的寶可夢。","o":"Target Self / Target One Ally. Basic Heal. If successful, spend 1 Will point to activate. This Move has its effect at the beginning of the Next Round if the User is switched it will heal whoever takes their place."},{"n":"Safeguard","z":"神秘守護","t":"一般","c":"變化","g":2,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：己方場地。防護力場。受影響者免疫所有異常狀態。","o":"Target User's side of the field. Force Field. Those affected are immune to all Status Ailments/Conditions."},{"n":"Extreme Speed","z":"神速","t":"一般","c":"物理","g":2,"p":"3","a":"靈巧 + 鬥毆","d":"力量/靈巧 + 3","e":"單體目標。先制反應 2。","o":"Single Target. Reaction 2."},{"n":"Present","z":"禮物","t":"一般","c":"物理","g":2,"p":"","a":"可愛 + 魅惑","d":"-","e":"單體目標。低命中率 1。*目標擲 1 顆骰，有 50-50 的機率對目標造成 2 點定額傷害，或使目標回復 2 HP。","o":"Single Target. Low Accuracy 1. *Target rolls 1 die with a 50-50 chance of dealing 2 Set Damage to the Target or Restoring 2 HP to the Target."},{"n":"Secret Power","z":"秘密之力","t":"一般","c":"物理","g":3,"p":"3","a":"洞察 + 鬥毆","d":"特殊 + 3","e":"單體目標。擲 3 顆機率骰，造成由環境或生效中的場地決定的異常狀態。詳見原書第 530 頁。","o":"Single Target. Roll 3 Chanc Dice to Inflicts Status determined by the environment or active Terrain. See more on p. 530"},{"n":"Sharpen","z":"稜角化","t":"一般","c":"變化","g":1,"p":"—","a":"力量 + 運動","d":"-","e":"目標：使用者。使用者的力量提升 1 點。","o":"Target Self. Increase the User's Strength by 1."},{"n":"Conversion","z":"紋理","t":"一般","c":"變化","g":1,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。專用。隨機改變使用者的主屬性。持續整個場景。","o":"Target Self. Unique. Change the User's Main Type at random. Whole Scene Duration."},{"n":"Conversion 2","z":"紋理２","t":"一般","c":"變化","g":2,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。專用。受到物理或特殊招式傷害後，將使用者的主屬性改為能抵抗該招式的屬性。持續整個場景。","o":"Target Self. Unique. After being dealt damage by a Physical or Special Move, change the User's Main Type to a Type resistant to that Move. Whole Scene Duration."},{"n":"Giga Impact","z":"終極衝擊","t":"一般","c":"物理","g":4,"p":"6","a":"力量 + 鬥毆","d":"力量 + 6","e":"單體目標。低命中率 1。需要重新充能。致命傷害。","o":"Single Target. Low Accuracy 1. Must Recharge. Lethal."},{"n":"Wring Out","z":"絞緊","t":"一般","c":"物理","g":4,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5 *","e":"單體目標。致命傷害。*目標每缺少 1 點 HP，傷害骰池就減少 1 顆骰。最多可用此方式移除 4 顆骰。","o":"Single Target. Lethal. *Remove 1 Dice from the Damage Pool for every missing HP on the target. Up to 4 Dice may be removed this way."},{"n":"Bind","z":"綁緊","t":"一般","c":"物理","g":1,"p":"1","a":"力量 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。阻擋。持續傷害。持續 4 個戰鬥輪。由說書人裁定，提高目標閃避的難度。","o":"Single Target. Low Accuracy 1. Blocks. Ongoing Damage. Duration 4 Rounds. Increase the Target's difficulty to Evade at Storyteller's discretion."},{"n":"Wrap","z":"緊束","t":"一般","c":"物理","g":1,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。阻擋。持續傷害。由說書人裁定，提高目標閃避的難度。持續 4 個戰鬥輪。","o":"Single Target. Low Accuracy 1. Blocks. Ongoing Damage. Increase the Target's difficulty to Evade at Storyteller's discretion. Duration. 4 Rounds."},{"n":"Constrict","z":"纏繞","t":"一般","c":"物理","g":1,"p":"1","a":"力量 + 鬥毆","d":"力量 + 1","e":"單體目標。此招式造成無屬性傷害。擲 1 顆機率骰，目標的靈巧降低 1 點。","o":"Single Target. This Move deals Typeless Damage. Roll 1 Chance Die to Reduce the Target's Dexterity by 1."},{"n":"Spotlight","z":"聚光燈","t":"一般","c":"變化","g":7,"p":"—","a":"帥氣 + 表演","d":"-","e":"目標：一名隊友。先制反應 3。敵方所有招式在可能時都會以所選的隊友為目標。持續 1 個戰鬥輪。","o":"Target One Ally. Reaction 3. All of the Foe's Moves will Target the Chosen Ally if able. Duration 1 Round."},{"n":"Pay Day","z":"聚寶功","t":"一般","c":"物理","g":1,"p":"2","a":"靈巧+ 導引","d":"力量 + 2","e":"單體目標。遠程。戰鬥結束時，依你的訓練家階級給予金錢：啟程／新手級 100、標準級 250、進階級 500、王牌級以上 1000。","o":"Single Target. Ranged. At the end of the battle give Money to your Trainer Equal to their Rank: Starter/Rookie - 100 Standard - 250 Advanced - 500 Ace or more- 1000"},{"n":"Focus Energy","z":"聚氣","t":"一般","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。使用者所有的物理與特殊招式現在都具有「高要害率」。持續整個場景。","o":"Target Self. All of the user's Physical & Special Moves now have “High Critical”. Whole Scene Duration."},{"n":"Belly Drum","z":"腹鼓","t":"一般","c":"變化","g":2,"p":"—","a":"強壯 + 表演","d":"-","e":"目標：使用者。使用者對自己擲出相當於其 HP 一半數量的無屬性傷害骰，無視防禦。使用者的力量提升 3 點。","o":"Target Self. Roll half of the User's HP as Neutral Damage Dice to itself, ignore defenses. Increase User's Strength by 3."},{"n":"Recover","z":"自我再生","t":"一般","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate."},{"n":"Psych Up","z":"自我暗示","t":"一般","c":"變化","g":2,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。使用者獲得與目標相同的能力值／特質提升與降低。","o":"Single Target. The User gets the same Attribute/Trait Increases and Reductions the Target has."},{"n":"Work Up","z":"自我激勵","t":"一般","c":"變化","g":5,"p":"—","a":"力量 + 運動","d":"-","e":"目標：使用者。使用者的力量、特殊提升 1 點。","o":"Target Self. Increase by 1 the User's Strength and Special."},{"n":"Nature's Power","z":"自然之力","t":"一般","c":"特殊","g":3,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。*此招式的屬性由環境或生效中的場地決定。","o":"Single Target. *The Type of this Move is determined by the environment or active Terrain"},{"n":"Natural Gift","z":"自然之恩","t":"一般","c":"物理","g":4,"p":"3","a":"洞察 + 自然","d":"力量 + 3","e":"單體目標。遠程。使用者失去所持有的樹果。*此招式的屬性依所用樹果而改變。","o":"Single Target. Ranged. The User loses its held berry. *The Type of this Move changes according to the berry used."},{"n":"Self Destruct","z":"自爆","t":"一般","c":"物理","g":1,"p":"8","a":"力量 + 導引","d":"力量 + 8","e":"範圍招式。致命傷害。遠程。使用者昏厥。","o":"Area Move. Lethal. Ranged. The User faints."},{"n":"Teatime","z":"茶會","t":"一般","c":"變化","g":8,"p":"-","a":"帥氣/美麗 + 禮儀","d":"-","e":"範圍招式。受影響者會吃掉自己持有的樹果與訓練家背包中的樹果，但不會獲得其效果。戰鬥外可平息暴力意圖數分鐘。","o":"Area Move. Those Affected will eat their held berries and berries on their Trainer's Bag without gaining their effects. Outside of battle will difuse violent intentions for a few minutes."},{"n":"Stockpile","z":"蓄力","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：使用者。使用者的防禦、特防提升 1 點。使「噴出」與「吞下」得以使用。","o":"Target Self. Increase by 1 the User's Defense and Sp. Defense. Enables the use of the Moves “Spit Up” and “Swallow”."},{"n":"Assist","z":"藉助","t":"一般","c":"變化","g":3,"p":"—","a":"洞察 + 禮儀","d":"依情況而定","e":"目標：一名隊友。複製招式。選擇一個隊友或隊伍成員（不論是否在戰鬥中）所會的招式。你可以為此招式另選目標。專用招式無法被複製。","o":"Target One Ally. Copy Move. Choose one Move known by an Ally or member of your party, who may or may not be active in battle. You may choose another Target(s) for the Move. Unique Moves can't be copied."},{"n":"Swagger","z":"虛張聲勢","t":"一般","c":"變化","g":2,"p":"—","a":"強壯/帥氣 + 威嚇","d":"-","e":"單體目標。目標的力量提升 2 點。使目標陷入混亂。","o":"Single Target. Increase the Target's Strength by 2. Confuse the Target."},{"n":"Endeavor","z":"蠻幹","t":"一般","c":"物理","g":3,"p":"","a":"意志 + 導引","d":"依情況而定","e":"單體目標。擲出等同於使用者目前 HP 與目標最大 HP 之差的一般屬性傷害骰。無視防禦。最多可擲 10 顆骰。此傷害不會使目標的 HP 低於使用者目前的 HP。","o":"Single Target. Roll Dice of Normal-Type Damage equal to the difference between the User's current HP and the Target's max HP. Ignore defenses. Up to 10 Dice may be rolled this way. This Damage cannot make the Target's HP to go lower than the User's current HP."},{"n":"Blood Moon","z":"血月","t":"一般","c":"特殊","g":9,"p":"6","a":"特殊 + 自然","d":"特殊 + 6","e":"單體目標。","o":"Single Target."},{"n":"Revelation Dance","z":"覺醒之舞","t":"一般","c":"特殊","g":7,"p":"3","a":"靈巧 + 表演","d":"特殊 + 3","e":"單體目標。*此招式的屬性變為使用者的主屬性。這會相應影響弱點、抗性與屬性一致加成。","o":"Single Target. *The Type of this Move becomes the same as the User's Main Type. This affects Weakness, Resistances, and STAB accordingly."},{"n":"Hidden Power","z":"覺醒力量","t":"一般","c":"特殊","g":2,"p":"3","a":"特殊 + 導引","d":"特殊 + 3","e":"單體目標。此招式對目標一律造成效果絕佳傷害。若由寶可夢 #201 未知圖騰使用，詳見 ser is on the battlefield, Moves known by the User cannot be used by foes. This effect ends if the user is removed from battle."},{"n":"Barrier","z":"屏障","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者的防禦提升 2 點。","o":"Target Self. Increase the User's Defense by 2."},{"n":"Psyshield Bash","z":"屏障猛攻","t":"超能力","c":"物理","g":8,"p":"2","a":"體魄 + 鬥毆","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使用者的防禦、特防提升 1 點。","o":"Single Target. Roll 3 Chance Dice to Increase by 1 the User's Defense and Sp. Defense."},{"n":"Psybeam","z":"幻象光線","t":"超能力","c":"特殊","g":1,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 1 Chance Die to Confuse the Target."},{"n":"Expanding Force","z":"廣域戰力","t":"超能力","c":"特殊","g":8,"p":"*","a":"特殊 + 導引","d":"特殊 + 3 *","e":"單體目標。致命傷害。*若精神場地生效中，傷害骰池額外增加 2 顆骰，並且可再增加一個目標。","o":"Single Target. Lethal. *If Psychic Terrain is active, add 2 Extra Dice to the Damage Pool of this Move and you may add another target to it."},{"n":"Heart Swap","z":"心靈互換","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 魅惑","d":"-","e":"單體目標。將使用者身上的特質與能力值增減，與目標身上的對調。","o":"Single Target. Switch the User's Trait and Attribute Increases and Reductions with those on the Target's."},{"n":"Confusion","z":"念力","t":"超能力","c":"特殊","g":1,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 1 Chance Die to Confuse the Target."},{"n":"Telekinesis","z":"意念移物","t":"超能力","c":"變化","g":5,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。目標對地面屬性招式免疫。目標無法閃避。持續 2 個戰鬥輪。","o":"Single Target. Target becomes immune to Ground-Type Moves. Target can't Evade. Duration 2 Rounds."},{"n":"Zen Headbutt","z":"意念頭錘","t":"超能力","c":"物理","g":4,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Roll 3 Chance Dice to Flinch the Target."},{"n":"Heart Stamp","z":"愛心印章","t":"超能力","c":"物理","g":5,"p":"2","a":"洞察 + 魅惑","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Die to Flinch the Target."},{"n":"Trick","z":"戲法","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 魅惑/隱匿","d":"-","e":"單體目標。使用者與目標交換攜帶道具。若只有一方持有道具，則將道具給對方。","o":"Single Target. The User and the Target switch their Held Item. If only one Pokémon is holding an Item, it gives it away."},{"n":"Trick Room","z":"戲法空間","t":"超能力","c":"變化","g":4,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：整個戰場。將先攻順序顛倒。持續 4 個戰鬥輪。","o":"Target the Battlefield. Invert the order of Initiative. Duration 4 Rounds."},{"n":"Role Play","z":"扮演","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。用目標的特性取代使用者的特性。持續整個場景。專屬特性無法被複製。","o":"Single Target. Replace the User's Ability with the Target's. Whole Scene Duration. Unique Abilities can't be copied."},{"n":"Kinesis","z":"折彎湯匙","t":"超能力","c":"變化","g":1,"p":"—","a":"靈巧 + 導引","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target."},{"n":"Lunar Blessing","z":"新月祈禱","t":"超能力","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"*目標：使用者，或一名隊友。專用。若命中成功，花費 1 點意志點以發動。強效治療。治癒目標的所有異常狀態。一名敵人的所有命中擲骰扣除 1 個成功。","o":"*Target User or Target one Ally. Unique. If successful, spend 1 Will point to activate. Complete Heal. Heal all Status Ailments on the Target. Reduce 1 success to all the Accuracy Rolls of one foe."},{"n":"Lunar Dance","z":"新月舞","t":"超能力","c":"變化","g":4,"p":"-","a":"洞察 + 表演","d":"-","e":"目標：使用者。專用。對使用者自己擲出等同於其剩餘 HP 的無屬性傷害骰。一名隊友目標回復全部 HP，並治癒所有異常狀態；若其已昏厥，則恢復意識。若所選目標不在戰場上，會被叫出場，並以與使用者相同的剩餘行動數準備戰鬥。","o":"Target Self. Unique. Roll the User's Remaining HP as Typeless Damage dice to itself. One allied Target restores its full HP and it is cured from any Status Condition, if it was fainted, restore conciousness. If the chosen Target is not in-battle, it is called out and ready to fight with the same remaining actions as the user."},{"n":"Esper Wing","z":"氣場之翼","t":"超能力","c":"特殊","g":8,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。高要害率。使用者的靈巧提升 1 點。","o":"Single Target. High Critical. Increase the User's Dexterity by 1."},{"n":"Healing Wish","z":"治癒之願","t":"超能力","c":"變化","g":4,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。使用者昏厥。一名隊友目標回復全部 HP，並治癒所有異常狀態。若所選目標不在戰場上，會被叫出場，並以與使用者相同的剩餘行動數準備戰鬥。","o":"Target Self. The user faints. One allied Target restores its full HP and it is cured from any Status Condition. If the chosen Target is not in-battle, it is called out and ready to fight with the same remaining actions as the user."},{"n":"Heal Pulse","z":"治癒波動","t":"超能力","c":"變化","g":5,"p":"—","a":"意志 + 導引","d":"-","e":"目標：一名隊友。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target One Ally. Basic Heal. If successful, spend 1 Will point to activate."},{"n":"Luster Purge","z":"潔淨光芒","t":"超能力","c":"特殊","g":3,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。專用。擲 5 顆機率骰，目標的特防降低 1 點。*此效果對每個目標最多可疊加 3 次。","o":"Single Target. Unique. Roll 5 Chance Dice to Reduce the Target's Sp. Defense by 1. *This Effect can stack up to 3 times per Target."},{"n":"Skill Swap","z":"特性互換","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 導引","d":"-","e":"單體目標。將使用者的特性與目標的對調。持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Switch the User's Ability with the Target's. Whole Scene Duration. This effect does not end by switching out the affected Pokémon."},{"n":"Lumina Crash","z":"琉光衝激","t":"超能力","c":"特殊","g":9,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。敵人的特防降低 2 點。","o":"Single Target. Reduce the Foe's Sp. Defense by 2."},{"n":"Meditate","z":"瑜伽姿勢","t":"超能力","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。使用者的特殊與特防提升 1 點。","o":"Target Self Increase by 1 the User's Special and Sp. Defense."},{"n":"Hyperspace Hole","z":"異次元洞","t":"超能力","c":"特殊","g":6,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。必中。專用。無視防禦。無視護盾招式與防護力場。","o":"Single Target. Never Miss. Unique. Ignore Defenses. Ignore Shield Moves, and Force Field."},{"n":"Rest","z":"睡覺","t":"超能力","c":"變化","g":1,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。強效治療。若命中成功，花費 1 點意志點以發動。使使用者陷入睡眠。","o":"Target Self. Complete Heal. If successful, spend 1 Will point to activate. Put the User to Sleep."},{"n":"Amnesia","z":"瞬間失憶","t":"超能力","c":"變化","g":1,"p":"—","a":"聰明 + 警覺","d":"-","e":"目標：使用者。使用者的特防提升 2 點。","o":"Target Self. Increase the User's Sp. Defense by 2."},{"n":"Teleport","z":"瞬間移動","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者方替換招式。在野外，戰鬥可能結束。戰鬥外，瞬間移動的距離與限制由使用者的特殊值與說書人裁定。","o":"Target Self. Switcher Move for the User. In the wild the battle may end. Out of battle, Teleportation distances and limitations are determined by the user's Special Score and Storyteller's discretion."},{"n":"Mystical Power","z":"神秘之力","t":"超能力","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"目標：使用者。使用者最低的一項能力值／特質提升 2 點。若某項能力值／特質已達 6 或更高，此效果失敗。可以用此方式提升不同的能力值／特質。","o":"Target Self. Increase by 2 the User's lowest Attribute/ Trait. If an Attribute/Trait Score is 6 or More this effect fails. Different Attributes/Traits may be increased this way."},{"n":"Extrasensory","z":"神通力","t":"超能力","c":"特殊","g":3,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標畏縮。","o":"Single Target. Roll 1 Chance Die to Flinch the Target."},{"n":"Prismatic Laser","z":"稜鏡鐳射","t":"超能力","c":"特殊","g":7,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。致命傷害。需要重新充能。專用。","o":"Single Target. Lethal. Must Recharge. Unique."},{"n":"Psychic Fangs","z":"精神之牙","t":"超能力","c":"物理","g":7,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。啃咬類招式。若目標一側的場地上有防護力場，將其摧毀。","o":"Single Target. Bite Move. If there is a Force Field on the Target's side of the field, destroy it"},{"n":"Psycho Cut","z":"精神利刃","t":"超能力","c":"物理","g":4,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。遠程。高要害率。切割類招式。","o":"Single Target. Ranged. High Critical. Cutter Move."},{"n":"Psyblade","z":"精神劍","t":"超能力","c":"物理","g":9,"p":"3","a":"靈巧/洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。切割類招式。*若電氣場地生效中，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Lethal. Cutter Move. *If Electric Terrain is active, add 2 Extra Dice to the Damage pool of this Move."},{"n":"Psychic Noise","z":"精神噪音","t":"超能力","c":"特殊","g":9,"p":"2","a":"洞察 + 導引/警覺","d":"特殊 + 2","e":"單體目標。目標無法回復 HP。持續 2 個戰鬥輪。","o":"Single Target. Target can't restore HP. Duration 2 Rounds."},{"n":"Psychic Terrain","z":"精神場地","t":"超能力","c":"變化","g":7,"p":"-","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。所有物理與特殊的超能力屬性招式，傷害骰池額外增加 1 顆骰。不具地面免疫的寶可夢無法使用帶有先制反應或後制反應的招式。持續 4 個戰鬥輪。","o":"Target Battlefield. Add 1 Extra Damage Dice to all Physical & Special Psychic-Type Moves. Pokémon without immunity to Ground can't use Moves with Reaction or Late Reaction. Duration 4 Rounds."},{"n":"Psychic","z":"精神強念","t":"超能力","c":"特殊","g":1,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，目標的特防降低 1 點。","o":"Single Target. Roll 1 Chance Die to Reduce the Target's Sp. Defense by 1."},{"n":"Psystrike","z":"精神擊破","t":"超能力","c":"特殊","g":5,"p":"4","a":"靈巧 + 導引","d":"特殊 + 4","e":"單體目標。致命傷害。專用。此招式以敵人的防禦取代其特防來抵抗。","o":"Single Target. Lethal. Unique. This Move is resisted with the Foe's Defense instead of its Sp. Defense."},{"n":"Psywave","z":"精神波","t":"超能力","c":"特殊","g":1,"p":"","a":"洞察 + 威嚇","d":"依情況而定","e":"依使用者的階級擲出超能力屬性傷害骰：啟程 1 顆／新手 2 顆／標準 4 顆／進階 6 顆／專家 8 顆／王牌以上 10 顆。無視防禦。","o":"Roll Psychic-Type Damage Dice according to the User's Rank: Starter 1 Die / Rookie 2 Dice / Standard 4 Dice / Advanced 6 Dice / Expert 8 Dice / Ace and forward 10 Dice. Ignore Defenses."},{"n":"Psycho Boost","z":"精神突進","t":"超能力","c":"特殊","g":3,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。致命傷害。專用。使用者的特殊降低 2 點。","o":"Single Target. Low Accuracy 1. Lethal. Unique. Reduce User's Special by 2."},{"n":"Psyshock","z":"精神衝擊","t":"超能力","c":"特殊","g":5,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。此招式以目標的防禦取代其特防來抵抗。","o":"Single Target. This Move is resisted with the Target's Defense instead of its Sp. Defense."},{"n":"Psycho Shift","z":"精神轉移","t":"超能力","c":"變化","g":4,"p":"—","a":"意志 + 導引","d":"-","e":"單體目標。將使用者的所有異常狀態複製給目標。之後，治癒使用者的所有異常狀態。","o":"Single Target. Copy all of the User's Status Ailments into the Target. Afterwards, Heal the User from any Status Ailment."},{"n":"Mist Ball","z":"薄霧球","t":"超能力","c":"特殊","g":3,"p":"2","a":"特殊 uracy 1. High Critical."},{"n":"Surf","z":"衝浪","t":"水","c":"特殊","g":1,"p":"4","a":"靈巧 + 導引","d":"特殊 + 4","e":"範圍招式。若目標因使用「潛水」而處於範圍外，此招式仍然命中。戰鬥之外，可讓寶可夢長距離渡海。","o":"Area Move. If a Target is out of range due to using the Move “Dive” this Move hits anyways. Out of battle allows the pokemon to travel the sea for long distances."},{"n":"Razor Shell","z":"貝殼刃","t":"水","c":"物理","g":5,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 1 顆機率骰，目標的防禦降低 1 點。切割類招式。","o":"Single Target. Roll 1 Chance Die to Reduce the Target's Defense by 1. Cutter Move."},{"n":"Clamp","z":"貝殼夾擊","t":"水","c":"物理","g":1,"p":"2","a":"體魄 + 鬥毆/隱匿","d":"力量 + 2","e":"單體目標。低命中率 2。使使用者與目標雙方皆被阻擋。持續傷害。由說書人裁定，提高目標閃避的難度。持續 4 個戰鬥輪。","o":"Single Target. Low Accuracy 2. Blocks both User and Target. Ongoing Damage. Increase the Target's difficulty to Evade at Storyteller's discretion. Duration 4 Rounds."},{"n":"Water Shuriken","z":"飛水手裡劍","t":"水","c":"特殊","g":6,"p":"1","a":"靈巧 + 導引/隱匿","d":"特殊 + 1","e":"單體目標。先制反應 1。連續行動。","o":"Single Target. Reaction 1. Successive Actions."},{"n":"Fishious Rend","z":"鰓咬","t":"水","c":"物理","g":8,"p":"*","a":"力量 + 鬥毆","d":"力量 + 3 *","e":"單體目標。啃咬類招式。*若這是使用者本戰鬥輪的第一個行動，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Bite Move. *If this is the first Action of the Round for the User, add 2 Extra Dice to the Damage pool of this Move."},{"n":"Brine","z":"鹽水","t":"水","c":"特殊","g":4,"p":"2","a":"靈巧 + 導引/自然","d":"特殊 + 2 *","e":"單體目標。*若目標的 HP 在一半或以下，傷害骰池額外增加 3 顆骰。傷害 *","o":"Single Target. *Add 3 Extra Dice to the Damage Pool if the Target is at half HP or less. Damage *"},{"n":"Ambush","z":"伏擊","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 隱匿","d":"-","e":"單體目標。戰鬥開始前，目標可擲 洞察 + 警覺 來抵抗，且成功數需相同或更多。使用者在擲先攻前擁有 1 個行動，此期間目標無法行動。其他敵人在此期間仍可閃避或對抗。","o":"Single Target. Before the Battle starts, Target may resist by rolling: Insight + Alert and scoring the same or more successes. The User has 1 Action before Initiatives are rolled in which the Target can't act. Other foes can still Evade or Clash during this time ."},{"n":"Clash","z":"對抗","t":"無","c":"變化","g":0,"p":"-","a":"力量/特殊 + 對抗","d":"-","e":"目標：使用者。先制反應 6。成功數需等於或高於針對使用者的招式的命中成功數。若成功，使用者進行對抗（詳見原書第 68 頁）。此技倆不受多重行動難度表影響。","o":"Target Self. Reaction 6. Match the number of successes on the Accuracy roll of a Move that targets the User. If successful, the user Clashes, see p.68 This Maneuver is not affected by the Multiple Action difficulty chart."},{"n":"Help Another","z":"幫助他人","t":"無","c":"變化","g":0,"p":"-","a":"與盟友嘗試的行動相同","d":"-","e":"目標：一名隊友。先制反應 1。將你的命中骰池當作機率骰來擲。每擲出 1 個，就為隊友的命中擲骰增加 6 顆骰。最多 3 名角色可以嘗試協助同一個行動。最多可用此方式增加 6 顆骰。","o":"Target One Ally. Reaction 1. Roll your Accuracy as if it were Chance dice. Add 1 die to the Accuracy Roll of your Ally for every 6 rolled. Up to 3 Characters may attempt to help a single action. Up to 6 Dice may be added this Way."},{"n":"Struggle","z":"掙扎","t":"無","c":"物理","g":0,"p":"0","a":"靈巧 + 鬥毆/導引/投擲","d":"力量/特殊 + 0","e":"單體目標。","o":"Single Target."},{"n":"Cover an Ally","z":"掩護同伴","t":"無","c":"變化","g":0,"p":"-","a":"意志","d":"-","e":"目標：一名隊友。先制反應 1。使用者會成為針對目標的攻擊的新目標。此掩護持續到使用者的下個回合，或直到目標使用近戰物理招式為止。忠誠度 2 以下的寶可夢不會使用此技倆。","o":"Target One Ally. Reaction 1. The User will become the target to incoming attacks towards the Target. This Cover lasts until the User's Next Turn or until the Target uses a Non-Ranged Physical Move. Pokémon with Loyalty 2 or less won't use this Maneuver."},{"n":"Grapple","z":"擒抱","t":"無","c":"變化","g":0,"p":"-","a":"力量 + 運動/鬥毆","d":"-","e":"單體目標。阻擋。目標可以擲力量或靈巧值來抵抗此技倆，且成功數需不低於使用者。使用者在擒抱期間無法行動。使用者可在任何時候放開擒抱以進行行動。","o":"Single Target. Blocks. The Target may resist this Maneuver by rolling Strength or Dexterity score and scoring the same or more successes than the User. The User can't Act while Grappling. The User can release the Grapple at any point to act."},{"n":"Stabilize an Ally","z":"穩定同伴","t":"無","c":"變化","g":0,"p":"-","a":"聰明 + 醫藥","d":"-","e":"使用者對一名隊友施行心肺復甦和／或急救。目標不再每小時受到致命傷害。隊友身上每有 1 點致命傷害，此技倆的命中骰池就扣除 1 個成功。此技倆每小時只能使用一次。","o":"The User applies CPR and/ or first aid to an Ally. Target won't receive Lethal Damage each hour anymore. Each Lethal Damage on the Ally reduces 1 Success to the Accuracy Pool of this Maneuver. This Maneuver can only be used once per hour."},{"n":"Run Away","z":"逃跑","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 運動","d":"-","e":"目標：使用者。使用者逃離戰場。結束戰鬥。敵人可以嘗試擲 靈巧 + 運動 阻止，且成功數需相同或更多。若使用者被阻擋，此技倆失敗。","o":"Target Self. The User runs away from the battlefield. End the battle. Foes might try to prevent this by rolling: Dexterity + Athletic and scoring the same or more successes. If the user is Blocked this Maneuver fails."},{"n":"Evasion","z":"閃避","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 閃避","d":"-","e":"目標：使用者。先制反應 6。成功數需等於或高於針對使用者的招式的命中成功數。若成功，使用者進行閃避（詳見原書第 68 頁）。此技倆不受多重行動難度表影響。","o":"Target Self. Reaction 6. Match the number of successes on the Accuracy roll of a Move that targets the User. If successful, the user Evades, see p.68 This Maneuver is not affected by the Multiple Action difficulty chart."}],GZ={"1": "第一世代（關都）", "2": "第二世代（城都）", "3": "第三世代（豐緣）", "4": "第四世代（神奧）", "5": "第五世代（合眾）", "6": "第六世代（卡洛斯）", "7": "第七世代（阿羅拉）", "8": "第八世代（伽勒爾、洗翠）", "9": "第九世代（帕底亞）"};
