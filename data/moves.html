物會使此招式無法造成傷害（寶可夢屬性、特性、護盾招式、天氣或防護力場），一律無視。此招式無法被對抗。","o":"Single Target. Lethal. Unique. If anything on the foe's side would prevent this move from deal- ing damage (Pokémon Type, Abilities, Shield Moves, Weather or Force Fields) ignore it. This Move cannot be Clashed.","f":"你看到一道明亮刺眼的光以極快的速度朝你而來，不由得停下腳步。你還沒看清是什麼擊中了你，眼前就已是一片黑暗。","fo":"You suddenly stop in your tracks as you see a bright and blinding light coming towards you at great speed. You do not see what hits you before it's all darkness.","ic":[1,20,79]},{"n":"Make It Rain","z":"淘金潮","t":"鋼","c":"特殊","g":9,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"範圍招式。使用者的特殊降低 2 點。戰鬥結束時，給予使用者與每位寶可夢被擊中的訓練家金錢，金額依其階級：啟程／新手 100、標準 250、進階 500、王牌以上 1000。","o":"Area Move. Reduce the User's Special by 2. At the end of the battle give the User and every Trainer whose Pokémon was hit, Money equal to their Rank: Starter/Rookie - 100 Standard - 250 Advanced - 500 Ace or more - 1000","f":"寶可夢召喚一場黃金雨從天而降，所有貪心的寶可夢撲向金錢，結果進入了黃金光芒爆炸的範圍。值得啊！","fo":"The Pokémon calls a rain of gold to fall from the sky. All the greedy Pokémon who threw themselves at the money get in range for an explosion of golden light. Worth it!","ic":[106,327]},{"n":"King's Shield","z":"王者盾牌","t":"鋼","c":"變化","g":6,"p":"—","a":"體魄 + 鬥毆","d":"-","e":"目標：使用者。先制反應 4。護盾招式。使用者受到傷害性招式時，減少 3 點傷害。*若敵人對使用者使用非遠程物理招式，該敵人的力量降低 2 點。","o":"Target Self. Reaction 4. Shield Move. Reduce 3 Damage the User would receive from a Damaging Move. *If the Foe used a Non-Ranged Physical Move against the user Reduce the foe's Strength by 2.","f":"從我的椅子上滾開，弄臣！國王坐在那裡！","fo":"Off my chair, jester! The king sits there!","ic":[36,8,34,129]},{"n":"Spin Out","z":"疾速轉輪","t":"鋼","c":"物理","g":9,"p":"4","a":"力量 + 鬥毆","d":"力量 + 4","e":"單體目標。致命傷害。使用者的靈巧降低 2 點。","o":"Single Target. Lethal. Reduce the User's Dexterity by 2.","f":"寶可夢旋轉著撞向目標，把牠壓制在地上。這招毀滅性的招式會讓寶可夢累到無法再轉太多圈。","fo":"The Pokémon spins against the target, with it pinned on the ground. This devastating Move leaves the Pokémon too tired to spin a lot more.","ic":[1,67,333]},{"n":"Doom Desire","z":"破滅之願","t":"鋼","c":"特殊","g":3,"p":"6","a":"洞察 + 魅惑","d":"特殊 + 6","e":"單體目標。專用。此招式的傷害在下一個戰鬥輪開始時才造成。無視護盾招式、防護力場、掩護與替身。若目標退場或被換下場，傷害會改由下一位對手或其隊友之一承受。說書人可酌情加入額外效果。","o":"Single Target. Unique. This Move's damage is dealt at the beginning of the next Round. Ignore Shield Moves, Force Field, Cover & Substitute decoys. If the target retires or switches out from battle, the damage will be dealt to the next opponent or to one of its allies.Extra effects may be added at Storyteller's Discretion","f":"許願要小心，這隻寶可夢會讀取你最私密的願望，並以非常扭曲的方式實現它們。","fo":"Be careful what you wish for, this Pokémon will read your most intimate wishes and make them come true in very twisted ways.","ic":[1,79]},{"n":"Hard Press","z":"硬壓","t":"鋼","c":"物理","g":9,"p":"*","a":"力量 + 鬥毆","d":"力量 + 6 *","e":"單體目標。*使用者每損失 1 點 HP，傷害骰池減少 1 顆骰。最多可用此方式移除 5 顆骰。","o":"Single Target. *Reduce 1 Die from the Damage Pool for every missing HP the User has. Up to 5 Dice may be removed this way.","f":"對手被痛苦的鎖技制住，掙扎得愈用力，感受到的壓力就愈大。使用者必須處於最佳狀態，這招才會有效。","fo":"The foe is grappled in a painful lock, the more it struggles to get out the more pressure it's gonna feel. The user must be on top condition for this grapple to be effective.","ic":[1,91]},{"n":"Magnet Bomb","z":"磁鐵炸彈","t":"鋼","c":"物理","g":4,"p":"2","a":"特殊 + 導引","d":"力量 + 2","e":"單體目標。遠程。必中。投彈類招式。","o":"Single Target.Ranged. Never Miss. Projectile Move.","f":"使用者點燃一顆磁化炸彈的引信。猜猜另一塊磁鐵是誰？","fo":"The user lights the fuse of a magnetized bomb. Guess who is the other magnet?","ic":[238,1,59,26]},{"n":"Autotomize","z":"身體輕量化","t":"鋼","c":"變化","g":5,"p":"—","a":"靈巧 + 導引","d":"-","e":"目標：使用者。使用者的靈巧提升 2 點。使用者的體重減半。","o":"Target Self. Increase the User's Dexterity by 2. Halve the User's weight.","f":"旋轉的零件與微小的齒輪，這隻寶可夢運作得像一台保養良好的機器。","fo":"Rotating parts and tiny gears, the Pokémon works like a welloiled machine.","ic":[8,322,133]},{"n":"Gear Up","z":"輔助齒輪","t":"鋼","c":"變化","g":7,"p":"—","a":"聰明 + 導引","d":"-","e":"目標：一名隊友。一名鋼屬性或電屬性隊友的力量與特殊提升 1 點。","o":"Target One Ally. Increase by 1 the Strength and Special of one Steel-Type or Electric-Type Ally.","f":"寶可夢為同伴進行基本的保養，換機油、換濾芯、換新火星塞，同伴就已準備萬全！","fo":"The Pokémon performs a basic manteniance on their ally. A change of oil and filters, new spark plugs, and the ally is more than ready!","ic":[24,64,85]},{"n":"Tachyon Cutter","z":"迅子利刃","t":"鋼","c":"特殊","g":9,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。致命傷害。必中。雙重行動。","o":"Single Target. Lethal. Never Miss. Double Action.","f":"寶可夢揮出一把鋒利得能砍兩次的劍。","fo":"The Pokémon swings with a sword so sharp, it cuts twice.","ic":[67,1,59,46]},{"n":"Heavy Slam","z":"重磅衝撞","t":"鋼","c":"物理","g":5,"p":"1","a":"體魄 + 鬥毆","d":"力量 + 1 *","e":"單體目標。*使用者的體重每比目標重 50 公斤，傷害骰池額外增加 1 顆骰，最多可用此方式增加 4 顆骰。","o":"Single Target. *Add 1 Extra Dice to the Damage Pool for every 50kg of weight the User is above the target's weight. Up to 4 Dice may be added this way.","f":"對手即將確認這隻寶可夢是不是骨架粗大（而不是胖）。","fo":"The foe is about to confirm if the Pokémon is thick-boned.","ic":[1,95]},{"n":"Metal Burst","z":"金屬爆炸","t":"鋼","c":"物理","g":4,"p":"","a":"洞察 + 鬥毆/導引","d":"依情況而定","e":"單體目標。後制反應 5。只有在目標上一次對使用者使用的是物理或特殊招式時才能使用。擲出等同於目標上一次對使用者擲出的傷害骰池，再加 2 顆骰。無視防禦。","o":"Single Target. Late Reaction 5. Can only be used if Target's last Move on User was a Physical or Special Move. Roll dice equal to Target's last damage pool rolled against the User plus 2 dice. Ignore Defenses.","f":"以劍為生的人，必將死於劍下，或者在這個例子裡，死於爆炸。","fo":"Those who live by the sword will die by the sword, or, in this case, by an explosion.","ic":[1,148]},{"n":"Metal Claw","z":"金屬爪","t":"鋼","c":"物理","g":2,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。擲 1 顆機率骰，使用者的力量提升 1 點。","o":"Single Target. Low Accuracy 1. Roll 1 Chance Die to Increase the User's Strength by 1.","f":"寶可夢把對手當成磨刀石。","fo":"The Pokémon uses the foe as a whetstone.","ic":[23,1,4,64]},{"n":"Metal Sound","z":"金屬音","t":"鋼","c":"變化","g":3,"p":"—","a":"強壯 + 表演","d":"-","e":"單體目標。聲音類招式。目標的特防降低 2 點。","o":"Single Target. Sound Move. Reduce the Target's Sp. Defense by 2.","f":"一陣可怕的刺耳噪音轟鳴在對手耳邊，有些人會想說服你這是好音樂。","fo":"A horrible screeching sound rumbles in the foe's ears. Some people will try to convince you that this is good music.","ic":[1,5,58]},{"n":"Double Iron Bash","z":"鋼拳雙擊","t":"鋼","c":"物理","g":7,"p":"2","a":"特殊 + 鬥毆","d":"力量 + 2","e":"單體目標。專用。雙重行動。每次命中後，擲 3 顆機率骰，使敵人畏縮。此招式只能使目標畏縮一次。","o":"Single Target. Unique. Double Action. Roll 3 Chance Dice to Flinch the Foe after each hit. This Move may only Flinch once.","f":"使用者讓四肢變硬，再以極快的速度旋轉，連續兩次打擊對手。這一擊可能把受害者壓扁在地上。","fo":"The user hardens its limbs and then rotates them at great speed to hit the foe twice in a row. The blow can leave the victim crushed on the floor.","ic":[79,1,46,324]},{"n":"Steel Wing","z":"鋼翼","t":"鋼","c":"物理","g":2,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。擲 1 顆機率骰，使用者的防禦提升 1 點。","o":"Single Target. Low Accuracy 1. Roll 1 Chance Dice to Increase the User's Defense by 1.","f":"寶可夢擁有防風雨的翅膀，能縮短飛行時間、劃破空氣，最重要的是，能劃破對手。","fo":"The Pokémon has weather-proofed wings that cut flying times, cut through the air, and, most importantly, cut through their foes.","ic":[23,1,4,86]},{"n":"Mirror Shot","z":"鏡光射擊","t":"鋼","c":"特殊","g":4,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。低命中率 2。擲 3 顆機率骰，使目標陷入混亂。","o":"Single Target. Low Accuracy 2. Roll 3 Chance Dice to Comfuse the Target.","f":"透過一系列反射面，寶可夢把光束導向意想不到的方向。對手不知所措，分不清眼前所見是真實還是倒影。","fo":"Through a series of reflective surfaces, the Pokémon redirects a beam through unexpected directions. The foe is at a loss; they don't know if what they see is real or a reflection.","ic":[1,21,329]},{"n":"Iron Defense","z":"鐵壁","t":"鋼","c":"變化","g":3,"p":"—","a":"體魄 + 導引","d":"-","e":"目標：使用者。使用者的防禦提升 2 點。","o":"Target Self. Increase the User's Defense by 2.","f":"鋼鐵之軀，鋼鐵意志。這隻寶可夢堅不可摧。","fo":"Iron body, iron will. This Pokémon is unbreakable.","ic":[8,325]},{"n":"Iron Tail","z":"鐵尾","t":"鋼","c":"物理","g":2,"p":"4","a":"力量 + 鬥毆","d":"力量 + 4","e":"單體目標。低命中率 3。擲 3 顆機率骰，目標的防禦降低 1 點。","o":"Single Target. Low Accuracy 3. Roll 3 Chance Dice to Reduce the Target's Defense by 1.","f":"寶可夢用變硬的尾巴揮向對手，在牠的盔甲上砸出一個凹痕。","fo":"With a hardened tail, the Pokémon swings against the foe to make a dent in their armor.","ic":[57,1,326,53]},{"n":"Steel Roller","z":"鐵滾輪","t":"鋼","c":"物理","g":8,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。致命傷害。若戰場上沒有生效中的場地（青草場地、電氣場地等），無法使用。移除戰場上任何生效中的場地。","o":"Single Target. Lethal. Can't be used if there is no Active Terrain (Grassy Terrain, Electric Terrain etc.) on the Battlefield. Remove any active Terrain on the Battlefield.","f":"寶可夢把自己捲成一個輪子，摧毀沿途的一切。建築物轟然倒塌，森林被一掃而空，土地變成一張白紙。","fo":"The Pokémon rolls into a wheel, destroying anything in their path. Buildings come crashing down, forests are swept away and the soil is left as a blank slate.","ic":[1,67]},{"n":"Steel Beam","z":"鐵蹄光線","t":"鋼","c":"特殊","g":8,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。致命傷害。反作用傷害。","o":"Single Target. Lethal. Recoil.","f":"一道集中的光線，能熔化最厚的鋼板。可惜，使用者自己也是鋼做的。","fo":"A concentrated ray of light that is capable of melting even the thickest steel plates. Unfortunately, the user is also made of steel.","ic":[1,67,135]},{"n":"Iron Head","z":"鐵頭","t":"鋼","c":"物理","g":4,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Dice to flinch the Target.","f":"寶可夢衝上去，要治好對手缺鐵的毛病。","fo":"The Pokémon charges to cure the foe's iron deficit.","ic":[1,319]},{"n":"Shelter","z":"閉關","t":"鋼","c":"變化","g":8,"p":"—","a":"體魄 + 自然/隱匿","d":"-","e":"目標：使用者。使用者的防禦、特防提升 1 點。敵人以使用者為目標時，其所有命中擲骰減少 1 顆成功骰。","o":"Target Self. Increase by 1 the User's Defense and Sp. Defense. Reduce 1 success to all the Accuracy Rolls of the Foes when Targeting the User.","f":"使用者把身體堅硬的部分當作庇護所躲起來，對手很難找到破綻。","fo":"The user uses a sturdy part of their body as a shelter to hide. It's difficult for the foes to find an opening.","ic":[330,8,331,332]},{"n":"Gyro Ball","z":"陀螺球","t":"鋼","c":"物理","g":4,"p":"1","a":"力量 + 運動","d":"力量 + 1 *","e":"單體目標。投彈類招式。*目標的靈巧每比使用者高 1 點，傷害骰池就額外增加 1 顆骰。最多可用此方式增加 5 顆骰。","o":"Single Target. Projectile Move. *Add 1 Extra Dice to the Damage Pool of this Move for every point on Dexterity the Target has that surpasses the User's. Up to 5 Dice may be added this way.","f":"寶可夢射出一枚投射物。更正：寶可夢本身就是那枚投射物。","fo":"The Pokémon shoots a projectile. Correction: the Pokémon IS the projectile.","ic":[1,26,254]},{"n":"Gear Grind","z":"齒輪飛盤","t":"鋼","c":"物理","g":5,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。雙重行動。","o":"Single Target. Low Accuracy 1. Double Action.","f":"對手被困在兩個齒輪之間，唯一的出路就是讓齒輪碾過牠被壓碎的身體。","fo":"The foe gets trapped into two gears, the only way out is to let the gears grind against its crushed body.","ic":[1,23,46]},{"n":"Triple Dive","z":"三連鑽","t":"水","c":"物理","g":9,"p":"2","a":"靈巧 + 運動/鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。三重行動。","o":"Single Target. Low Accuracy 1. Triple Action.","f":"使用者以完美的時機施展三連潛水跳，對手被每一道水花沖走。","fo":"The user performs a triple dive jump with perfect timing. The foe is washed away by each water splash.","ic":[1,23,160]},{"n":"Hydro Cannon","z":"加農水炮","t":"水","c":"特殊","g":3,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。需要重新充能。","o":"Single Target. Low Accuracy 1. Must Recharge.","f":"那些害怕火焰破壞力的人，已經忘記了水每一次都能戰勝火焰。","fo":"Those who fear fire's destructive power have forgotten that water triumphs over the flames every single time.","ic":[1,23,97]},{"n":"Jet Punch","z":"噴射拳","t":"水","c":"物理","g":9,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。先制反應 1。拳類招式。","o":"Single Target. Reaction 1. Fist Move.","f":"正義的拳頭，準確、迅速……而且濕漉漉的！","fo":"The fist of justice strikes true, swift...and wet!","ic":[1,113,82]},{"n":"Water Spout","z":"噴水","t":"水","c":"特殊","g":3,"p":"6","a":"特殊 + 導引","d":"特殊 + 6 *","e":"目標：範圍內所有敵人。致命傷害。*使用者每損失 1 點 HP，傷害骰池減少 1 顆骰。最多可用此方式移除 5 顆骰。","o":"Target All Foes in Range. Lethal. *Reduce 1 Die from the Damage Pool for every missing HP the User has. Up to 5 Dice may be removed this way.","f":"光是這個招式，就可能是地球有百分之七十都是水的原因。","fo":"This Move alone may be the reason the earth is 70% water.","ic":[20,344,91]},{"n":"Flip Turn","z":"快速折返","t":"水","c":"物理","g":8,"p":"2","a":"靈巧 + 運動","d":"力量 + 2","e":"單體目標。使用者方替換招式。","o":"Single Target. Switcher Move for the User.","f":"像一顆由水構成的砲彈衝向對手，巨大的水花讓旁觀者看不清戰場。水花落下時，使用者已經不見了。","fo":"Charge at the foe as a cannon ball made out of water. The big splash causes bystanders to lose sight on the battlefield. When the splash settles, the user is gone.","ic":[1,227]},{"n":"Waterfall","z":"攀瀑","t":"水","c":"物理","g":1,"p":"3","a":"力量 + 運動","d":"力量 + 3","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢游泳的力量與速度之大，甚至能逆流游上瀑布。","fo":"The Pokémon swims with such force and speed that it could even swim upwards in a waterfall.","ic":[1,43]},{"n":"Origin Pulse","z":"根源波動","t":"水","c":"特殊","g":6,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"目標：範圍內所有敵人。低命中率 2。致命傷害。專用。無視目標對水屬性傷害的免疫。若目標因使用某招式而處於「範圍外」，此招式仍然命中。","o":"Target All Foes in Range. Low Accuracy 2. Lethal. Unique. Ignore the Target's immunity to Water-Type Damage. If a Target is “Out of Range” due to using a Move, this Move hits anyways.","f":"寶可夢在水下送出巨大的脈衝，引發潮汐的連鎖反應，製造出一連串海嘯般的巨浪。就連水屬性寶可夢也無法在這些狂暴的洋流中衝浪。","fo":"The Pokémon sends a giant pulse underwater that creates a chain reaction in the tides, creating a series of tsunami waves. Not even water-pokemon can surf through these wild currents.","ic":[21,7,79,20]},{"n":"Water Pulse","z":"水之波動","t":"水","c":"特殊","g":3,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。擲 3 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 3 Chance Dice to Confuse the Target.","f":"使用者送出一圈脈動的水環，以超音波轟擊對手。有那麼一陣子，一切看起來都像映在水波中的倒影。","fo":"The user sends out a pulsing ring of water that blasts the foe with ultrasonic waves. For a while, everything seems as if reflected in the water ripples.","ic":[1,191]},{"n":"Water Pledge","z":"水之誓約","t":"水","c":"特殊","g":5,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"範圍招式。","o":"Area Move.","f":"寶可夢吟唱，召喚水的力量，空氣中的水氣折射光線形成彩虹，帶來好運。場上所有人暫時都覺得自己更幸運。","fo":"The Pokémon chants to invoke the power of water. Moisture in the air bends the light to create a rainbow to bring good fortune. Everyone in the field feels luckier for a while.","ic":[106,110,342,18]},{"n":"Water Gun","z":"水槍","t":"水","c":"特殊","g":1,"p":"2","a":"靈巧/特殊 + 導引","d":"特殊 + 2","e":"單體目標。","o":"Single Target.","f":"全鎮最快的水槍，沒有敵人能保持乾燥。","fo":"The fastest water gun in town. No enemy will remain dry.","ic":[1]},{"n":"Aqua Cutter","z":"水波刀","t":"水","c":"物理","g":9,"p":"2","a":"力量 + 導引","d":"力量 + 2","e":"單體目標。遠程。高要害率。切割類招式。","o":"Single Target. Ranged. High Critical. Cutter Move.","f":"使用者壓縮水分，並以加壓水柱的形式射出，這道水柱非常鋒利，能輕易切開固體。","fo":"The User compacts water and shoots it as a pressurized jet. This jet is very sharp and can easily cut through solids.","ic":[0,1,2,14]},{"n":"Aqua Jet","z":"水流噴射","t":"水","c":"物理","g":4,"p":"2","a":"靈巧 + 運動","d":"力量/靈巧 + 2","e":"單體目標。先制反應 1。","o":"Single Target. Reaction 1.","f":"寶可夢以加壓水流作為推進器，推動自己前進。","fo":"The Pokémon propels themselves with a jet of pressured water.","ic":[1,113]},{"n":"Aqua Tail","z":"水流尾","t":"水","c":"物理","g":4,"p":"3","a":"靈巧/力量 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Roll 3 Chance Dice to Flinch the Target.","f":"使用者擺動尾巴製造出一個口袋大小的漩渦，對手被旋轉的動作吸了進去。","fo":"The user sways their tail to create a pocket whirlpool in which the foe gets sucked in by the spinning motion.","ic":[96,1,43]},{"n":"Aqua Ring","z":"水流環","t":"水","c":"變化","g":4,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：使用者。使用者在每個戰鬥輪結束時回復 1 HP。花費 1 點意志點以發動。持續整個場景。","o":"Target Self. The User heals 1 HP at the end of each Round. Spend 1 Will point to activate. Whole Scene Duration.","f":"寶可夢用清水包覆自己。","fo":"The Pokémon coats themselves in fresh water.","ic":[8,207,42]},{"n":"Liquidation","z":"水流裂破","t":"水","c":"物理","g":7,"p":"3","a":"力量 + 運動/鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。擲 2 顆機率骰，目標的防禦降低 1 點。","o":"Single Target. Lethal. Roll 2 Chance Dice to Reduce the Target's Defense by 1.","f":"寶可夢在爆發全力加壓水流的同時發動攻擊，水可能會切開或砸凹目標的盔甲。","fo":"The Pokémon strikes while bursting a full-force blast of pressurized water. The water heir target by kicking and splashing around.","ic":[1,280]},{"n":"Soak","z":"浸水","t":"水","c":"變化","g":5,"p":"—","a":"意志+ 自然","d":"-","e":"單體目標。將目標的屬性改為水。（例：噴火龍原為火／飛行，此招式後其屬性為水。）持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Change theTarget's Type to Water. (i.e. Charizard was Fire/Flying, after this Move their Type will be Water) Whole Scene Duration. This effect does not end by switching out the affected Pokémon.","f":"對手被淋得濕透，應該遠離電源插座和口渴的植物。","fo":"The foe gets soaking wet, they should stay away from electric outlets and thirsty plants.","ic":[1,42]},{"n":"Splishy Splash","z":"滔滔衝浪","t":"水","c":"特殊","g":7,"p":"3","a":"靈巧 + 運動","d":"特殊 + 3","e":"目標：範圍內所有敵人。擲 3 顆機率骰，使受影響者陷入麻痺。","o":"Target All Foes in Range. Roll 3 Chance Dice to Paralyze those affected.","f":"寶可夢乘著一道帶電的浪，看起來超級酷炫，卻也很危險，因為帶電的水並不適合衝浪。","fo":"The Pokémon rides a wave charged with electricity. It looks incredibly rad but it is also dangerous, as electrified water is not considered safe for surfing.","ic":[7,125]},{"n":"Chilling Water","z":"潑冷水","t":"水","c":"特殊","g":9,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。目標的力量降低 1 點。","o":"Single Target. Reduce the Target's Strength by 1.","f":"寶可夢向對手的頭上潑冷水，讓牠頭腦清醒、思路清晰。出乎意料，竟然有效。","fo":"The Pokémon douses cold water in the head of their foe in order to make them think straight. Surprisingly, it works.","ic":[1,334]},{"n":"Dive","z":"潛水","t":"水","c":"物理","g":3,"p":"3","a":"靈巧 + 隱匿","d":"力量 + 3","e":"單體目標。蓄力招式。蓄力期間處於範圍外。蓄力期間易受以下招式影響：熱水／衝浪／潮旋／冷凍乾燥／絕對零度。戰鬥外可讓寶可夢攜人在水中移動而不會有溺水風險。","o":"Single Target. Charge Move. Out of Range while Charging. Vulnerable while charging to: Scald/ Surf/ Whirlpool/ Freeze-Dry/ Sheer Cold. Out of battle allows the pokemon to move underwater carrying someone without risk of drowning.","f":"看看你四周的世界，就在海底這裡，美好的事物環繞著你，你還在尋找什麼呢？","fo":"Just look at the world around you right here on the ocean floor, such wonderful things surround you. What more are you lookin' for?","ic":[336,335,190,98]},{"n":"Whirlpool","z":"潮旋","t":"水","c":"特殊","g":2,"p": ":"*","a":"力量 + 鬥毆","d":"力量 + 3 *","e":"單體目標。啃咬類招式。*若這是使用者本戰鬥輪的第一個行動，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Bite Move. *If this is the first Action of the Round for the User, add 2 Extra Dice to the Damage pool of this Move.","f":"這隻寶可夢用鰓去咬目標，即使沒有牙齒，牠的顎也具有壓碎般的力量。","fo":"This Pokémon uses their gills to snap at its target. Even if they don't have teeth, their jaws have a crushing strength.","ic":[1,3,49]},{"n":"Brine","z":"鹽水","t":"水","c":"特殊","g":4,"p":"2","a":"靈巧 + 導引/自然","d":"特殊 + 2 *","e":"單體目標。*若目標的 HP 在一半或以下，傷害骰池額外增加 3 顆骰。傷害 *","o":"Single Target. *Add 3 Extra Dice to the Damage Pool if the Target is at half HP or less. Damage *","f":"一潑海水，真的是在對手的傷口上愈撒愈多的鹽。","fo":"A splash of sea water that literally adds more and more salt to the foe's wounds.","ic":[1,120]},{"n":"Ambush","z":"偷襲","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 隱匿","d":"-","e":"單體目標。戰鬥開始前，目標可擲 洞察 + 警覺 來抵抗，且成功數需相同或更多。使用者在擲先攻前擁有 1 個行動，此期間目標無法行動。其他敵人在此期間仍可閃避或對抗。","o":"Single Target. Before the Battle starts, Target may resist by rolling: Insight + Alert and scoring the same or more successes. The User has 1 Action before Initiatives are rolled in which the Target can't act. Other foes can still Evade or Clash during this time .","f":"在陰影中潛行，貼近地面，準備撲向毫無戒心的對手。","fo":"Sneak through the shadows, keep low to the ground and prepare to pounce on an unsuspecting foe.","ic":[1]},{"n":"Help Another","z":"協助同伴","t":"無","c":"變化","g":0,"p":"-","a":"與盟友嘗試的行動相同","d":"-","e":"目標：一名隊友。先制反應 1。將你的命中骰池當作機率骰來擲。每擲出 1 個，就為隊友的命中擲骰增加 6 顆骰。最多 3 名角色可以嘗試協助同一個行動。最多可用此方式增加 6 顆骰。","o":"Target One Ally. Reaction 1. Roll your Accuracy as if it were Chance dice. Add 1 die to the Accuracy Roll of your Ally for every 6 rolled. Up to 3 Characters may attempt to help a single action. Up to 6 Dice may be added this Way.","f":"不是最適合某項任務的人，不代表你不會盡自己的一份力來幫忙。最強的團隊是合作無間的！","fo":"Not being the best suited for a task doesn't mean you won't do your part in helping out. The best teams work together!","ic":[128,113]},{"n":"Clash","z":"對抗","t":"無","c":"變化","g":0,"p":"-","a":"力量/特殊 + 對抗","d":"-","e":"目標：使用者。先制反應 6。成功數需等於或高於針對使用者的招式的命中成功數。若成功，使用者進行對抗（詳見原書第 68 頁）。此技倆不受多重行動難度表影響。","o":"Target Self. Reaction 6. Match the number of successes on the Accuracy roll of a Move that targets the User. If successful, the user Clashes, see p.68 This Maneuver is not affected by the Multiple Action difficulty chart.","f":"一場力量的角力可能演變成實力的碰撞，通常會帶來爆炸性的結果。","fo":"A power struggle can become a clash of mights, usually with explosive results.","ic":[345,346]},{"n":"Struggle","z":"掙扎","t":"無","c":"物理","g":0,"p":"0","a":"靈巧 + 鬥毆/導引/投擲","d":"力量/特殊 + 0","e":"單體目標。","o":"Single Target.","f":"拚命扭打，盡全力想打出一擊。","fo":"Scuffle about and make every effort to deliver a blow.","ic":[1]},{"n":"Cover an Ally","z":"掩護同伴","t":"無","c":"變化","g":0,"p":"-","a":"意志","d":"-","e":"目標：一名隊友。先制反應 1。使用者會成為針對目標的攻擊的新目標。此掩護持續到使用者的下個回合，或直到目標使用近戰物理招式為止。忠誠度 2 以下的寶可夢不會使用此技倆。","o":"Target One Ally. Reaction 1. The User will become the target to incoming attacks towards the Target. This Cover lasts until the User's Next Turn or until the Target uses a Non-Ranged Physical Move. Pokémon with Loyalty 2 or less won't use this Maneuver.","f":"用你的身體當盾牌，保護你的朋友！就算一百隻烈雀也穿不過你！","fo":"Use your body as a shield to protect your friends! Not even 100 Spearrows will go through you!","ic":[128,113]},{"n":"Grapple","z":"擒抱","t":"無","c":"變化","g":0,"p":"-","a":"力量 + 運動/鬥毆","d":"-","e":"單體目標。阻擋。目標可以擲力量或靈巧值來抵抗此技倆，且成功數需不低於使用者。使用者在擒抱期間無法行動。使用者可在任何時候放開擒抱以進行行動。","o":"Single Target. Blocks. The Target may resist this Maneuver by rolling Strength or Dexterity score and scoring the same or more successes than the User. The User can't Act while Grappling. The User can release the Grapple at any point to act.","f":"把目標逼進摔角鎖技；像牛仔競技一樣用套索；或者乾脆抱住牠的一條腿——重點是：你不會讓牠逃走！","fo":"Force the target into a wrestling lock; use a lasso rodeo-style; or simply cling onto one of their legs — the point is: you won't let them escape!","ic":[1,16]},{"n":"Stabilize an Ally","z":"穩定同伴的傷勢","t":"無","c":"變化","g":0,"p":"-","a":"聰明 + 醫藥","d":"-","e":"使用者對一名隊友施行心肺復甦和／或急救。目標不再每小時受到致命傷害。隊友身上每有 1 點致命傷害，此技倆的命中骰池就扣除 1 個成功。此技倆每小時只能使用一次。","o":"The User applies CPR and/ or first aid to an Ally. Target won't receive Lethal Damage each hour anymore. Each Lethal Damage on the Ally reduces 1 Success to the Accuracy Pool of this Maneuver. This Maneuver can only be used once per hour.","f":"施壓！做胸部按壓！把毒吸出來！今天不會有任何人犧牲！","fo":"Apply pressure! Give chest compressions! Suck out the venom! You are not losing anyone today!","ic":[128]},{"n":"Run Away","z":"逃跑","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 運動","d":"-","e":"目標：使用者。使用者逃離戰場。結束戰鬥。敵人可以嘗試擲 靈巧 + 運動 阻止，且成功數需相同或更多。若使用者被阻擋，此技倆失敗。","o":"Target Self. The User runs away from the battlefield. End the battle. Foes might try to prevent this by rolling: Dexterity + Athletic and scoring the same or more successes. If the user is Blocked this Maneuver fails.","f":"不。不。不。","fo":"Nope. Nope. Nope.","ic":[8]},{"n":"Evasion","z":"閃避","t":"無","c":"變化","g":0,"p":"-","a":"靈巧 + 閃避","d":"-","e":"目標：使用者。先制反應 6。成功數需等於或高於針對使用者的招式的命中成功數。若成功，使用者進行閃避（詳見原書第 68 頁）。此技倆不受多重行動難度表影響。","o":"Target Self. Reaction 6. Match the number of successes on the Accuracy roll of a Move that targets the User. If successful, the user Evades, see p.68 This Maneuver is not affected by the Multiple Action difficulty chart.","f":"沒時間想了！如果你聽到「閃————避！」就要盡快讓開。","fo":"No time to think! If you hear “Doooooodge!” You get out of the way A.S.A.P.","ic":[345,346]}],GZ={"1": "第一世代（關都）", "2": "第二世代（城都）", "3": "第三世代（豐緣）", "4": "第四世代（神奧）", "5": "第五世代（合眾）", "6": "第六世代（卡洛斯）", "7": "第七世代（阿羅拉）", "8": "第八世代（伽勒爾、洗翠）", "9": "第九世代（帕底亞）"};
