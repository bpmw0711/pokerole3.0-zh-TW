 the sounds of nature. It is a very subtle tone, so it may be hard to listen.","ic":[57,1,5,205]},{"n":"Grav Apple","z":"萬有引力","t":"草","c":"物理","g":8,"p":"3","a":"力量 + 導引","d":"力量 + 3","e":"單體目標。遠程。目標的防禦降低 1 點。","o":"Single Target. Ranged. Reduce the Target's Defense by 1.","f":"寶可夢升到對手頭頂上，把一顆蘋果丟在牠頭上，對手接著吃起蘋果，因而從戰鬥中分心。","fo":"The Pokémon rises on top of its foe and drops an apple on their head. The foe proceeds to eat the apple, distracting it from the fight.","ic":[1,2,53]},{"n":"Petal Blizzard","z":"落英繽紛","t":"草","c":"物理","g":6,"p":"3","a":"靈巧 + 導引","d":"力量 + 3","e":"範圍招式。遠程。風類招式。","o":"Area Move. Ranged. Wind Move.","f":"一場猛烈的花瓣與葉片暴風雪橫掃整片區域，所過之處留下宜人的花香與一片殘破。","fo":"A raging blizzard of petals and leaves sweeps through the entire area, leaving a pleasant floral scent and destruction in its wake.","ic":[102,106,2]},{"n":"Leaf Blade","z":"葉刃","t":"草","c":"物理","g":3,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。高要害率。致命傷害。切割類招式。","o":"Single Target. High Critical. Lethal. Cutter Move.","f":"危險不在於材質有多堅硬，而在於刃口有多鋒利。","fo":"Danger lies not on the material's toughness but on its edge's sharpness.","ic":[20,1,0,14]},{"n":"Chloroblast","z":"葉綠爆震","t":"草","c":"特殊","g":8,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。反作用傷害。","o":"Single Target. Recoil.","f":"寶可夢把體內所有的葉綠素集中起來引爆，目標之後好幾天身上都會染成綠色。","fo":"The Pokémon concentrates all of the chlorophyll inside of their body to make it explode. Targets are tinted green for days afterwards.","ic":[1,135]},{"n":"Vine Whip","z":"藤鞭","t":"草","c":"物理","g":1,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。","o":"Single Target.","f":"寶可夢用身上的藤蔓狠狠抽打對手，這些藤蔓可以長達二十英尺，堅韌得像繩索一樣。","fo":"The Pokémon uses its body vines to give the foe a good smack. These vines can be as long as 20 feet and quite surdy as ropes.","ic":[1]},{"n":"Apple Acid","z":"蘋果酸","t":"草","c":"特殊","g":8,"p":"3","a":"體魄 + 導引","d":"特殊 + 3","e":"單體目標。敵人的特防降低 1 點。","o":"Single Target. Reduce the Foe's Sp. Defense by 1.","f":"寶可夢以所吃的酸蘋果製造出樹液，如果蘋果未熟，樹液就會很酸，對牙齒不好。","fo":"The Pokémon produces a sap from the tart apples they feed on, if the apples are not ripe their sap will be acidic and bad for teeth.","ic":[1,150]},{"n":"Spore","z":"蘑菇孢子","t":"草","c":"變化","g":1,"p":"—","a":"特殊 + 自然","d":"-","e":"單體目標。粉末類招式。使目標陷入睡眠。","o":"Single Target. Powder Move. Put the Target to Sleep.","f":"效果極強的催眠孢子，吸入有危險，可能會讓你一睡好幾天。","fo":"A very potent somniferous spore. Dangerous to inhale as it could make you sleep for days.","ic":[1,28,205]},{"n":"Trailblaze","z":"起草","t":"草","c":"物理","g":9,"p":"2","a":"靈巧 + 隱匿","d":"力量 + 2","e":"單體目標。使用者的靈巧提升 1 點。","o":"Single Target. Increase the User's Dexterity by 1.","f":"憑藉敏捷的腳步，使用者從高草叢中躍出，出其不意地攻擊對手。","fo":"With their nimble footwork. the user leaps out of the tall grass to take the foe by surprise.","ic":[1,29]},{"n":"Mega Drain","z":"超級吸取","t":"草","c":"特殊","g":1,"p":"2","a":"體魄 + 自然/導引","d":"特殊 + 2","e":"單體目標。使用者回復等同於造成傷害一半的 HP（無條件捨去）。","o":"Single Target. The User restores HP equal to half the damage dealt, rounded down.","f":"使用者從目標身上吸收大量的生命能量與養分，作為自己的食糧。","fo":"The user absorbs a big amount of vital energy and nutrients from the target to feed from.","ic":[1]},{"n":"Spicy Extract","z":"辣椒精華","t":"草","c":"變化","g":9,"p":"-","a":"聰明 + 導引","d":"-","e":"單體目標。目標的力量提升 2 點。目標的防禦降低 2 點。","o":"Single Target. Increase the Target's Strength by 2. Reduce the Target's Defense by 2.","f":"使用者向受害者下戰帖，要牠吃一根辣椒，對手出於自尊心吃了下去，卻痛苦不堪，因為那根辣椒裡灌了雙倍的辣椒萃取物。","fo":"The user dares their victim to eat a hot pepper, out of pride, the foe does and suffers as the pepper was double-loaded with spicy extract.","ic":[1,212,213]},{"n":"Grassy Terrain","z":"青草場地","t":"草","c":"變化","g":6,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：己方場地。所有物理與特殊的草屬性招式，傷害骰池額外增加 1 顆骰。使用者一側場地上的所有人，在每個戰鬥輪結束時回復 1 HP。花費 1 點意志點以發動。持續 4 個戰鬥輪。","o":"Target User's side of the field. Add 1 Extra Damage Dice to all Physi- cal & Special Grass-Type Moves. Everyone on the User's side of the field heals 1 HP at the end of each Round. Spend 1 Will point to activate. Duration 4 Rounds.","f":"使用者周圍的區域長出一片草地，大自然透過它賜予 率 3。粉末類招式。使目標陷入麻痺。","o":"Single Target. Low Accuracy 3. Powder Move. Paralyze the Target.","f":"一團麻痺花粉，會影響吸入者的神經，使肌肉痙攣。","fo":"A cloud of paralyzing pollen that affects the nerves and cramps the muscles of those who inhale it.","ic":[57,1,28,118]},{"n":"Drum Beating","z":"鼓擊","t":"草","c":"物理","g":8,"p":"3","a":"力量 + 表演","d":"力量 + 3","e":"單體目標。目標的靈巧降低 1 點。","o":"Single Target. Reduce the Target's Dexterity by 1.","f":"寶可夢手上明明有一面好好的鼓，你以為牠會用它，但牠沒有，牠用的是牠的對手。","fo":"The Pokémon has a perfectly good drum and you'd think it would use it. But it doesn't, It uses it's foe.","ic":[1,115]},{"n":"High Horsepower","z":"十萬馬力","t":"地面","c":"物理","g":7,"p":"4","a":"體魄 + 鬥毆","d":"力量 + 4","e":"單體目標。低命中率 1。","o":"Single Target. Low Accuracy 1.","f":"寶可夢毫不留情地踐踏對手，牠強壯的身體可以拉動牽引車行駛很長的距離。","fo":"The Pokémon tramples their foe without mercy. Their powerful body could pull a traction vehicle for very long distances.","ic":[1,23]},{"n":"Thousand Waves","z":"千波激盪","t":"地面","c":"物理","g":6,"p":"3","a":"力量 + 導引/隱匿","d":"力量 + 3","e":"目標：範圍內所有敵人。遠程。專用。阻擋。持續整個場景。","o":"Target All Foes in Range. Ranged. Unique. Blocks. Whole Scene Duration.","f":"堅實的地面變成流沙陷阱，裂開的大地會闔上，纏住你的腳。彷彿大地本身想困住你，看不到攻擊者，也看不到出路。","fo":"Solid ground becomes a sandtrap, cracked earth will close to ensnare your feet. It's as if the land itself wanted to trap you. There is no attacker nor escape in sight.","ic":[2,79,7,16,42]},{"n":"Thousand Arrows","z":"千箭齊發","t":"地面","c":"物理","g":6,"p":"3","a":"力量 + 導引/隱匿","d":"力量 + 3","e":"目標：範圍內所有敵人。遠程。致命傷害。專用。無視目標對地面屬性的免疫。移除受影響者對地面屬性招式的免疫。持續整個場景。","o":"Target All Foes in Range. Ranged. Lethal. Unique. Ignore the Target's immunity to Ground. Remove the immunity to Ground-Type Moves of those affected. Whole Scene Duration.","f":"憑空出現的尖銳碎片，從天空如雨般射向對手。就連飛行的生物被打中也會墜落地面。快找掩護，這會很痛。","fo":"Out of nowhere, pointy shards come raining from the sky towards the foes. Even flying creatures will fall to the ground if they are knocked by them. Take cover, this is gonna hurt.","ic":[20,2,7,79,42]},{"n":"Fissure","z":"地裂","t":"地面","c":"物理","g":1,"p":"","a":"力量 + 導引","d":"-","e":"單體目標。低命中率 5。遠程。對目標造成等同於其剩餘 HP 的傷害，再加上 1 點致命傷害。若目標因使用招式「挖洞」而處於範圍外，此招式仍會命中。","o":"Single Target. Low Accuracy 5. Ranged. Deal Damage to the Target equal to its Remaining HP, plus 1 Lethal Damage. If the Target is out of range due to using the Move “Dig” this Move hits anyways.","f":"大地在目標腳下裂開，把牠整個吞沒。你需要搜救隊才能把不幸的受害者從深處救出來。","fo":"The earth rips apart underneath the target and swallows them whole. You'll need a rescue team to recover the unlucky victim from the deep.","ic":[216,1,2]},{"n":"Earthquake","z":"地震","t":"地面","c":"物理","g":1,"p":"4","a":"力量 + 自然","d":"力量 + 4","e":"範圍招式。遠程。","o":"Area Move. Ranged.","f":"使用者呼喚大自然的力量，大地猛烈震動，一切都崩塌倒地。","fo":"The user calls the forces of nature. The earth shakes violently and everything crumbles to the ground.","ic":[106,2]},{"n":"Earth Power","z":"大地之力","t":"地面","c":"特殊","g":4,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，目標的特防降低 1 點。","o":"Single Target. Roll 1 Chance Die to Reduce the Target's Sp. Defense by 1.","f":"使用者放出一道地底的波動，在目標腳下爆開地面，彷彿大地都順從使用者的意志。","fo":"The user sends out a subterranean wave that bursts the ground below the target. It's as if the earth bends to the user's will.","ic":[1,4,150]},{"n":"Land's Wrath","z":"大地神力","t":"地面","c":"物理","g":6,"p":"3","a":"力量 + 導引/隱匿","d":"力量 + 3","e":"目標：範圍內所有敵人。遠程。致命傷害。專用。","o":"Target All Foes in Range. Ranged. Lethal. Unique.","f":"大地自行移動，卻看不到任何攻擊者。地面崩裂、大地震動，吞沒受害者。不久後，茂盛的樹木會從瓦礫中冒出。","fo":"The earth moves on its own, no attacker in sight. The floor crumbles and the ground shakes engulfing its victims. From the rubble, lush trees emerge a short time after.","ic":[20,7,79,2]},{"n":"Dig","z":"挖洞","t":"地面","c":"物理","g":1,"p":"3","a":"靈巧 + 隱匿","d":"力量 + 3","e":"單體目標。蓄力招式。蓄力期間處於範圍外。蓄力期間易受以下招式影響：大地之力／地震／地裂／震級／亂暴。戰鬥外可讓寶可夢挖洞並開鑿地下隧道。","o":"Single Target. Charge Move. Out of Range while Charging. Vulnerable while charging to: Earth Power/ Earthquake/ Fissure/ Magnitude/ Stomping Tantrum. Out of battle allows the pokemon to burrow and make underground tunnels.","f":"使用者在地面挖出隧道，再從目標下方鑽出來攻擊。這個招式曾被用來逃出洞窟，並潛入戒備森嚴的地方。","fo":"The user digs a tunnel on the ground and attacks by coming out from below its target. This move has been used to escape caves and gain access to highly surveiled places.","ic":[114,1,190,98]},{"n":"Spikes","z":"撒菱","t":"地面","c":"變化","g":2,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：敵方場地。入場危害。進入戰場的寶可夢受到 1 點無屬性傷害。此效果不會疊加。對地面屬性招式免疫的寶可夢不受影響。","o":"Target Foe's Side of the Field. Entry Hazard. Pokémon entering the battle Receive 1 Typeless Damage. This effect does not stack. Pokémon with immunity Ground-Type Moves arenot affected.","f":"尖銳的尖刺散布在場地各處，如果你不小心腳下，尖刺就會扎進你的腳。","fo":"Sharp and pointy spikes are scattered around the field, if you don't watch your step the spikes will dig on your feet.","ic":[41,224,40]},{"n":"Mud Slap","z":"擲泥","t":"地面","c":"特殊","g":2,"p":"1","a":"靈巧 + 導引","d":"特殊 + 1","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target.","f":"一顆泥球啪地打在對手臉上，縮小了牠的視野。","fo":"A mud ball splatters right into the foe's face, reducing their field of vision.","ic":[1,72]},{"n":"Precipice Blades","z":"斷崖之劍","t":"地面","c":"物理","g":6,"p":"5","a":"力量 + 導引","d":"力量 + 5","e":"目標：範圍內所有敵人。低命中率 2。遠程。致命傷害。專用。無視目標對地面屬性傷害的免疫。若目標因使用任何招式而處於「範圍外」，此招式仍然命中。","o":"Target All Foes in Range. Low Accuracy 2. Ranged. Lethal. Unique. Ignore the Target's immunity to Ground-Type Damage. If a Target is “Out of Range” due to using any Move, this Move hits anyways.","f":"巨大的刀刃從地面冒出，刺穿附近的倒楣鬼。你以為在空中就安全了嗎？再想想……","fo":"Giant blades emerge from the earth impaling the unlucky souls nearby. Do you think you are safe in the air? Think again...","ic":[21,20,7,79,2]},{"n":"Mud Shot","z":"泥巴射擊","t":"地面","c":"特殊","g":3,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"單體目標。目標的靈巧降低 1 點。","o":"Single Target. Reduce the Target's Dexterity by 1.","f":"使用者向目標射出一道泥流，成功妨礙牠的行動。","fo":"By shooting a stream of mud at their target, the user manages to impair their movement.","ic":[1,115]},{"n":"Mud Bomb","z":"泥巴炸彈","t":"地面","c":"特殊","g":4,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。低命中率 2。投彈類招式。擲 3 顆機率骰，使目標的所有命中擲骰減少 1 顆成功骰。","o":"Single Target. Low Accuracy 2. Projectile Move. Roll 3 Chance Die to Reduce 1 success to all Accuracy rolls of the Target.","f":"寶可夢射出一顆泥球，在受害者臉上炸開，試圖讓牠看不見。","fo":"The Pokémon shoots a ball of mud to burst on their victim's face in an attempt to blind them.","ic":[218,1,26,217,72]},{"n":"Sand Tomb","z":"流沙地獄","t":"地面","c":"物理","g":3,"p":"2","a":"力量 + 自然","d":"力量 + 2","e":"單體目標。低命中率 2。遠程。阻擋。持續傷害。持續 4 個戰鬥輪。由說書人裁定，提高目標閃避的難度。","o":"Single Target. Low Accuracy 2. Ranged. Blocks. Ongoing Damage. Duration 4 Rounds. Increase the Target's difficulty to Evade at Storyteller's discretion.","f":"寶可夢在對手周圍弄出一個流沙坑，把牠活埋。可憐的受害者在沙子愈陷愈深時掙扎著呼吸。","fo":"The Pokémon creates a pit of shifting sand around the foe to bury it alive. The poor victim struggles for air as the sand keeps sinking it lower and lower.","ic":[21,16,1,2,17,18]},{"n":"Sand Attack","z":"潑沙","t":"地面","c":"變化","g":1,"p":"—","a":"靈巧 + 隱匿","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target.","f":"沙子打進眼睛！在好幾個方面都是骯髒的手段。","fo":"Sand to the eyes! A dirty tactic in more ways than one.","ic":[1,72]},{"n":"Scorching Sands","z":"熱沙大地","t":"地面","c":"特殊","g":8,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。擲 3 顆機率骰，使敵人陷入灼傷 1 級。","o":"Single Target. Roll 3 Chance Dice to inflict 1st Degree Burn the foe.","f":"使用者周圍的沙子被加熱到灼人的高溫，再丟向對手。","fo":"The sand around the user heats to scorching temperatures as it is thrown against their foe.","ic":[1,223]},{"n":"Sandsear Storm","z":"熱沙風暴","t":"地面","c":"特殊","g":8,"p":"4","a":"特殊 + 自然","d":"特殊 + 4","e":"範圍招式。低命中率 2。致命傷害。風類招式。擲 3 顆機率骰，使受影響者陷入灼傷 2 級。","o":"Area Move. Low Accuracy 2. Lethal. Wind Move. Roll 3 Chance Dice to inflict 2nd Degree Burn those affected.","f":"由灼熱沙子構成的壓倒性風暴橫掃戰場，倖存者形容那就像被燃燒的炭火擊中。","fo":"An overwhelming storm made of blistering sands rages through the battlefield, survivors describe it as being hit with live coal embers.","ic":[21,20,106,102,222]},{"n":"Mud Sport","z":"玩泥巴","t":"地面","c":"變化","g":3,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。物理與特殊的電屬性招式，威力視為 0。弱點為電屬性的寶可夢，不會受到電屬性招式的效果絕佳傷害。持續 4 個戰鬥輪。","o":"Target Battlefield. Physical & Special Electric-Type Moves have Power 0. Pokémon weak to Electric- Type Moves won't receive Super-Effective Damage from them. Duration 4 Rounds.","f":"使用者用泥巴蓋滿整個場地，電流無法正常流動，因此電屬性攻擊會大幅減弱。","fo":"The user covers the whole field with mud. Electricity can't flow properly, so Electric attacks will be severely impaired.","ic":[108,107,110,18]},{"n":"Drill Run","z":"直衝鑽","t":"地面","c":"物理","g":5,"p":"3","a":"靈巧 + 運動/鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。高要害率。","o":"Single Target. Lethal. High Critical.","f":"寶可夢把雙爪併在一起並開始旋轉，就像一把鑽頭。從牆壁、地板到對手，牠可以在任何表面鑽出洞來。","fo":"The Pokémon holds their claws together and starts spinning as if they were a drill. They can puncture a hole into any surface from walls and floors to their foes.","ic":[20,1,0]},{"n":"Headlong Rush","z":"突飛猛撲","t":"地面","c":"物理","g":8,"p":"5","a":"力量 + 鬥毆","d":"力量 + 5","e":"單體目標。使用者的防禦、特防降低 1 點。","o":"Single Target. Reduce by 1 the User's Defense & Sp. Defense.","f":"這隻寶可夢的頑固是字面上的「頭很硬」，真的真的是字面上的意思。","fo":"This Pokémon is headstrong in a very very literal way.","ic":[1,66,147]},{"n":"Rototiller","z":"耕地","t":"地面","c":"變化","g":6,"p":"—","a":"洞察 + 自然","d":"-","e":"目標：整個戰場。所有草屬性寶可夢的力量與特殊提升 1 點。","o":"Target Battlefield. Increase by 1 the Strength and Special of all Grass-Type Pokémon.","f":"寶可夢在戰場上到處挖掘，把土壤翻鬆，使其成為適合耕作的好地。","fo":"The Pokémon digs around the battlefield to soften the soil and make it ideal for harvest.","ic":[221,219,110,220,64,85]},{"n":"Stomping Tantrum","z":"跺腳","t":"地面","c":"物理","g":7,"p":"3","a":"力量 + 威嚇","d":"力量 + 3 *","e":"單體目標。*若使用者上一個使用的招式命中擲骰失敗，此招式的傷害骰池額外增加 2 顆骰。若目標因使用招式「挖洞」而處於範圍外，此招式仍會命中。","o":"Single Target. *Add 2 Extra Dice to the Damage Pool of this Move if the User failed the Accuracy Roll of the last Move it performed. If the Target is out of range due to using the Move “Dig” this Move hits anyways.","f":"寶可夢發起脾氣，到處亂踩亂踏，如果先前有什麼事讓牠受挫，情況會更糟。","fo":"The Pokémon throws a tantrum and stomps all over the place, it becomes worse if something has previously frustrated them.","ic":[1,49]},{"n":"Bulldoze","z":"重踏","t":"地面","c":"物理","g":5,"p":"2","a":"力量 + 自然","d":"力量 + 2","e":"範圍招式。靈巧降低 1 點。","o":"Area Move. Reduce by 1 the Dexterity of those Affected.","f":"使用者猛踩並壓平地面，把所有雜物都推開，讓地面隨時可以動工興建。","fo":"The user stomps and flattens the ground, pushing all the rubbish and leaving the surface ready for construction.","ic":[106,115]},{"n":"Shore Up","z":"集沙","t":"地面","c":"變化","g":7,"p":"-","a":"洞察 + 自然","d":"-","e":"目標：使用者。基礎治療。若命中成功，花費 1 點意志點以發動。若在沙暴天氣下使用，此招式為強效治療。","o":"Target Self. Basic Heal. If successful, spend 1 Will point to activate. If performed under Sandstorm weather, this Move is a Complete Heal.","f":"寶可夢把周圍的沙子聚集到自己身上，讓身體恢復原狀。","fo":"The Pokémon gathers the sand around themselves to restore their body to shape.","ic":[8,15]},{"n":"Magnitude","z":"震級","t":"地面","c":"物理","g":2,"p":"","a":"力量 + 自然","d":"力量 + X *","e":"範圍招式。遠程。在擲傷害之前，先擲 1 顆骰來決定此招式的威力。","o":"Area Move. Ranged. Before you roll damage, Roll 1 die to determine this Move's Power.","f":"使用者搖動戰場下方的板塊，試圖尋找斷層，一旦找到，這個招式就具有毀滅性。","fo":"The user shakes the tectonic plates underneath the battlefield, trying to find a fault, when they do, this Move is devastating.","ic":[106,2]},{"n":"Bone Club","z":"骨棒","t":"地面","c":"物理","g":1,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。擲 2 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Roll 2 Chance Dice to Flinch the Target.","f":"寶可夢用骨頭當作棍棒敲打對手，可以聽到響亮的「咚！」一聲。","fo":"The Pokémon uses a bone as a club to to smack their foe, a loud “Bonk!” sound can be heard.","ic":[23,1,54]},{"n":"Bone Rush","z":"骨棒亂打","t":"地面","c":"物理","g":2,"p":"1","a":"靈巧 + 鬥毆","d":"力量 + 1","e":"單體目標。低命中率 1。連續行動。","o":"Single Target. Low Accuracy 1. Succesive Actions.","f":"對手遭到骨棍的一連串猛攻。","fo":"The foe is assaulted by a series of flurry strikes with a bone club.","ic":[23,1,13]},{"n":"Bonemerang","z":"骨頭回力鏢","t":"地面","c":"物理","g":1,"p":"2","a":"力量 + 導引","d":"力量 + 2","e":"單體目標。低命中率 1。遠程。雙重行動。","o":"Single Target. Low Accuracy 1. Ranged. Double Action.","f":"寶可夢把骨頭擲向對手，骨頭在空中旋轉，又飛回來再打一次。","fo":"The Pokémon throws their bone against the foe, the bone spins in the air and makes a comeback to strike a second time.","ic":[23,1,22,46]},{"n":"Triple Axel","z":"三旋擊","t":"冰","c":"物理","g":8,"p":"*","a":"靈巧 + 鬥毆","d":"力量 + 1 *","e":"三重行動。*傷害額外增加 1 顆骰（第 2 擊），並額外增加 2 顆骰（第 3 擊）。**第二擊的低命中率為 1。***第三擊的低命中率為 2。","o":"Triple Action. *Add 1 Extra Die to the Damage of the 2nd hit and 2 Extra Dice to the Damage of the 3rd hit. **Second hit has Low Accuracy 1. ***Third hit has Low Accuracy 2.","f":"一連串冷血的踢擊，能打斷骨頭，就像打碎脆弱的薄冰一樣。","fo":"A series of cold-blooded kicks that break bone as they would break brittle ice.","ic":[23,161,1,21,49,160]},{"n":"Freezy Frost","z":"冰冰霜凍","t":"冰","c":"特殊","g":7,"p":"3","a":"特殊 + 表演","d":"特殊 + 3","e":"單體目標。低命中率 1。移除目標身上所有被提升或被降低的能力值與特質。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. Low Accuracy 1. Remove all Increased or Reduced Attributes and Traits the Target may have. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"使用者一邊說著「別動！」一邊碰觸對手，出人意料的是，對手竟被凍在一塊冰裡，而這塊冰在對手發現這只是遊戲時就融化了。","fo":"The user touches its foe while saying “Freeze!”, surprisingly, the foe becomes frozen on a block of ice that melts as soon as the foe realizes it was just a game.","ic":[1,23]},{"n":"Icy Wind","z":"冰凍之風","t":"冰","c":"特殊","g":2,"p":"2","a":"特殊 + 自然","d":"特殊 + 2","e":"目標：範圍內所有敵人。風類招式。靈巧降低 1 點。","o":"Target All Foes in Range. Wind Move. Reduce by 1 the Dexterity of those affected.","f":"極地的風橫掃場地，每個人都開始發抖並抱緊自己，努力保留一點暖意。","fo":"Polar winds sweep through the arena. Everyone starts to shiver and embrace themselves, trying to preserve a bit of warmth.","ic":[7,102,115]},{"n":"Freeze Shock","z":"冰凍伏特","t":"冰","c":"物理","g":5,"p":"6","a":"力量 + 導引","d":"力量 + 6","e":"單體目標。低命中率 1。蓄力招式。遠程。致命傷害。專用。擲 3 顆機率骰，使目標陷入麻痺。","o":"Single Target. Low Accuracy 1. Charge Move. Ranged. Lethal. Unique. Roll 3 Chance Dice to Paralyze the Target.","f":"使用者看起來變成一塊冰，然後以毀滅性的放電掙脫冰塊。爆開的冰塊碎片與閃電飛遍整個戰場。","fo":"The user appears to become a block of ice, then releases itself from the ice with a devastating discharge. The exploding ice shards and the lightning fly all over the battlefield.","ic":[23,114,1,20,2,79,89]},{"n":"Ice Beam","z":"冰凍光束","t":"冰","c":"特殊","g":1,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標陷入冰凍。","o":"Single Target. Roll 1 Chance Die to Freeze the Target.","f":"寶可夢射出一道寒冷的光束，把環境中的所有暖意降到冰點。","fo":"The Pokémon shoots a cold beam that reduces all warmth on the environment up to freezing point.","ic":[1,225]},{"n":"Ice Punch","z":"冰凍拳","t":"冰","c":"物理","g":1,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。拳類招式。擲 1 顆機率骰，使目標陷入冰凍。","o":"Single Target. Fist Move. Roll 1 Chance Dice to Freeze the Target.","f":"寶可夢戴上冰做的手套去揍對手。沒錯，就是用冰做的手套。","fo":"The Pokémon wears their ice gloves to punch the foe. Yes. Gloves made of ice.","ic":[1,82,225]},{"n":"Ice Fang","z":"冰凍牙","t":"冰","c":"物理","g":4,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 1。啃咬類招式。擲 2 顆機率骰，使目標畏縮。擲 2 顆機率骰，使目標陷入冰凍。","o":"Single Target. Low Accuracy 1. Bite Move. Roll 2 Chance Dice to Flinch the Target. Roll 2 Chance Dice to Freeze the Target.","f":"寶可夢用鋒利的牙齒咬住對手，並吹出冰冷的氣息，直接讓骨頭結冰。","fo":"The Pokémon bites their foe with sharp teeth and a geli breath to chill their bones directly.","ic":[23,3,1,54,231]},{"n":"Glaciate","z":"冰封世界","t":"冰","c":"特殊","g":5,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"目標：範圍內所有敵人。致命傷害。專用。靈巧降低 1 點。擲 3 顆機率骰，使受影響者陷入冰凍。","o":"Target All Foes in Range. Lethal. Unique. Reduce by 1 the Dexterity of those Affected. Roll 3 Chance Dice to Freeze those Affected.","f":"空氣冷到連動一下、看一眼、呼吸都會痛。逃離這裡應是你的首要之務，因為你多待一秒，性命就多一分危險。","fo":"The air is so cold it hurts to move, to see, to breath. Escaping should be your top priority, for every second you don't your life will be at peril.","ic":[20,79,7,115,228]},{"n":"Mountain Gale","z":"冰山風","t":"冰","c":"物理","g":8,"p":"4","a":"力量 + 導引","d":"力量 + 4","e":"單體目標。遠程。擲 3 顆機率骰，使敵人畏縮。","o":"Single Target. Ranged. Roll 3 Chance Dice to Flinch the foe.","f":"如果敵人不去山那邊，就把山丟向敵人。","fo":"If the foe does not go to the mountain, hurl the mountain into the foe.","ic":[1,2,234]},{"n":"Frost Breath","z":"冰息","t":"冰","c":"特殊","g":5,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。低命中率 1。此招式一律視為擊中要害，並獲得相應的加成。","o":"Single Target. Low Accuracy 1. This Move is always considered to be a Critical Hit and gets the proper Bonus for it.","f":"使用者找出對手最暴露的部位，對牠吹出一口冰冷的氣息，突如其來的寒意直竄對手的脊椎。","fo":"The user locates the most exposed parts of its foe and sends a gelid breath against it. The sudden chill goes right through the foe's spine.","ic":[1,23]},{"n":"Ice Spinner","z":"冰旋","t":"冰","c":"物理","g":9,"p":"3","a":"靈巧/力量 + 運動","d":"力量 + 3","e":"單體目標。移除戰場上任何生效中的場地。","o":"Single Target. Remove any active Terrain on the Battlefield.","f":"使用者在腳上裝上鋒利的冰刃，在場地上優雅地旋轉滑行，撞擊目標。不過戰場最後也會被冰刃劃得傷痕累累。","fo":"The user covers their feet with sharp ice blades and skates through the field making gracious spins to hit the target. The battlefield ends up cut by the blades though.","ic":[1]},{"n":"Icicle Crash","z":"冰柱墜擊","t":"冰","c":"物理","g":5,"p":"3","a":"靈巧 + 導引","d":"力量 + 3","e":"單體目標。低命中率 1。致命傷害。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Lethal. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢在對手頭頂製造出一根巨大的鐘乳冰柱，讓它落在對手身上，有時還能把對手釘在地上。","fo":"The Pokémon creates a big stalactite on top of the foe and lets it fall on top of it. Sometimes they manage to impale the foe to the ground.","ic":[96,1,20,43]},{"n":"Ice Ball","z":"冰球","t":"冰","c":"物理","g":3,"p":"1","a":"靈巧 + 運動/ 鬥毆","d":"力量 + 1 *","e":"單體目標。低命中率 1。連續行動。*若 5 次行動全部命中，此招式最後一擊的傷害骰池額外增加 1 顆骰。若寶可夢在同一戰鬥輪中使用過「變圓」，此招式的基礎威力變為 2。","o":"Single Target. Low Accuracy 1. Successive Actions. *If all 5 actions land successfully, add 1 Extra Die to the Damage Pool of the last hit of this Move. If the Pokémon used the Move “Defense Curl” in the same round, this Move's base Power becomes 2.","f":"寶可夢蜷成一顆雪球滾動，愈滾愈大。","fo":"The Pokémon rolls into a snowball, getting bigger and bigger as they keep rolling.","ic":[23,1,13,161]},{"n":"Ice Shard","z":"冰礫","t":"冰","c":"物理","g":4,"p":"2","a":"靈巧 + 導引","d":"力量 + 2","e":"單體目標。先制反應 1。遠程。","o":"Single Target. Reaction 1. Ranged.","f":"寶可夢以非凡的速度射出一顆冰彈，就像北極最快的槍手。","fo":"With extraordinary swiftness, the Pokémon shoots an ice bullet like the fastest gun in the North Pole.","ic":[1,206,232]},{"n":"Icicle Spear","z":"冰錐","t":"冰","c":"物理","g":3,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。遠程。連續行動。","o":"Single Target. Ranged. Successive Actions.","f":"一陣冰錐彈幕射向目標，冰錐雖小，卻又尖又利。","fo":"A barrage of icicles shot against the target. They are small but sharp and pointy.","ic":[1,2,13]},{"n":"Ice Hammer","z":"冰錘","t":"冰","c":"物理","g":7,"p":"4","a":"力量 + 鬥毆","d":"力量 + 4","e":"單體目標。低命中率 1。使用者的靈巧降低 1 點。","o":"Single Target. Low Accuracy 1. Reduce User's Dexterity by 1.","f":"寶可夢用強大而冰冷的手臂，以揮擊的動作打擊對手。","fo":"The Pokémon uses its powerful gelid arms and strikes the foe with a swing motion.","ic":[23,1,151]},{"n":"Hail","z":"冰雹","t":"冰","c":"變化","g":3,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。啟動冰雹天氣。持續 4 個戰鬥輪。","o":"Target Battlefield. Activate Hail Weather. Duration 4 Rounds.","f":"天空轉為灰色，雷聲隆隆，但落下的不是溫柔的細雨，而是以高速傾瀉而下、永無止境的冰塊碎片。快找地方躲避！","fo":"The skies turn gray, and loud thunder rumbles, but what falls is not a gentle drizzle, but an endless stream of ice shards coming down at high speeds. Find shelter!","ic":[110,229,18]},{"n":"Freeze Dry","z":"冷凍乾燥","t":"冰","c":"特殊","g":6,"p":"3","a":"特殊 + 自然","d":"特殊 + 3","e":"單體目標。水屬性寶可夢受到此招式的效果絕佳傷害。","o":"Single Target. Water-Type Pokémon receive Super-Effective Damage from this Move.","f":"所有水分都被冰凍，再承受高壓而瞬間蒸發。水屬性寶可夢受這個招式的影響最大。","fo":"All moisture is frozen and then subjected to high pressure, evaporating it immediately. Water-type Pokémon suffer this Move the most.","ic":[1]},{"n":"Chilly Reception","z":"冷笑話","t":"冰","c":"變化","g":9,"p":"—","a":"缺少的帥氣點數","d":"-","e":"目標：整個戰場。使用者方替換招式。啟動下雪天氣。持續 4 個戰鬥輪。擁有此招式的寶可夢可以完全放棄其帥氣值。若寶可夢忘記此招式，恢復 1 點帥氣值。","o":"Target Battlefield. Switcher Move For the User. Activate Snowy Weather. Duration 4 Rounds. Pokémon with this Move may forfeit their Cool score completely. If the Pokémon forgets this Move, restore 1 Point to their Cool Score.","f":"「一隻小拳石對另一隻小拳石說了什麼？我們一起搖滾吧（Let's Rock）！」使用者講了一個爛到極點的笑話，整個戰場都凍結了。事後，使用者羞愧地退場。","fo":"“What did a Geodude say to another Geodude? Let's Rock!” The User tells a joke so terrible the whole battlefield freezes. Afterwards, the user retreats in shame.","ic":[227,110,226,18]},{"n":"Blizzard","z":"暴風雪","t":"冰","c":"特殊","g":1,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"範圍內所有敵人。低命中率 2。致命傷害。風類招式。擲 1 顆機率骰，使受影響者陷入冰凍。*大晴天會使低命中率增加至 4。**冰雹／下雪天氣會移除低命中率，並加上「必中」效果。","o":"All Foes in Range. Low Accuracy 2. Lethal. Wind Move. Roll 1 Chance Die to Freeze those affected. *Sunny Weather increases to Low Accuracy 4. **Hail/Snowy Weather remove Low Accuracy and adds the effect “Never Miss”.","f":"使用者召喚出狂亂又冰冷的風，感覺就像冰製的匕首。晴朗的日子可能很難召喚，但如果氣溫降到零度以下，就要小心了。","fo":"The user summons a turbulent and gelid wind that feels like ice daggers. A pleasant day may make it difficult to call upon, but beware if the temperatures go below zero.","ic":[21,20,7,59,102,225]},{"n":"Aurora Veil","z":"極光幕","t":"冰","c":"變化","g":7,"p":"-","a":"特殊 + 導引","d":"-","e":"目標：己方場地。針對物理與特殊傷害的防護力場。若不是在冰雹／下雪天氣下使用，此招式會失敗。持續 4 個戰鬥輪，即使冰雹或下雪天氣已結束也一樣。","o":"Target User's Side of the Field. Force Field against Physical & Special Damage. This move will fail if not performed under Hail/ Snowy Weather. Duration 4 Rounds, even if Hail or Snow Weather is over.","f":"如果天氣夠冷，美麗的極光會覆蓋半個戰場，彈開攻擊。","fo":"If the weather is cold enough, beautiful aurora lights will cover half of the battlefield, deflecting attacks.","ic":[18,50,195,51]},{"n":"Aurora Beam","z":"極光束","t":"冰","c":"特殊","g":1,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，目標的力量降低 1 點。","o":"Single Target. Roll 1 Chance Die to Reduce Target's Strength by 1.","f":"寶可夢射出美麗閃爍的光束，能讓火爆的脾氣冷靜下來。","fo":"The Pokémon shoots a beautiful shimmering beam that cools down a hot temper.","ic":[1,4,74]},{"n":"Ice Burn","z":"極寒冷焰","t":"冰","c":"特殊","g":5,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。致命傷害。蓄力招式。專用。擲 3 顆機率骰，使目標陷入灼傷 1 級。","o":"Single Target. Low Accuracy 1. Lethal. Charge Move. Unique. Roll 3 Chance Dice to Inflict 1st Degree Burn on the Target.","f":"使用者看起來變成一塊冰，然後以毀滅性的爆炸掙脫冰塊。爆開的冰塊碎片與火焰飛遍整個戰場。","fo":"The user appears to become a block of ice, then it releases themselves from the ice with a devastating explosion. The exploding ice shards and fire blow all over the battlefield.","ic":[23,114,1,20,79,230]},{"n":"Mist","z":"白霧","t":"冰","c":"變化","g":1,"p":"—","a":"特殊 + 自然/隱匿","d":"-","e":"目標：使用者與範圍內的隊友。目標的能力值與特質無法被降低。先前已被降低的能力值與特質維持不變。持續 4 個戰鬥輪。","o":"Target User and Allies in Range. Targets cannot have their Attributes or Traits Reduced. Previously Reduced Attributes and Traits remain. Duration 4 Rounds.","f":"一層濃密的霧氣掩護著一群寶可夢，想要欺騙並削弱牠們的人，必須先找到牠們。","fo":"A thick layer of mist cloaks a pack of pokémon, those with the intent to trick and weaken them will have to find them first.","ic":[90,233,18]},{"n":"Powder Snow","z":"細雪","t":"冰","c":"特殊","g":2,"p":"2","a":"靈巧 + 導引","d":"特殊 + 2","e":"目標：範圍內所有敵人。擲 1 顆機率骰，使受影響者陷入冰凍。","o":"Target All Foes in Range. Roll 1 Chance die to Freeze those affected.","f":"一層薄薄的雪花覆蓋對手，隨著雪愈積愈厚，被困在雪中的可能性也愈高。","fo":"A light layer of snow flakes covers the foes, as the layers pile up the possibilities to be trapped into the snow increase.","ic":[7,225]},{"n":"Sheer Cold","z":"絕對零度","t":"冰","c":"特殊","g":3,"p":"","a":"特殊 + 自然","d":"-","e":"單體目標。低命中率 5。對目標造成等同於其剩餘 HP 的傷害，再加上 1 點致命傷害。","o":"Single Target. Low Accuracy 5. Deal Damage equal to the Target's Remaining HP, plus 1 Lethal Damage.","f":"寶可夢從內而外被凍結，達到絕對零度。需要立刻就醫。","fo":"The Pokémon reaches an absolute zero by being freezed from the inside out. Urgent medical attention is required.","ic":[1,216]},{"n":"Avalanche","z":"雪崩","t":"冰","c":"物理","g":4," e. It can't even cry for help or all of it will go into its mouth.","ic":[21,1,2,294]},{"n":"Belch","z":"打嗝","t":"毒","c":"特殊","g":6,"p":"4","a":"缺少的美麗點數","d":"特殊 + 4","e":"單體目標。低命中率 1。聲音類招式。使用者必須在使用此招式前的戰鬥輪中吃下一顆樹果或類似的東西，否則此招式失敗。此效果每吃一顆樹果／食物只能發動一次。","o":"Single Target. Low Accuracy 1. Sound Move. The user must eat a berry or something similar during the Round before using this Move, otherwise it will fail. This effects only works once per berry/food eaten.","f":"沒禮貌已經夠糟了，故意對著對手的臉打嗝更是低級。","fo":"Bad manners were bad enough already, but purposely pointing at the foe's face is just low.","ic":[1,23,5]},{"n":"Mortal Spin","z":"晶光轉轉","t":"毒","c":"物理","g":9,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"範圍內所有敵人。使受影響者中毒。從使用者或其場地上移除入場危害、場地（例：青草場地、薄霧場地）、持續傷害與寄生種子。","o":"All foes in Range. Poison the those Affected. Remove Entry Hazards, Terrains (ie. Grassy Terrain, Misty Terrain) Ongoing Damage and Leech seed from the User or their side of the field.","f":"使用者在場地上旋轉，劈開障礙物並射出裝滿劇毒的小飛鏢。大地從此中毒，一片荒蕪。","fo":"The user spins around the field, cutting through obstacles and shooting small darts full of a toxic venom. The earth is now poisoned and left barren.","ic":[7,296]},{"n":"Barb Barrage","z":"毒千針","t":"毒","c":"物理","g":8,"p":"*","a":"力量 + 導引","d":"力量 + 2 *","e":"單體目標。遠程。擲 3 顆機率骰，使目標陷入中毒。*若目標已處於異常狀態，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Ranged. Roll 3 Chance Dice to Poison the Target. *If the Target already has an active Status Condition, add 2 Extra Dice to the Damage Pool of this Move.","f":"使用者射出一陣有毒的針，向對手注入毒液，這種毒液對已經受傷虛弱的對象特別有效。","fo":"The user shoots a blast of venomous pins that inject venom into the foe, this venom is specially potent against those already compromised.","ic":[2,1,289,49]},{"n":"Poison Tail","z":"毒尾","t":"毒","c":"物理","g":3,"p":"2","a":"靈巧 + 鬥毆","d":"力量 + 2","e":"單體目標。高要害率。擲 1 顆機率骰，使目標陷入中毒。","o":"Single Target. High Critical. Roll 1 Chance Die to Poison the Target.","f":"浸了毒液的鋒利尖端，一記不論哪層意義上都結下惡緣（bad blood，惡血）的攻擊。","fo":"A sharp edge dipped in venom—an attack in bad  Accuracy 2. Roll 4 Chance Dice to Poison the Target.","f":"寶可夢釋放出一道骯髒的氣體，對手也許會試著屏住呼吸，但能撐多久呢？","fo":"The Pokémon releases a stream of filthy gases. The foe may try to hold their breath, but for how long?","ic":[21,1,300]},{"n":"Coil","z":"盤蜷","t":"毒","c":"變化","g":5,"p":"—","a":"強壯 + 威嚇","d":"-","e":"目標：使用者。使用者的力量、防禦提升 1 點。","o":"Target Self. Increase by 1 the User's Strength and Defense score and Accuracy Pools.","f":"寶可夢蜷縮起來，對手很快就發現，這不是躲藏中的獵物的姿勢，而是獵人準備噴出毒液的姿勢。","fo":"The Pokémon curls up into themselves. Foes soon realize this is not the position of a prey in hiding, but of a hunter about to spit their venom.","ic":[64,8,86,65]},{"n":"Baneful Bunker","z":"碉堡","t":"毒","c":"變化","g":7,"p":"-","a":"體魄 + 自然","d":"-","e":"目標：使用者。先制反應 4。護盾招式。使用者受到傷害性招式時，減少 3 點傷害。*若敵人對使用者使用非遠程物理招式，使該敵人陷入中毒。","o":"Target Self. Reaction 4. Shield Move. Reduce 3 Damage the User would receive from a Damaging Move. *If the Foe used a Non-Ranged Physical Move against the user, Poison the foe.","f":"使用者把自己關進一個布滿毒刺的堅固殼裡，如果有倒刺刺進目標的皮膚，傷口就會開始潰爛。","fo":"The user encloses themselves inside a sturdy shell covered by poisonous barbs, if a barb pinches the Target's skin, the wound will start to fester.","ic":[36,8,34,288]},{"n":"Gastro Acid","z":"胃液","t":"毒","c":"變化","g":4,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。無效化目標特性會產生的任何效果。持續整個場景。無效化","o":"Single Target. Negate any effect the Target's Ability would have. Whole Scene Duration. Negate","f":"使用者向對手噴出自己的胃液，噁心得讓對手只想著要趕快把自己洗乾淨。","fo":"The user spews their gastric juices on the foe. It's so disgusting the foe can only concentrate on getting cleaned ASAP.","ic":[1,293,42]},{"n":"Corrosive Gas","z":"腐蝕氣體","t":"毒","c":"變化","g":8,"p":"-","a":"特殊 + 自然","d":"-","e":"範圍招式。受影響者失去其攜帶道具。","o":"Area attack. Those affected lose their held item.","f":"寶可夢釋放出強力的酸性氣體，在幾秒內熔化所有無機物質。","fo":"The Pokémon releases a powerful acidic gas that melts all inorganic matter in seconds.","ic":[106]},{"n":"Shell Side Arm","z":"臂貝武器","t":"毒","c":"特殊","g":8,"p":"3","a":"特殊 + 導引 / 力量 + 鬥毆 t as they were about to be hit, and suddenly there's another Pokémon in their place. Di-Did the user disappear? Or was it never there to begin with?","ic":[304,130,227]},{"n":"Hypnosis","z":"催眠術","t":"超能力","c":"變化","g":1,"p":"—","a":"聰明 + 導引","d":"-","e":"單體目標。低命中率 3。使目標陷入睡眠。惡屬性寶可夢也會受到此招式影響。","o":"Single Target. Low Accuracy 3. Put the Target to sleep. Dark-Type Pokémon are affected by this Move.","f":"盯著一個催眠擺錘，目標會被暗示感到疲倦，闔上眼皮。","fo":"By staring at an hypnotic pendulum, the target is suggestioned to feel tired and close its eyelids.","ic":[57,1,56]},{"n":"Photon Geyser","z":"光子噴湧","t":"超能力","c":"物理","g":7,"p":"4","a":"靈巧 + 導引","d":"力量/特殊 + 4","e":"單體目標。致命傷害。專用。此招式的傷害骰池可用力量或特殊來擲，分別造成物理或特殊傷害。選擇對使用者最方便的方式。","o":"Single Target. Lethal. Unique. This Move's Damage Pool, can be rolled with either the Strength or Special Attribute, dealing Physical or Special Damage respectively. Choose whatever is most convenient for the user.","f":"寶可夢以一道從腳下冒出的巨大光柱攻擊，不論是熾烈的能量還是毀滅性的衝擊，都足以擊倒對手。","fo":"The Pokémon attacks with a large pillar of light that comes out from they stand, either the blazing energy or the crushing strike are enough to knock foes out.","ic":[67,1,79]},{"n":"Light Screen","z":"光牆","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：己方場地。防護力場。","o":"Target the User's side of the field. Force Field.","f":"戰場一半的範圍被建立起光之屏障，所有試圖穿過的能量一穿過就會消散。","fo":"A barrier of light is created over half of the battlefield, all energy trying to go trough dissolves as it crosses it.","ic":[18,50,195,51]},{"n":"Calm Mind","z":"冥想","t":"超能力","c":"變化","g":3,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。使用者的特殊、特防提升 1 點。","o":"Target Self. Increase by 1 the User's Special and Sp. Defense.","f":"寶可夢深呼吸，增強面對任何難題所需的心智堅韌度。","fo":"The Pokémon takes a deep breath to increase the mental fortitude required to face any problem.","ic":[8,87,85]},{"n":"Freezing Glare","z":"冰冷視線","t":"超能力","c":"特殊","g":8,"p":"3","a":"洞察 + 威嚇","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標陷入冰凍。","o":"Single Target Roll 1 Chance Die to Freeze the Target.","f":"寶可夢從那該死的眼睛，對所有會動的東西發射該死的雷射光束……直到什麼都不會動為止。","fo":"The Pokémon shoots freakin' laser beams from its freakin' eyes against everything that moves...until nothing does.","ic":[1,225]},{"n":"Power Swap","z":"力量互換","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將使用者的力量與特殊，與目標的對調。","o":"Single Target. Switch the User's Strength and Special with the Target's.","f":"寶可夢進入對手的心靈，偷走牠的力量，並在對方心中植入自己脆弱的想法。","fo":"The Pokémon enters their foe's mind to steal its power and implant on them the idea of their own frailty.","ic":[1]},{"n":"Power Split","z":"力量平分","t":"超能力","c":"變化","g":5,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將使用者的力量與特殊，與目標的取平均值（無條件捨去）。","o":"Single Target. Average the User's Strength and Special with the Target's, rounded down.","f":"透過心靈連結，兩隻寶可夢都知道彼此的長處，最終拉平了雙方的差距。","fo":"Through a mental link both Pokémon are aware of each other strengths, which ends up evening the odds.","ic":[1]},{"n":"Power Trick","z":"力量戲法","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。將使用者的力量與防禦對調，特殊與特防對調。","o":"Target Self. Switch the User's Strength with their Defense and Special with their Sp. Defense.","f":"寶可夢欺騙自己的心靈，讓牠相信自己的體魄就是力量，反之亦然。","fo":"The Pokémon tricks their own mind to believe their vitality is their power and vice versa.","ic":[8]},{"n":"Take Heart","z":"勇氣填充","t":"超能力","c":"變化","g":8,"p":"1","a":"意志 + 導引","d":"-","e":"目標：使用者。","o":"Target Self.","f":"只有你才能做到的事，才能讓這顆藍色星球不失去光芒。相信自己，展現你勇敢的心。","fo":"There's something only you can do so that this blue planet doesn't lose it's light. Believe in yourself and show your brave heart.","ic":[201,313,85,87]},{"n":"Reflect","z":"反射壁","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：己方場地。防護力場。","o":"Target the User's side of the field. Force Field.","f":"一道如鏡子般的虛幻牆壁把戰場一分為二，彈回大部分打擊的衝擊。","fo":"An ethereal mirror-like wall cuts the battlefield in half, bouncing back the impact of most blows.","ic":[18,50,195,51]},{"n":"Synchronoise","z":"同步干擾","t":"超能力","c":"特殊","g":5,"p":"5","a":"特殊 + 導引/表演","d":"特殊 + 5","e":"範圍招式。聲音類招式。選擇一種屬性（火、毒、鋼等），此招式只會影響擁有該屬性的對象。","o":"Area Move. Sound Move. Choose one Type (Fire, Poison, Steel, etc.) This move only affects those with that Type.","f":"每一種能量都被一層薄薄的粒子包裹著，只要用對的振動頻率，這層薄膜就能像玻璃一樣碎裂。","fo":"Each type of energy is contained by a thin layer of particles. With the right vibration frequency, that thin layer can be shattered like glass.","ic":[106,5]},{"n":"Glitzy Glow","z":"嘩嘩氣場","t":"超能力","c":"特殊","g":7,"p":"3","a":"特殊 + 禮儀","d":"特殊 + 3","e":"單體目標。造成傷害後，在己方場地啟動持續 4 個戰鬥輪、針對特殊傷害的防護力場。若此招式的使用者已是最終進化階段，則此招式失敗。","o":"Single Target. After dealing damage, activate a Force Field against Special Damage with a Duration of 4 Rounds on the User's side of the Field. If the user of this Move is at its Final Stage of Evolution, this move fails.","f":"使用者被華麗的光芒包圍，並射出超能量爆炸，發光的粒子留在場上，守護著牠的光彩奪目。","fo":"The user surrounds themselves with a glamorous light and shoots a psychic blast, the glowing particles remain in the field protecting their fabulousness.","ic":[18,50,1,51]},{"n":"Heal Block","z":"回復封鎖","t":"超能力","c":"變化","g":4,"p":"—","a":"強壯 + 導引","d":"-","e":"範圍招式。受影響者無法回復 HP。持續 4 個戰鬥輪。","o":"Area Move. Those affected can't restore HP. Duration 4 Rounds.","f":"透過一場強大的精神攻勢，寶可夢喚回周圍所有人對痛苦的記憶。","fo":"Through a massive mental onslaught, the Pokémon brings back the memories of pain on everyone around.","ic":[106,308,18]},{"n":"Wonder Room","z":"奇妙空間","t":"超能力","c":"變化","g":5,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：整個戰場。戰場上所有人的防禦與特防改以洞察計算，而非體魄。若使用「以洞察作為特防」的可選規則，則對調計算方式。持續 4 個戰鬥輪。","o":"Target the Battlefield. Everyone on the Battlefield will have their Defense and Sp. Defense calculated with Insight instead of Vitality. If using Insight as Sp. Defense optional rule, swap the calculation. Duration 4 Rounds.","f":"戰場變成一個考驗心智的空間，堅強的心智會帶來堅強的身體，但如果心智脆弱，身體也會感到虛弱無力。","fo":"The battlefield is now a space that puts the mind to the test. A resilient mind will be a resilient body, but if the mind is weak the body will feel frail and feeble.","ic":[110,18]},{"n":"Miracle Eye","z":"奇跡之眼","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 警覺","d":"-","e":"目標：使用者。使用者的超能力屬性招式無視惡屬性的免疫。目標無法閃避使用者的招式。此寶可夢的命中不會被招式、道具或特性降低。（例：潑沙、光粉等。）持續整個場景。","o":"Target Self. The User's Psychic-Type Moves ignore Dark-Type Immunity. Targets cannot Evade the User's Moves. This Pokémon's Accuracy cannot be Reduced by Move's, Items or Abilities. (i.e. Sand Attack, Bright Powder, etc.). Whole Scene Duration.","f":"寶可夢睜開第三隻眼，牠的視線超越血肉的屏障，沒有任何人能不被發現。","fo":"The Pokémon opens up the third eye. Their sight trascends the barriers of flesh. No one goes undetected.","ic":[8,42]},{"n":"Cosmic Power","z":"宇宙力量","t":"超能力","c":"變化","g":3,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者的防禦、特防提升 1 點。","o":"Target Self. Increase by 1 the User's Defense and Sp. Defense.","f":"寶可夢提升自己的小宇宙，增強身體與心智的強韌度。","fo":"The Pokémon elevates their cosmos to enhance their physical and mental fortitude.","ic":[8,87,86]},{"n":"Imprison","z":"封印","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 導引","d":"-","e":"目標：使用者。使用者在戰場上時，敵人無法使用使用者所會的招式。若使用者離開戰鬥，此效果結束。","o":"Target Self. While the User is on the battlefield, Moves known by the User cannot be used by foes. This effect ends if the user is removed from battle.","f":"這個招式封鎖使用者所清楚知道的、一切共有的記憶。招式、技巧、名字、地點、人物或情境，沒有人能想起那些被囚禁的記憶。","fo":"This move blocks all shared parts of a memory the user is well aware of. Moves, techniques, names, places, people or situations, no one will be able to recall those imprisoned memories.","ic":[8]},{"n":"Barrier","z":"屏障","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者的防禦提升 2 點。","o":"Target Self. Increase the User's Defense by 2.","f":"每當對手試圖靠近使用者，就會突然停下，彷彿有什麼……或有誰，阻止了牠的行動。","fo":"Whenever a foe attempts to to get too close to the user, they suddenly stop as if something ...or someone, prevented their movement.","ic":[8,274]},{"n":"Psyshield Bash","z":"屏障猛攻","t":"超能力","c":"物理","g":8,"p":"2","a":"體魄 + 鬥毆","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使用者的防禦、特防提升 1 點。","o":"Single Target. Roll 3 Chance Dice to Increase by 1 the User's Defense and Sp. Defense.","f":"使用者用超能量的盾牌裹住自己，然後撞向對手。","fo":"The user cloaks itself in a shield of psychic energy then rams into the foe.","ic":[1,141,86,87]},{"n":"Psybeam","z":"幻象光線","t":"超能力","c":"特殊","g":1,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 1 Chance Die to Confuse the Target.","f":"對手的心靈遭到一道精神射線攻擊，事後可能會出現幻覺。","fo":"The foe's mind isassaulted by a mental ray, afterwards they may suffer from hallucinations.","ic":[1,312]},{"n":"Expanding Force","z":"廣域戰力","t":"超能力","c":"特殊","g":8,"p":"*","a":"特殊 + 導引","d":"特殊 + 3 *","e":"單體目標。致命傷害。*若精神場地生效中，傷害骰池額外增加 2 顆骰，並且可再增加一個目標。","o":"Single Target. Lethal. *If Psychic Terrain is active, add 2 Extra Dice to the Damage Pool of this Move and you may add another target to it.","f":"超能量形成光之泡泡傷害對手。在精神場地下，能量大得變成一根高聳的光柱，壓垮裡面的所有人。","fo":"Psychic energies form a bubble of light to damage the foe. Under Psychic Terrain, the energy is so big it turns into a tall pillar that crushes anyone inside.","ic":[20,1,49]},{"n":"Heart Swap","z":"心靈互換","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 魅惑","d":"-","e":"單體目標。將使用者身上的特質與能力值增減，與目標身上的對調。","o":"Single Target. Switch the User's Trait and Attribute Increases and Reductions with those on the Target's.","f":"使用者進入對手的心靈，把自己不安的感受植入對方心中，並拿走對方對自己的自信。","fo":"The User enters the mind of the foe to give implant them with their own feelings of insecurity and take the foe's feelings of confidence in itself.","ic":[1]},{"n":"Confusion","z":"念力","t":"超能力","c":"特殊","g":1,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使目標陷入混亂。","o":"Single Target. Roll 1 Chance Die to Confuse the Target.","f":"基本的精神攻擊，讓對手以為自己正遭到隱形敵人的攻擊。","fo":"A basic mental assault that makes the foe believe they are being attacked by an invisible enemy.","ic":[1,305]},{"n":"Telekinesis","z":"意念移物","t":"超能力","c":"變化","g":5,"p":"—","a":"特殊 + 導引","d":"-","e":"單體目標。目標對地面屬性招式免疫。目標無法閃避。持續 2 個戰鬥輪。","o":"Single Target. Target becomes immune to Ground-Type Moves. Target can't Evade. Duration 2 Rounds.","f":"目標離開地面飄浮，使用者的念力讓牠無法動彈。","fo":"The target levitates from the ground as the user's telekinetic powers prevent its movement.","ic":[1,314]},{"n":"Zen Headbutt","z":"意念頭錘","t":"超能力","c":"物理","g":4,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。低命中率 1。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Low Accuracy 1. Roll 3 Chance Dice to Flinch the Target.","f":"寶可夢同時運用精神與肉體的力量，發出一記令人存疑卻有效的「超能力」攻擊。","fo":"The Pokémon uses both their mental and physical prowess in a questionable yet effective “psychic” strike.","ic":[1,23,256]},{"n":"Heart Stamp","z":"愛心印章","t":"超能力","c":"物理","g":5,"p":"2","a":"洞察 + 魅惑","d":"力量 + 2","e":"單體目標。擲 3 顆機率骰，使目標畏縮。","o":"Single Target. Roll 3 Chance Die to Flinch the Target.","f":"寶可夢控制受害者的情緒，就在他們開始感到被愛與安全時發動攻擊，可憐的受害者因此心碎了好幾秒鐘。","fo":"The Pokémon controls the emotions of their victims just as they start to feel loved and safe, the Pokémon strikes. The poor victim is left broken hearted for a few seconds.","ic":[1,127]},{"n":"Trick","z":"戲法","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 魅惑/隱匿","d":"-","e":"單體目標。使用者與目標交換攜帶道具。若只有一方持有道具，則將道具給對方。","o":"Single Target. The User and the Target switch their Held Item. If only one Pokémon is holding an Item, it gives it away.","f":"使用者控制目標的心智，讓牠做出簡單而不帶敵意的動作，例如走路或遞出道具。不過有些寶可夢只是使用簡單的小把戲。","fo":"The user controls its target's mind to make them do a simple non-hostile action, such as walking or handing an item. Although some Pokémon use simple sleigh of hand.","ic":[1]},{"n":"Trick Room","z":"戲法空間","t":"超能力","c":"變化","g":4,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：整個戰場。將先攻順序顛倒。持續 4 個戰鬥輪。","o":"Target the Battlefield. Invert the order of Initiative. Duration 4 Rounds.","f":"戰場內的現實被扭曲，時間彎折，對每個人的流動都不一樣。不急著衝的人比較容易適應。","fo":"Reality inside the battlefielfield is distorted, time bends and flows differently for everyone. Those who don't rush through manage to adapt easier.","ic":[110,18]},{"n":"Role Play","z":"扮演","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 表演","d":"-","e":"單體目標。用目標的特性取代使用者的特性。持續整個場景。專屬特性無法被複製。","o":"Single Target. Replace the User's Ability with the Target's. Whole Scene Duration. Unique Abilities can't be copied.","f":"這隻寶可夢是個出色的演員，牠的模仿真的非常棒！……也許有點太棒了。","fo":"The Pokémon is a great actor. Their impersonations are really good! ...maybe a bit too good.","ic":[1,215,42]},{"n":"Kinesis","z":"折彎湯匙","t":"超能力","c":"變化","g":1,"p":"—","a":"靈巧 + 導引","d":"-","e":"單體目標。目標所有命中擲骰扣除 1 個成功。","o":"Single Target. Reduce 1 success to all the Accuracy Rolls of the Target.","f":"超能力的基本展示，讓物體和其他生物短暫地懸浮。","fo":"A basic display of psychic abilities, making objects and other creatures levitate for a short period of time.","ic":[1,72]},{"n":"Lunar Blessing","z":"新月祈禱","t":"超能力","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"*目標：使用者，或一名隊友。專用。若命中成功，花費 1 點意志點以發動。強效治療。治癒目標的所有異常狀態。一名敵人的所有命中擲骰扣除 1 個成功。","o":"*Target User or Target one Ally. Unique. If successful, spend 1 Will point to activate. Complete Heal. Heal all Status Ailments on the Target. Reduce 1 success to all the Accuracy Rolls of one foe.","f":"請信仰月亮，在黑暗的時刻祈禱，它就會為你的心帶來光明、引導迷途的人，並驅逐陰影中的生物。","fo":"Put your faith on the moon, pray during dark times and it shall bring light into your heart, guide the strayed, and cast away the creatures from the shadows.","ic":[79,8,128,279,201,72]},{"n":"Lunar Dance","z":"新月舞","t":"超能力","c":"變化","g":4,"p":"-","a":"洞察 + 表演","d":"-","e":"目標：使用者。專用。對使用者自己擲出等同於其剩餘 HP 的無屬性傷害骰。一名隊友目標回復全部 HP，並治癒所有異常狀態；若其已昏厥，則恢復意識。若所選目標不在戰場上，會被叫出場，並以與使用者相同的剩餘行動數準備戰鬥。","o":"Target Self. Unique. Roll the User's Remaining HP as Typeless Damage dice to itself. One allied Target restores its full HP and it is cured from any Status Condition, if it was fainted, restore conciousness. If the chosen Target is not in-battle, it is called out and ready to fight with the same remaining actions as the user.","f":"月亮在最黑暗的時刻發光，把太陽賜予生命的光芒映在墜入黑夜的人身上。克雷色利亞憐憫那些迷失的靈魂，引領牠們走向黎明。","fo":"The moon shines at the darkest hours, reflecting sun's life bringer light on those fallen into the night. Cresselia takes pity of their lost souls and guides them towards the dawn.","ic":[8,79]},{"n":"Esper Wing","z":"氣場之翼","t":"超能力","c":"特殊","g":8,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。高要害率。使用者的靈巧提升 1 點。","o":"Single Target. High Critical. Increase the User's Dexterity by 1.","f":"使用者以透過翅膀導引的超能量斬擊對手，這股能量也讓牠能切開空氣，飛得更快。","fo":"The User slashes the foe with psychic energy channeled through their wings. This energy also allows it to cut through the air and fly faster.","ic":[1,0,84]},{"n":"Healing Wish","z":"治癒之願","t":"超能力","c":"變化","g":4,"p":"—","a":"意志 + 導引","d":"-","e":"目標：使用者。使用者昏厥。一名隊友目標回復全部 HP，並治癒所有異常狀態。若所選目標不在戰場上，會被叫出場，並以與使用者相同的剩餘行動數準備戰鬥。","o":"Target Self. The user faints. One allied Target restores its full HP and it is cured from any Status Condition. If the chosen Target is not in-battle, it is called out and ready to fight with the same remaining actions as the user.","f":"為了展現真正的無私，使用者為了他人的福祉，作出最終的犧牲。","fo":"In a display of true selflessness, the user makes the ultimate sacrifice for the well-being of others.","ic":[8]},{"n":"Heal Pulse","z":"治癒波動","t":"超能力","c":"變化","g":5,"p":"—","a":"意志 + 導引","d":"-","e":"目標：一名隊友。基礎治療。若命中成功，花費 1 點意志點以發動。","o":"Target One Ally. Basic Heal. If successful, spend 1 Will point to activate.","f":"以意念駕馭物質，寶可夢加快同伴的療癒過程。","fo":"Commanding the mind over the matter, the Pokémon speeds up the healing process on an ally.","ic":[128,15]},{"n":"Luster Purge","z":"潔淨光芒","t":"超能力","c":"特殊","g":3,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。專用。擲 5 顆機率骰，目標的特防降低 1 點。*此效果對每個目標最多可疊加 3 次。","o":"Single Target. Unique. Roll 5 Chance Dice to Reduce the Target's Sp. Defense by 1. *This Effect can stack up to 3 times per Target.","f":"使用者被刺眼的光芒包圍，並朝對手射出一道光束，這道光讓對手無力抵抗這場襲擊。","fo":"The user engulfs itself in a blinding light and shoots a light beam at its foe, this light leaves the foe powerless to resist the assault.","ic":[79,1,310,150]},{"n":"Skill Swap","z":"特性互換","t":"超能力","c":"變化","g":3,"p":"—","a":"聰明 + 導引","d":"-","e":"單體目標。將使用者的特性與目標的對調。持續整個場景。此效果不會因為被影響的寶可夢換下場而結束。","o":"Single Target. Switch the User's Ability with the Target's. Whole Scene Duration. This effect does not end by switching out the affected Pokémon.","f":"寶可夢進入對手的心靈，吸收該物種的特質，同時讓對手以為自己是另一個物種的一員。事後對手會陷入身分認同危機。","fo":"The Pokémon enters their foe's mind to assimilate the traits of that species while make the foe think it is a member from another species. The foe gets an identity crisis afterwards.","ic":[1,215,42]},{"n":"Lumina Crash","z":"琉光衝激","t":"超能力","c":"特殊","g":9,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。敵人的特防降低 2 點。","o":"Single Target. Reduce the Foe's Sp. Defense by 2.","f":"使用者閃出一種光的圖樣，衝擊對手的心靈，讓牠在一陣子內舉止失常。","fo":"The user flashes a light pattern that crashes the foe's mind, leaving it acting erraticaly for a few moments.","ic":[1,309]},{"n":"Meditate","z":"瑜伽姿勢","t":"超能力","c":"變化","g":1,"p":"—","a":"洞察 + 導引","d":"-","e":"目標：使用者。使用者的力量提升 1 點。","o":"Target Self Increase by 1 the User's Strength.","f":"透過冥想，寶可夢把心智的力量帶入身體之中。","fo":"Through meditation the Pokémon brings forward their mind's strength into their body.","ic":[8,64]},{"n":"Hyperspace Hole","z":"異次元洞","t":"超能力","c":"特殊","g":6,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。必中。專用。無視防禦。無視護盾招式與防護力場。","o":"Single Target. Never Miss. Unique. Ignore Defenses. Ignore Shield Moves, and Force Field.","f":"物理定律禁止一個物體同時出現在多個地方，也禁止與其他物體占據同一個空間。但使用者無視這些法則的權威。","fo":"The laws of physics forbid one object from being in many places at once and from occupying the same space as other bodies. But the user disregards their autorithy.","ic":[1,79,59]},{"n":"Rest","z":"睡覺","t":"超能力","c":"變化","g":1,"p":"—","a":"體魄 + 自然","d":"-","e":"目標：使用者。強效治療。若命中成功，花費 1 點意志點以發動。使使用者陷入睡眠。","o":"Target Self. Complete Heal. If successful, spend 1 Will point to activate. Put the User to Sleep.","f":"嗯，這裡看起來是個適合睡個午覺的好地方。","fo":"Yeah, this seems like a good spot to take a nap.","ic":[8,56,279]},{"n":"Amnesia","z":"瞬間失憶","t":"超能力","c":"變化","g":1,"p":"—","a":"聰明 + 警覺","d":"-","e":"目標：使用者。使用者的特防提升 2 點。","o":"Target Self. Increase the User's Sp. Defense by 2.","f":"沒在想事情，腦袋空空。","fo":"No thoughts. Head empty.","ic":[8,134]},{"n":"Teleport","z":"瞬間移動","t":"超能力","c":"變化","g":1,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：使用者。使用者方替換招式。在野外，戰鬥可能結束。戰鬥外，瞬間移動的距離與限制由使用者的特殊值與說書人裁定。","o":"Target Self. Switcher Move for the User. In the wild the battle may end. Out of battle, Teleportation distances and limitations are determined by the user's Special Score and Storyteller's discretion.","f":"現在你看得到我，現在你看不到。","fo":"Now you see me. Now you don't.","ic":[8,227]},{"n":"Mystical Power","z":"神秘之力","t":"超能力","c":"變化","g":8,"p":"-","a":"意志 + 導引","d":"-","e":"目標：使用者。使用者最低的一項能力值／特質提升 2 點。若某項能力值／特質已達 6 或更高，此效果失敗。可以用此方式提升不同的能力值／特質。","o":"Target Self. Increase by 2 the User's lowest Attribute/ Trait. If an Attribute/Trait Score is 6 or More this effect fails. Different Attributes/Traits may be increased this way.","f":"力量就在你的內心。你能在心中感受到它，也能在腦海中看見它。相信你自己，然後拿起它吧！","fo":"The power is inside you. You can feel it in your heart, you can see it in your mind. Believe in yourself and take it!","ic":[8,311]},{"n":"Extrasensory","z":"神通力","t":"超能力","c":"特殊","g":3,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，使目標畏縮。","o":"Single Target. Roll 1 Chance Die to Flinch the Target.","f":"寶可夢改變目標的感官，讓牠感覺到並不存在的東西。","fo":"The Pokémon alters their target's senses, making it feel things that aren't really there.","ic":[1,307]},{"n":"Prismatic Laser","z":"稜鏡鐳射","t":"超能力","c":"特殊","g":7,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。致命傷害。需要重新充能。專用。","o":"Single Target. Lethal. Must Recharge. Unique.","f":"使用者透過稜鏡射出集中的雷射光束，穿透接觸到的一切。這番付出會讓使用者精神上精疲力盡。","fo":"Through a prism, the user shoots a concentrated laser beam that pierces everything that comes in contact with it. The effort leaves the user mentally exhausted.","ic":[20,1,79,97]},{"n":"Psychic Fangs","z":"精神之牙","t":"超能力","c":"物理","g":7,"p":"3","a":"力量 + 鬥毆","d":"力量 + 3","e":"單體目標。啃咬類招式。若目標一側的場地上有防護力場，將其摧毀。","o":"Single Target. Bite Move. If there is a Force Field on the Target's side of the field, destroy it","f":"寶可夢露出尖牙咬向對手，在真正的牙齒接觸之前，超能量就已經開始穿刺。","fo":"The Pokémon bares its fangs to bite the foe, psychic energy begins piercing before the actual fangs make contact.","ic":[1,3]},{"n":"Psycho Cut","z":"精神利刃","t":"超能力","c":"物理","g":4,"p":"3","a":"洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。遠程。高要害率。切割類招式。","o":"Single Target. Ranged. High Critical. Cutter Move.","f":"使用者放出一把由超能量構成的無形之劍，即使目標距離很遠也能斬到。","fo":"The user sends out an invisible sword made with psychic energy that slashes targets even if they are far away.","ic":[2,1,0,14]},{"n":"Psyblade","z":"精神劍","t":"超能力","c":"物理","g":9,"p":"3","a":"靈巧/洞察 + 鬥毆","d":"力量 + 3","e":"單體目標。致命傷害。切割類招式。*若電氣場地生效中，此招式的傷害骰池額外增加 2 顆骰。","o":"Single Target. Lethal. Cutter Move. *If Electric Terrain is active, add 2 Extra Dice to the Damage pool of this Move.","f":"寶可夢用一把虛幻的刀刃攻擊，電能會讓刀刃更加鋒利。","fo":"The Pokémon attacks using an ethereal blade. Electric energy will increase the sharpness of its edge.","ic":[20,1,14,49]},{"n":"Psychic Noise","z":"精神噪音","t":"超能力","c":"特殊","g":9,"p":"2","a":"洞察 + 導引/警覺","d":"特殊 + 2","e":"單體目標。目標無法回復 HP。持續 2 個戰鬥輪。","o":"Single Target. Target can't restore HP. Duration 2 Rounds.","f":"目標會頭痛欲裂，慘到腦袋裡只聽得到白噪音。","fo":"The target gets a migraine so awful it can only hear white noise inside of its head.","ic":[1,308,314]},{"n":"Psychic Terrain","z":"精神場地","t":"超能力","c":"變化","g":7,"p":"-","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。所有物理與特殊的超能力屬性招式，傷害骰池額外增加 1 顆骰。不具地面免疫的寶可夢無法使用帶有先制反應或後制反應的招式。持續 4 個戰鬥輪。","o":"Target Battlefield. Add 1 Extra Damage Dice to all Physical & Special Psychic-Type Moves. Pokémon without immunity to Ground can't use Moves with Reaction or Late Reaction. Duration 4 Rounds.","f":"場地受到超能量波照射，每個人的頭腦裡都嗡嗡作響、思緒遲鈍，讓所有事情都比應有的時間更久才完成。","fo":"The arena becomes radiated by psychic waves. Everyone feels their mind slog due to the buzz in their heads, making all tasks take longer than they should.","ic":[315,111,110,316,317,18]},{"n":"Psychic","z":"精神強念","t":"超能力","c":"特殊","g":1,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，目標的特防降低 1 點。","o":"Single Target. Roll 1 Chance Die to Reduce the Target's Sp. Defense by 1.","f":"最具代表性的超能力攻擊，對手開始飄浮在空中，隨著念力左搖右晃，心靈的屏障逐漸崩塌。","fo":"The most iconic Psychic attack, the foe starts floating in the air and its swayed around by telekinesis as their mental barrier crumbles.","ic":[1,37,150]},{"n":"Psystrike","z":"精神擊破","t":"超能力","c":"特殊","g":5,"p":"4","a":"靈巧 + 導引","d":"特殊 + 4","e":"單體目標。致命傷害。專用。此招式以敵人的防禦取代其特防來抵抗。","o":"Single Target. Lethal. Unique. This Move is resisted with the Foe's Defense instead of its Sp. Defense.","f":"憑藉純粹的超能力，使用者把自己的能量實體化，對對手打出沉重的一擊。","fo":"Through sheer psychic power, the user materializes its energy to deal a heavy strike to its foe.","ic":[1,67,79]},{"n":"Psywave","z":"精神波","t":"超能力","c":"特殊","g":1,"p":"","a":"洞察 + 威嚇","d":"依情況而定","e":"依使用者的階級擲出超能力屬性傷害骰：啟程 1 顆／新手 2 顆／標準 4 顆／進階 6 顆／專家 8 顆／王牌以上 10 顆。無視防禦。","o":"Roll Psychic-Type Damage Dice according to the User's Rank: Starter 1 Die / Rookie 2 Dice / Standard 4 Dice / Advanced 6 Dice / Expert 8 Dice / Ace and forward 10 Dice. Ignore Defenses.","f":"強大的精神波直接衝擊目標的大腦，從被遺忘的記憶到宇宙的祕密，在短短幾秒內轟炸牠的心靈。","fo":"A powerful mental wave assault's the target's brain directly. Everything, from forgotten memories to the secrets of the universe bombard its mind in just a few seconds.","ic":[1]},{"n":"Psycho Boost","z":"精神突進","t":"超能力","c":"特殊","g":3,"p":"6","a":"特殊 + 導引","d":"特殊 + 6","e":"單體目標。低命中率 1。致命傷害。專用。使用者的特殊降低 2 點。","o":"Single Target. Low Accuracy 1. Lethal. Unique. Reduce User's Special by 2.","f":"寶可夢把集中的全部超能力化為毀滅性的爆炸釋放，事後使用者會極度疲憊。","fo":"The Pokémon releases an explosion of all of its concentrated psychic power in a devastating explosion, afterwards the user will be extremely tired.","ic":[23,20,1,79,88]},{"n":"Psyshock","z":"精神衝擊","t":"超能力","c":"特殊","g":5,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。此招式以目標的防禦取代其特防來抵抗。","o":"Single Target. This Move is resisted with the Target's Defense instead of its Sp. Defense.","f":"衝擊是精神上的，打擊卻是真實的。","fo":"The shock is mental, the blow is real.","ic":[1]},{"n":"Psycho Shift","z":"精神轉移","t":"超能力","c":"變化","g":4,"p":"—","a":"意志 + 導引","d":"-","e":"單體目標。將使用者的所有異常狀態複製給目標。之後，治癒使用者的所有異常狀態。","o":"Single Target. Copy all of the User's Status Ailments into the Target. Afterwards, Heal the User from any Status Ailment.","f":"僅憑精神暗示，使用者竟讓對手真的感受到自己的病痛，使用者事後則說服自己已經痊癒。","fo":"Through sheer mental suggestion, the user actually makes their target feel their sickness. The user convinces themselves they are healed afterwards.","ic":[1,318]},{"n":"Mist Ball","z":"薄霧球","t":"超能力","c":"特殊","g":3,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。專用。投彈類招式。擲 5 顆機率骰，目標的特殊降低 1 點。此效果對每個目標最多可疊加 3 次。","o":"Single Target. Unique. Projectile Move. Roll 5 Chance Dice to Reduce the Target's Special by 1. This Effect can be stacked up to 3 times per Target.","f":"使用者用一團雲霧包住對手，這片撫慰人心的霧氣讓邪惡的念頭無法浮現在目標的腦海中。","fo":"The user engulfs its foe with a cloud, this soothing mist keeps evil intents from surfacing ino the Target's mind.","ic":[79,1,26,310,75]},{"n":"Instruct","z":"號令","t":"超能力","c":"變化","g":7,"p":"-","a":"洞察 + 魅惑","d":"-","e":"單體目標。複製招式。專用招式無法被複製。你可以為被複製的招式另選目標。","o":"Single Target. Copy Move. Unique Moves can't be copied. You may choose another Target(s) for the copied Move.","f":"寶可夢對目標發出一道念力指令，使用者能以意念告訴牠該做什麼。如果你看到寶可夢在攻擊自己的同伴……就是這招。","fo":"The Pokémon sends a psychic command to a target, enabling the user to mentally tell them what to do. If you see a Pokémon attacking their own allies... this was it.","ic":[1,193]},{"n":"Eerie Spell","z":"詭異咒語","t":"超能力","c":"特殊","g":8,"p":"3","a":"洞察 + 威嚇","d":"特殊 + 3","e":"單體目標。聲音類。目標無謂地花費 3 點意志點，此效果不會疊加。","o":"Single Target. Sound-based. Target spends 3 Will points without any benefit, this effect does not stack.","f":"寶可夢喃喃念著古老的咒語，禁忌的話語擊潰受害者的精神，使牠更容易受到操控。","fo":"The Pokémon mutters ancient spell, forbidden words break the spirit to make the victim easier to manipulate.","ic":[1,306,5]},{"n":"Stored Power","z":"輔助力量","t":"超能力","c":"特殊","g":5,"p":"1","a":"特殊 + 導引","d":"特殊 + 1 *","e":"單體目標。*使用者每有 1 點能力值或特質提升，傷害骰池就增加 1 顆骰，總計最多 7 顆。（例：使用者防禦被提升 2 點，傷害骰增加 2 顆。）","o":"Single Target. *Add 1 Die to the Damage Pool of this Move for each Attribute or Trait increase the User has, up to a maximum of 7 total Dice. (eg. The user has 2 increased Points of Defense, add 2 Damage Dice).","f":"這個招式讓使用者釋放自己的力量，如果使用者身上有任何強化，傷害就會增加。","fo":"This move allows the user to release its power. If the user has any boosts, the damage is increased.","ic":[1,76]},{"n":"Speed Swap","z":"速度互換","t":"超能力","c":"變化","g":7,"p":"-","a":"洞察 + 導引","d":"-","e":"單體目標。將使用者的靈巧與目標的對調。","o":"Single Target. Switch the User's Dexterity with the Target's.","f":"使用者憑超能力，讓對手感知事物彷彿以高速或慢動作發生，視使用者自身的速度而定。","fo":"With their psychic power, the user makes the foe perceive events as if they were happening at fast speed or in slow motion, depending on the user's own speed.","ic":[1]},{"n":"Gravity","z":"重力","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察/力量 + 導引","d":"-","e":"目標：整個戰場。移除場上所有人對地面屬性招式的免疫。需要跳躍或飛行的招式額外獲得「低命中率 2」。持續 4 個戰鬥輪。","o":"Target Battlefield. Remove the immunity to Ground-Type Moves for everyone in the field. Moves that require jumping or flying get an Extra “Low Accuracy 2”. Duration 4 Rounds.","f":"一股無形的力量把所有人拉向地面，讓大家無法離地。","fo":"An invisisible force pulls everyone to the floor keeps them from taking off the ground.","ic":[110,18]},{"n":"Mirror Coat","z":"鏡面反射","t":"超能力","c":"特殊","g":2,"p":"","a":"洞察 + 導引","d":"依情況而定","e":"單體目標。後制反應 5。只有在目標上一次對使用者使用的是特殊招式時才能使用。傷害骰為：目標上一次對使用者擲出的傷害骰池，再加 2 顆骰。無視防禦。","o":"Single Target. Late Reaction 5. Can only be used if Target's last Move on User was a Special Move. For damage, roll dice equal to Target's last damage pool rolled against the User plus 2 dice. Ignore Defenses.","f":"使用者匯聚周圍的有害能量，將它們反彈回源頭。","fo":"The user gathers the harmful energies around themselves and bounces them back to their source.","ic":[1,148]},{"n":"Guard Swap","z":"防守互換","t":"超能力","c":"變化","g":4,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將使用者的防禦與特防，與目標的對調。持續整個場景。","o":"Single Target. Switch the User's Defense and Sp. Defense with the Target's. Whole Scene Duration.","f":"寶可夢進入對手的心靈，偷走牠的堅韌，並在對方心中植入自己虛弱的想法。","fo":"The Pokémon enters their foe's mind to steal its fortitude and implant on them the idea of their own weakness.","ic":[1]},{"n":"Guard Split","z":"防守平分","t":"超能力","c":"變化","g":5,"p":"—","a":"洞察 + 導引","d":"-","e":"單體目標。將使用者的防禦與特防，與目標的取平均值（無條件捨去）。","o":"Single Target. Average the User's Defense and Sp. Defense with the Target's, rounded down.","f":"透過心靈連結，兩隻寶可夢都知道彼此的弱點，最終拉平了雙方的差距。","fo":"Through a mental link both Pokémon are aware of each other weaknesses, which end up evening the odds.","ic":[1]},{"n":"Twin Beam","z":"雙光束","t":"超能力","c":"特殊","g":9,"p":"2","a":"洞察 + 導引","d":"特殊 + 2","e":"單體目標。雙重行動。","o":"Single Target. Double Action.","f":"寶可夢射出一道光束，彷彿有自己的意識般，牠身體的另一部分也跟著射出一道光束。","fo":"The Pokémon shoots a beam, and as if had a mind of its own, another part of their body also shoots a beam along.","ic":[1,46]},{"n":"Future Sight","z":"預知未來","t":"超能力","c":"特殊","g":2,"p":"5","a":"洞察 + 導引","d":"特殊 + 5","e":"單體目標。此招式的傷害在下一個戰鬥輪開始時才造成。無視護盾招式、防護力場、掩護與替身。若目標退場或被換下場，傷害會改由下一位對手或其隊友之一承受。","o":"Single Target. This Move's damage is dealt at the beginning of the next Round. Ignore Shield Moves, Force Field, Cover & Substitute. If the target retires or switches out from battle, the damage will be dealt to the next opponent or to one of its allies.","f":"寶可夢預見某件可怕的事即將發生，但當牠試著看自己的未來時，畫面卻不斷變化。","fo":"The Pokémon foresees something terrible happening. Although when it tries to see their own future, the images are ever changing.","ic":[1]},{"n":"Dream Eater","z":"食夢","t":"超能力","c":"特殊","g":1,"p":"4","a":"洞察 + 導引","d":"特殊 + 4","e":"單體目標。只有在目標處於睡眠狀態時才能使用，否則失敗。","o":"Single Target. Can only be used if the Target has the Sleep Condition, otherwise it will fail.","f":"寶可夢進入夢的世界吃點心，孩子和寶可夢寶寶的夢最好吃。","fo":"The Pokémon enters the dream world for a snack. The dreams of children and baby Pokémon are the tastiest.","ic":[1]},{"n":"Agility","z":"高速移動","t":"超能力","c":"變化","g":1,"p":"—","a":"靈巧 + 運動","d":"-","e":"目標：使用者。使用者的靈巧提升 2 點。","o":"Target Self. Increase the User's Dexterity by 2.","f":"身體敏捷，頭腦也敏捷。","fo":"Swift of body, swift of mind.","ic":[8,303]},{"n":"Magic Coat","z":"魔法反射","t":"超能力","c":"變化","g":3,"p":"—","a":"特殊 + 隱匿","d":"-","e":"目標：使用者。先制反應 4。原本以使用者或其場地為目標的變化招式，改為作用於使用該招式的敵人或其場地。","o":"Target self. Reaction 4. Support Moves that would target the user or its side of the field are inflicted to the foe performing the Move or that foe's side of the field instead.","f":"寶可夢用迅速的心理把戲，騙對手把牠的惡意全都傾倒在自己身上。","fo":"Through a swift mind trick the Pokémon trick the foe into pouring their ill intent on itself.","ic":[8,36]},{"n":"Magic Room","z":"魔法空間","t":"超能力","c":"變化","g":5,"p":"—","a":"特殊 + 導引","d":"-","e":"目標：整個戰場。攜帶道具失去效果。無法使用任何道具。持續 4 個戰鬥輪。","o":"Target Battlefield. Held items lose their effects. No items can be used. Duration 4 Rounds.","f":"整個戰場變成一個房間，在其中物質世界的法則全都失效。","fo":"The entire battlefield becomes a room on which the laws of the material world are rendered useless.","ic":[110,18]},{"n":"Magic Powder","z":"魔法粉","t":"超能力","c":"變化","g":8,"p":"-","a":"聰明/可愛 + 導引","d":"-","e":"單體目標。粉末類招式。將目標的屬性改為超能力。","o":"Single Target. Powder Move. Change the target's Type to Psychic.","f":"寶可夢吟誦咒語，向目標吹出一團粉紅色的粉塵，之後目標會變得非常擅長猜你從牌堆裡抽到了哪張牌。","fo":"The Pokémon recites an enchantment and blows a cloud of pink dust on its Target. Afterwards, the target becomes incredibly good at guessing which card you got from a deck.","ic":[1,28]},{"n":"Power Gem","z":"力量寶石","t":"岩石","c":"特殊","g":4,"p":"3","a":"洞察 + 導引","d":"特殊 + 3","e":"單體目標。","o":"Single Target.","f":"有了水晶寶石，這隻寶可夢總能拯救世界！","fo":"With a crystal gem, the Pokémon will always save the day!","ic":[1]},{"n":"Ancient Power","z":"原始之力","t":"岩石","c":"特殊","g":2,"p":"2","a":"特殊 + 導引","d":"特殊 + 2","e":"單體目標。擲 1 顆機率骰，使用者的力量、靈巧、特殊、防禦、特防提升 1 點。","o":"Single Target. Roll 1 Chance Die to Increase by 1 the User's Strength, Dexterity, Special, Defense and Sp. Defense.","f":"寶可夢喚出來自遠古時代的能量，這可能讓使用者獲得原始的力量。","fo":"The Pokémon calls forward an energy from the ancient past . This may infuse the user with a primal strength.","ic":[1,37,198]},{"n":"Stone Edge","z":"尖石攻擊","t":"岩石","c":"物理","g":4,"p":"4","a":"力量 + 導引","d":"力量 + 4","e":"單體目標。低命中率 2。遠程。致命傷害。高要害率。切割類招式。","o":"Single Target. Low Accuracy 2. Ranged. Lethal. High Critical. Cutter Move.","f":"黑曜石碎片射向對手，這種岩石也許易碎，卻是世上最鋒利的。","fo":"Obsidian shards are sent out against the foe. This rock may be brittle but is the sharpest in the world.","ic":[21,20,1,321,0,14]},{"n":"Rock Slide","z":"岩崩","t":"岩石","c":"物理","g":1,"p":"3","a":"力量 + 導引","d":"力量 + 3","e":"目標：範圍內所有敵人。低命中率 1。遠程。擲 3 顆機率骰，使受影響者畏縮。","o":"Target all Foes in Range. Low Accuracy 1. Ranged. Roll 3 Chance Dice to Flinch those affected.","f":"別擔心，就算你不是賽跑中最快的，仍然可以靠山崩般的壓倒性優勢獲勝。","fo":"Don't worry, even if you are not the fastest one in the race, you can still win by a landslide.","ic":[23,52,2,319]},{"n":"Stone Axe","z":"岩斧","t":"岩石","c":"物理","g":8,"p":"2","a":"力量 + 鬥毆","d":"力量 + 2","e":"單體目標。低命中率 2。高要害率。切割類招式。持續傷害。持續 4 個戰鬥輪。","o":"Single Target. Low Accuracy 2. High Critical. Cutter Move. Ongoing Damage. Dura- tion 4 Rounds.","f":"寶可夢揮舞一把狂暴的石斧砍向對手，尖銳的石子與碎石會留在傷口裡，讓對手開始一瘸一拐。","fo":"The Pokémon hacks at the foe with a furious stone axe. Pointy pebbles and rubble remain within the cut, making the foe start limping.","ic":[21,0,1,14,17,18]},{"n":"Rock Tomb","z":"岩石封鎖","t":"岩石","c":"物理","g":3,"p":"2","a":"力量 + 導引","d":"力量 + 2","e":"單體目標。低命中率 1。遠程。目標的靈巧降低 1 點。","o":"Single Target. Low Accuracy 1. Ranged. Reduce the Target's Dexterity by 1.","f":"寶可夢提前把對手埋起來，不過這對真正的葬禮來說也是不錯的練習。","fo":"The pokémon buries their foe prematurely, but it'll be good practice for the real thing.","ic":[23,1,2,115]},{"n":"Rock Polish","z":"岩石打磨","t":"岩石","c":"變化","g":4,"p":"—","a":"力量 + 運動","d":"-","e":"目標：使用者。使用者的靈巧提升 2 點。","o":"Target Self. Increase the User's Dexterity by 2.","f":"磨平粗糙的稜角，人生不用這麼磨磨蹭蹭。","fo":"Smooth the rough edges, no need to grind about in life.","ic":[8,133]},{"n":"Rock Wrecker","z":"岩石炮","t":"岩石","c":"物理","g":4,"p":"6","a":"力量 + 導引","d":"力量 + 6","e":"單體目標。低命中率 1。致命傷害。遠程。投彈類招式。需要重新充能。","o":"Single Target. Low Accuracy 1. Lethal. Ranged. Projectile Move. Must Recharge.","f":"一塊巨石像砲彈一樣轟向目標，沿途留下破壞的痕跡，巨石撞擊時又引發爆炸。之後要讓寶可夢喘口氣。","fo":"A giant boulder is blasted like a cannon ball towards the target. Leaving a path of destruction and a subsequent explosion as the boulder crashes. Let the pokémon catch their breath afterwards.","ic":[23,20,1,2,26,97]},{"n":"Rock Blast","z":"岩石爆擊","t":"岩石","c":"物理","g":3,"p":"1","a":"靈巧 + 導引","d":"力量 + 1","e":"單體目標。低命中率 1。遠程。連續行動。投彈類招式。","o":"Single Target. Low Accuracy 1. Ranged. Successive Actions. Projectile Move.","f":"岩石的碎片，使用者射出細小如子彈般的小石頭。","fo":"A rock shrapnel, the user shoots tiny bullet-like pebbles.","ic":[23,1,2,13,26]},{"n":"Wide Guard","z":"廣域防守","t":"岩石","c":"變化","g":5,"p":"—","a":"體魄 + 鬥毆","d":"-","e":"目標：使用者與範圍內的隊友。先制反應 3。護盾招式。目標受到物理或特殊招式時，減少 3 點傷害。使目標身上任何招式的額外效果無效。","o":"Target User and Allies in Range. Reaction 3. Shield Move. Reduce 3 Damage the Targets would receive from a Physical or Special Move. Negate the Added Effects of Any Moves on the Targets.","f":"寶可夢用整個身體為牠所能顧及的所有人提供庇護與保護。牠們就是別人賴以依靠的磐石。","fo":"The Pokémon uses their whole body to provide shelter and protection to everyone they can. They are the rock on which others stand.","ic":[24,34,130]},{"n":"Mighty Cleave","z":"強刃攻擊","t":"岩石","c":"物理","g":9,"p":"4","a":"靈巧 + 鬥毆","d":"力量 + 4","e":"單體目標。","o":"Single Target.","f":"寶可夢帶著一道強光，劈開對手的防護，如巨石般打擊。","fo":"With a mighty light, the Pokémon cleaves through the foe's protections and strikes like a boulder.","ic":[1]},{"n":"Smack Down","z":"擊落","t":"岩石","c":"物理","g":5,"p":"2","a":"力量 + 導引","d":"力量 + 2","e":"單體目標。遠程。移除目標對地面屬性招式的免疫。若目標因使用「飛翔」、「彈跳」或「空中彈跳」而處於範圍外，此招式仍會命中。","o":"Single Target. Ranged. Remove the Target's immunity to Ground-Type Moves. If the Target is Out of Range due to using “Fly”, “Bounce” or “Sky Drop” this Move hits anyways.","f":"人們說一石二鳥很不錯，這隻寶可夢卻要把所有的石頭都給一隻鳥。","fo":"They say it's great to get two birds with one stone, this Pokémon will give one bird ALL the stones.","ic":[1,321]},{"n":"Sandstorm","z":"沙暴","t":"岩石","c":"變化","g":2,"p":"—","a":"特殊 + 自然","d":"-","e":"目標：整個戰場。風類招式。啟動沙暴天氣。持續 4 個戰鬥輪。","o":"Target Battlefield. Wind Move. Activate Sandstorm Weather. Duration 4 Rounds.","f":"一場猛烈的沙暴在戰場四周肆虐，快遮住眼睛、鼻子和臉！粗糙的沙子會弄傷你！","fo":"A fierce sandstorm starts raging all around the battlefield. Cover your eyes, nose and face! The rough sand will hurt you!","ic":[102,110,320,18]},{"n":"Meteor Beam","z":"流星光束","t":"岩石","c":"特殊","g":8,"p":"5","a":"特殊 + 導引","d":"特殊 + 5","e":"單體目標。蓄力招式。使用者在開始蓄力的瞬間，特殊提升 1 點。","o":"Single Target. Charge Move. Increase the User's Special by 1 the moment it begins charging.","f":"使用者滿溢著銀河的能量，召喚出一顆小隕石撞向對手。有一種理論認為，這個招式可能是史前寶可夢滅絕的原因。","fo":"The user overflows with galactic energy while summoning a small meteor to impact the foe. A theory suggests this move might have caused the extintion of prehistoric Pokémon.","ic":[114,1,85]},{"n":"Rollout","z":"滾動","t":"岩石","c":"物理","g":2,"p":"1","a":"靈巧 + 運動/鬥毆","d":"力量 + 1 *","e":"單體目標。低命中率 1。連續行動。*若 5 次行動全部命中，此招式最後一擊的傷害骰池額外增加 1 顆骰。若寶可夢在同一戰鬥輪中使用過「變圓」，此招式的基礎威力變為 2。","o":"Single Target. Low Accuracy 1. Successive Actions. *If all 5 actions land successfully, add 1 Extra Die to the Damage Pool of the last hit of this Move. If the Pokémon used the Move “Defense Curl” in the same round, this Move's base Power becomes 2.","f":"當對手看到這隻寶可夢滾來滾去，就會恨得牙癢癢。","fo":"When the foe sees this Pokémon rollin' they'll be hatin'.","ic":[96,1,13]},{"n":"Tar Shot","z":"瀝青射擊","t":"岩石","c":"變化","g":8,"p":"-","a":"聰明 + 自然","d":"-","e":"單體目標。目標的靈巧降低 1 點。","o":"Single Target. Reduce the Target's Dexterity by 1.","f":"寶可夢向對手噴出一團黑色焦油，不幸的受害者之後幾乎動彈不得。請遠離火源，焦油極易燃燒。","fo":"The Pokémon gushes a blob of black tar over its foe. The unfortunate victim can barely move afterwards, keep it away from fire sources, tar is extremely flammable.","ic":[1,115]},{"n":"Rock Throw","z":"落石","t":"岩石","c":"物理","g":1,"p":"2","a":"靈巧/力量 + 導引","d":"力量 + 2","e":"單體目標。低命中率 1。遠程。","o":"Single Target. Low Accuracy 1. Ranged.","f":"從前，這是寶可夢和孩子們之間常見的消遣。","fo":"Back in the day, this was a common form of amusement amongst Pokémon and children alike.","ic":[1,23,2]},{"n":"Accelerock","z":"衝岩","t":"岩石","c":"物理","g":7,"p":"2","a":"靈巧 + 鬥毆","d":"力量/靈巧 + 2","e":"單體目標。先制反應 1。","o":"Single Target. Reaction 1.","f":"寶可夢以極快的速度衝刺，利用身上的岩石在衝撞時打擊對手。","fo":"The Pokémon dashes at great speed using the rocks on their body to strike the foe upon impact.","ic":[1,113]},{"n":"Diamond Storm","z":"鑽石風暴","t":"岩石","c":"物理","g":6,"p":"4","a":"力量 + 導引","d":"力量 + 4","e":"目標：範圍內所有敵人。遠程。專用。擲 5 顆機率骰，使用者的防禦提升 2 點。此效果可與其他防禦提升疊加。","o":"Target all Foes in Range. Ranged. Unique. Roll 5 Chance Dice to Increase the User's Defense by 2. This effect can stack with other Defense increases.","f":"寶可夢在場地上召喚一場鑽石風暴，這些鑽石同時也是使用者可以躲藏的屏障。","fo":"The Pokémon summons a storm of diamonds over the field. These diamonds also serve as barriers the user can take cover into.","ic":[2,79,7,310,274]},{"n":"Stealth Rock","z":"隱形岩","t":"岩石","c":"變化","g":4,"p":"—","a":"洞察 + 隱匿","d":"-","e":"目標：敵方場地。入場危害。進入戰場的寶可夢受到 1 點岩石屬性傷害。此效果不會疊加。","o":"Target Foe's Side of the Field. Entry Hazard. Pokémon entering the battle Receive 1 Rock-Type Damage. This effect does not stack.","f":"寶可夢暗中布下尖銳岩石的陷阱，在受害者還沒搞清楚發生什麼事時，岩石就已射向牠。","fo":"The Pokémon hides a trap of sharp rocks that are launched at the victim before they even realize what even happened.","ic":[41,224,40]},{"n":"Head Smash","z":"雙刃頭錘","t":"岩石","c":"物理","g":4,"p":"6","a":"力量 + 鬥毆","d":"力量 + 6","e":"單體目標。低命中率 2。反作用傷害。","o":"Single Target. Low Accuracy 2. Recoil.","f":"寶可夢，生氣。寶可夢，砸！","fo":"Pokémon, angry. Pokémon, smash!","ic":[1,21,135]},{"n":"Salt Cure","z":"鹽醃","t":"岩石","c":"物理","g":9,"p":"2","a":"洞察 + 導引","d":"力量 + 2","e":"單體目標。遠程。持續傷害。持續 4 個戰鬥輪。鋼屬性與水屬性寶可夢受到此招式的效果絕佳傷害，以及持續傷害的額外 1 點傷害。","o":"Single Target. Ranged. Ongoing Damage. Duration 4 Rounds. Steel-Type and Water-Type Pokémon receive Super-Effective Damage from this Move and 1 Extra Damage from the Ongoing Damage.","f":"使用者用鹽殼覆蓋對手，鹽會刺激皮膚並使受害者脫水，甚至能在幾秒內讓金屬生鏽。","fo":"The user covers the foe with a salt crust, the salt irritates the skin and drehydrates the victim. It can even rust metal in a few seconds.","ic":[2,1,17,18]},{"n":"Smart Strike","z":"修長之角","t":"鋼","c":"物理","g":7,"p":"3","a":"靈巧 + 鬥毆","d":"力量 + 3","e":"單體目標。必中。致命傷害。","o":"Single Target. Never Miss. Lethal.","f":"使用者用其中一隻鋒利的角以驚人的精準度刺向對手，傷口非常深，需要立刻縫合。","fo":"The user stabs the foe using one of their sharp horns with astounding precision. The resulting wound is very deep and needs stitches immediately.","ic":[1,20,59]},{"n":"Flash Cannon","z":"加農光炮","t":"鋼","c":"特殊","g":4,"p":"3","a":"靈巧 + 導引","d":"特殊 + 3","e":"單體目標。擲 1 顆機率骰，目標的特防降低 1 點。","o":"Single Target. Roll 1 Chance Die to Reduce the Target's Sp. Defense by 1.","f":"寶可夢透過身體上閃亮的金屬部位，把一道光束直接反射到對手的眼睛裡。","fo":"Through shiny metal parts of their body, the Pokémon reflects a light beam straight into the foe's eyes.","ic":[1,4,150]},{"n":"Bullet Punch","z":"子彈拳","t":"鋼","c":"物理","g":4,"p":"2","a":"靈巧 + 鬥毆","d":"力量/靈巧 + 2","e":"單體目標。先制反應 1。拳類招式。","o":"Single Target. Reaction1. Fist Move.","f":"你跑不過子彈。","fo":"You cannot outrun a bullet.","ic":[1,323,113]},{"n":"Gigaton Hammer","z":"巨力錘","t":"鋼","c":"物理","g":9,"p":"7","a":"力量 + 鬥毆","d":"力量 + 7","e":"單體目標。致命傷害。若上個戰鬥輪用過此招式，則此招式失敗。*依說書人裁定，此招式可對鋼屬性寶可夢額外造成 2 顆傷害骰。","o":"Single Target. Lethal. This Move will fail if it was used the previous Round. *This Move may deal 2 extra Damage Dice to Steel-Type Pokémon at Storyteller's Discretion.","f":"當你手上有一把鎚子，看什麼都像釘子。","fo":"When you have a hammer everything is a nail.","ic":[67,1,49]},{"n":"Behemoth Bash","z":"巨獸彈","t":"鋼","c":"物理","g":8,"p":"*","a":"力量 + 鬥毆","d":"力量 + 4 *","e":"單體目標。專用。*若對手處於極巨化／超極巨化狀態，此招式變為致命，傷害骰池額外增加 4 顆骰。","o":"Single Target. Unique. *If the Foe is under the effects of Dynamax/Gigantamax, This Move becomes Lethal and add 4 Extra Dice to the Damage Pool.","f":"寶可夢化身為巨大的能量盾牌，把沿途的一切都推回去。如果對手正處於極巨化現象之下，牠的所有能量都會被一掃而空。","fo":"The Pokémon
